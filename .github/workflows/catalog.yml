name: catalog

# Publishes the hosted theme catalog: each theme and set whose version the bucket's index.json
# does not list gets its release objects, its demo, and a new index (scripts/catalog/publish.mjs).
# A pull request proves the run on the `catalog-proving` environment, whose bucket and demo Worker
# start empty every run; a push to main, or a dispatch on main, publishes to `catalog`. The script
# reads its target from the environment's variables and secrets alone.
#
# The `catalog` environment allows the `main` branch only. `catalog-proving` has no branch rule,
# because a pull request run's ref is refs/pull/<n>/merge and a branch pattern would refuse it.
on:
  pull_request:
    paths:
      - 'themes/**'
      - 'sets/**'
      - 'schema/cairn-catalog-1.schema.json'
      - 'scripts/catalog/**'
      - 'scripts/theme/**'
      - 'scripts/build/starter-overlay/**'
      - '.github/workflows/catalog.yml'
  push:
    branches: [main]
    paths:
      - 'themes/**'
      - 'sets/**'
      - 'schema/cairn-catalog-1.schema.json'
      - 'scripts/catalog/**'
      - 'scripts/theme/**'
      - 'scripts/build/starter-overlay/**'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # A pull request from a fork or from Dependabot gets none of the environment's secrets, so its
    # run could only fail. A dispatch publishes to the real catalog, so it runs on main only.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.event_name == 'pull_request' && 'catalog-proving' || 'catalog' }}
    # One run at a time per environment, and never one cut off mid-publish. GitHub still drops an
    # older queued run when a newer one queues; that is safe, since each run publishes whatever the
    # index is missing.
    concurrency:
      group: catalog-${{ github.event_name == 'pull_request' && 'catalog-proving' || 'catalog' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CATALOG_BUCKET: ${{ vars.CATALOG_BUCKET }}
      CATALOG_ORIGIN: ${{ vars.CATALOG_ORIGIN }}
      DEMO_WORKER: ${{ vars.DEMO_WORKER }}
      DEMO_ORIGIN: ${{ vars.DEMO_ORIGIN }}
      RELEASE_CACHE_CONTROL: ${{ vars.RELEASE_CACHE_CONTROL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No npm cache: this job holds deploy and bucket credentials, so it installs from the
      # lockfiles alone, as publish.yml's build job does.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npm ci
          clean: node_modules
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npm ci --prefix examples/showcase
          clean: examples/showcase/node_modules
      - run: npm run package
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npx playwright install --with-deps chromium
      # The publish script runs `npx wrangler deploy` from a scratch directory outside the
      # checkout, where npx would fetch the newest Wrangler; on PATH, the locked one runs instead.
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Publish to the emptied proving target
        if: github.event_name == 'pull_request'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/catalog/publish.mjs --reset
      - name: Publish again and prove the second run is a no-op
        if: github.event_name == 'pull_request'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          out=$(node scripts/catalog/publish.mjs)
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -Fxq 'catalog: nothing to publish'; then
            echo "::error::the second publish run was not a no-op"
            exit 1
          fi
      - name: Publish to the catalog
        if: github.event_name != 'pull_request'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/catalog/publish.mjs
      - run: node scripts/catalog/reference-check.mjs --catalog "$CATALOG_ORIGIN/index.json"
      - if: failure() || cancelled()
        uses: ./.github/actions/install-diagnostics
