name: create-site

# The create-cairn-site rot gate: prove the CLI's OUTPUT builds, from packed artifacts, on a clean
# checkout. scaffold.yml proves the same for the emitter it wraps; this workflow proves the path a
# real user takes, which is a different path. It packs the CLI, installs that tarball into a scratch
# directory, runs the command, and then installs, typechecks, and builds the site it produced.
#
# It also exercises the substitution pass against the REAL template rather than a test fixture. The
# brand rotation asserts it finds exactly four --color-primary declarations, so a showcase theme
# refactor that splits or renames them fails here instead of shipping a site whose dark mode lost
# its contrast.

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  create-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run package
      - name: Pack the engine and dev backend
        id: pack
        # npm pack runs the engine's `prepare` build hook, whose stdout banners precede the tarball
        # name; --silent does not suppress lifecycle stdout, so take the last line as the filename.
        run: |
          ENGINE_TGZ="$PWD/$(npm pack --silent | tail -n1)"
          DEV_TGZ="$PWD/$(npm pack --silent ./packages/cairn-cms-dev | tail -n1)"
          echo "engine=$ENGINE_TGZ" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV_TGZ" >> "$GITHUB_OUTPUT"
      - name: Bake the template and pack the CLI
        id: create-pack
        working-directory: packages/create-cairn-site
        # The bake refuses a `file:` spec and refuses a 0.0.0 version, by design: both name something
        # no registry can install, and a published tarball carrying either would be broken on
        # arrival. That makes `prepack`'s own default path unrunnable until @glw907/cairn-cms-dev
        # publishes, so bake here with the engine's real version standing in for both specs and pack
        # with --ignore-scripts. The specs a published bake writes are covered by the bake's own unit
        # tests; what this job proves is that the scaffolded tree builds, and the rewrite below
        # points it at the freshly packed tarballs anyway.
        run: |
          VERSION="$(node -p "require('../../package.json').version")"
          node scripts/bake-template.mjs --to template --engine-spec "^$VERSION" --dev-spec "^$VERSION"
          CREATE_TGZ="$PWD/$(npm pack --ignore-scripts --silent | tail -n1)"
          echo "create=$CREATE_TGZ" >> "$GITHUB_OUTPUT"
      - name: Install the CLI from its tarball and scaffold a site
        # Installed into a scratch package rather than run from the checkout, so the run resolves the
        # packed `template/` the way a user's install does. A brand color is passed deliberately: it
        # is what exercises the four-declaration rot gate against the real theme file. CAIRN_STATE_DIR
        # points the state save at a known, empty directory, so the next step can assert the record
        # actually landed there and nowhere inside the scaffold, instead of checking a filename
        # state.mjs never writes.
        env:
          CAIRN_STATE_DIR: /tmp/ci-site-state
        run: |
          mkdir -p /tmp/create-scratch "$CAIRN_STATE_DIR"
          cd /tmp/create-scratch
          npm init -y > /dev/null
          npm install --no-save "${{ steps.create-pack.outputs.create }}"
          npx create-cairn-site --yes --name "CI Site" --description "Built by CI" \
            --brand-color "#2f6fdb" --dir /tmp/ci-site
      - name: Point the scaffolded site at the packed tarballs
        # The same substitution scaffold.yml performs through the emitter's arguments, applied after
        # the fact here because the CLI bakes its specs at pack time.
        env:
          ENGINE: ${{ steps.pack.outputs.engine }}
          DEV: ${{ steps.pack.outputs.dev }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "/tmp/ci-site/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.dependencies["@glw907/cairn-cms"] = "file:" + process.env.ENGINE;
            pkg.devDependencies["@glw907/cairn-cms-dev"] = "file:" + process.env.DEV;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
      - name: Assert the scaffold is personalized and carries no showcase-only material
        # The state assertion checks both halves, not just the filename that can never appear:
        # exactly one record exists in CAIRN_STATE_DIR (proving the save happened) and its name
        # is absent anywhere under the scaffold tree (proving it did not also land inside).
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const assert = require("node:assert");
            const pkg = JSON.parse(fs.readFileSync("/tmp/ci-site/package.json", "utf8"));
            assert.equal(pkg.name, "ci-site", "package.json name was not renamed to the site slug");
            const config = fs.readFileSync("/tmp/ci-site/src/theme/site.config.yaml", "utf8");
            assert.match(config, /siteName: CI Site/, "site name was not substituted");
            assert.match(config, /description: Built by CI/, "description was not inserted");

            const stateFiles = fs.readdirSync("/tmp/ci-site-state").filter((name) => name.endsWith(".json"));
            assert.equal(stateFiles.length, 1, "expected exactly one saved state record");
            const [stateFileName] = stateFiles;
            const scaffoldFileNames = fs.readdirSync("/tmp/ci-site", { recursive: true }).map((entry) => path.basename(entry));
            assert.ok(!scaffoldFileNames.includes(stateFileName), "state record " + stateFileName + " landed inside the scaffold");

            for (const leftover of ["e2e", "playwright.config.ts", ".claude"]) {
              assert.ok(!fs.existsSync("/tmp/ci-site/" + leftover), leftover + " shipped into the scaffold");
            }

            const scriptsEntries = fs.readdirSync("/tmp/ci-site/scripts");
            assert.deepEqual(scriptsEntries, ["dev.mjs"], "scripts/ must hold exactly the baked dev shim");
          '
      - name: Install, typecheck, and build the scaffolded site
        working-directory: /tmp/ci-site
        run: |
          npm install
          npm run check
          npm run build
      - name: Dev server reaches the admin
        working-directory: /tmp/ci-site
        run: |
          # --host 127.0.0.1 pins the bind to the address the probe talks to; vite's default
          # host is localhost, which the runner can resolve to ::1 while curl speaks IPv4.
          # Output goes to a file so no background child holds the step's stdout open.
          setsid npm run dev -- --port 4173 --strictPort --host 127.0.0.1 >/tmp/ci-dev.log 2>&1 &
          # A healthy signed-in admin 307s /admin to its first concept view; a broken shim's
          # auth guard 303s to /admin/login, which itself renders 200. So the probe follows
          # redirects and requires BOTH a final 200 AND a final URL that is not the login
          # page, which keeps a broken shim red and a dead server (000) red.
          ok=0
          result=000
          for i in $(seq 1 60); do
            result=$(curl -sL -o /dev/null -w '%{http_code} %{url_effective}' http://127.0.0.1:4173/admin || true)
            case "$result" in
              "200 "*"/admin/login"*) ;;
              "200 "*) ok=1; break ;;
            esac
            sleep 1
          done
          pkill -f 'scripts/dev.mjs' 2>/dev/null || true
          pkill -f 'vite' 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "the scaffolded site's /admin probe ended at '$result', not a signed-in 200"
            echo '--- dev server log ---'
            cat /tmp/ci-dev.log
            exit 1
          fi
      - name: Seed and probe the Builds discovery console
        # T4d Task 6's CI probe: the only console proof that runs the PACKED CLI (the same install
        # the earlier steps already produced in /tmp/create-scratch, no second install) from a real
        # GitHub Actions job rather than node:test. Both integration proofs in this repo target the
        # Builds hold, the one wait class a spawned child can drive at all (the propagation probe's
        # inputs have no env seam; see hold-loop.mjs's own header). CAIRN_STATE_DIR is seeded with a
        # fixture at chapter 3's own watch step (config-reconciled, its buildsReconciledHash already
        # matching the local scaffold so performReconcile sees no diff and needs no GitHub call at
        # all), CAIRN_CLOUDFLARE_API_BASE points at this repo's own fake Cloudflare (run in-process
        # here so this step can flip its state mid-run), and CAIRN_FORCE_HOLD=1 is the documented
        # override the hold-force seam exists for (a spawned child is non-TTY, and this runner's own
        # CI=true would otherwise refuse to hold at all). Two fetches prove a real re-render, never a
        # stub 200: the first against the pre-discovery view, the second once the fake's build state
        # has flipped to a build the hold has found but not yet settled (`status: 'running'`, a null
        # `build_outcome`), which keeps the console up rather than reaching its cleared exit page;
        # mirrors test/console-hold.test.mjs's own "changed cell" assertions exactly.
        env:
          PKG_DIR: ${{ github.workspace }}/packages/create-cairn-site
          CREATE_BIN: /tmp/create-scratch/node_modules/create-cairn-site/bin.mjs
        run: |
          cat > /tmp/builds-console-probe.mjs <<'PROBE_EOF'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { spawn } from 'node:child_process';
          import { createInterface } from 'node:readline';
          import { mkdtemp, mkdir, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { randomUUID } from 'node:crypto';

          const pkgDir = process.env.PKG_DIR;
          const load = (relative) => import(pathToFileURL(path.join(pkgDir, relative)).href);

          const { startFakeCloudflare } = await load('test/fake-cloudflare.mjs');
          const { saveSite } = await load('src/state.mjs');
          const { reconciledConfigHash } = await load('src/cloudflare/chapter3.mjs');
          const { EXIT_TEXT } = await load('src/console/exit-render.mjs');

          const WORKER_NAME = 'ci-console-hold-worker';
          const WORKER_TAG = 'tag-ci-console-hold';

          const stateDir = await mkdtemp(path.join(tmpdir(), 'ci-console-hold-state-'));
          process.env.CAIRN_STATE_DIR = stateDir;

          const scaffold = await mkdtemp(path.join(tmpdir(), 'ci-console-hold-scaffold-'));
          await writeFile(path.join(scaffold, 'wrangler.jsonc'), `${JSON.stringify({ name: WORKER_NAME }, null, 2)}\n`);
          await mkdir(path.join(scaffold, 'src/theme'), { recursive: true });
          await writeFile(path.join(scaffold, 'src/theme/cairn.config.ts'), "export const from = 'cms@example.test';\n");

          const cloudflare = await startFakeCloudflare();
          cloudflare.state.workerScripts.push({ id: WORKER_NAME, tag: WORKER_TAG });

          const hash = await reconciledConfigHash(scaffold);
          const siteId = 'ci-console-hold-abc123';
          await saveSite(siteId, {
            name: 'CI Console Hold Site',
            dir: scaffold,
            step: 'config-reconciled',
            ownerEmail: 'owner@example.com',
            github: {
              clientId: 'fake-client-1',
              clientSecret: 'fake-secret',
              installationId: 1,
              repo: { owner: 'ci-console-hold-owner', repo: 'ci-console-hold-site', defaultBranch: 'main' },
            },
            cloudflare: {
              accountId: 'acct-1',
              url: `https://${WORKER_NAME}.example.workers.dev`,
              workerName: WORKER_NAME,
              buildsReconciledHash: hash,
            },
          });

          const child = spawn(process.execPath, [process.env.CREATE_BIN, '--dir', scaffold, '--yes', '--connect'], {
            env: {
              ...process.env,
              CAIRN_STATE_DIR: stateDir,
              CAIRN_CLOUDFLARE_API_BASE: cloudflare.apiBase,
              CAIRN_CF_API_TOKEN: 'ci-console-hold-env-token',
              CAIRN_FORCE_HOLD: '1',
            },
          });

          let failed = false;
          try {
            const url = await new Promise((resolve, reject) => {
              const rl = createInterface({ input: child.stdout });
              const timer = setTimeout(() => reject(new Error('timed out waiting for the console URL line')), 20000);
              rl.on('line', (line) => {
                const match = /^Watch progress at (\S+) /.exec(line);
                if (match) {
                  clearTimeout(timer);
                  resolve(match[1]);
                }
              });
            });

            const firstBody = await (await fetch(url)).text();
            assert.ok(firstBody.includes(WORKER_NAME), `expected the worker name in the first render, got: ${firstBody}`);
            assert.ok(
              firstBody.includes('Still discovering the build that matches your push.'),
              `expected the pre-discovery view, got: ${firstBody}`,
            );

            const buildUuid = randomUUID();
            cloudflare.state.builds.set(buildUuid, {
              build_uuid: buildUuid,
              status: 'running',
              build_outcome: null,
              created_on: new Date().toISOString(),
              trigger: { external_script_id: WORKER_TAG },
              build_trigger_source: 'push_event',
              build_trigger_metadata: { commit_hash: 'deadbeef', commit_message: 'x', author: 'admin', branch: 'main' },
            });

            const deadline = Date.now() + 15000;
            let changedBody = firstBody;
            while (changedBody === firstBody && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 200));
              try {
                changedBody = await (await fetch(url)).text();
              } catch {
                break; // The exit render's grace window closed the server; the assertion below reports this.
              }
            }
            assert.notEqual(changedBody, firstBody, 'expected a real re-render once the build was discovered');
            assert.ok(changedBody.includes(buildUuid), `expected the discovered build's own id, got: ${changedBody}`);
            assert.ok(changedBody.includes('Status: running'), `expected the build's live status, got: ${changedBody}`);
            assert.equal(
              changedBody.includes(EXIT_TEXT),
              false,
              'the hold must not end at discovery: an unfinished build is still a wait to watch',
            );

            console.log('Builds discovery console probe passed.');
          } catch (err) {
            failed = true;
            console.error(err);
          } finally {
            child.kill('SIGKILL');
            await cloudflare.close();
          }

          process.exit(failed ? 1 : 0);
          PROBE_EOF
          node /tmp/builds-console-probe.mjs
