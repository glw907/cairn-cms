name: design

# The B2 design gate: the public-theme token gates, the second-theme fixture, and the styleguide
# accessibility e2e. It is scoped to the design dimension (cairn-audit's public scope, the re-skin
# fixture, the fixture theme's build in both arms, and axe over /styleguide in both schemes). The
# full showcase e2e lives in e2e.yml; this job runs only the styleguide spec so a token or a11y
# regression fails fast and on its own signal.

on:
  push:
    branches: [main, rebuild]
    paths-ignore: ['tool/**']
  pull_request:
    paths-ignore: ['tool/**']

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 (Active LTS), matching the other workflows.
          node-version: 24
          cache: npm
          # This job also installs the showcase's own lockfile below, so the cache key has to
          # cover both, or the cache silently keys on the root lockfile alone and never warms
          # for the showcase install.
          cache-dependency-path: |
            package-lock.json
            examples/showcase/package-lock.json
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npm ci
          clean: node_modules
      # Build the engine dist the showcase resolves through, so the token gates and the e2e read the
      # current render output (the styleguide renders prose through the packaged engine).
      - run: npm run package
      # The showcase lockfile is committed and installed with `npm ci` so CI resolves the exact
      # toolchain a developer reproduces locally. The token gates below read the showcase's installed
      # engine (cairn-public.css) and daisyUI, so they run after this install.
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npm ci --prefix examples/showcase
          clean: examples/showcase/node_modules
      # The token gates: cairn-audit's public scope over the showcase and the cairn-theme overlay
      # (no literal colors or absolute font sizes, a complete theme with every var() resolved, every
      # text pair at AA in both sRGB and P3), then the re-skin fixture (a hue rotation of the brand
      # accent, Waymark with its hand-tuned inks stripped, and the fixture theme all hold AA, and prose
      # reads one set).
      - run: npm run check:public-tokens
      - run: npm run test:reskin
      # The styleguide accessibility e2e. The styleguide spec's own webServer builds
      # (VITE_CAIRN_E2E=1) and serves the showcase, then axe scans /styleguide in both color schemes
      # and a rendered article, and the skip-link and reduced-motion floors are checked.
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npx --prefix examples/showcase playwright install --with-deps chromium
      # The second-theme fixture, both arms: the showcase built with the fixture theme in place of
      # Waymark's and read in Chromium, and the emitted template built under Waymark and under the
      # fixture with the planted sentinel proving the engine stylesheet's @source line. It launches
      # Chromium and installs the template's registry dependencies, so it runs after the browser
      # install and stays out of check:close, the way test:reskin does.
      - run: npm run test:theme-fixture
      - name: Run the styleguide e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-retries.json
        run: npm --prefix examples/showcase run test:e2e -- styleguide --reporter=dot,json
      # A retried test leaves the job green, so its name goes into the run's annotations. It runs
      # whether the tests passed or failed; a report the run never wrote reads as unknown.
      - name: Report retried tests
        if: always()
        run: node scripts/ci/retries-notice.mjs "$RUNNER_TEMP/playwright-retries.json"
      - if: failure() || cancelled()
        uses: ./.github/actions/install-diagnostics
