name: e2e

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the admin-visual baseline snapshots instead of asserting against them
        type: boolean
        default: false

jobs:
  # The 0.91.0 cut proved the norms manifest's staleness window bites: a post-generation component
  # edit left the manifest stale, and only the release-time rehearsal caught it (docs-friction-log,
  # 2026-07-29). This workflow already builds and serves the showcase for the e2e specs, so calling
  # the reusable norms.yml here (the same definition publish.yml gates on) proves manifest freshness
  # on every push and pull request, well before a release. One definition, two callers.
  norms:
    uses: ./.github/workflows/norms.yml

  e2e:
    runs-on: ubuntu-latest
    # Only the manual regen dispatch needs to push a commit back to the branch it ran against;
    # the routine push/pull_request runs never reach that step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # The showcase lockfile is committed (not gitignored) and installed with `npm ci` so CI resolves
      # the exact toolchain a developer reproduces locally. A floating `npm install` once drifted CI onto
      # a Vite 8 / Rolldown build that no local run could reproduce; see the post-mortem at
      # docs/internal/2026-06-21-e2e-dist-svelte-build-failure.md.
      - run: npm ci --prefix examples/showcase
      - run: npx --prefix examples/showcase playwright install --with-deps chromium
      # A DEFAULT build (no VITE_CAIRN_E2E) proves the fence holds: Vite substitutes `false` for
      # __CAIRN_DEV_BUILD__ at every call site, so the dev backend and its owner-session bypass are
      # eliminated from the deployable bundle. test:e2e's own webServer then does the flagged build
      # (VITE_CAIRN_E2E=1) + preview to run the specs, so this default-build grep must run first.
      - run: npm --prefix examples/showcase run build
      - name: Assert the dev backend is eliminated from the default build's deployable bundle
        # adapter-cloudflare 7 does not bundle: .svelte-kit/cloudflare/_worker.js is a loader that
        # imports ../output/server/index.js by relative path, so the server code wrangler actually
        # bundles and deploys is invisible to a grep over .svelte-kit/cloudflare. `wrangler deploy
        # --dry-run` produces the artifact Cloudflare receives without needing credentials; grep that.
        # wrangler resolves its config relative to the process cwd, not npx's --prefix, so this step
        # runs from examples/showcase directly rather than through npm/npx's --prefix flag.
        working-directory: examples/showcase
        run: |
          rm -rf /tmp/dev-fold-default
          npx wrangler deploy --dry-run --outdir=/tmp/dev-fold-default
          if grep -rlF -f ../../scripts/dev-fold-markers.txt /tmp/dev-fold-default 2>/dev/null; then
            echo "FAIL: dev-backend artifact in the deployable Worker"; exit 1
          fi
          echo "OK: no dev-backend artifact in the deployable Worker"
      - name: Gate self-test: the markers ARE present in a flagged build's deployable bundle
        # A grep that can never match again is how this gate rotted before: adapter-cloudflare 7
        # stopped bundling and the old grep target (.svelte-kit/cloudflare) held no server code, so
        # the negative check above passed vacuously on every build, flagged or not. This positive
        # control proves the grep still finds real matches when the dev backend is actually present.
        working-directory: examples/showcase
        run: |
          rm -rf /tmp/dev-fold-flagged
          VITE_CAIRN_E2E=1 npm run build
          npx wrangler deploy --dry-run --outdir=/tmp/dev-fold-flagged
          if ! grep -rlF -f ../../scripts/dev-fold-markers.txt /tmp/dev-fold-flagged 2>/dev/null; then
            echo "FAIL: gate self-test: no dev-fold marker matched a flagged build's deployable bundle"; exit 1
          fi
          echo "OK: gate self-test: markers present in the flagged build's deployable bundle"
      - name: Run the e2e suite
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true') }}
        run: npm --prefix examples/showcase run test:e2e
      # Manual regen mode: a dispatcher ticks `update_snapshots` after a deliberate rendering
      # change. Runs both visual specs BY FILE PATH (never a title grep, which silently skips
      # any test whose name doesn't match), on the CI runner itself, since baselines are
      # CI-canonical and a workstation render is never an acceptable substitute. Commits the
      # changed PNGs straight back to the branch the dispatch ran against, the same
      # checkout-commit-push shape as aksailingclub-org's ci.yml; nothing here uploads an
      # artifact for manual copy-back.
      - name: Regenerate the visual baseline snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true' }}
        run: npm --prefix examples/showcase run test:e2e -- e2e/admin-visual.spec.ts e2e/site-visual.spec.ts --update-snapshots
      - name: Commit the regenerated visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add examples/showcase/e2e/admin-visual.spec.ts-snapshots/ examples/showcase/e2e/site-visual.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(e2e): regenerate the admin-visual and site-visual baselines"
            git push
          fi
