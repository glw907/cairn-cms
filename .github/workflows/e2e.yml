name: e2e

on:
  push:
    branches: [main, rebuild]
    paths-ignore: ['tool/**']
  pull_request:
    paths-ignore: ['tool/**']
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the admin-visual and site-visual baselines instead of asserting against them
        type: boolean
        default: false

jobs:
  # The 0.91.0 cut proved the norms manifest's staleness window bites: a post-generation component
  # edit left the manifest stale, and only the release-time rehearsal caught it (docs-friction-log,
  # 2026-07-29). This workflow already builds and serves the showcase for the e2e specs, so calling
  # the reusable norms.yml here (the same definition publish.yml gates on) proves manifest freshness
  # on every push and pull request, well before a release. One definition, two callers.
  norms:
    uses: ./.github/workflows/norms.yml

  # The suite runs as a Playwright shard matrix (playwright.dev/docs/test-sharding): each leg builds
  # the showcase, runs its `--shard=i/N` slice, and uploads a blob report; the e2e-report job below
  # merges them into one HTML report. SHARD_TOTAL is the one place the count lives, and the matrix
  # legs are the matching indexes; keep the two in step. The regen dispatch runs one unsharded leg.
  e2e:
    name: e2e (shard ${{ matrix.shardIndex }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true' && '[1]' || '[1, 2]') }}
    env:
      SHARD_TOTAL: 2
    # Only the manual regen dispatch needs to push a commit back to the branch it ran against;
    # the routine push/pull_request runs never reach that step.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # This job also installs the showcase's own lockfile below, so the cache key has to
          # cover both, or the cache silently keys on the root lockfile alone and never warms
          # for the showcase install.
          cache-dependency-path: |
            package-lock.json
            examples/showcase/package-lock.json
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npm ci
          clean: node_modules
      # The showcase lockfile is committed (not gitignored) and installed with `npm ci` so CI resolves
      # the exact toolchain a developer reproduces locally. A floating `npm install` once drifted CI onto
      # a Vite 8 / Rolldown build that no local run could reproduce; see the post-mortem at
      # docs/internal/2026-06-21-e2e-dist-svelte-build-failure.md.
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npm ci --prefix examples/showcase
          clean: examples/showcase/node_modules
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 22
        with:
          command: npx --prefix examples/showcase playwright install --with-deps chromium
      # A DEFAULT build (no VITE_CAIRN_E2E) proves the fence holds: Vite substitutes `false` for
      # __CAIRN_DEV_BUILD__ at every call site, so the dev backend and its owner-session bypass are
      # eliminated from the deployable bundle. test:e2e's own webServer then does the flagged build
      # (VITE_CAIRN_E2E=1) and serves it through `wrangler dev` to run the specs, so this default-build
      # grep must run first.
      - run: npm --prefix examples/showcase run build
      - name: Assert the dev backend is eliminated from the default build's deployable bundle
        # adapter-cloudflare 7 does not bundle: .svelte-kit/cloudflare/_worker.js is a loader that
        # imports ../output/server/index.js by relative path, so the server code wrangler actually
        # bundles and deploys is invisible to a grep over .svelte-kit/cloudflare. `wrangler deploy
        # --dry-run` produces the artifact Cloudflare receives without needing credentials; grep that.
        # The grep covers the executable bundle only (--exclude='*.map'): SvelteKit 3 emits server
        # sourcemaps by default, and a map's sourcesContent holds authored source, including the
        # import lines the fold removes from the code. A Worker bundle is never served publicly, and
        # wrangler uploads a map only with upload_source_maps, so a map is not a deployed artifact.
        # wrangler resolves its config relative to the process cwd, not npx's --prefix, so this step
        # runs from examples/showcase directly rather than through npm/npx's --prefix flag.
        working-directory: examples/showcase
        run: |
          rm -rf /tmp/dev-fold-default
          npx wrangler deploy --dry-run --outdir=/tmp/dev-fold-default
          if grep -rlF --exclude='*.map' -f ../../scripts/checks/dev-fold-markers.txt /tmp/dev-fold-default 2>/dev/null; then
            echo "FAIL: dev-backend artifact in the deployable Worker"; exit 1
          fi
          echo "OK: no dev-backend artifact in the deployable Worker"
      - name: Assert the Worker bundle stays under the v1 corpus-in-bundle budget
        # The preview pass's globbed PublicRoutesConfig (the whole site's content corpus) now rides
        # into the deployable Worker for real (loadPreview, /preview/[token], is the first
        # runtime-routable route to import the public delivery composition), the accepted v1 cost the
        # plan's global constraints named. This reads the SAME /tmp/dev-fold-default artifact the
        # step above already produced (`wrangler deploy --dry-run`), not a second measurement, and
        # gates on gzip size, the figure Cloudflare's own script-size limits are measured against.
        #
        # The 5 MiB HARD budget is picked with roughly 60% headroom over the size measured when this
        # gate was added (about 3.1 MB gzipped); the narrowed manifest-backed resolver (ROADMAP)
        # replaces the full corpus with a per-entry read when this budget starts to bite. It sits
        # well under Workers Paid's own 10 MiB script limit, which is the ceiling that binds cairn:
        # a cairn site runs on Workers Paid, so free-tier fitness is not a goal this gate chases.
        # The free-tier figure is still echoed on every run, because bundle size is worth watching
        # and the 3 MiB (3,145,728-byte) Workers Free limit is a familiar yardstick for it (measured
        # 2026-08-19: 3,246,163 bytes, about 100 KB over). It is reported, never annotated: a
        # warning that fires on every single run carries no signal, which is the same defect class,
        # inverted, as a budget that can never fire.
        working-directory: examples/showcase
        run: |
          size=$(gzip -9 -c /tmp/dev-fold-default/_worker.js | wc -c)
          budget=$((5 * 1024 * 1024))
          free_tier_budget=$((3 * 1024 * 1024))
          echo "Worker bundle (gzip): ${size} bytes; hard budget: ${budget} bytes; free-tier threshold: ${free_tier_budget} bytes"
          if [ "$size" -gt "$free_tier_budget" ]; then
            echo "note: bundle is $((size - free_tier_budget)) bytes over the ${free_tier_budget}-byte Workers Free limit (expected; cairn runs on Workers Paid)"
          else
            echo "note: bundle is $((free_tier_budget - size)) bytes under the ${free_tier_budget}-byte Workers Free limit"
          fi
          if [ "$size" -gt "$budget" ]; then
            echo "FAIL: Worker bundle ${size} bytes (gzip) exceeds the ${budget}-byte v1 hard budget"
            exit 1
          fi
          echo "OK: Worker bundle ${size} bytes (gzip) is under the ${budget}-byte v1 hard budget"
      - name: "Gate self-test: the markers ARE present in a flagged build's deployable bundle"
        # A grep that can never match again is how this gate rotted before: adapter-cloudflare 7
        # stopped bundling and the old grep target (.svelte-kit/cloudflare) held no server code, so
        # the negative check above passed vacuously on every build, flagged or not. This positive
        # control proves the grep still finds real matches when the dev backend is actually present.
        # It keeps the same --exclude='*.map', so the match has to come from the executable bundle.
        working-directory: examples/showcase
        run: |
          rm -rf /tmp/dev-fold-flagged
          VITE_CAIRN_E2E=1 npm run build
          npx wrangler deploy --dry-run --outdir=/tmp/dev-fold-flagged
          if ! grep -rlF --exclude='*.map' -f ../../scripts/checks/dev-fold-markers.txt /tmp/dev-fold-flagged 2>/dev/null; then
            echo "FAIL: gate self-test: no dev-fold marker matched a flagged build's deployable bundle"; exit 1
          fi
          echo "OK: gate self-test: markers present in the flagged build's deployable bundle"
      - name: Run the e2e suite
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true') }}
        # playwright.config.ts leaves reporter unset, so the flag chooses: `dot` prints pass/fail
        # to the run log; `blob` writes this shard's blob-report (named by shard number, so legs
        # never clash) for the e2e-report job to merge into the HTML report; `json` writes the
        # per-shard report the retries step reads.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-retries.json
        run: npm --prefix examples/showcase run test:e2e -- --shard=${{ matrix.shardIndex }}/${{ env.SHARD_TOTAL }} --reporter=dot,blob,json
      # Manual regen mode: a dispatcher ticks `update_snapshots` after a deliberate rendering
      # change. Runs both visual specs BY FILE PATH (never a title grep, which silently skips
      # any test whose name doesn't match), on the CI runner itself, since baselines are
      # CI-canonical and a workstation render is never an acceptable substitute. Commits the
      # changed PNGs straight back to the branch the dispatch ran against, the same
      # checkout-commit-push shape as aksailingclub-org's ci.yml; nothing here uploads an
      # artifact for manual copy-back.
      - name: Regenerate the visual baseline snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-retries.json
        run: npm --prefix examples/showcase run test:e2e -- e2e/admin-visual.spec.ts e2e/site-visual.spec.ts --update-snapshots --reporter=dot,html,json
      # A retried test leaves the job green, so its name goes into the run's annotations. It runs
      # whether the tests passed or failed, and reads whichever of the two runs above wrote the report.
      - name: Report retried tests
        if: always()
        run: node scripts/ci/retries-notice.mjs "$RUNNER_TEMP/playwright-retries.json"
      - name: Commit the regenerated visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add examples/showcase/e2e/admin-visual.spec.ts-snapshots/ examples/showcase/e2e/site-visual.spec.ts-snapshots/
          if git diff --staged --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(e2e): regenerate the admin-visual and site-visual baselines"
            # A push that lands while the browsers run makes this non-fast-forward.
            git pull --rebase
            git push
          fi
      # Both paths are relative to examples/showcase: Playwright writes test-results (its outputDir
      # default) regardless of reporter, and the blob reporter writes blob-report. `if: failure()`
      # catches a failure from any prior step in this job, not only the test run.
      # `if-no-files-found: ignore` keeps the step from failing the job itself when a path has
      # nothing to upload (a failure before the run step leaves neither directory written). Names
      # carry the shard index so legs never collide on one artifact.
      - name: Upload the test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: examples/showcase/test-results
          retention-days: 7
          if-no-files-found: ignore
      # Runs on failure too, so the merged report shows the failing shard. The regen dispatch writes
      # no blob (its step uses the html reporter), so the step finds nothing and is ignored.
      - name: Upload this shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: examples/showcase/blob-report
          retention-days: 1
          if-no-files-found: ignore
      - if: failure() || cancelled()
        uses: ./.github/actions/install-diagnostics

  # Merges the shards' blob reports into the one HTML report. It needs only the showcase's
  # @playwright/test (no browsers, no build), and is skipped for the regen dispatch, which has no blobs.
  e2e-report:
    name: e2e report
    needs: e2e
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && github.event.inputs.update_snapshots == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/showcase/package-lock.json
      - uses: ./.github/actions/bounded-install
        timeout-minutes: 8
        with:
          command: npm ci --prefix examples/showcase
          clean: examples/showcase/node_modules
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the blob reports into the HTML report
        working-directory: examples/showcase
        run: npx playwright merge-reports --reporter html "$RUNNER_TEMP/all-blob-reports"
      - name: Upload the merged Playwright report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: examples/showcase/playwright-report
          retention-days: 7
          if-no-files-found: ignore
