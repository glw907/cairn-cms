name: Norms manifest freshness

# The norms manifest ships in the package, so a cut cannot ship a stale one. This workflow renders
# the admin screens and compares a fresh generation against the committed manifest.
#
# It lives here, as its own reusable workflow, rather than as a job inside publish.yml, so the
# check can be PROVEN on CI without attempting a real npm publish. publish.yml calls it through
# `workflow_call` and still gates on it, so there is one definition of the check and no way for the
# publish path and the rehearsal path to drift apart. Dispatch it from the Actions tab (or
# `gh workflow run norms.yml --ref <branch>`) against any branch to rehearse.
#
# It is deliberately outside the `check:*` family that test.yml runs. Those scripts invoke
# `npm run package` on every call and run on every push; a browser render inside that hot path
# would add latency and flake to every gate for a file that only matters at a cut (spec section
# 6.4). Regenerating is `npm run norms:generate` against the same preview server.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  norms:
    name: Norms manifest freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 LTS, matching test.yml and e2e.yml, so the render runs on the toolchain the
          # rest of CI proves.
          node-version: 24
          cache: npm
          # This job also installs the showcase's own lockfile below, so the cache key has to
          # cover both, or the cache silently keys on the root lockfile alone and never warms
          # for the showcase install.
          cache-dependency-path: |
            package-lock.json
            examples/showcase/package-lock.json
      - run: npm ci
      # The showcase lockfile is committed and installed with `npm ci`, the same convention e2e.yml
      # follows, so the rendered admin is the exact build a developer reproduces locally.
      - run: npm ci --prefix examples/showcase
      # Chromium for the ROOT playwright, which is what the generator imports; the version is
      # pinned by the root lockfile, and the manifest's numbers are only reproducible against a
      # pinned engine.
      - run: npx playwright install --with-deps chromium
      - run: VITE_CAIRN_E2E=1 npm --prefix examples/showcase run build
      - name: Serve the showcase admin
        run: |
          # Detached, with its output redirected: a background process still holding the step's
          # stdout keeps the step from ever finishing.
          CAIRN_DEV_BACKEND=1 nohup npm --prefix examples/showcase run preview -- --port 4173 \
            > /tmp/showcase-preview.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/admin/posts && exit 0
            sleep 2
          done
          echo "the showcase preview never answered at http://localhost:4173"
          cat /tmp/showcase-preview.log
          exit 1
      - run: npm run norms:check

  # The rendered `motion-reduced-delay` audit. Wired here rather than into a new file: this job
  # reuses the "Serve the showcase admin" recipe two jobs above verbatim, on its own port (4174,
  # never 4173, since the showcase e2e suite and capture-surfaces.mjs both hard-code that port and
  # this workflow never runs beside them, but a distinct port keeps that true by construction).
  #
  # `npm ci` at the repo root triggers the package's own `prepare` script (`npm run package`), which
  # is what builds `dist/audit/bin.js` before `npx cairn-audit` ever runs; no separate build step is
  # needed for that reason, the same reason the `norms` job above never runs one either.
  motion-reduced-delay:
    name: motion-reduced-delay rendered audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/showcase/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/showcase
      - run: npx playwright install --with-deps chromium
      - run: VITE_CAIRN_E2E=1 npm --prefix examples/showcase run build
      - name: Serve the showcase admin
        run: |
          # Detached, with its output redirected: a background process still holding the step's
          # stdout keeps the step from ever finishing.
          CAIRN_DEV_BACKEND=1 nohup npm --prefix examples/showcase run preview -- --port 4174 \
            > /tmp/showcase-preview-motion.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4174/admin/posts && exit 0
            sleep 2
          done
          echo "the showcase preview never answered at http://localhost:4174"
          cat /tmp/showcase-preview-motion.log
          exit 1
      # Scoped to motion-reduced-delay alone with --rule: the job exercises one advisory rule and
      # exits 0 unless the run itself fails to start, never a gate on the rule's own findings.
      - run: BASE_URL=http://localhost:4174 npx cairn-audit --rendered --rule motion-reduced-delay
