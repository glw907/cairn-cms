name: Publish to npm

# Token-free publishing via npm Trusted Publishing (OIDC). No NPM_TOKEN secret:
# npm mints a short-lived credential from the GitHub OIDC token, and (for public
# repos) attaches build provenance automatically. Configure the trusted publisher
# once at npmjs.com → @glw907/cairn-cms → Settings → Trusted Publisher
# (repo: glw907/cairn-cms, workflow: publish.yml).
#
# Release flow: bump "version" in package.json, then either publish a GitHub
# Release or run this workflow manually. `prepublishOnly` (svelte-package) builds
# dist as part of `npm publish`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  # The norms manifest ships in the package, so a cut cannot ship a stale one. The check is defined
  # once, in norms.yml, and called here so the publish still gates on it. Keeping it there rather
  # than inline is what makes it rehearsable: norms.yml also carries `workflow_dispatch`, so the
  # render can be proven on CI against any branch without this workflow attempting a real publish.
  norms:
    uses: ./.github/workflows/norms.yml

  publish:
    needs: norms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing requires npm >= 11.5.1 (newer than the bundled version).
      # WATCH: pinned to the 11.x line because npm 12.0.0 (2026-07-08) ships without its
      # sigstore module and every publish fails on MODULE_NOT_FOUND in libnpmpublish;
      # move back to npm@latest once a fixed 12.x publishes cleanly.
      - run: npm install -g npm@11
      - run: npm install --no-audit --no-fund
      # Validate the published package shape before releasing.
      - run: npm run check:package
      # The repo is public, so OIDC trusted publishing attaches build provenance automatically.
      #
      # The dist-tag is derived from the version rather than left to npm's default, which is
      # `latest` whatever the version's shape. A prerelease published to `latest` would serve a
      # candidate to every bare `npm install @glw907/cairn-cms`, while the caret ranges the
      # consumer sites pin would not resolve it at all, so the one audience it reached would be
      # the one that never asked for it. ROADMAP's "Toward 1.0" names `next` as the prerelease
      # dist-tag, and `latest` keeps pointing at the last stable until a stable supersedes it.
      #
      # The already-published guard mirrors publish-dev's, and for the same reason: the two
      # packages publish in separate jobs that can fail apart, so re-running a release to recover
      # the half that failed must not die on the half that already landed. 0.95.0 is the case that
      # proved it, publishing the engine while the dev backend failed provenance validation.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          if npm view "@glw907/cairn-cms@$VERSION" version >/dev/null 2>&1; then
            echo "@glw907/cairn-cms@$VERSION is already on the registry; skipping"
            exit 0
          fi
          echo "publishing $VERSION to the '$TAG' dist-tag"
          npm publish --access public --tag "$TAG"

  # The dev backend publishes alongside the engine: a scaffolded site's devDependency needs
  # @glw907/cairn-cms-dev on the registry at the version the bake writes, which is also the spec
  # templates/waymark carries. Its trusted publisher was configured at the
  # first publish (2026-08-16, done by hand because npm cannot bind a trusted publisher to a
  # package that does not exist). The already-published guard exists because the two packages
  # version in lockstep but can publish apart (that first cut published the dev backend
  # manually); re-running a release must not fail on the half that already landed.
  publish-dev:
    needs: norms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Same npm pin as the engine job above; see its WATCH comment.
      - run: npm install -g npm@11
      - name: Publish @glw907/cairn-cms-dev to npm
        working-directory: packages/cairn-cms-dev
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          if npm view "@glw907/cairn-cms-dev@$VERSION" version >/dev/null 2>&1; then
            echo "@glw907/cairn-cms-dev@$VERSION is already on the registry; skipping"
            exit 0
          fi
          echo "publishing @glw907/cairn-cms-dev@$VERSION to the '$TAG' dist-tag"
          npm publish --access public --tag "$TAG"
