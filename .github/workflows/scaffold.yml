name: scaffold

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # Build and pack the engine and the dev backend into tarballs the emitted template installs,
      # which mirrors a scaffolded user's npm-range resolution without needing the registry.
      - run: npm run package
      - name: Pack the engine and dev backend
        id: pack
        # npm pack runs the engine's `prepare` build hook, whose stdout banners precede the tarball
        # name; --silent does not suppress lifecycle stdout, so take the last line as the filename.
        run: |
          ENGINE_TGZ="$PWD/$(npm pack --silent | tail -n1)"
          DEV_TGZ="$PWD/$(npm pack --silent ./packages/cairn-cms-dev | tail -n1)"
          echo "engine=$ENGINE_TGZ" >> "$GITHUB_OUTPUT"
          echo "dev=$DEV_TGZ" >> "$GITHUB_OUTPUT"
      - name: Emit the scaffolded template
        run: node scripts/build/emit-template.mjs /tmp/cairn-emitted "file:${{ steps.pack.outputs.engine }}" "file:${{ steps.pack.outputs.dev }}" emitted-site
      - name: Install, typecheck, and build the emitted template
        working-directory: /tmp/cairn-emitted
        run: |
          npm install
          npm run check
          npm run build
      - name: Assert the dev backend is eliminated from the emitted Worker's deployable bundle
        # adapter-cloudflare 7 does not bundle: .svelte-kit/cloudflare/_worker.js is a loader that
        # imports ../output/server/index.js by relative path, so the server code wrangler actually
        # bundles and deploys is invisible to a grep over .svelte-kit/cloudflare. `wrangler deploy
        # --dry-run` produces the artifact Cloudflare receives without needing credentials; grep that.
        working-directory: /tmp/cairn-emitted
        run: |
          rm -rf /tmp/dev-fold-default
          npx wrangler deploy --dry-run --outdir=/tmp/dev-fold-default
          if grep -rlF -f "$GITHUB_WORKSPACE/scripts/checks/dev-fold-markers.txt" /tmp/dev-fold-default 2>/dev/null; then
            echo "FAIL: dev-backend artifact in the emitted Worker"; exit 1
          fi
          echo "OK: no dev-backend artifact in the emitted Worker"
      - name: "Gate self-test: the markers ARE present in a flagged emitted build's deployable bundle"
        # A grep that can never match again is how this gate rotted before: adapter-cloudflare 7
        # stopped bundling and the old grep target (.svelte-kit/cloudflare) held no server code, so
        # the negative check above passed vacuously on every build, flagged or not. This positive
        # control proves the grep still finds real matches when the dev backend is actually present.
        working-directory: /tmp/cairn-emitted
        run: |
          rm -rf /tmp/dev-fold-flagged
          VITE_CAIRN_E2E=1 npm run build
          npx wrangler deploy --dry-run --outdir=/tmp/dev-fold-flagged
          if ! grep -rlF -f "$GITHUB_WORKSPACE/scripts/checks/dev-fold-markers.txt" /tmp/dev-fold-flagged 2>/dev/null; then
            echo "FAIL: gate self-test: no dev-fold marker matched a flagged emitted build's deployable bundle"; exit 1
          fi
          echo "OK: gate self-test: markers present in the flagged emitted build's deployable bundle"
