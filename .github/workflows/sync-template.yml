name: Sync template repo

# The public glw907/cairn-waymark-template repo is generated wholesale from this package's bake
# output; a hand edit there survives at most one sync. publish.yml carries the release-triggered
# path (see its `sync-template-repo` job for why that one lives there instead of here). This
# workflow carries the two paths that are not tied to a release:
#
#   - `workflow_dispatch`, a real sync on demand. This pass's first sync and its live spike both
#     use this path, since the release path stays unproven until a release actually ships the dev
#     backend.
#   - a weekly cron in --dry-run --verify-build compare mode that fails on drift or on a build
#     failure: the machine-detectable tripwire for a hand edit to the template repo, an expired
#     TEMPLATE_REPO_TOKEN, a sync that has gone silently inert, or a template that has stopped
#     building because the published engine moved underneath it (--verify-build runs the build
#     check unconditionally here, since the release-triggered sync in publish.yml only proves
#     buildability at the moment a release publishes, never in between). A red run reaches a
#     maintainer through GitHub's own failure notification rather than waiting for someone to
#     notice at the next release.

on:
  workflow_dispatch:
    inputs:
      strip-dev-backend:
        description: >-
          Strip the @glw907/cairn-cms-dev devDependency, its dev script, and the dev shim from the
          synced tree. Leave this on until the dev backend's first publish: a template referencing
          an unpublished package fails npm install for anyone who uses it before then.
        type: boolean
        default: true
  schedule:
    # Monday 06:00 UTC. Weekly is frequent enough that drift never accumulates for long and rare
    # enough not to be noise; the exact hour has no significance beyond sitting outside the
    # release-triggered path's own traffic.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Shared with publish.yml's own sync-template-repo job, so a manual dispatch cut during a release
# cannot race the release-triggered sync. Two concurrent syncs would not corrupt the template repo
# (the loser's push is refused as a non-fast-forward), but the loser fails red, and a red run whose
# cause is a benign race is exactly what teaches a maintainer to stop reading these notifications.
concurrency:
  group: sync-template-repo

jobs:
  sync:
    name: Sync the public template repo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A real sync's own install-and-build (paid whenever there is drift to push) runs in well
    # under two minutes locally; this bounds a wedged install or build well short of GitHub's
    # 6-hour job default, without being so tight that ordinary network variance trips it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # --engine-spec/--dev-spec are required because the bake this script runs internally refuses
      # its own default: cairn-cms-dev's repo-declared version is 0.0.0 (unpublished) today, so the
      # engine's own version stands in for both specs, the same substitution test.yml's bake step
      # makes and for the same reason.
      - name: Sync the public template repo
        working-directory: packages/create-cairn-site
        env:
          TEMPLATE_REPO_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          VERSION="$(node -p "require('../../package.json').version")"
          STRIP_FLAG=""
          if [ "${{ inputs.strip-dev-backend }}" = "true" ]; then
            STRIP_FLAG="--strip-dev-backend"
          fi
          node scripts/sync-template-repo.mjs --remote https://github.com/glw907/cairn-waymark-template.git \
            --engine-spec "^$VERSION" --dev-spec "^$VERSION" $STRIP_FLAG

  drift-check:
    name: Fail on template repo drift
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # --verify-build below pays for a real install and build every run, the same cost the sync
    # job pays only when pushing; see that job's own timeout comment for the basis of the bound.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # --dry-run never pushes, so this step only reads and reports. --verify-build adds a real
      # install and build of the composed tree, run unconditionally (even on a clean compare with
      # nothing to push), since a template can be perfectly in sync with the bake and still stop
      # building once the published engine moves underneath it; the release-triggered sync in
      # publish.yml only proves buildability at the moment a release publishes, never in between.
      # The script's own contract exits 0 on both a clean compare and a drifted one, printing a
      # distinct line for each ("up to date at <sha> (no changes)" versus "dry run: would sync N
      # file(s)"); this step is what turns a drifted compare, a failed build, or any other failure
      # (a bad credential, a renamed remote), into a red run. `-o pipefail` (GitHub's default bash
      # flags) means a script failure fails the step before the grep ever runs, and a clean
      # compare that does not match the no-op line also fails it, so neither an error nor silent
      # drift can pass as healthy.
      #
      # WATCH: --strip-dev-backend below is hardcoded on, and it comes off at release one, in the
      # same edit that drops the dispatch input's default and the overlay README's pre-release
      # notice. The release path (publish.yml) never strips, so the moment a release publishes
      # @glw907/cairn-cms-dev this compare starts measuring a stripped bake against an unstripped
      # repo and goes red every Monday forever. A tripwire that cries wolf weekly is worse than no
      # tripwire: the next real drift arrives in a notification everyone has learned to delete. The
      # obligation is filed in CHANGELOG.md as a release-checklist item, and this comment is the
      # copy that sits where the edit has to happen.
      - name: Compare the public template repo against a fresh bake
        working-directory: packages/create-cairn-site
        env:
          TEMPLATE_REPO_TOKEN: ${{ secrets.TEMPLATE_REPO_TOKEN }}
        run: |
          VERSION="$(node -p "require('../../package.json').version")"
          node scripts/sync-template-repo.mjs --remote https://github.com/glw907/cairn-waymark-template.git \
            --engine-spec "^$VERSION" --dev-spec "^$VERSION" --strip-dev-backend --dry-run \
            --verify-build | tee sync-dry-run.log
          if ! grep -q "up to date at .* (no changes)" sync-dry-run.log; then
            echo "::error::the public template repo has drifted from a fresh bake; run the sync-template.yml workflow_dispatch to sync it"
            exit 1
          fi
