name: test

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pin Node 22 LTS: vitest-pool-workers has a known console bug on Node 24.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The component test project runs in real Chromium via @vitest/browser-playwright.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Two node:test suites vitest does not reach. The emitter's own tests were never wired into
      # any workflow; the create-cairn-site package is new. Both gate the scaffolded output, so a
      # break here ships a broken first-run experience while every vitest project stays green.
      - run: npm run test:emit
      # Two of the create-cairn-site tests read the baked `template/`, which is gitignored and
      # produced by `prepack`. Bake it first, or those two fail on a clean checkout while passing
      # on any machine that has run the CLI. The engine's own version stands in for both specs,
      # the same substitution create-site.yml makes and for the same reason: the bake refuses a
      # `file:` spec and a 0.0.0 version, so `prepack`'s default path is unrunnable until
      # @glw907/cairn-cms-dev publishes.
      - name: Bake the create-cairn-site template
        working-directory: packages/create-cairn-site
        run: |
          VERSION="$(node -p "require('../../package.json').version")"
          node scripts/bake-template.mjs --to template --engine-spec "^$VERSION" --dev-spec "^$VERSION"
      - run: npm --prefix packages/create-cairn-site test
      - run: npm run check:package
      - run: npm run check:reference
      - run: npm run check:reference:signatures
      - run: npm run check:surface
      - run: npm run check:custom-surface
      - run: npm run check:chassis-boundary
      - run: npm run check:cm-internals
      - run: npm run check:invisible-craft
      - run: npm run check:admin-css-classes
      - run: npm run check:readiness
      - run: npm run check:docs
      - run: npm run check:arm-indexes
      - run: npm run check:visuals
      - run: npm run check:transcripts
      - run: npm run check:symbols
      - run: npm run check:snippets
      - run: npm run check:prose
      - run: npm run check:version
      - run: npm run check:dev-package
      # templates/waymark is generated from examples/showcase by the bake, so it can go stale the
      # moment the showcase changes. This is the tripwire that used to be a weekly cross-repo drift
      # cron: it needs no push credential and fails on the change that caused the drift.
      - run: npm run check:template
      # The showcase lockfile is committed and installed with `npm ci` so this job resolves the
      # exact toolchain a developer reproduces locally, the same convention e2e.yml follows.
      - run: npm ci --prefix examples/showcase
      - run: npm run check:consumers
      # The showcase's own svelte-check: it sits outside tsconfig.json's `include`, so the root
      # `npm run check` never reaches it. A consumer-facing type error (a facade action's success
      # payload colliding with another action's failure field inside SvelteKit's generated
      # ActionData) is invisible until this runs.
      - run: npm --prefix examples/showcase run check
      - name: Install Vale 3.15.1
        run: |
          curl -sfL https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
      # Error-tier only: warnings and suggestions are advisory and are not gated (the standing
      # repo rule). The Google and Microsoft style packages are vendored under .vale/styles, so
      # this runs offline against the exact rules committed to the repo.
      - run: npm run check:vale
      - run: npm run check:comments
