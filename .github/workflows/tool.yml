name: tool

# The Go operator CLI's own gate: `make -C tool check` on three platforms. Scoped to `tool/**`
# plus the cross-tree drift gates whose fixtures, types, schemas, or published pages a Go check
# depends on, so a change elsewhere in the repo never triggers this workflow and a change to one
# of those paths always does. The three contract pages and the schema directory are on the list
# because Go tests read them: they publish the tool's own exit codes, payloads, and check ids,
# and they live in the engine's reference arm so the npm tarball carries them.

on:
  push:
    branches: [main, rebuild]
    paths:
      - 'tool/**'
      - '.github/workflows/tool.yml'
      - 'packages/create-cairn-site/src/**'
      - 'packages/create-cairn-site/fixtures/**'
      - 'src/lib/diagnostics/conditions.ts'
      - 'src/lib/log/events.ts'
      - 'docs/admin/is-it-working.md'
      - 'docs/reference/cli-cairn-exit-codes.md'
      - 'docs/reference/cli-cairn-json-output.md'
      - 'docs/reference/cli-cairn-doctor.md'
      - 'docs/reference/schema/**'
    tags: ['tool/v*']
  pull_request:
    paths:
      - 'tool/**'
      - '.github/workflows/tool.yml'
      - 'packages/create-cairn-site/src/**'
      - 'packages/create-cairn-site/fixtures/**'
      - 'src/lib/diagnostics/conditions.ts'
      - 'src/lib/log/events.ts'
      - 'docs/admin/is-it-working.md'
      - 'docs/reference/cli-cairn-exit-codes.md'
      - 'docs/reference/cli-cairn-json-output.md'
      - 'docs/reference/cli-cairn-doctor.md'
      - 'docs/reference/schema/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  VALE_VERSION: '3.15.1'

jobs:
  check:
    # GitHub does not evaluate `paths` for a tag push, so a `tool/v*` tag push runs this job
    # unconditionally, same as workflow_dispatch. That is intentional: the release job below
    # needs this job's binaries to come from a ref the gate ran on, so it declares `needs: check`
    # rather than the two jobs racing independently on a tag push.
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # The floor, not the patch. tool/go.mod's directive is 1.26.0, and setup-go
          # pins GOTOOLCHAIN=local to whatever it installs, so reading the file directly
          # would gate every run on the floor's own first patch release: govulncheck then
          # reports every stdlib advisory fixed since. This installs the newest patch of
          # the same minor, which is the oldest toolchain an operator should be running.
          go-version: '1.26.x'
      - name: Install Vale (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
      - name: Install Vale (macOS)
        if: runner.os == 'macOS'
        run: |
          # macos-latest is arm64; select the asset from runner.arch rather than hardcoding,
          # since GitHub has moved macos-latest to arm64 before without renaming the label.
          asset="64-bit"
          if [ "${{ runner.arch }}" = "ARM64" ]; then
            asset="arm64"
          fi
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_macOS_${asset}.tar.gz" -o vale.tar.gz
          sudo tar -xz -C /usr/local/bin -f vale.tar.gz vale
      - name: Install Vale (Windows)
        if: runner.os == 'Windows'
        run: |
          # 7z (7-Zip) is preinstalled on windows-latest; unzip is not. Extract into a relative
          # directory under the workspace, not $RUNNER_TEMP: that variable holds a backslash
          # Windows path, and interpolating it into a bash mkdir -p / mv breaks on the separator.
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Windows_64-bit.zip" -o vale.zip
          7z x vale.zip -ovale-bin -y
          echo "$PWD/vale-bin" >> "$GITHUB_PATH"
      - run: vale --version
      - name: Install GNU make (Windows)
        # windows-latest ships no GNU make (7zip, CMake, gcc, gdb, binutils are preinstalled;
        # make is not), so the make step below needs it installed first.
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress -y
      - name: Show make version (Windows)
        if: runner.os == 'Windows'
        run: make --version
      - run: make -C tool check
      - name: Verbose store package tests (Windows)
        # make test runs go test ./... with no -v, so a skipped test (the symlink tests above
        # skip on Windows CI, which typically lacks the privilege to create one) is invisible in
        # the log and the junction test's own proof of the reparse-point defense rests on an
        # unreferenced job log. Scoped to the store package and to this platform, since that is
        # the one leg where the distinction between "ran and passed" and "skipped" matters.
        if: runner.os == 'Windows'
        working-directory: tool
        run: go test -v ./internal/store/...

  release:
    # Runs on a real `tool/v*` tag (the publish) and on workflow_dispatch (Task 1's dry run,
    # which proves the cross-compile without publishing anything). Task 23 is the first tag push.
    # `needs: check` means the binaries below only build after the same ref has passed the full
    # three-platform gate; a tag push that fails `check` never reaches this job.
    name: release
    needs: check
    if: ${{ startsWith(github.ref, 'refs/tags/tool/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Attestation mints a Sigstore identity token and writes to the repository's attestations
      # store, so the attest step below fails naming whichever of the two is absent.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe reads the tool's own tags, and the default shallow checkout fetches
          # none, so a workflow_dispatch run would otherwise stamp every artifact "dev".
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          # The floor, not the patch. tool/go.mod's directive is 1.26.0, and setup-go
          # pins GOTOOLCHAIN=local to whatever it installs, so reading the file directly
          # would gate every run on the floor's own first patch release: govulncheck then
          # reports every stdlib advisory fixed since. This installs the newest patch of
          # the same minor, which is the oldest toolchain an operator should be running.
          go-version: '1.26.x'
      - name: Generate man pages
        # Every archive carries the generated pages beside the binary, so a packager and an
        # operator both get them without the repository. Man pages are platform-independent, so
        # one generation on this runner serves all six targets.
        working-directory: tool
        run: make man
      - name: Cross-compile release archives
        id: build
        working-directory: tool
        run: |
          set -euo pipefail
          # A tag names its own version; a dry run has no tag, so it describes from the nearest
          # one. Either way the `tool/v` prefix comes off: it is the monorepo's tag namespace,
          # not part of the version an operator reads out of `cairn --version`.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#tool/v}"
          else
            version="$(git describe --tags --match 'tool/v*' --always | sed 's|^tool/v||')"
          fi
          commit="$(git rev-parse --short HEAD)"
          module="github.com/glw907/cairn-cms/tool"
          # Matching the Makefile's build target exactly, so a release binary reports the same
          # version a local `make -C tool build` would.
          ldflags="-X '${module}/internal/version.Version=${version}' -X '${module}/internal/version.Commit=${commit}'"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          rm -rf dist
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            name="cairn_${version}_${goos}_${goarch}"
            stage="dist/${name}"
            mkdir -p "${stage}/man"
            binary="cairn"
            [ "$goos" = "windows" ] && binary="cairn.exe"
            echo "building ${name}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "${stage}/${binary}" ./cmd/cairn
            cp man/*.1 "${stage}/man/"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -qr "../${name}.zip" "$binary" man)
            else
              tar -czf "dist/${name}.tar.gz" -C "$stage" "$binary" man
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum cairn_* > SHA256SUMS)
          ls -la dist
          cat dist/SHA256SUMS
      - name: Assert each archive's file list
        working-directory: tool
        run: |
          set -euo pipefail
          count=0
          check() {
            # $1 archive, $2 its listing, $3 the binary name it must carry
            printf '== %s\n%s\n' "$1" "$2"
            grep -qx "$3" <<<"$2" || { echo "$1: no $3 at the archive root"; exit 1; }
            grep -qx 'man/cairn.1' <<<"$2" || { echo "$1: no man/cairn.1"; exit 1; }
          }
          for archive in dist/*.tar.gz; do
            check "$archive" "$(tar -tzf "$archive")" cairn
            count=$((count + 1))
          done
          for archive in dist/*.zip; do
            check "$archive" "$(unzip -Z1 "$archive")" cairn.exe
            count=$((count + 1))
          done
          [ "$count" -eq 6 ] || { echo "built ${count} archives, want 6"; exit 1; }
      - name: Run the runner-native artifact
        # Linking a binary is not running one, so the artifact this runner can execute is
        # unpacked and asked for its own version. A tag run holds it to the tag; a dry run has
        # no tag to compare against and asserts only that the stamping happened at all.
        working-directory: tool
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p native
          tar -xzf "dist/cairn_${VERSION}_linux_amd64.tar.gz" -C native
          out="$(./native/cairn --version)"
          echo "$out"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            want="${GITHUB_REF_NAME#tool/v}"
            case "$out" in
              "$want ("*) ;;
              *) echo "--version does not open with ${want} and a commit"; exit 1 ;;
            esac
          else
            case "$out" in
              dev*|"") echo "--version reports an unstamped build"; exit 1 ;;
              *" ("*")"*) ;;
              *) echo "--version carries no commit"; exit 1 ;;
            esac
          fi
          rm -rf native
      - name: Attest build provenance
        # A SHA256SUMS file published in the same release as the binaries it covers proves
        # integrity, not authenticity: whoever could replace a binary could replace the checksum
        # beside it. Attestation binds each archive to this workflow and this commit. It runs on
        # a dry run too, so the two permissions above are exercised before any tag.
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            tool/dist/*.tar.gz
            tool/dist/*.zip
      - name: Verify the attestation
        # The same command tool/README.md gives an operator, run here against the archives this
        # job just built, so the documented verification path is exercised by every release
        # rather than only written down.
        working-directory: tool
        run: |
          set -euo pipefail
          # The command takes one artifact, so the six are verified one at a time.
          for archive in dist/*.tar.gz dist/*.zip; do
            gh attestation verify "$archive" --repo "${{ github.repository }}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish release
        if: ${{ github.ref_type == 'tag' }}
        run: |
          gh release create "${{ github.ref_name }}" \
            tool/dist/*.tar.gz tool/dist/*.zip tool/dist/SHA256SUMS \
            --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
