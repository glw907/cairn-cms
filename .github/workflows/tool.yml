name: tool

# The Go operator CLI's own gate: `make -C tool check` on three platforms. Scoped to `tool/**`
# plus the four cross-tree drift gates whose fixtures or types a Go check depends on, so a
# change elsewhere in the repo never triggers this workflow and a change to one of those four
# files always does.

on:
  push:
    branches: [main, rebuild]
    paths:
      - 'tool/**'
      - '.github/workflows/tool.yml'
      - 'packages/create-cairn-site/src/**'
      - 'packages/create-cairn-site/fixtures/**'
      - 'src/lib/diagnostics/conditions.ts'
      - 'src/lib/log/events.ts'
      - 'docs/admin/is-it-working.md'
    tags: ['tool/v*']
  pull_request:
    paths:
      - 'tool/**'
      - '.github/workflows/tool.yml'
      - 'packages/create-cairn-site/src/**'
      - 'packages/create-cairn-site/fixtures/**'
      - 'src/lib/diagnostics/conditions.ts'
      - 'src/lib/log/events.ts'
      - 'docs/admin/is-it-working.md'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  VALE_VERSION: '3.15.1'

jobs:
  check:
    # GitHub does not evaluate `paths` for a tag push, so a `tool/v*` tag push runs this job
    # unconditionally; skip it there and let the release job below do the tag's own work.
    if: ${{ !startsWith(github.ref, 'refs/tags/tool/v') }}
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: tool/go.mod
      - name: Install Vale (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
      - name: Install Vale (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_macOS_64-bit.tar.gz" -o vale.tar.gz
          sudo tar -xz -C /usr/local/bin -f vale.tar.gz vale
      - name: Install Vale (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Windows_64-bit.zip" -o vale.zip
          unzip vale.zip vale.exe
          mkdir -p "$RUNNER_TEMP/vale"
          mv vale.exe "$RUNNER_TEMP/vale/vale.exe"
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
      - run: vale --version
      - run: make -C tool check

  release:
    # Runs on a real `tool/v*` tag (the publish) and on workflow_dispatch (Task 1's dry run,
    # which proves the cross-compile without publishing anything). Task 23 is the first tag push.
    name: release
    if: ${{ startsWith(github.ref, 'refs/tags/tool/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: tool/go.mod
      - name: Cross-compile release binaries
        working-directory: tool
        run: |
          set -euo pipefail
          version="$(git describe --tags --always)"
          commit="$(git rev-parse --short HEAD)"
          module="github.com/glw907/cairn-cms/tool"
          ldflags="-X '${module}/internal/version.Version=${version}' -X '${module}/internal/version.Commit=${commit}'"
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
            "windows arm64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<<"$target"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            out="dist/cairn-${goos}-${goarch}${ext}"
            echo "building ${out}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/cairn
          done
          (cd dist && sha256sum cairn-* > SHA256SUMS)
          ls -la dist
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/tool/v') }}
        run: gh release create "${{ github.ref_name }}" tool/dist/* --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
