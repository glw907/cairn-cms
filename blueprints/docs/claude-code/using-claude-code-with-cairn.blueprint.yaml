version: 1
argument: |
  cairn's guidance for Claude Code is a tree of files under `.claude/` that a scaffolded site is
  born with and that `cairn-guidance install` writes on any other site, and the engine stops at
  that tree: it never edits Claude Code's settings, never rewrites the site's root `CLAUDE.md`,
  and never makes CI fail on a stale tree unless the developer chooses that. A developer who
  works with Claude Code therefore needs three things from this page: what the tree holds and
  which skill loads for which task, the two deliberate edits the engine leaves to them (the
  `Stop` hook and, if they want it, a CI gate), and how `cairn-guidance install` and
  `cairn-guidance check` report what they did, since `install` exits 0 even on a partial run.
introduction:
  covers: |
    How to work on a cairn site with Claude Code: the guidance tree cairn installs under
    `.claude/` and the root `CLAUDE.md` that imports it, which of the four packaged skills loads
    for which task, where the review agent sits (its file, with a link to the reference for what
    it checks), how to wire the `Stop` hook that runs the site's `check:cairn` script when a
    Claude Code turn ends (adding that script on a site without one), and how to adopt, refresh,
    and check the tree with `cairn-guidance install` and `cairn-guidance check`, including their
    exit codes, what `check` reports when a site lacks the scaffold's gate wiring, and the
    scaffold's CI step and how to make it gate (starting the workflow on a site without one). The
    reader is the extend track's developer (a Svelte-fluent web developer
    building an organization's site on cairn's seams) who has chosen Claude Code as their coding
    assistant. Two arrivals are named: a developer whose scaffolded site already carries the tree
    and wants to know what Claude Code now reads, and a developer adopting the tree on an
    existing site or refreshing it after an upgrade. The framing states that the rest of the
    docs assume no coding assistant and that this page is the one that teaches working with
    Claude Code, and that cairn ships its guidance in Claude Code's format only, with no
    `AGENTS.md` and no file for any other coding agent, so a developer using another agent has
    no cairn guidance to read (one line, f:pmmtrm).
  priorKnowledge: |
    A running cairn site with the engine installed, and working knowledge of Claude Code itself:
    starting a session in a project, what a skill and a subagent are, and where a project's
    `.claude/settings.json` lives. Package scripts and a GitHub Actions workflow file are assumed.
    No knowledge of the engine's internals is needed.
  notCovered: |
    Any coding assistant other than Claude Code, which cairn ships nothing for. The review agent's
    purpose and how it relates to the audit gate: the page places only the agent's file, and the
    `cairn-guidance` reference page describes what the agent checks. The scaffolded
    tree outside `.claude/`, file by file, which Scaffolded site files covers. Running the audit
    and reading its findings, which Run cairn-audit on your site covers. The upgrade procedure and
    when to refresh, which Upgrade cairn covers. Writing a consultation brief, whose protocol
    lives in the `cairn-consult` skill itself. The CLI's full option and output listing and the
    trust boundary, which the `cairn-guidance` reference page covers.
  facts:
    - f:pmmtrm
framing:
  readers: |
    The page has no register track of its own, so its reader is the extend track's profile, per
    the outline's `job`: a Svelte-fluent web developer building an organization's site on cairn's
    seams, who has chosen Claude Code as their coding assistant. Two arrivals:

    1. **The scaffolded-site developer.** The site already carries the guidance tree, and the
       reader wants to know what Claude Code now reads and which skill fires for which task.
    2. **The adopting or refreshing developer.** The reader adopts the tree on an existing site,
       or refreshes it after an engine upgrade, and needs to know what `install` writes and what
       it leaves to them.

    A developer using another coding agent arrives in the wrong place: cairn ships no guidance
    for that agent (`f:pmmtrm`), and the introduction says so in one line.
  introPlan: |
    Two paragraphs, then the bounds (prior knowledge and what the page leaves out). No heading.

    1. **The task and the reader.** State the task from the reader's situation: setting up and
       working with Claude Code on a cairn site. Say who the page is for, the extend track's
       developer who has chosen Claude Code, and name the two arrivals: a scaffolded site that
       already carries the tree, and an existing site adopting the tree or refreshing it after an
       upgrade. State that the rest of the docs assume no coding assistant and that this page is
       the one that teaches working with Claude Code. Give one line, and only one, to other
       agents: cairn ships its guidance in Claude Code's format only, with no `AGENTS.md` and no
       file for any other coding agent, so a developer using another agent has no cairn guidance
       to read (`f:pmmtrm`).
    2. **The contract.** Name what the reader does with the page: learn the guidance tree under
       `.claude/` and the root `CLAUDE.md` that imports it, which of the four packaged skills
       loads for which task, and where the review agent sits (its file, with the reference for
       what it checks); wire the `Stop` hook that runs the site's `check:cairn` script when a
       Claude Code turn ends, adding that script on a site without one; adopt, refresh, and
       check the tree with `cairn-guidance install` and `cairn-guidance check`, including their
       exit codes and what `check` reports when a site lacks the scaffold's gate wiring; and make
       the scaffold's CI step gate, starting the workflow on a site without one, if they choose
       to.

    Then the bounds. The page assumes a running cairn site with the engine installed, working
    knowledge of Claude Code (starting a session, what a skill and a subagent are, where a
    project's `.claude/settings.json` lives), package scripts, and a GitHub Actions workflow
    file; it needs no knowledge of the engine's internals. It leaves out the review agent's
    purpose and its relation to the audit gate, placing only the agent's file and linking the
    `cairn-guidance` reference page for what the agent checks. It leaves to other pages the
    scaffolded tree outside `.claude/` (Scaffolded site files), running the audit and reading its
    findings (Run cairn-audit on your site), the upgrade procedure and when to refresh (Upgrade
    cairn), the consultation brief's protocol (the `cairn-consult` skill itself), and the CLI's
    full option and output listing and the trust boundary (the `cairn-guidance` reference page).

    Cautions for the drafter, introduction only:

    - Name no other coding agent, and teach none.
    - Promise only where the review agent sits, never what it reviews.
    - Address the human developer, never Claude Code.
orderReason: |
  The sections run in the order the reader meets the guidance: what the tree holds, the install
  that writes it, the two edits the engine leaves to the developer, then the verification of all
  of them and the failures it surfaces. [[see-also]] closes the page.
preconditions:
  - cairn-site
  - claude-code
  - guidance-tree
  - import-line
exemplars:
  - source: operators/gh-exit-codes/
    slice: Operators
    manifestType: Reference entry (exit codes)
    take: Take the exit code stated flat beside the condition that produces it, and the closing caution that a command may carry codes the table does not list; leave the gh-specific codes and the page's bare list shape.
  - source: extenders/sveltekit-hooks/
    slice: Extenders
    manifestType: Reference entry (hooks)
    take: Take the one-hook-at-a-time rhythm where each hook gets a signature-sized snippet and one sentence on when it runs; leave the SvelteKit hook inventory.
  - source: core/workers-sdk-agents-md/
    slice: Core
    manifestType: Agent-facing contributor file
    take: Take the idea of pointing at the authoritative source instead of copying it (the guidance tree states this about its own VERSION and MANIFEST); leave the monorepo commands and the file's own agent-addressed voice, which this human page never uses.
sections:
  - id: before-you-begin
    heading: Before you begin
    why: |
      The reader confirms the two things every later section rests on, a cairn site and Claude
      Code, before the page describes what cairn installs.
    opens: |
      Working through this page takes a cairn site with the engine installed and Claude Code
      installed on the machine you develop on.
    items:
      - id: pre-site
        kind: sentence
        mode: claim
        text: |
          A cairn site, either scaffolded by `create-cairn-site` or built by hand with the engine
          installed, is the first precondition, each linked to the page that produces it.
      - id: pre-site-scaffold
        kind: link
        target: ../extend/scaffolded-site-files.md#the-scaffold
      - id: pre-site-hand
        kind: link
        target: ../extend/add-cairn-to-a-sveltekit-app.md#install-and-wire-the-engine
      - id: pre-claude
        kind: sentence
        mode: claim
        text: |
          Claude Code installed and able to start a session in the site's root is the second
          precondition, linked to Claude Code's own installation page and never restated.
      - id: pre-claude-link
        kind: link
        target: https://code.claude.com/docs/en/setup#install-claude-code
      - id: pre-handoff
        kind: handoff
        text: |
          With both in place, the next section describes what cairn puts under `.claude/`.
  - id: the-guidance-tree
    heading: The guidance tree
    why: |
      Both arrivals need the tree before they act: the scaffolded-site reader already has it and
      needs to know what Claude Code reads, and the adopting reader needs to know what `install` is
      about to write. The review agent is one bullet of the tree, with a link to the reference.
    opens: |
      cairn's guidance for Claude Code is a set of files under `.claude/`, plus the root
      `CLAUDE.md` that imports it, and a scaffolded site is born with all of it installed.
    items:
      - id: f-tree-only-claude
        kind: fact
        fact: f:pmmtrm
        use: |
          Only that the tree is written under `.claude/` plus the root `CLAUDE.md`, in Claude Code's
          locations (`@` import, `.claude/skills/`, `.claude/agents/`), and that no `AGENTS.md` or
          other agent's file ships. It also backs the introduction's one line on other agents.
      - id: f-tree-paths
        kind: fact
        fact: f:0ygumq
        use: |
          Only the tree's paths: `.claude/skills/<skill>/`,
          `.claude/agents/cairn-extension-reviewer.md`, `.claude/cairn/CLAUDE.md`,
          `.claude/cairn/VERSION`, `.claude/cairn/MANIFEST`, and the root `CLAUDE.md` importing the
          fragment. Present them as a bulleted list or a short text tree.
      - id: f-tree-root-claude
        kind: fact
        fact: f:6ro1n9
        use: |
          Only the root `CLAUDE.md`'s shape: the one import line, then a `# Your site` section for
          the site's own guidance.
      - id: r-tree-own-guidance
        kind: reason
        text: |
          The site's own guidance for Claude Code belongs under `# Your site` in the root
          `CLAUDE.md`, because that file is the site's and the fragment under `.claude/cairn/` is
          the package's to refresh.
        facts:
          - f:6ro1n9
      - id: f-tree-version
        kind: fact
        fact: f:dy5cfj
        use: |
          Only what `VERSION` stamps on a scaffolded site: the engine dependency spec with its caret
          stripped, resolved when the scaffold was baked, not a version read from `node_modules`.
      - id: l-tree-ref
        kind: link
        target: ../reference/guidance.md#install
      - id: f-agent-location
        kind: fact
        fact: f:0ygumq
        use: |
          Only the review agent's file, `.claude/agents/cairn-extension-reviewer.md`, as one bullet
          of the tree, with the reference link beside it for what the agent checks. The agent's
          purpose and its relation to the audit gate are outside this page's outline entry, and no
          fact states either, so the bullet says nothing about them.
      - id: l-agent-ref
        kind: link
        target: ../reference/guidance.md#what-ships-under-claude
      - id: h-tree
        kind: handoff
        text: |
          The part of the tree that acts on each task you ask for is the skills.
  - id: skills-by-task
    heading: Skills by task
    why: |
      The skills are part of the tree, not a task, so they sit under [[the-guidance-tree]] as its
      one subsection and say which skill fires for which task.
    level: 3
    opens: |
      Claude Code loads each of the four packaged skills when a task matches the description the
      skill carries, so the skill that fires depends on what you ask for.
    items:
      - id: f-skills
        kind: fact
        fact: f:o7bkm0
        use: |
          Only the four skills, `cairn-admin-screens`, `cairn-consult`, `cairn-extend`, and
          `cairn-public`, and when each loads. Present them as a bulleted list or a two-column
          table of skill and task.
      - id: f-skills-public
        kind: fact
        fact: f:hiif6u
        use: |
          Only that `cairn-public` carries one catalogue page per public piece cairn ships, under
          its `references/` directory.
      - id: s-skills-consult
        kind: sentence
        mode: claim
        text: |
          The consultation brief `cairn-consult` writes follows the protocol inside the skill
          itself, and this page does not teach it.
      - id: l-skills-ref
        kind: link
        target: ../reference/guidance.md#the-four-skills
      - id: h-skills
        kind: handoff
        text: |
          A site without the tree, or one that has upgraded the engine, installs or refreshes it
          next.
  - id: adopt-or-refresh-the-guidance-tree
    heading: Adopt or refresh the guidance tree
    why: |
      The first task, since every later step reads the tree it produces. It carries the root
      `CLAUDE.md` import line because `install` never writes that line, and an adopting site would
      otherwise fail the check's second line.
    opens: |
      `cairn-guidance install` writes the guidance tree into an existing site and refreshes it
      after an engine upgrade; a scaffolded site skips this section until its first upgrade.
    items:
      - id: f-install-adopt
        kind: fact
        fact: f:0ygumq
        use: |
          Only that `npx cairn-guidance install` is how an existing site adopts the same tree a
          scaffolded site is born with, or refreshes it after an upgrade.
      - id: s-install
        kind: step
        text: |
          In the project root, run `npx cairn-guidance install`.
        requires:
          - cairn-site
        produces:
          - guidance-tree
        canFail: true
        optional: true
      - id: f-install-root
        kind: fact
        fact: f:6ro1n9
        use: |
          Only that `install` writes the fragment to `.claude/cairn/CLAUDE.md` and never rewrites
          the root `CLAUDE.md`, so an adopting site adds the import line by hand.
      - id: s-import
        kind: step
        text: |
          If the root `CLAUDE.md` lacks it, add `@.claude/cairn/CLAUDE.md` as its first line,
          creating the file in the project root if the site has none.
        requires:
          - guidance-tree
        produces:
          - import-line
        optional: true
      - id: c-import
        kind: code
        text: |
          The one import line the root `CLAUDE.md` needs.
        source: ../../claude/snippets/claude-md-import.txt
      - id: f-install-delete
        kind: fact
        fact: f:4h9fz4
        use: |
          Only the no-delete rule of a refresh: a path an earlier `MANIFEST` listed that the
          package no longer ships prints as removable, and the site removes it.
      - id: f-install-exit
        kind: fact
        fact: f:5ohm23
        use: |
          Only the exit code on a partial run: `install` exits 0 even when an entry is refused or a
          destination write fails, each printed to stderr, so a script that must detect a partial
          install reads stderr. The nonzero half is the failure row in
          [[diagnose-an-install-or-check-failure]].
      - id: s-install-refresh
        kind: sentence
        mode: claim
        text: |
          When to run the refresh after an upgrade is the upgrade procedure's call, and that page
          places it among its steps.
      - id: l-install-upgrade
        kind: link
        target: ../extend/upgrade-cairn.md#steps
      - id: h-install
        kind: handoff
        text: |
          The tree is now in place, and the one Claude Code setting it needs is yours to add.
  - id: wire-the-stop-hook
    heading: Wire the Stop hook
    why: |
      The hook is the one edit `install` leaves out on purpose, and the reader makes it once the
      tree and the import exist.
    opens: |
      The `Stop` hook runs `npm run check:cairn --if-present` when a Claude Code turn ends, and you
      paste it into `.claude/settings.json` yourself because `install` never writes that file.
    items:
      - id: f-hook-snippet
        kind: fact
        fact: f:4nccq6
      - id: r-hook-deliberate
        kind: reason
        text: |
          The paste is deliberate by design: a hook would give the package's code unattended
          execution inside a Claude Code session, so the engine leaves that one edit to the
          developer, and the trust-boundary section of the reference records the reasoning.
      - id: l-hook-trust
        kind: link
        target: ../reference/guidance.md#the-trust-boundary
      - id: c-hook
        kind: code
        text: |
          The whole `Stop` hook block as the package ships it, framed as the snippet to merge
          into `.claude/settings.json`.
        source: ../../claude/snippets/settings-hook.json
      - id: s-hook
        kind: step
        text: |
          In `.claude/settings.json`, add the `Stop` entry from the snippet under `hooks`.
        requires:
          - claude-code
          - guidance-tree
        produces:
          - stop-hook
      - id: l-hook-vendor
        kind: link
        target: https://code.claude.com/docs/en/hooks#stop
      - id: s-script
        kind: step
        text: |
          In `package.json`, check that `scripts` holds a `check:cairn` entry. If it has none,
          merge in the script entries from the package's `check-cairn.json` snippet, shown below.
        requires:
          - cairn-site
        produces:
          - check-cairn-script
      - id: c-script
        kind: code
        text: |
          The script entries a site needs for the admin stylesheet build and the `check:cairn`
          gates, as the package ships them; a scaffolded site already carries them.
        source: ../../claude/snippets/check-cairn.json
      - id: s-hook-script
        kind: sentence
        mode: claim
        text: |
          The hook runs the site's own `check:cairn` script under `--if-present`, so on a site
          without that script the hook runs nothing and reports nothing, which is why the step
          above checks for it.
        facts:
          - f:4nccq6
      - id: l-hook-npm
        kind: link
        target: https://docs.npmjs.com/cli/v11/commands/npm-run#if-present
      - id: f-hook-runs
        kind: fact
        fact: f:mrv24k
        use: |
          Only what the hook's `check:cairn` runs: the admin stylesheet build, then `cairn-audit`'s
          whole static registry, public-scope findings as advisories that never change the exit
          code, and a missing `daisyui` or `tailwindcss` peer failing the run by name.
      - id: s-hook-peers
        kind: sentence
        mode: claim
        text: |
          The `check:cairn` run therefore needs the `daisyui` and `tailwindcss` peers installed;
          a missing one fails the run by name, and [[diagnose-an-install-or-check-failure]] covers
          that case.
        facts:
          - f:mrv24k
      - id: l-hook-audit
        kind: link
        target: ../extend/run-cairn-audit-on-your-site.md#run-the-static-pass
      - id: h-hook
        kind: handoff
        text: |
          The scaffold's CI workflow also checks the guidance tree, and how strictly is a second
          choice.
  - id: make-the-ci-step-gate-on-a-stale-tree
    heading: Make the CI step gate on a stale tree
    why: |
      The CI gate is the second deliberate, optional choice, so it follows the hook, and it
      introduces the check's exit codes where the reader decides whether to gate on them.
    opens: |
      The scaffold's workflow reports a stale or missing guidance tree in its job log without
      failing the build, and making it fail the build is a choice you make in
      `.github/workflows/check.yml`.
    items:
      - id: f-ci-step
        kind: fact
        fact: f:jd54ph
        use: |
          Only the scaffold's guidance step and what gating it takes: the step runs without
          `--strict` under `continue-on-error: true`, so a stale or missing tree surfaces in the
          job log without failing the build, and gating takes both `--strict` and removing the
          `continue-on-error` line.
      - id: s-ci-workflow
        kind: step
        text: |
          If the site has no `.github/workflows/check.yml`, create it from the package's
          `check.yml` snippet, which carries the same guidance step as the scaffold's workflow.
        requires:
          - cairn-site
        produces:
          - ci-workflow
        optional: true
      - id: c-ci-workflow
        kind: code
        text: |
          The starting workflow as the package ships it, for a site that has none, with the
          comment above the guidance step left out.
        source: ../../claude/snippets/check.yml
      - id: l-ci-snippet-ref
        kind: link
        target: ../reference/guidance.md#what-ships-under-claude
      - id: f-ci-exit
        kind: fact
        fact: f:4ax489
        use: |
          Only the exit codes the choice turns on: once its arguments parse, `check` exits 0
          whatever the report says, and `--strict` exits 1 only when the guidance tree is stale or
          missing.
      - id: c-ci
        kind: code
        text: |
          Only the workflow's last step, `npx cairn-guidance check` with `continue-on-error: true`,
          as the scaffold ships it, without the comment above it.
        source: ../../templates/waymark/.github/workflows/check.yml
      - id: s-ci
        kind: step
        text: |
          In `.github/workflows/check.yml`, add `--strict` to the `cairn-guidance check` step and
          remove its `continue-on-error: true` line.
        requires:
          - guidance-tree
          - ci-workflow
        produces:
          - ci-gate
        optional: true
      - id: r-ci-both
        kind: reason
        text: |
          Both edits are needed: `--strict` sets the step's exit code, and whether a failing step
          fails the job is GitHub's `continue-on-error` setting, which the linked workflow-syntax
          reference defines and this page does not restate.
      - id: l-ci-vendor
        kind: link
        target: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepscontinue-on-error
      - id: r-ci-trade
        kind: reason
        text: |
          Removing `continue-on-error: true` is a trade: that setting passes the job on any
          nonzero exit of the step, so without it any nonzero exit fails the build, not only the
          `--strict` exit on a stale or missing tree.
        facts:
          - f:jd54ph
          - f:4ax489
      - id: h-ci
        kind: handoff
        text: |
          Whichever you chose, verify the setup locally first, then in CI if you gated it.
  - id: verify-the-guidance-setup
    heading: Verify the guidance setup
    why: |
      Verification runs `cairn-guidance check` over everything the earlier sections produced and
      reads its seven lines, ends a Claude Code turn to see the hook run, and reads the CI log for a
      reader who gated it, so it comes only after them.
    opens: |
      A healthy setup reports the tree fresh and every other line satisfied, and
      `check --strict` exits 0.
    items:
      - id: v-check
        kind: step
        text: |
          In the project root, run `npx cairn-guidance check`.
        requires:
          - guidance-tree
          - import-line
        produces:
          - check-report
        canFail: true
      - id: f-verify-lines
        kind: fact
        fact: f:4ax489
        use: |
          Only the seven report lines and the exit codes: once its arguments parse, 0 whatever
          the report says, and 1 under `--strict` only on a stale or missing tree; an unknown
          command or flag exits 2.
      - id: f-verify-import
        kind: fact
        fact: f:6ro1n9
        use: |
          Only the line that reports whether the root `CLAUDE.md` carries the import line.
      - id: f-verify-tailwind
        kind: fact
        fact: f:1kwkl0
        use: |
          Only two clauses. First, the order in which the `.claude/` Tailwind exclusion line
          judges: a `.gitignore` line that ignores `.claude` counts as excluded before any
          stylesheet is read; otherwise only `src/admin.css`, then `src/theme/admin.css`, is read,
          and the first of them that contains `@source` or `source(none)` decides, excluded when it
          holds the literal `@source not "./.claude";` line or `source(none)` anywhere; when neither
          file carries either, the line reports unknown and names the paths it checked. Second, the
          tree's freshness ignores the `VERSION` stamp, so a tree differing only there reads fresh.
      - id: l-verify-ref
        kind: link
        target: ../reference/guidance.md#check
      - id: v-exit
        kind: step
        text: |
          In the same shell, run `npx cairn-guidance check --strict`, then print the exit code
          with `echo $?`.
        requires:
          - check-report
        produces:
          - strict-exit
      - id: v-hook
        kind: step
        text: |
          In a Claude Code session in the site's root, end a turn, and read the `check:cairn`
          output the `Stop` hook produced.
        requires:
          - stop-hook
          - check-cairn-script
        produces:
          - hook-report
        canFail: true
      - id: l-verify-hook
        kind: link
        target: https://code.claude.com/docs/en/hooks
      - id: v-push
        kind: step
        text: |
          If you gated CI, push a commit from the project root, and read the guidance check's
          report lines in the `check` job's log, starting with the first, which reports whether
          the tree is fresh.
        requires:
          - ci-gate
        canFail: true
        optional: true
      - id: h-verify
        kind: handoff
        text: |
          When a line reports a problem, the next section maps it to its fix.
  - id: diagnose-an-install-or-check-failure
    heading: Diagnose an install or check failure
    why: |
      It collects the step-linked failures from the install, the hook, the check, and the gated
      CI job, after the verification that surfaces most of them.
    opens: |
      `install` reports a partial run on stderr or stops with a nonzero exit, `check` reports each problem on its own line, the
      hook's `check:cairn` run names a missing peer or prints nothing, and a gated CI job fails at
      the guidance step on a stale tree or on any other nonzero exit, and each row below points at
      its fix.
    items:
      - id: x-refused
        kind: failure
        from: s-install
        symptom: |
          `install` prints a `refused <path>` line on stderr and still exits 0.
        cause: |
          The path has a symlinked component or destination, has a component that exists as
          something other than a directory (a regular file, say), exists as something other than a
          regular file (a directory, say), or falls outside `.claude`; or a `<path>.orig` recovery
          copy could not be made, which refuses the destination beside it too; or the
          `.claude/cairn/MANIFEST` path is itself refused (a symlinked `MANIFEST`, say), so no
          `MANIFEST` is written. The run refuses each path by name and continues.
        handledBy: l-diag-install
      - id: f-diag-refused
        kind: fact
        fact: f:vhxkab
        use: |
          Only the refusal cases a reader sees, each refused by name while the run continues and
          none changing the exit code: a symlinked component or destination, a component that
          exists as something other than a directory, a destination that exists as something other
          than a regular file, a destination outside `.claude`, a `.orig` copy that could not be
          made (which refuses the destination beside it too), and a refused `MANIFEST` path, after
          which no `MANIFEST` is written.
      - id: x-write
        kind: failure
        from: s-install
        symptom: |
          `install` prints a `write error <path>: <code>` line on stderr and still exits 0.
        cause: |
          A disk or permissions error, named by its errno code, not a containment refusal.
        handledBy: l-diag-install
      - id: f-diag-write
        kind: fact
        fact: f:x5grdm
        use: |
          Only that a write failure is reported separately from a refusal and its printed line
          names the errno code, such as `ENOSPC` or `EACCES`.
      - id: x-install-throw
        kind: failure
        from: s-install
        symptom: |
          `install` stops with an error instead of finishing, and exits nonzero.
        cause: |
          A failure creating a directory, writing the `MANIFEST`, or reading a destination that
          already exists. Unlike a refusal or a write error, which the run prints and continues
          past, this failure ends the run.
        handledBy: l-diag-install
        facts:
          - f:5ohm23
      - id: l-diag-install
        kind: link
        target: ../reference/guidance.md#install
      - id: x-peer
        kind: failure
        from: v-hook
        symptom: |
          The hook's `check:cairn` run stops and names a missing `daisyui` or `tailwindcss` peer.
        handledBy: l-diag-audit
      - id: l-diag-audit
        kind: link
        target: ../extend/run-cairn-audit-on-your-site.md#diagnose-a-run-that-exits-2
      - id: x-hook-silent
        kind: failure
        from: v-hook
        symptom: |
          The turn ends and no `check:cairn` output appears.
        cause: |
          `package.json` has no `check:cairn` script, so `--if-present` skips the run, or the
          `Stop` entry is not under `hooks` in `.claude/settings.json`.
        handledBy: h-diag-hook
        facts:
          - f:4nccq6
      - id: h-diag-hook
        kind: handoff
        text: |
          Add the missing script as the `check:cairn` step in [[wire-the-stop-hook]] shows; if the
          script is there, compare the `Stop` entry in `.claude/settings.json` with the snippet in
          that section, then end another turn.
      - id: x-ci-stale
        kind: failure
        from: v-push
        symptom: |
          The `check` job fails at the guidance step, and the guidance check's first line in the
          job log reports the guidance tree stale or missing.
        cause: |
          The committed tree is stale or missing. Under `--strict` the check exits 1 on exactly
          that, and with `continue-on-error` removed the exit fails the job.
        handledBy: h-diag-ci-stale
        facts:
          - f:4ax489
          - f:jd54ph
      - id: h-diag-ci-stale
        kind: handoff
        text: |
          Run the install step in [[adopt-or-refresh-the-guidance-tree]], commit the refreshed
          `.claude/` tree, and push again.
      - id: x-ci-other
        kind: failure
        from: v-push
        symptom: |
          The `check` job fails at the guidance step, but the guidance check's first line in the
          job log does not report the guidance tree stale or missing, or the step prints no
          report lines at all.
        cause: |
          The step exited nonzero for a reason other than a stale or missing tree, such as exit 2
          for an unknown flag or a file read that failed and ended the run. `--strict` exits 1
          only on a stale or missing tree, so this exit is not the gate's, and with
          `continue-on-error` removed any nonzero exit of the step fails the job: the trade
          [[make-the-ci-step-gate-on-a-stale-tree]] describes.
        handledBy: h-diag-ci-other
        facts:
          - f:4ax489
          - f:jd54ph
      - id: h-diag-ci-other
        kind: handoff
        text: |
          Read the guidance step's output in the job log, and compare it with what the
          `cairn-guidance check` reference says the command reports. To keep the build passing
          while you work on it, put the `continue-on-error: true` line back under the step, which
          passes the job on any nonzero exit, then push again; the build then no longer fails on a
          stale tree either until you remove the line again.
      - id: l-diag-ci-ref
        kind: link
        target: ../reference/guidance.md#check
      - id: x-stale
        kind: failure
        from: v-check
        symptom: |
          The first line reports the guidance tree stale or missing.
        handledBy: s-install
      - id: x-import
        kind: failure
        from: v-check
        symptom: |
          The second line reports the root `CLAUDE.md` missing the import line.
        handledBy: s-import
      - id: x-wiring
        kind: failure
        from: v-check
        symptom: |
          A line reports a missing `check:cairn` script, `cairn-audit.config.json`, or
          `.github/workflows/check.yml`; `check` prints the snippet to paste under that line.
        handledBy: l-verify-ref
      - id: x-orig
        kind: failure
        from: v-check
        symptom: |
          The last line names a `.orig` file still present.
        handledBy: l-diag-install
      - id: x-tailwind
        kind: failure
        from: v-check
        symptom: |
          The Tailwind line reports `.claude/` not excluded from the site's Tailwind build, or
          reports unknown and names the paths it checked.
        handledBy: l-diag-tailwind
      - id: l-diag-tailwind
        kind: link
        target: ../reference/guidance.md#the-claude-exclusion-from-the-tailwind-build
      - id: x-check-throw
        kind: failure
        from: v-check
        symptom: |
          `npx cairn-guidance check`, with or without `--strict`, stops with an error instead of
          finishing, and exits nonzero.
        cause: |
          A file the check reads failed to read for a reason other than its being absent, which
          ends the run. This exit is not the stale-tree exit: `--strict` exits 1 only on a stale
          or missing tree, and this failure happens with or without `--strict`.
        handledBy: h-diag-check-throw
        facts:
          - f:4ax489
      - id: h-diag-check-throw
        kind: handoff
        text: |
          Read the error the run printed, compare it with the files the `cairn-guidance check`
          reference says the command reads, make the file that failed readable, and run the check
          again from the project root.
  - id: see-also
    heading: See also
    why: |
      The task-guide anatomy closes the page with its related task, concept, and reference pages
      and its limitations. The outline's one concept page on this subject is Scaffolded site
      files, which explains the scaffolded tree the guidance sits in. The outline holds no
      limitations page for the guidance tree or for Claude Code, so the section links none, and
      the page's own limits are the introduction's `notCovered` list, whose other homes the
      remaining links reach: the audit, the upgrade, and the `cairn-guidance` reference.
    opens: |
      The following pages explain the scaffolded tree around the guidance and cover the work this
      page leaves out.
    items:
      - id: l-see-scaffold
        kind: link
        target: ../extend/scaffolded-site-files.md
      - id: l-see-audit
        kind: link
        target: ../extend/run-cairn-audit-on-your-site.md
      - id: l-see-upgrade
        kind: link
        target: ../extend/upgrade-cairn.md
      - id: l-see-ref
        kind: link
        target: ../reference/guidance.md
dispositions:
  - fact: f:7ozknm
    disposition: cut
    reason: |
      It states the four skill names and that `cairn-public` is the public-side skill, both of
      which f:o7bkm0 states in full with each skill's load condition, so placing it would add a
      duplicate citation and no claim.
  - fact: f:guiavc
    disposition: subordinated
    reference: ../extend/scaffolded-site-files.md#githubworkflowscheckyml
    reason: |
      The workflow's other steps (`npm install`, `npm run check`, `npm run check:cairn` on every
      push and pull request) and `cairn-audit.config.json` belong to the scaffolded tree outside
      `.claude/`, which is out of scope here. That page's `check.yml` section states the workflow
      half, and its `cairn-audit.config.json` section states the config half; this page needs only
      the guidance step, which f:jd54ph carries.
constraints:
  - |
    This is the one cairn docs page that teaches working with Claude Code. Every other page
    follows the register's rule that the general docs assume no coding assistant, so this page
    never rewrites another page's prose and nothing here implies the reader of other pages uses
    Claude Code.
  - |
    The page documents Claude Code only (f:pmmtrm). Other coding agents get exactly one line, in
    the introduction, stating that cairn ships no guidance for them; the page teaches no other
    agent and names none.
  - |
    The page addresses the human developer in the docs voice, never Claude Code. It does not
    borrow the agent-addressed voice of the fragment, the skills, or the review agent.
  - |
    Claude Code's own behavior (when a `Stop` hook fires, how skills are discovered, where hook
    output appears) gets a link to Claude Code's docs, never a restated detail, per the vendor
    rule. The `Stop` timing sentence in [[wire-the-stop-hook]] stays at "when a Claude Code turn
    ends" with the hooks link beside it.
  - |
    f:5ohm23's exit-0 half is placed only for a refused entry or a failed destination write, and
    its nonzero half only as the failure `x-install-throw`. Do not widen the exit-0 half to
    "every failure", and give the nonzero case no fix beyond its link to the `install` reference:
    no fact names one.
  - |
    f:hiif6u is placed only for `cairn-public`'s catalogue pages. Its `check:public-skill` half
    is an engine-repository script that a site does not run, and never appears on this page.
  - |
    f:vhxkab and f:x5grdm are placed only for what the reader sees (a refusal by name, the run
    continuing, a write error naming its errno code). The `.orig` case is placed only as a copy
    that could not be made refusing the destination beside it; the realpath and lstat mechanics,
    the exclusive no-follow open, and `InstallReport.writeErrors` stay on the reference page.
  - |
    The review agent is one bullet in [[the-guidance-tree]], with no heading of its own: its
    location (f:0ygumq) and the reference link `l-agent-ref`, nothing on what it reviews or how it
    relates to `cairn-audit` until a fact states that.
  - |
    The hand-offs `pre-handoff`, `h-tree`, `h-skills`, `h-install`, `h-hook`, `h-ci`,
    `h-verify`, `h-diag-hook`, `h-diag-ci-stale`, and `h-diag-ci-other` carry no extractable
    fact (`h-diag-ci-other`'s restored `continue-on-error` line rests on f:jd54ph, which
    `x-ci-other` cites); `pre-handoff` and `h-tree` name `.claude/` and the
    skills, which earlier or later items back.
  - |
    GitHub's `continue-on-error` behavior and npm's `--if-present` behavior are vendor behavior
    with no `[vendor]` fact, so each gets its link (`l-ci-vendor`, `l-hook-npm`) and only the
    minimal statement this blueprint's items word; the drafter adds no further claim about either.
  - |
    `s-script`, `s-ci-workflow`, `x-wiring`, and `x-orig` rest on the reference page they link
    (`docs/reference/guidance.md`, the `check` and "What ships under `claude/`" sections) and on
    the snippet files the code items `c-script` and `c-ci-workflow` quote, not on a fact; the
    drafter words them no wider than that page and those files state.
