constraints:
  - |
    The page carries the one-declaration change, the roles migration, `resolveDb` taking
    `createChannelDb`'s result with no cast, and the Turnstile missing-secret reason: the role
    declared once on the adapter and read
    by both handles from the runtime (`f:4xrx5f`, `f:7cv105`, `f:f21bcz`, `f:mbx6q1`, `f:hwffph`,
    `f:q07rd5`); the roles migration (`f:rn62i1`, `f:xffr6i`); `resolveDb` and the cast-free test
    (`f:ditn3e`); the missing-secret reason (`f:thbxvf`).
  - |
    The page never tells the reader to pass `roles` or `access` to `createAuthGuard` or
    `devBackendHandle`, or to create `src/access.ts`. The vocabulary lives on the adapter, and the
    hooks step only confirms that both handles take `{ runtime }`; an older site's move is Upgrade
    cairn's.
  - |
    The page never says that `requireAccess` refuses every `none` session whatever the map says, or
    that a map rule for the home path that names the role hides its sidebar link from the role;
    both are false since a route rule naming a `none` role admits it (`f:5sx6zl`). A key matching
    the home path that does not name the role does hide the link (`f:altcjp`), which
    [[resolve-a-failed-setup]] states as a failure cause. The page configures no access map: the
    home screen checks the role, the map alternative is one sentence with a link, and the sidebar
    failure's fix for a site that already keeps a map routes to Restrict admin access.
  - |
    The test assigns `createChannelDb`'s result to the mocked env with no cast (`f:ditn3e`), typing
    the env's `MEMBER_DB` as `ChannelDatabaseLike`, a type the `@glw907/cairn-cms/auth-channel`
    subpath exports. The test's shape follows `src/tests/unit/auth-channel-resolve-db-type.test.ts`
    and `src/tests/unit/worker-wait-until.test.ts`.
  - |
    The channel sample never copies the example site's `captureDeliver` or
    `insecureTestChallenge`. Its `challenge` reads `TURNSTILE_SECRET`, the one name the
    `.dev.vars`, `.dev.vars.example`, and `wrangler secret put` steps store.
  - |
    Keep the headings of [[provision-the-channel-database]] and [[write-the-channel-module]]
    stable: `docs/reference/auth-channel.md` links both anchors.
  - |
    The [[see-also]] links to the security model's channel section, Restrict admin access, and Replace
    magic links with Cloudflare Access also render in the introduction's not-covered list.
  - |
    On the page, the example site is "the repository's example site, `examples/showcase`" at its
    first mention and "the example site" after it; the scaffolder is `create-cairn-site` at first
    mention and the setup command after it; the group is always a second sign-in group, never a
    second audience or population.
  - |
    Each step names its location before its action and holds one action; a conditional step states
    its condition first and says who skips it. [[show-the-home-screen-in-the-sidebar]] is a
    one-step procedure, a single bulleted item. The two removal steps in
    [[end-a-removed-member-s-sessions]] are a bulleted list of alternatives. The verification
    checks and the checks in [[resolve-a-failed-setup]] are numbered lists, and there each failure
    and its handler render as one numbered item.
  - |
    The channel path states no threat claim; the security model owns the channel's threat surface.
    Do not claim that applying an already-applied `0001_roles.sql` is a no-op, or that the setup
    command applied it to the remote database; no fact states either.
  - |
    No step suggests trying the role under the dev backend, which mints an owner (`f:7cv105`);
    both paths end with a deploy and a check on the deployed site.
