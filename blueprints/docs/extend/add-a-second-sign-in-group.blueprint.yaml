      - id: wm-lookup
        kind: fact
        fact: f:dtz8oa
        use: |
          Only the `lookup` clause: `lookup` returns the stable subject for a normalized contact or
          null, which decides membership. The `verify` clauses are placed in
          [[end-a-removed-member-s-sessions]].
      - id: wm-env
        kind: fact
        fact: f:ffskeq
        use: |
