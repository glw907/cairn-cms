        kind: handoff
        text: |
          Turns to the first decision: which mechanism to build.
  - id: choose-the-mechanism
    heading: Choose the mechanism
    why: |
      The two paths share no step, so the reader chooses before building anything. The section
      carries the early right-tool callout, here role versus channel.
    opens: |
      A second group signs in either as a declared role in the editors' roster in `AUTH_DB` or
      through a separate login built with `createAuthChannel`.
