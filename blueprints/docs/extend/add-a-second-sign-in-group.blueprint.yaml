  - id: resolve-a-failed-setup
    heading: Resolve a failed setup
    why: |
      The page's failure path holds both paths' failures in the order a reader meets them, after both
      paths so either path's checks can send a reader here.
    opens: |
      Each failure below names the symptom, then its fix; the role path's failures come first and
      the channel's follow.
    items:
      - id: x-wiring
        kind: failure
        from: v-doctor
        symptom: |
          `cairn doctor` reports `auth.role-wiring-missing`.
        cause: |
          The guard never received the runtime, so it resolves every session against the owner and
          editor pair and the custom role to `none`.
        handledBy: r-wiring
      - id: r-wiring
        kind: step
        text: |
          If `cairn doctor` reports `auth.role-wiring-missing`, pass `{ runtime }` to
          `createAuthGuard` in `src/hooks.server.ts`, as [[declare-the-role]] does, then rebuild,
          rerun the check, and deploy as [[deploy-the-role]] does.
      - id: rs-wiring-link
        kind: link
        target: '#declare-the-role'
      - id: x-unmigrated
        kind: failure
        from: s-submit
        symptom: |
          Adding a person with the new role fails on `/admin/editors`.
        cause: |
          `AUTH_DB` lacks `0001_roles.sql`, so the `editor` table keeps its owner-or-editor `CHECK`
          and the write fails as the condition `auth.store-roles-unmigrated`.
        handledBy: r-unmigrated
      - id: rs-unmigrated
        kind: fact
        fact: f:xffr6i
        use: |
          Only the cause: the condition, the original `CHECK (role IN ('owner', 'editor'))`, a
          write naming any other role failing, the condition's message naming `0001_roles.sql`, and
          no tool check raising it. Omit the routed-statement and CHECK-text matching detail.
      - id: r-unmigrated
        kind: step
        text: |
          If adding a person with the new role fails, copy and apply `0001_roles.sql` as
          [[deploy-the-role]] does, then add the person again.
      - id: rs-unmigrated-link
        kind: link
        target: '#deploy-the-role'
      - id: x-welcome
        kind: failure
        from: v-lands
        symptom: |
          The person lands on the minimal signed-in welcome screen, not the home screen.
        cause: |
          The deployed vocabulary gives the role no `home`, or omits the role, which then resolves
          to `none`.
        handledBy: r-welcome
      - id: rs-welcome
        kind: fact
        fact: f:kqcyv1
        use: |
          Only, for the symptom, the welcome screen a `none`-capability role with no `home` lands
          on.
      - id: r-welcome
        kind: step
        text: |
          If the person lands on the welcome screen, check that the vocabulary declares the role with
          its `home`, then redeploy as [[deploy-the-role]] does.
      - id: x-forbidden
        kind: failure
        from: v-lands
        symptom: |
          The home screen answers 403 to the role's people.
        cause: |
          The screen's load function gates with `requireAccess`, and no route rule in the access map
          names the role.
        handledBy: r-forbidden
      - id: r-forbidden
        kind: step
        text: |
          If the home screen answers 403, replace `requireAccess` in its load function with the role
          check from [[build-the-role-s-home-screen]], then redeploy as [[deploy-the-role]] does.
      - id: rs-forbidden-link
        kind: link
        target: '#build-the-roles-home-screen'
      - id: rs-redeploy-link
        kind: link
        target: '#deploy-the-role'
      - id: x-sidebar
        kind: failure
        from: v-sidebar
        symptom: |
          The home screen's link does not show in the role's sidebar.
        cause: |
          The entry's `roles` list names a role the vocabulary does not declare, or the site keeps
          an access map whose key matching `/admin/staff` does not name `staff`, so `canReach`
          hides the link.
        handledBy: r-sidebar
      - id: rs-sidebar-roles
        kind: fact
        fact: f:16paho
        use: |
          Only: a `roles` name the site's vocabulary does not declare fails validation.
      - id: rs-sidebar-map
        kind: fact
        fact: f:altcjp
        use: |
          Only: a site entry whose `href` a map key matches is shown only to the roles that key
          admits, and to an owner. Omit the engine-screen and unmatched-href clauses.
      - id: rs-sidebar-admit
        kind: fact
        fact: f:5sx6zl
        use: |
          Only: `canReach` admits a `none`-capability session only when the deepest matching key
          lists its role. Omit the list of targets that stay refused.
      - id: r-sidebar
        kind: step
        text: |
          If the link does not show, check that the entry's `roles` list names `staff` exactly as
          the vocabulary declares it, and, on a site that keeps an access map, add `staff` to the
          key matching `/admin/staff` as Restrict admin access describes; then redeploy as
          [[deploy-the-role]] does.
      - id: rs-sidebar-link
        kind: link
        target: restrict-admin-access.md
      - id: x-node
        kind: failure
        from: t-run
        symptom: |
          The test fails inside `createChannelDb`, on a Node release below 24.
        cause: |
          `createChannelDb` needs `node:sqlite`, and nothing enforces the dev package's Node floor
          at runtime; npm only warned at install.
        handledBy: r-node
      - id: rs-node
        kind: fact
        fact: f:fcqs22
        use: |
          Only: `createChannelDb` needs `node:sqlite`, the dev package declares `engines.node`
          `>=24` with no runtime guard, and npm only warns.
      - id: r-node
        kind: step
        text: |
          If the test fails on a Node release below 24, switch to Node 24 or later and run
          `npx vitest run` again.
      - id: x-construct
        kind: failure
        from: t-run
        symptom: |
          The channel module throws a construction error when it first loads: in the test run,
          which imports its `normalizeContact`, or on the deployed site's first request.
        cause: |
          Construction throws when a required function is missing and when the cookie name is
          missing, empty, or starts with `cairn_`.
        handledBy: r-construct
      - id: rs-construct
        kind: fact
        fact: f:vo4m61
        use: |
          Only: construction throws when `challenge` or any other required function is missing. The
          cookie-name throw rests on `f:4cw5dk`, placed in [[write-the-channel-module]].
      - id: r-construct
        kind: step
        text: |
          If the channel module throws when it loads, read the construction error, supply the
          member it names as [[write-the-channel-module]] does, and run the test again.
      - id: x-secret
        kind: failure
        from: c-request
        symptom: |
          Every code request answers `challenge-required`, and Workers Logs shows
          `turnstile.verify_failed` with `reason: 'missing_secret'`.
        cause: |
          The Turnstile secret is blank where the running Worker reads it.
        handledBy: r-secret
      - id: rs-reasons
        kind: fact
        fact: f:thbxvf
        use: |
          Only, for both challenge failures: `verifyTurnstile` logs `missing_secret` for a blank or
          non-string secret and `invalid_input` for a blank, non-string, or over-length token, and
          it checks the secret first, so a call with both bad logs `missing_secret`. Omit the fetch
          clause.
      - id: r-secret
        kind: step
        text: |
          If the reason is `missing_secret`, set `TURNSTILE_SECRET` where the running Worker reads
          it: `.dev.vars` under `wrangler dev`, and the Worker secret on the deployed site.
      - id: rs-secret-where
        kind: fact
        fact: f:86h9o6
        use: |
          Only where each runtime reads the secret: `wrangler dev` from `.dev.vars`, a deployed
          Worker from its secret.
      - id: x-token
        kind: failure
        from: c-request
        symptom: |
          Every code request answers `challenge-required`, and the record's reason is
          `invalid_input`.
        cause: |
          The request form posts no Turnstile token under the field your `challenge` reads.
        handledBy: r-token
      - id: r-token
        kind: step
        text: |
          If the reason is `invalid_input`, check that the request form posts the widget's token
          under the field your `challenge` reads.
      - id: x-no-code
        kind: failure
        from: c-enter
        symptom: |
          The request answers that a code was sent, but no code arrives.
        cause: |
          `lookup` returned `null` for the normalized contact, because the contact is not on the
          roster or its normalized form does not match the roster's, or `lookup` threw.
        handledBy: r-no-code
      - id: rs-no-code
        kind: fact
        fact: f:dtz8oa
        use: |
          Only: `lookup`'s answer for the normalized contact, a subject or null, decides membership.
      - id: r-no-code
        kind: step
        text: |
          If no code arrives, read the `auth.channel.requested` record in Workers Logs: an `outcome`
          of `unknown` means the normalized contact is not on the roster `lookup` reads, and
          `lookup_failed` means `lookup` threw.
      - id: x-send-failed
        kind: failure
        from: c-enter
        symptom: |
          The request answers that a code was sent, but no code arrives, and Workers Logs shows
          `auth.channel.send_failed`.
        cause: |
          `deliver` threw while sending the code.
        handledBy: r-send-failed
      - id: r-send-failed
        kind: step
        text: |
          If Workers Logs shows `auth.channel.send_failed`, read its `error` field and fix the
          transport your `deliver` calls.
      - id: x-bad-code
        kind: failure
        from: c-enter
        symptom: |
          Entering the code returns the login page with an error, and no redirect to `/members`
          follows.
        cause: |
          The confirm action answered something other than `confirmed`, so the login route answered
          `fail(400, ...)`: a mistyped code answers `bad-code` and mints no session, and a code
          past its 10-minute lifetime or its 5 attempts no longer confirms.
        handledBy: r-bad-code
        facts:
          - f:vo4m61
          - f:u3qhel
          - f:265s4t
      - id: rs-bad-code
        kind: fact
        fact: f:vo4m61
        use: |
          Only: a wrong code on confirm returns `bad-code` and mints no session.
      - id: rs-code-limits
        kind: fact
        fact: f:u3qhel
        use: |
          Only `code.ttlMs`, 10 minutes, and `code.attemptCap`, 5, as defaults. Omit every other
          limit.
      - id: r-bad-code
        kind: step
        text: |
          If entering the code returns an error, request a new code and enter it exactly as
          delivered, within 10 minutes and the 5 attempts a code allows by default.
      - id: rs-channel-records-link
        kind: link
        target: ../reference/log-events.md
      - id: r-otherwise
        kind: step
        text: |
          Otherwise, read the auth channel's records in the log events reference, and work through
          Debug your site.
      - id: rs-log-events-link
        kind: link
        target: ../reference/log-events.md
      - id: rs-debug-link
        kind: link
        target: debug-your-site.md
  - id: see-also
    heading: See also
    why: |
      The anatomy closes a task guide with the pages around its subject: the channel's threat
      surface, access maps, identity mode, the sidebar, and the reference entries.
    opens: |
      The following pages cover the seams and limits around a second group.
    items:
      - id: sa-security
        kind: link
        target: security-model.md#the-auth-channels-threat-surface
      - id: sa-restrict
        kind: link
        target: restrict-admin-access.md
      - id: sa-identity
        kind: link
        target: replace-magic-links-with-cloudflare-access.md
      - id: sa-sidebar
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: sa-channel-ref
        kind: link
        target: ../reference/auth-channel.md
      - id: sa-roles-ref
        kind: link
        target: ../reference/core.md#roles
