          - channel-module
        produces:
          - login-load
      - id: l-request
        kind: step
        text: |
          In the same file, add a `request` action that passes the event to `actions.request` and
          answers `fail(400, ...)` on any outcome but `sent`.
        requires:
          - login-load
        produces:
          - login-request
      - id: l-confirm
        kind: step
        text: |
          In the same file, add a `confirm` action that passes the event to `actions.confirm`,
          redirects to `/members` on `confirmed`, and answers `fail(400, ...)` otherwise.
        requires:
          - login-request
        produces:
          - login-confirm
      - id: l-prerender
        kind: step
        text: |
          In the same file, export `prerender = false`, so a site that prerenders by default still
          serves the route from the Worker.
        requires:
          - login-confirm
        produces:
          - login-server
      - id: lr-prerender
        kind: fact
        fact: f:k0cryh
        use: |
          Only: both member route modules export `prerender = false`, since on a site that
