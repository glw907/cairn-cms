  - id: sign-the-group-in-with-a-role
    heading: Sign the group in with a role
    why: |
      The role path comes before the channel because it is shorter and reuses the sign-in the site
      already runs; a reader who chose a channel skips it from the comparison.
    opens: |
      A role adds the group to the editors' roster at `none` capability, so its people sign in by
      the magic link and reach only the screens the site builds for them.
    items:
      - id: ra-opens
        kind: fact
        fact: f:4673n6
        use: |
          Only, for the opening, the shared magic-link flow and the refusal by the engine's content
          and roster screens.
      - id: ra-example
        kind: fact
        fact: f:pvs115
        use: |
          Only the running example: a `staff` role declared `{ capability: 'none', home:
          '/admin/staff' }`, the declaration the roles reference uses.
      - id: ra-roles-link
        kind: link
        target: ../reference/core.md#defineroles
      - id: ra-handoff
        kind: handoff
        text: |
