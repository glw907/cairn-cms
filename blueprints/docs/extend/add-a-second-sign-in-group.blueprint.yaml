  - id: declare-the-role
    heading: Declare the role
    why: |
      Every later role step uses the role's name and `home`, and the role is declared once on the
      adapter, so the hooks need no edit.
    level: 3
    opens: |
      A role is one entry in the site's role vocabulary, declared once on the adapter's `roles`
      member, and the guard and the dev backend both read it from the composed runtime.
    items:
      - id: dr-guard
        kind: fact
        fact: f:4xrx5f
        use: |
          Only the opening's claim: `createAuthGuard` takes a required `runtime` and reads the declared
          role vocabulary from `runtime.roles`. Omit the earlier-versions clause.
      - id: dr-dev
        kind: fact
        fact: f:7cv105
        use: |
          Only: `devBackendHandle` takes the same required `runtime` and reads `runtime.roles`, so
          one declaration serves both handles. Omit the earlier-versions clause; the
          dev-backend-mints-an-owner clause is placed in
          [[verify-the-role-signs-in-to-its-home-screen]].
      - id: dr-module
        kind: fact
        fact: f:q07rd5
        use: |
          Only the adapter module's location, `src/theme/cairn.config.ts` on a scaffolded site and
          `src/lib/cairn.config.ts` on the tutorial's site, and, for the hooks step, the clause
          that the tutorial page's hooks still call `createAuthGuard()` and `devBackendHandle()`
          with no config, a form that no longer type-checks, so a site built from the tutorial
          passes `{ runtime }` there. Omit the `src/access.ts` clause.
      - id: s-declare
        kind: step
        text: |
          In the adapter module, set the adapter's `roles` member to a `defineRoles` vocabulary
          that keeps `owner` and `editor` beside the `staff` entry.
        requires:
          - mechanism-chosen
        produces:
          - role-declared
        optional: true
      - id: c-declare
        kind: code
        text: |
          Illustrative adapter excerpt: a `defineRoles` vocabulary of `owner: 'owner'`,
          `editor: 'editor'`, and `staff: { capability: 'none', home: '/admin/staff' }`, passed as
          `defineAdapter`'s `roles` member, with a comment marking the adapter's other members as
          unchanged. The file comment names the adapter module.
      - id: s-hooks
        kind: step
        text: |
          In `src/hooks.server.ts`, confirm that `createAuthGuard` and `devBackendHandle` each
          receive `{ runtime }`, as the scaffold's hooks do. Where either takes no config, pass
          `{ runtime }`. An older site whose hooks pass `roles` follows Upgrade cairn instead.
        requires:
          - role-declared
        produces:
          - role-wired
        optional: true
      - id: dr-hooks
        kind: fact
        fact: f:f21bcz
        use: |
          Only: the scaffold's hooks module passes the composed runtime to both handles,
          `createAuthGuard({ runtime })` and `devBackendHandle({ runtime })`. Omit the dev-gate
          and earlier-versions clauses.
      - id: dr-upgrade-link
        kind: link
        target: upgrade-cairn.md#when-your-range-crosses-the-one-declaration-change
      - id: dr-keep
        kind: reason
        text: |
          Why the vocabulary keeps `owner` and `editor`: `defineRoles` throws without an `owner`
          key mapped to owner capability, and a roster row whose role the vocabulary omits resolves
          to `none`, so dropping `editor` would close the content screens to every existing editor.
        facts:
          - f:dbaklx
          - f:zjglk8
      - id: dr-owner
        kind: fact
        fact: f:dbaklx
        use: |
          Only the missing-`owner` and owner-capability throws, and the throw on a `home` outside
          `/admin`. Omit the rest of the validation list.
      - id: dr-absent
        kind: fact
        fact: f:zjglk8
        use: |
          Only: a role name absent from the vocabulary resolves to `none`.
      - id: dr-home
        kind: fact
        fact: f:pvs115
        use: |
          Only the `home` rule: the path's form and the `/admin` index's redirect to it, before
          the index looks for a reachable concept.
      - id: dr-welcome
        kind: fact
        fact: f:7n28wc
        use: |
          Only the welcome branch, in the sentence after the redirect: a `none`-capability role
          with no `home` gets the welcome view at `/admin`.
      - id: dr-roles-link
        kind: link
        target: ../reference/core.md#defineroles
      - id: dr-handoff
        kind: handoff
        text: |
          Turns to the screen the `home` path needs, which the next section builds.
  - id: build-the-role-s-home-screen
    heading: Build the role's home screen
    why: |
      The path the role's `home` names must exist before anyone lands there, so the screen follows
      the declaration.
    level: 3
    opens: |
      The home path is a custom admin screen the site builds, and its load function checks the
      session's role itself, so the role needs no access map.
    items:
      - id: hs-session
        kind: fact
        fact: f:5t6hz6
        use: |
          Only, for the opening, that a `none`-capability session populates `locals.cairnEditor`
          like an editor's, so the screen reads `role` from it.
      - id: s-route
        kind: step
        text: |
          In the site's admin routes, create the route for `/admin/staff`, as Add a custom admin
          screen describes.
        requires:
          - role-declared
        produces:
          - home-route
        optional: true
      - id: hs-route-link
        kind: link
        target: add-a-custom-admin-screen.md#place-the-route
      - id: s-gate
        kind: step
        text: |
          In the screen's `+page.server.ts`, make the load function call `requireSession` and
          answer 403 to any session whose `role` is not `staff`.
        requires:
          - home-route
        produces:
          - home-screen
        optional: true
      - id: c-gate
        kind: code
        text: |
          The screen's server file, `src/routes/admin/staff/+page.server.ts`: a load function that
          calls `requireSession(event)`, throws `error(403, ...)` when the session's `role` is not
          `staff`, and returns the display name.
        source: ../../src/lib/sveltekit/guard.ts#requireSession
      - id: hs-session-only
        kind: fact
        fact: f:8anql1
        use: |
          Only: `requireSession` redirects to login when there is no session and does not consult
          the access map. Omit every `requireAccess` clause.
      - id: hs-why
        kind: reason
        text: |
          Why the screen checks the role in place of `requireAccess`: the check works whether or not
          the site declares an access map, while `requireAccess` refuses a `none` session unless a
          route rule in the map names its role.
        facts:
          - f:8anql1
          - f:5sx6zl
      - id: hs-map-alt
        kind: fact
        fact: f:5sx6zl
        use: |
          Only: `canReach` admits a `none`-capability session to a route path only when the deepest
          matching map key lists its role, and `requireAccess` and `createSectionAction` inherit
          that admit, so a site that keeps an access map may instead add a route rule naming
          `staff` and gate with `requireAccess`. Omit the list of targets that stay refused.
      - id: hs-map-link
        kind: link
        target: restrict-admin-access.md
      - id: hs-action
        kind: reason
        text: |
          Why an action on the screen repeats the check: SvelteKit runs a form action without its
          page's load function, so the action's handler checks the session's role too. Add a custom
          admin screen compares the two action wrappers' access checks.
      - id: hs-action-link
        kind: link
        target: add-a-custom-admin-screen.md#choose-the-action-wrapper
      - id: hs-handoff
        kind: handoff
        text: |
          Turns to the sidebar, which shows the screen's link to the role.
  - id: show-the-home-screen-in-the-sidebar
