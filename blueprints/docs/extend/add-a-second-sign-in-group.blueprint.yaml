  - id: verify-the-role-signs-in-to-its-home-screen
    heading: Verify the role signs in to its home screen
    why: |
      The dev backend mints an owner, so the role cannot be tried locally, and the role path closes
      with checks on the deployed site.
    level: 3
    opens: |
      A working role signs its people in by the magic link onto the home screen, with the screen's
      link in the sidebar and the engine's content screens closed to them.
    items:
      - id: vr-deployed
        kind: fact
        fact: f:7cv105
        use: |
