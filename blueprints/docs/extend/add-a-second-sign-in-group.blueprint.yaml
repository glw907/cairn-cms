      - id: wm-handoff
        kind: handoff
        text: |
          Turns to the routes that call the returned actions, starting with the login route.
  - id: build-the-login-route
    heading: Build the login route
    why: |
      The login route calls the `request` and `confirm` actions the module returns.
    level: 3
    opens: |
      The example site folds request and confirm onto `/members/login` as two named form actions
      that pass the event to the channel's actions and switch on each outcome.
    items:
      - id: lr-example
        kind: fact
        fact: f:265s4t
        use: |
          Only the opening and the steps: the request form posts a `contact` field and the confirm
          form a `code` field; each action switches on the returned `outcome` and answers
          `fail(400, ...)` on anything but `sent` or `confirmed`; a confirmed code redirects to
          `/members`; the login load redirects a visitor who already has a session. Omit the
          `/members` page clauses.
      - id: l-load
        kind: step
        text: |
          In `src/routes/members/login/+page.server.ts`, add a load function that redirects a
          visitor who already has a session to `/members`.
