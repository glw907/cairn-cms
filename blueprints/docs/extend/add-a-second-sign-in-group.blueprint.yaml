  - id: deploy-the-role
    heading: Deploy the role
    why: |
      The role reaches the live site only after the roles migration and a local wiring check, so a
      wiring fault is caught before it goes live, and the deploy is what makes the editors screen offer
      the role.
    level: 3
    opens: |
      The role reaches the deployed site once `AUTH_DB` carries `0001_roles.sql`, the migration that
      lets the roster hold a role beyond owner and editor, and a local build passes the role-wiring
      check.
    items:
      - id: ap-migration
        kind: fact
        fact: f:rn62i1
        use: |
          Only the opening, the copy step, and its caution: the migration is needed once a site
          declares a vocabulary beyond owner and editor; the scaffold ships it, so a scaffolded
          site already has the file, and an existing site without it copies it from the package;
          the rebuild keeps only the engine's four `editor` columns, so a site that added its own
          columns carries them across first. Omit the `0003_preview.sql` clause.
      - id: s-copy-roles
        kind: step
        text: |
          In the project directory, copy `0001_roles.sql` from the package's `migrations` directory
          into the site's `migrations` directory. A site whose `migrations` directory already holds
          the file skips this step.
        requires:
          - role-declared
        produces:
          - roles-migration-file
        optional: true
      - id: s-apply-roles
        kind: step
        text: |
          In the project directory, apply the migrations to the remote auth database with
          `wrangler d1 migrations apply` and the `--remote` flag.
        requires:
          - roles-migration-file
        produces:
          - roles-migrated
        optional: true
      - id: ap-apply
        kind: fact
        fact: f:xxtooz
        use: |
          Only the apply command, `wrangler d1 migrations apply <database> --remote`. Omit the
          count of shipped migrations.
      - id: v-doctor
        kind: step
        text: |
          After building the site locally, in the project directory, run `cairn doctor` and confirm
          that it reports no `auth.role-wiring-missing` warning.
        requires:
          - cairn-cli
          - role-wired
          - home-screen
          - nav-entry
        produces:
          - wiring-checked
        canFail: true
        optional: true
      - id: vr-doctor
        kind: fact
        fact: f:hwffph
        use: |
          Only: the warning means the adapter declares custom roles but `createAuthGuard` was not
          passed `{ runtime }`, so the running guard falls back to the owner and editor pair, and
          `cairn doctor` raises it from its `auth.role-wiring` check. Omit the older-engine
          spelling.
      - id: vr-type-error
        kind: fact
        fact: f:4xrx5f
        use: |
          Only: on this engine a `createAuthGuard` call that passes no `runtime` is a type error, so
          the warning concerns a site whose hooks escape the type check or an older site. Omit the
          earlier-versions detail.
      - id: vr-build
        kind: fact
        fact: f:6oopkt
        use: |
          Only the `auth.role-wiring` clause: the check reads `src/content/.cairn/site-facts.json`,
          and without it reports that it needs one build, which is why the step runs after a build.
      - id: vr-doctor-link
        kind: link
        target: ../reference/cli-cairn-doctor.md#the-checks
      - id: s-deploy-role
        kind: step
        text: |
          In the project directory, build and deploy the site as Deploy a change describes, so the
          screen that adds editors offers the new role.
        requires:
          - roles-migrated
          - wiring-checked
        produces:
          - role-deployed
        optional: true
      - id: ap-deploy-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#deploy-a-change
      - id: ap-vocab
        kind: fact
        fact: f:mbx6q1
        use: |
          Only: the admin mount forwards its runtime, so the screen that adds editors validates the
          posted role against the declared vocabulary in `runtime.roles`, and the site sets the
          vocabulary once on the adapter. Omit the `createEditorRoutes` wiring detail.
      - id: dp-handoff
        kind: handoff
        text: |
          Turns to adding the role's people on the deployed site.
  - id: add-the-role-s-people
