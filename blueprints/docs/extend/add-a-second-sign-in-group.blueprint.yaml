      - id: wm-cookie
        kind: fact
        fact: f:4cw5dk
        use: |
          Only the `cookie.name` member: the cookies it names and the `cairn_` prefix rule.
      - id: wm-turnstile
        kind: fact
        fact: f:69xbyh
        use: |
          Only: `verifyTurnstile` returns `false` on every failure and never throws. Omit the `ip`
