version: 1
argument: |
  A developer can add cairn to a SvelteKit app by hand in four milestones, each ending with a check
  the reader runs: a bare site deployed to Cloudflare, a post on disk rendered at its permalink, the
  admin signed in on the dev backend over that post, and the production site publishing an edit
  through the developer's own GitHub App. Content comes before the admin because the dev backend
  serves the site's own content from the working tree and the `cairnManifest` plugin supplies
  the build-time flag the dev backend's hook reads, so a reader who builds in this order never wires
  a step whose prerequisite does not exist yet. Every file the engine needs appears once, in the
  milestone that needs it, with the reason it exists, so a reader who only wants to see what cairn
  does underneath can read the page through without building anything.
introduction:
  covers: |
    An overview in second person, opening on the reader's situation and never on the page. It frames
    the model first: the engine is an npm package that a SvelteKit site wires in through its own files
    (an admin route mounted at `/admin`, a server hook that guards it, and a Vite plugin that indexes
    the markdown content at build time); editors sign in from an emailed link; each publish commits
    the editor's change to the site's repository through a GitHub App the site registers; in
    production the engine keeps its editors and sessions in a D1 database bound to the Worker and
    sends sign-in mail through the Worker's Email Sending binding. It then names the readers: the
    usual way to start a new cairn site is the setup command, `create-cairn-site`, which is much
    easier because it creates the GitHub App, the repository, and the Cloudflare bindings and deploys
    in one run (link Scaffolded site files); this tutorial serves a developer with an existing
    SvelteKit app, which the setup command never adds cairn to; a developer who wants cairn without
    the Waymark theme, since the npm package carries no template; and a developer curious about what
    cairn does underneath, who can read it through. It names the running example, Field Notes, a site
    with one post, and states what the reader can do by the end: an editor signs in to the deployed
    site, edits the post, and publishes it. It lists the four milestones as a numbered list, each
    with the check that ends it, and says that a closing section customizes the sign-in email.
  priorKnowledge: |
    Working knowledge of SvelteKit (routes, layouts, server hooks, and the Vite config that carries
    the kit config), TypeScript, git, and a terminal. The tutorial explains every Cloudflare and
    cairn step it uses, and it explains no SvelteKit basics. A reader who starts from an existing app
    works through the same milestones, and the tutorial says where that app skips a step.
  notCovered: |
    A bulleted list under a complete lead-in, each item subject first and its page last: the faster
    path, the setup command, and the tree it writes file by file (Scaffolded site files); every
    adapter option (Define an adapter and schema); the security reasoning behind the GitHub App's
    repository-wide write and the CSRF design (Security model); the delivery routes beyond the entry
    catch-all (Build the public routes); rotating the App's private key later (Rotate the GitHub App
    key). The retired JavaScript doctor and the removed `/components` subpath are not named at all.
  facts:
    - f:kldwss
    - f:9slxqf
    - f:rxj43c
    - f:dqe7ij
    - f:f21bcz
    - f:xluud1
    - f:lbetsq
    - f:5f4kmk
    - f:ntdafg
framing:
  readers: |
    | Reader | Arrives from | Why they came | Knows | Lacks |
    |---|---|---|---|---|
    | A. Existing-app developer | Search ("add cms to sveltekit"), extend README "Start" | Put cairn's admin into an app they already run | SvelteKit, their app | That the setup command cannot help them (refuses a non-empty dir, f:9slxqf); what pieces cairn adds |
    | B. Own-design developer | Front door, extend README | A new cairn site without Waymark | SvelteKit | That the npm package carries no theme or chassis (f:rxj43c), so hand-building is the bare route |
    | C. Curious developer or evaluator | Architecture page, after running the setup command, search | Understand what cairn does underneath / what the scaffold wired | Maybe the scaffolded tree | The model: engine as npm package, SvelteKit wiring points, Cloudflare bindings, GitHub App |
    | D. Misrouted newcomer | Search, extend README "Start" (this page sits second) | Wants a cairn site, any route | Little | That the setup command is the usual, much easier route (f:kldwss) |
  background: |
    - cairn is embedded in a SvelteKit site on Cloudflare Workers (f:4zpvor, f:i74t7g).
    - SvelteKit fit: npm package installed (f:ew4uk7); admin mounted as routes (f:dqe7ij); server hook
      guard (f:f21bcz, f:9xthnq); Vite manifest plugin at build (f:n0laoh).
    - Cloudflare fit: D1 auth store (f:u77pea) and Email Sending binding (f:i74t7g).
    - GitHub fit: per-site App, publish commits (f:gyu7jc, f:qehbx3).
    - The usual route: `npx create-cairn-site` (f:yvfzr2), Waymark starter (f:u705t5, f:rxj43c), App,
      repo, bindings, deploy in one run (f:kldwss).
  placeInDocSet: |
    Second page under "Start", after Architecture (the model in full). The scaffolded-tree page
    (Scaffolded site files) explains the setup command's output; this page is the by-hand twin.
    The body milestones carry the steps; the introduction carries the model and the route choice.
  introPlan: |
    1. Model paragraph: what cairn is, where SvelteKit, Cloudflare, and GitHub each fit. Opens on a
       statement about cairn, never the page.
    2. Usual-route paragraph: the setup command, what it does in one run, that it is much easier for
       a new site; link Scaffolded site files.
    3. Readers paragraph: why this page exists: existing app (setup command refuses), no Waymark,
       curious reader can read it through.
    4. Then the Field Notes example, the prior knowledge, the milestone list, the closing-section
       line, and the pointers, with Architecture among the pointers for reader C.
orderReason: |
  The page re-sequences the outline's covers so that every step's prerequisite exists before the
  step: the prerequisites, then four milestones (a bare deploy, an entry rendered from content on
  disk, the admin on the dev backend, and production), then customizing the sign-in email, then the
  summary and next steps the tutorial anatomy requires. Content precedes the admin, since the admin
  needs the runtime the adapter feeds and the dev backend reads the content, the manifest, and the
  define that the content milestone supplies. Each milestone runs its objectives and starting state,
  steps, verification, failure paths, a try-it-yourself prompt with a disclosure answer, and a
  checklist, per the tutorial milestone anatomy.
preconditions:
  - node-24
  - github-account
  - cloudflare-account
  - workers-paid-plan
  - domain-zone
  - project
  - local-repo
  - repo-pushed
exemplars:
  - source: extenders/astro-tutorial-2-pages-1/
    slice: Extenders
    manifestType: Tutorial
    take: Take the objectives stated before any step, the check that ends nearly every step (the page loads at its URL), the "Try it yourself" prompt with its collapsed "Show me the steps." answer, and the closing checklist of "I can" statements before the reader advances; each unit ends live, as each milestone here ends deployed or running; leave the beginner register, the VS Code and Netlify specifics, and the MDX components.
  - source: extenders/django-custom-management-commands/
    slice: Extenders
    manifestType: Task guide
    take: Take the one running example carried through every milestone and the file-location tree before each file's code; leave the appended API reference.
sections:
  - id: before-you-begin
    heading: Before you begin
    why: |
      Every milestone draws on these accounts and tools, so they come before the first step, and the
      section is where a reader who wants the faster route finds the setup command.
    opens: |
      You need Node 24 or later, a GitHub account, a Cloudflare account on the Workers Paid plan,
      and a domain whose zone is on that account.
    items:
      - id: intro-scaffold-link
        kind: link
        target: scaffolded-site-files.md
      - id: pre-lead
        kind: sentence
        mode: verbatim
        text: |
          You need the following accounts and tools:
      - id: pre-accounts
        kind: fact
        fact: f:75hawi
        use: |
          Only the list items: the Node floor, the GitHub account, the Cloudflare account and what
          its free tier runs (the first milestone's bare deploy), the Workers Paid plan and the
          first deploy that needs it (the one that carries the admin), and the domain zone that real
          sign-in mail needs.
      - id: pre-second-person
        kind: fact
        fact: f:t4pwpw
        use: |
          Only the split between sign-in mail to a second person, which the same plan covers, and
          mail to yourself, which is free on any plan, inside the Workers Paid list item. Omit the
          price.
      - id: pre-paid-link
        kind: link
        target: https://developers.cloudflare.com/workers/platform/pricing/
      - id: pre-zone
        kind: fact
        fact: f:xhwl32
        use: |
          Only the `workers.dev` clause, inside the domain list item.
      - id: pre-typescript
        kind: fact
        fact: f:yegr67
        use: |
          Only the major-version pin, its `svelte-check` reason, and that `npx sv create` already
          pins it, as a list item; an existing app keeps its `typescript` on 6. Omit the advisory
          workflow.
      - id: pre-cli
        kind: fact
        fact: f:1dhk1a
        use: |
          Only the separate install, as the last list item: once per machine with `go install` or
          from a release archive, and not part of the npm package. The production milestone runs the
          CLI as `cairn doctor`.
      - id: s-install-cli
        kind: step
        text: |
          Inside the `cairn` CLI list item, a command block: install it with
          `go install github.com/glw907/cairn-cms/tool/cmd/cairn@latest`, or from a release archive.
        produces:
          - cairn-cli
      - id: pre-doctor-link
        kind: link
        target: ../reference/cli-cairn-doctor.md
  - id: deploy-a-bare-sveltekit-site
    heading: Deploy a bare SvelteKit site
    why: |
      The first milestone proves the deploy path before any engine code exists to blame for a
      failure, and it holds what an existing app does to meet SvelteKit 3 before the engine install.
    opens: |
      This milestone ends with a plain SvelteKit site, with no cairn code yet, answering at its
      `workers.dev` address, so the deploy path works before the engine joins it.
    items:
      - id: m1-objectives
        kind: sentence
        mode: claim
        text: |
          A bulleted list of the milestone's objectives under a complete lead-in: create the project
          under version control, name the Cloudflare adapter in the kit config, and describe the
          Worker to Wrangler and deploy it.
      - id: m1-start
        kind: sentence
        mode: claim
        text: |
          The milestone starts from an empty directory. An existing app skips creating the project
          and starting its repository, and first meets SvelteKit 3's requirements, which the
          following sentences name.
      - id: m1-existing-kit
        kind: fact
        fact: f:skeche
        use: |
          Only the `ERESOLVE` that an existing app on `@sveltejs/kit` `^2` meets at the engine
          install, and the `^3` peer range behind it; such an app upgrades to SvelteKit 3 before the
          next milestone.
      - id: m1-existing-config
        kind: fact
        fact: f:979v0a
        use: |
          Only that SvelteKit 3 no longer supports `svelte.config.js`, so an existing app moves its
          kit options into the `sveltekit()` call in `vite.config.ts` and deletes the file.
      - id: m1-existing-csrf
        kind: fact
        fact: f:3cekcy
        use: |
          Only that SvelteKit 3 fails the build on a config that sets `csrf.checkOrigin`, so an
          existing app deletes that setting. The CSRF reasoning waits for the dev-backend section.
      - id: m1-existing-lib
        kind: fact
        fact: f:pgeeq3
        use: |
          Only that SvelteKit 3 throws on a `$lib` import, so an existing app moves its `$lib`
          imports to `#lib` through the `imports` field in `package.json`.
      - id: m1-upgrade-link
        kind: link
        target: upgrade-cairn.md#when-your-range-crosses-sveltekit-3
  - id: create-the-project-on-the-cloudflare-adapter
    heading: Create the project on the Cloudflare adapter
    why: |
      Every later step builds on the project and the kit config this section writes, so it opens the
      milestone.
    level: 3
    opens: |
      A self-deployed site names `@sveltejs/adapter-cloudflare` explicitly, because the scaffold's
      `adapter-auto` guesses the deploy target at build time.
    items:
      - id: m1-auto
        kind: fact
        fact: f:mhsere
        use: |
          Only the claim the section's first sentence makes; add nothing beyond it.
      - id: m1-inline
        kind: fact
        fact: f:ifuvcl
        use: |
          Only that the scaffold has no `svelte.config.js`, so the kit config, the adapter included,
          sits inline in the `sveltekit()` call in `vite.config.ts`.
      - id: m1-scaffold-vite
        kind: fact
        fact: f:87hc1y
        use: |
          Only the scaffold call's two keys: `compilerOptions` with its `runes` setting, and the
          `adapter` imported from `@sveltejs/adapter-auto`. Every `vite.config.ts` sample on the
          page keeps `compilerOptions` as a comment.
      - id: m1-steps-lead
        kind: sentence
        mode: verbatim
        text: |
          To create the project and swap its adapter, follow these steps:
      - id: s-create
        kind: step
        text: |
          In a terminal, create a minimal TypeScript project with no add-ons named `field-notes`,
          then change into its directory. An existing app skips this step.
        requires:
          - node-24
        produces:
          - project
        optional: true
      - id: m1-create-flags
        kind: fact
        fact: f:7e1t0j
        use: |
          Only the command and the `dev`, `build`, `preview`, and `check` scripts the project it
          writes carries.
      - id: s-git-init
        kind: step
        text: |
          In the project directory, start a git repository on the `main` branch and commit the
          scaffold. An app that is already a repository skips this step.
        requires:
          - project
        produces:
          - local-repo
        optional: true
      - id: m1-main-reason
        kind: reason
        text: |
          The production milestone names this branch in the adapter's GitHub App config and reads
          the publish commit from it.
      - id: s-swap-adapter
        kind: step
        text: |
          In the project directory, uninstall `@sveltejs/adapter-auto` and install
          `@sveltejs/adapter-cloudflare` as a development dependency.
        requires:
          - project
        produces:
          - cloudflare-adapter
      - id: s-kit-adapter
        kind: step
        text: |
          In `vite.config.ts`, import the Cloudflare adapter and pass it as the `adapter` key of
          the `sveltekit()` call.
        requires:
          - cloudflare-adapter
        produces:
          - kit-config
      - id: m1-kit-keys
        kind: fact
        fact: f:979v0a
        use: |
          Only the sibling-key clause, applied to the `adapter` key beside the scaffold's
          `compilerOptions` in the one `sveltekit()` call.
      - id: m1-vite-code
        kind: code
        text: |
          A file-location tree (`field-notes/` with `src/`, `package.json`, `vite.config.ts`), then
          `vite.config.ts` with only `defineConfig({ plugins: [sveltekit({ adapter: adapter() })] })`,
          the adapter imported from `@sveltejs/adapter-cloudflare` and a comment saying
          `compilerOptions` stays as `sv create` wrote it. None of the template's Tailwind,
          preprocess, prerender, or `cairnManifest` entries.
        source: ../../templates/waymark/vite.config.ts
  - id: describe-the-worker-and-deploy-it
    heading: Describe the Worker and deploy it
    why: |
      Wrangler needs the Worker described before it can deploy, and the deploy needs the adapter
      that [[create-the-project-on-the-cloudflare-adapter]] names.
    level: 3
    opens: |
      The minimal `wrangler.jsonc` names the Worker, sets a compatibility date, and points `main`
      and the `ASSETS` binding at the adapter's build output.
    items:
      - id: m1-wrangler
        kind: fact
        fact: f:q13lck
        use: |
          Only the claim the section's first sentence makes; add nothing beyond it.
      - id: m1-login-deploy
        kind: fact
        fact: f:9ug9mo
        use: |
          Only the two commands, `npx wrangler login` and `npx wrangler deploy`, and what each does.
          The address waits for [[verify-the-deployed-site]].
      - id: m1-wrangler-lead
        kind: sentence
        mode: verbatim
        text: |
          To describe the Worker and deploy it, follow these steps:
      - id: s-wrangler
        kind: step
        text: |
          In the project root, create `wrangler.jsonc`.
        requires:
          - project
        produces:
          - wrangler-config
      - id: m1-wrangler-code
        kind: code
        text: |
          A file-location tree adding `wrangler.jsonc` at the root, then the file with four keys
          only: `name` set to `field-notes`, a `compatibility_date`, `main` set to
          `.svelte-kit/cloudflare/_worker.js`, and `assets` with `directory`
          `.svelte-kit/cloudflare` and `binding` `ASSETS`.
        source: ../../templates/waymark/wrangler.jsonc
      - id: s-login
        kind: step
        text: |
          In the project directory, sign in to Cloudflare with `npx wrangler login`.
        requires:
          - cloudflare-account
        produces:
          - wrangler-signed-in
      - id: s-deploy-bare
        kind: step
        text: |
          In the project directory, build the site with `npm run build` and upload the Worker with
          `npx wrangler deploy`.
        requires:
          - kit-config
          - wrangler-config
          - wrangler-signed-in
        produces:
          - bare-deployed
        canFail: true
  - id: verify-the-deployed-site
    heading: Verify the deployed site
    why: |
      The milestone ends with a check the reader runs, the deployed address loading the scaffold's
      page, and the failure rows follow the steps they diagnose.
    level: 3
    opens: |
      The deploy output ends with an address of the form
      `<worker name>.<account subdomain>.workers.dev`, which serves the site with no domain purchase
      or DNS change.
    items:
      - id: m1-address
        kind: fact
        fact: f:9ug9mo
        use: |
          Only the address clause the section's first sentence makes; add nothing beyond it.
      - id: m1-home
        kind: fact
        fact: f:ibis7z
        use: |
          Only the page the check looks for: the scaffold's home page, `src/routes/+page.svelte`,
          with its "Welcome to SvelteKit" heading and one paragraph.
      - id: s-open-bare
        kind: step
        text: |
          In a browser, open the address the deploy printed, and confirm that the scaffold's
          "Welcome to SvelteKit" page loads.
        requires:
          - bare-deployed
        produces:
          - bare-verified
        canFail: true
      - id: x-deploy-bare
        kind: failure
        from: s-deploy-bare
        symptom: |
          The deploy fails.
        cause: |
          Wrangler is not signed in to the account, or the build output is not where the Worker
          config points.
        handledBy: r-deploy-checks
      - id: x-open-bare
        kind: failure
        from: s-open-bare
        symptom: |
          The address does not load the scaffold's page.
        cause: |
          The kit config still names another adapter, or `wrangler.jsonc` points at the wrong
          output.
        handledBy: r-deploy-checks
      - id: r-deploy-checks
        kind: sentence
        mode: claim
        text: |
          When the deploy fails or the address does not load, a numbered list of checks in order:
          that `npx wrangler login` completed for the account you deploy to; that the kit config
          names `@sveltejs/adapter-cloudflare`; that `main` and the `assets` directory in
          `wrangler.jsonc` point at `.svelte-kit/cloudflare`.
        facts:
          - f:9ug9mo
          - f:mhsere
          - f:q13lck
  - id: deploy-a-change
    heading: Deploy a change
    why: |
      The tutorial anatomy gives each milestone a try-it-yourself prompt, and a redeployed change
      practices the build-and-deploy loop the later milestones repeat.
    level: 3
    opens: |
      Change one line of the scaffold's home page, deploy again, and confirm the change at the same
      address.
    items:
      - id: t1-disclosure
        kind: sentence
        mode: claim
        text: |
          The answer sits in a collapsed disclosure block labeled "Show me the steps", as a
          numbered list, so a reader can try first and check after.
      - id: t1-edit
        kind: step
        text: |
          In `src/routes/+page.svelte`, change a line of text.
        requires:
          - bare-verified
        produces:
          - home-changed
      - id: t1-deploy
        kind: step
        text: |
          In the project directory, build the site and deploy it again.
        requires:
          - home-changed
        produces:
          - change-deployed
      - id: t1-check
        kind: step
        text: |
          In a browser, reload the `workers.dev` address and confirm that the page shows the
          change.
        requires:
          - change-deployed
        produces:
          - change-verified
  - id: checklist-before-the-engine
    heading: Checklist before the engine
    why: |
      The tutorial anatomy closes each milestone with "I can" statements, so the reader confirms the
      deploy path before the engine joins it.
    level: 3
    opens: |
      Before you continue, confirm that each of the following statements holds:
    items:
      - id: c1-list
        kind: sentence
        mode: claim
        text: |
          A bulleted list of "I can" statements: I can name the Cloudflare adapter explicitly in
          the `sveltekit()` call in `vite.config.ts`; I can deploy the Worker and load it at its
          `workers.dev` address.
  - id: install-the-engine-and-render-an-entry
    heading: Install the engine and render an entry
    why: |
      Content comes before the admin: the dev backend in [[mount-the-admin-on-the-dev-backend]]
      reads the site's own entries and committed manifest, `createCairnAdmin` needs the runtime the
      adapter feeds, and the `cairnManifest` plugin this milestone adds supplies the define the dev
      backend's hook reads.
    opens: |
      This milestone installs the engine, declares a site with one posts concept, and ends with
      the site's first post rendered at its permalink on the dev server.
    items:
      - id: m2-objectives
        kind: sentence
        mode: claim
        text: |
          A bulleted list of the milestone's objectives under a complete lead-in: install the
          engine and let Vite compile it; write the site config and a minimal adapter; put an entry
          on disk and commit the manifest every build checks; render the entry at its permalink.
      - id: m2-start
        kind: sentence
        mode: claim
        text: |
          It starts from the deployed bare site the previous milestone left.
      - id: m2-why
        kind: reason
        text: |
          The content comes before the admin because the dev backend that milestone 3 wires reads
          the site's own entries and its committed manifest from the working tree, and the Vite
          plugin this milestone adds also supplies the flag that the dev backend's hook reads.
  - id: install-the-engine-and-let-vite-compile-it
    heading: Install the engine and let Vite compile it
    why: |
      Every later module imports the engine, so the package, its compile setting, and its ambient
      types come before any config or route.
    level: 3
    opens: |
      Before any route exists, the engine needs its package with the `@cloudflare/workers-types`
      peer, an `ssr.noExternal` entry, and an ambient import that types `App.Locals`.
    items:
      - id: i-peer
        kind: fact
        fact: f:26kuvx
        use: |
          Only the required peer, `@cloudflare/workers-types` at `^5`, and why the engine needs it.
          The optional peers wait for [[verify-the-rendered-entry]].
      - id: i-deps
        kind: fact
        fact: f:ew4uk7
        use: |
          Only which list each package installs into, as a scaffolded site lists them: the engine as
          a dependency and `@cloudflare/workers-types` as a development dependency; and the types
          the shipped `.d.ts` files import from it.
      - id: i-noexternal
        kind: fact
        fact: f:c8efq5
      - id: i-ambient
        kind: fact
        fact: f:vvgpr5
        use: |
          Only the ambient import's augmentation of `App.Locals` (name the five fields through the
          ambient reference, never inline), and where a custom route reads Worker bindings: from
          `cloudflare:workers`, typed by the `Env` that `wrangler types` generates, since adapter 8
          declares no `App.Platform`. Omit the clause that `src/app.d.ts` references the generated
          file.
      - id: i-ambient-link
        kind: link
        target: ../reference/ambient.md
      - id: i-steps-lead
        kind: sentence
        mode: verbatim
        text: |
          To install the engine, follow these steps:
      - id: s-install-engine
        kind: step
        text: |
          In the project directory, install `@glw907/cairn-cms`, and install
          `@cloudflare/workers-types` as a development dependency.
        requires:
          - kit-config
        produces:
          - engine-installed
        canFail: true
      - id: x-eresolve
        kind: failure
        from: s-install-engine
        symptom: |
          npm stops the install with `ERESOLVE`.
        cause: |
          The app's `package.json` still requires `@sveltejs/kit` `^2`.
        handledBy: m1-existing-kit
      - id: s-noexternal
        kind: step
        text: |
          In `vite.config.ts`, add an `ssr` block that lists `@glw907/cairn-cms` under
          `noExternal`.
        requires:
          - engine-installed
        produces:
          - engine-compiles
      - id: s-ambient
        kind: step
        text: |
          In `src/app.d.ts`, add `import '@glw907/cairn-cms/ambient';` above the scaffold's
          `declare global` block.
        requires:
          - engine-installed
        produces:
          - ambient-types
      - id: i-appd-code
        kind: code
        text: |
