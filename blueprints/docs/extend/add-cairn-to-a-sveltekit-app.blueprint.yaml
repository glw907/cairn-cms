          path to the reference.
      - id: x-verify
        kind: fact
        fact: f:xluud1
        use: |
          Only that the plugin verifies the committed content manifest on build. The define it
          supplies waits for the dev-backend section.
      - id: x-plugin-link
        kind: link
        target: ../reference/vite.md#cairnmanifestoptions
      - id: x-origin
        kind: fact
        fact: f:7bch04
        use: |
          Only that the content module also exports an `origin` constant, the local dev origin for
          now, which the production milestone changes to the deployed origin.
      - id: x-steps-lead
        kind: sentence
        mode: verbatim
        text: |
          To index the content and commit the manifest, follow these steps:
      - id: s-content-module
        kind: step
        text: |
          In `src/lib`, create the content module, `content.ts`, which passes the posts glob to
          `createSiteIndexes` and exports the site index and `origin`.
        requires:
          - adapter
          - first-entry
        produces:
          - content-module
      - id: x-content-code
        kind: code
        text: |
          A file-location tree under `src/lib`, then `src/lib/content.ts`: one eager
          `import.meta.glob('/src/content/posts/*.md', { query: '?raw', import: 'default' })`,
          `createSiteIndexes(cairn, siteConfig, { posts })` from `@glw907/cairn-cms/delivery`,
          `export const site`, and `export const origin = 'http://localhost:5173'` under a comment
          that production changes it.
        source: ../../templates/waymark/src/chassis/content.ts
      - id: s-manifest-plugin
        kind: step
        text: |
          In `vite.config.ts`, add the `cairnManifest` plugin after `sveltekit()`, with
          `configModule` naming `/src/lib/cairn.config.ts` and `content` mapping `posts` to its
          glob.
        requires:
          - content-module
          - engine-compiles
        produces:
          - manifest-plugin
      - id: x-vite-code
        kind: code
        text: |
          The whole `vite.config.ts` at this point: `sveltekit({ adapter: adapter() })` with the
          `compilerOptions` comment, `cairnManifest({ configModule: '/src/lib/cairn.config.ts',
          content: { posts: '/src/content/posts/*.md' } })`, and `ssr.noExternal` listing the engine
