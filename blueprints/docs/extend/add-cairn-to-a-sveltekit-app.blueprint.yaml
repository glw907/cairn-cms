    reason: |
      What the scaffold builds with is the scaffolded-site page's subject; this page's adapter step
      rests on `f:mhsere`.
  - fact: f:fekvhi
    disposition: subordinated
    reference: ../reference/sveltekit.md#created1auditsink
    reason: |
      The audit sink's wiring belongs to its reference entry, linked from the database section;
      the tutorial site wires no audit sink.
  - fact: f:dzmj90
    disposition: cut
    reason: |
      A synthetic case in the engine's slug contract test; no reader-facing claim, and the page
