constraints:
  - |
    Where the dev backend's behavior and its neighbors land: the working-tree default, the
    in-memory overlay, and the fixtures mode in [[wire-the-dev-backend]] (`f:p1v88s`, `f:cgt4tk`,
    `f:2fqe3l`, `f:dqjkci`); the admin notice in [[verify-the-dev-sign-in]] (`f:7qwrb9`) and the
    in-memory exercise in [[edit-the-post-in-memory]] (`f:cgt4tk`); the dev package's
    `ssr.noExternal` entry and its built form in [[wire-the-dev-backend]] (`f:2pv4r5`, `f:47v0r9`),
    with the 500 as a failure row; the one declaration as `{ runtime }` on both handles and the
    access map declared once on the adapter (`f:4xrx5f`, `f:7cv105`, `f:iwf4nu`, `f:f21bcz`); the
    branding merge in [[rebrand-the-email]] (`f:v72g9z`, `f:2gtftn`); the engine-supplied define in
    [[wire-the-dev-backend]] (`f:xluud1`, `f:n52h8f`), so the page shows no hand-written define
    plugin and no `app.d.ts` declaration; the stale-manifest message in
    [[resolve-a-content-build-failure]] (`f:fdtgh5`). No `cf-typegen` step is placed (see
    `dispositions`). `seedContent` is named nowhere on the page.
  - |
    No coding assistant is assumed (register). The page names no coding agent, addresses none, and
    mentions neither `CLAUDE.md` nor `.claude/`.
  - |
    Never on the page: the removed `/components` subpath, the retired JavaScript doctor or its
    `github.app` check, `seedContent`, a hand-written `devBuildDefine` plugin, a
    `declare const __CAIRN_DEV_BUILD__` in `app.d.ts`, `createAuthGuard()` or `devBackendHandle()`
    called with no argument, `devBackendHandle({ access })`, or an `admin.action.misconfigured`
    warning about the dev backend.
  - |
    Running example and names the reader creates: the project and Worker `field-notes`, the
    database `field-notes-auth`, the domain `notes.example.com`, the GitHub account placeholder
    `your-account`, the post `2026-08-14-first-light.md` titled First light. The modules are
    `src/lib/site.config.yaml`, `src/lib/cairn.config.ts`, `src/lib/content.ts`,
    `src/lib/cairn.server.ts`, `src/routes/[...path]/`, `src/routes/admin/`, and
    `src/hooks.server.ts`, imported across directories as `#lib/<file>.js`. The handoffs `i-handoff`
    and `k-handoff` name no path.
  - |
    Milestone shape (tutorial milestone anatomy): each milestone's level-2 section opens with its
    objectives and the state it starts from; its level-3 sections run steps, a verification whose
    check is the page or admin loading, failure rows, a try-it prompt, and a checklist of "I can"
    statements. Each try-it's steps sit inside a collapsed `<details>` block whose summary reads
    "Show me the steps", never under a fourth-level heading. Milestone headings carry no
    "Milestone N:" prefix; the introduction's numbered list names the four milestones in order.
  - |
    Every `vite.config.ts` sample keeps the scaffold's `compilerOptions` as a comment and never
    shows a define plugin. The admin layout sample imports no style sheet. The tutorial runs the dev
    backend under `vite dev` only; `wrangler dev` appears only in the fixtures sentence.
  - |
    Form: every step names its location before its action and holds one action, except the shell
    forms nested in `s-dev-admin`; step and list sentences stay under 26 words; every list and code
    block takes a complete-sentence lead-in; each file's code follows its file-location tree, as the
    Django exemplar does; no em dash; no heading carries a link; task headings start with a bare
    infinitive.
  - |
    Names (register "Names"): cairn lowercase; the engine for the library and `@glw907/cairn-cms`
    where the reader types it; `create-cairn-site` on first mention, then the setup command; the
