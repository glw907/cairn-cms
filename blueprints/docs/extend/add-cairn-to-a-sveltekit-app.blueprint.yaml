        kind: fact
        fact: f:lbetsq
        use: |
          Only the claim the section's first sentence makes, plus the `/sveltekit` subpath that
          exports `SendMagicLink`.
      - id: cs-message
        kind: fact
        fact: f:1b54g7
        use: |
          Only the message's members, with `replyTo` taking one address, and the rule for what a
          sender throws: its text reaches the log scrubbed of token values and truncated, so a
          thrown message never embeds the message body or the sign-in link.
      - id: s-custom-send
        kind: step
        text: |
          In the server module, pass a `send` that edits the message's subject before sending it
          through the `EMAIL` binding.
        requires:
