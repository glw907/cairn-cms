      - id: cs-code
        kind: code
        text: |
          `src/lib/cairn.server.ts` with a `send: SendMagicLink` that throws a message naming only
          the missing binding when `env.EMAIL` is absent, then sends `{ ...message, subject:
          `${message.subject}: your sign-in link` }`, passed beside `bootstrapOwner` in `auth`.
        source: ../../templates/waymark/src/chassis/cairn.server.ts
      - id: cs-types-link
        kind: link
        target: ../reference/sveltekit.md#types
