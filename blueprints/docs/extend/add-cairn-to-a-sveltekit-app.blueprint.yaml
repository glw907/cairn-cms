  - id: create-the-auth-database
    heading: Create the auth database
    why: |
      The database's create output carries the id the `AUTH_DB` entry needs, so the database comes
      before the bindings that need it.
    level: 3
    opens: |
      The engine keeps its editors, sign-in tokens, and sessions in the D1 database bound as
      `AUTH_DB`, and every site applies two of the five migrations the package ships.
    items:
      - id: db-tables
        kind: fact
        fact: f:gffvfd
        use: |
          Only the three tables `0000_auth.sql` creates, which back "editors, sign-in tokens, and
          sessions", and the count of five migration files. Omit every other table detail.
      - id: db-two
        kind: fact
        fact: f:hft8s8
        use: |
          Only the two migrations every site applies and what the nonce column of
          `0004_login_nonce.sql` binds. The missing-column error waits for
          [[resolve-a-production-failure]].
      - id: db-ship
        kind: fact
        fact: f:xxtooz
        use: |
          Only the shipped `migrations/` directory, the copy into the site's own `migrations_dir`,
          and the apply command's `--remote` and `--local` flags.
      - id: db-create
        kind: fact
        fact: f:if45on
      - id: db-steps-lead
        kind: sentence
        mode: verbatim
        text: |
          To create and migrate the database, follow these steps:
      - id: s-d1-create
        kind: step
        text: |
          In the project directory, create the database with `npx wrangler d1 create
          field-notes-auth`, and note the database id in its output.
        requires:
          - wrangler-signed-in
        produces:
          - auth-db
      - id: s-copy-migrations
        kind: step
        text: |
          In the project directory, copy `0000_auth.sql` and `0004_login_nonce.sql` from
          `node_modules/@glw907/cairn-cms/migrations/` into a new `migrations` directory.
        requires:
          - engine-installed
        produces:
          - migrations-copied
      - id: s-d1-binding
        kind: step
        text: |
          In `wrangler.jsonc`, add a top-level `d1_databases` entry that binds the database as
          `AUTH_DB`, with the id from the create output and `migrations_dir` set to `migrations`.
        requires:
          - auth-db
          - migrations-copied
          - wrangler-config
        produces:
          - auth-binding
      - id: s-d1-apply
        kind: step
        text: |
          In the project directory, apply the migrations to the remote database with
          `npx wrangler d1 migrations apply field-notes-auth --remote`.
        requires:
          - auth-binding
        produces:
          - auth-migrated
      - id: db-optin
        kind: fact
        fact: f:rn62i1
        use: |
          Only what each opt-in migration serves, in a paragraph after the steps: `0001_roles.sql` a
          role vocabulary beyond owner and editor, and `0003_preview.sql` draft-preview links. Omit
          the scaffold history and the rebuild detail.
      - id: db-preview-link
        kind: link
        target: share-a-draft-preview.md#apply-the-preview-migration
      - id: db-audit
        kind: fact
        fact: f:pkrwom
        use: |
          Only the separate D1 binding with its own `migrations_dir` for `0002_audit.sql`, and its
          reason.
      - id: db-audit-link
        kind: link
        target: ../reference/sveltekit.md#created1auditsink
  - id: add-the-email-sending-binding-and-name-the-origin
    heading: Add the Email Sending binding and name the origin
    why: |
      The bindings consume the database id and come last of the production edits, and the origin
      they name must be set before the production build in [[verify-the-production-site]].
    level: 3
    opens: |
      Sign-in mail leaves through the `EMAIL` binding on a domain you control, and that domain also
      supplies the sender address and the origin the site names in two places.
    items:
      - id: em-binding
        kind: fact
        fact: f:xhwl32
        use: |
          Only the binding entry, the onboarding command, and the `workers.dev` clause, from which
          the production site runs on the onboarded domain.
      - id: em-domain-link
        kind: link
        target: https://developers.cloudflare.com/email-service/configuration/domains/
      - id: em-route
        kind: fact
        fact: f:thgmpz
        use: |
          Only the `routes` entry and what the next deploy creates, inside the `wrangler.jsonc`
          step.
      - id: em-origin
        kind: fact
        fact: f:ntdafg
        use: |
          Only `PUBLIC_ORIGIN` as the canonical origin for sign-in links and the
          `config.public-origin-invalid` throw for an unset or invalid value.
      - id: em-observability
        kind: fact
        fact: f:txgoyy
        use: |
          Only the setting and the check that raises it, inside the `wrangler.jsonc` step:
          `observability.enabled: true` sends the engine's log records to Workers Logs, and the site
          sets it here because `cairn doctor` would otherwise warn from its `config.observability`
          check when the verification runs it.
      - id: em-steps-lead
        kind: sentence
        mode: verbatim
        text: |
          To add the binding and name the origin, follow these steps:
      - id: s-onboard
        kind: step
        text: |
          In the project directory, onboard the domain for Email Sending, following Cloudflare's
          domain configuration page.
        requires:
          - domain-zone
          - wrangler-signed-in
        produces:
          - domain-onboarded
      - id: s-wrangler-prod
        kind: step
        text: |
          In `wrangler.jsonc`, add the `routes` entry, the `EMAIL` binding, `PUBLIC_ORIGIN` under
          `vars`, and `observability` beside the `AUTH_DB` entry.
        requires:
          - auth-binding
          - domain-onboarded
        produces:
          - bindings-declared
      - id: em-wrangler-code
        kind: code
        text: |
          The whole tutorial `wrangler.jsonc`: the four keys from the first milestone, `routes` with
          `notes.example.com` as a custom domain, `send_email` with `EMAIL`, the `AUTH_DB`
          `d1_databases` entry, `vars` with `PUBLIC_ORIGIN` set to `https://notes.example.com`, and
          `observability: { enabled: true }`. No `r2_buckets`, no `dev` block.
        source: ../../templates/waymark/wrangler.jsonc
      - id: s-sender
        kind: step
        text: |
          In the adapter module, set the `email` group's `from` to an address on the domain.
        requires:
          - backend-configured
          - domain-onboarded
        produces:
          - sender-set
      - id: s-origin
        kind: step
        text: |
          In the content module, set `origin` to the same value as `PUBLIC_ORIGIN`.
        requires:
          - content-module
          - bindings-declared
        produces:
          - origin-set
      - id: em-prerender
        kind: reason
        text: |
          A prerendered route writes `origin` into the build output, so the content module names
          the deployed origin before the production build.
      - id: em-send-link
        kind: link
        target: '#edit-the-message-in-a-custom-sender'
  - id: verify-the-production-site
    heading: Verify the production site
    why: |
      The milestone ends with a check the reader runs: `cairn doctor` confirms the bindings, and a
      publish carried to the deployed page confirms the App, which no command checks.
    level: 3
    opens: |
      `cairn doctor` confirms the two bindings, and a publish from the deployed admin confirms the
      App, since no command checks the App itself.
    items:
      - id: pv-doctor
        kind: fact
        fact: f:m0ouh8
        use: |
          Only what backs the section's first sentence: the `config.bindings` check, run with no
          flags from the site's directory, and that checking the App takes a manual publish whose
          commit lands on `main`.
      - id: pv-prerender
        kind: reason
        text: |
          The entry route is prerendered, so a published edit reaches the deployed page only after
          the next build and deploy, which the steps perform.
      - id: pv-steps-lead
        kind: sentence
        mode: verbatim
        text: |
          To check the bindings and deploy the production build, follow these steps:
      - id: s-doctor
        kind: step
        text: |
          In the project directory, run `cairn doctor` with no flags, and confirm that the
          `config.bindings` check passes.
        requires:
          - cairn-cli
          - bindings-declared
        produces:
          - doctor-passed
        canFail: true
      - id: s-commit-all
        kind: step
        text: |
          In the project directory, commit every uncommitted file and push the `main` branch, so the
          pull after the publish is a fast-forward.
        requires:
          - repo-pushed
          - origin-set
          - sender-set
          - pem-safe
        produces:
          - prod-pushed
      - id: s-deploy-prod
        kind: step
        text: |
          In the project directory, build the site and deploy it.
        requires:
          - prod-pushed
          - key-secret
          - auth-migrated
          - doctor-passed
        produces:
          - prod-deployed
        canFail: true
      - id: pv-publish-lead
        kind: sentence
        mode: verbatim
        text: |
          To publish an edit and confirm it on the deployed page, follow these steps:
      - id: s-sign-in
        kind: step
        text: |
          On the deployed origin, request a sign-in to the admin with the `bootstrapOwner` email,
          and open the link in the email.
        requires:
          - prod-deployed
        produces:
          - prod-signed-in
        canFail: true
      - id: pv-bootstrap
        kind: fact
        fact: f:f2vudv
        use: |
          Only the owner row the first real sign-in creates and its `editor.bootstrapped` log.
      - id: pv-log-link
        kind: link
        target: ../reference/log-events.md
      - id: s-publish
        kind: step
        text: |
          In the admin, open First light, change a line, and publish the edit.
        requires:
          - prod-signed-in
        produces:
          - published
        canFail: true
      - id: s-confirm-commit
        kind: step
        text: |
          On GitHub, confirm that the commit lands on `main` of the site's repository, with you as
          its author and the App's bot as its committer.
        requires:
          - published
        produces:
          - commit-verified
      - id: pv-commit
        kind: fact
        fact: f:5f4kmk
        use: |
          Only the commit's author and committer. Omit the scaffold's App name.
      - id: s-pull
        kind: step
        text: |
          In the project directory, pull the published commit with `git pull`.
        requires:
          - commit-verified
        produces:
          - pulled
      - id: s-redeploy
        kind: step
        text: |
          In the project directory, build the site and deploy it again.
        requires:
          - pulled
        produces:
          - edit-deployed
      - id: s-open-edit
        kind: step
        text: |
          On the deployed origin, open the post's permalink, and confirm that the post shows the
          edit.
        requires:
          - edit-deployed
        produces:
          - production-verified
      - id: pv-doctor-link
        kind: link
        target: ../reference/cli-cairn-doctor.md#the-checks
  - id: resolve-a-production-failure
    heading: Resolve a production failure
    why: |
      The failure rows follow the verification steps they diagnose, each pointing at a setting this
      milestone made.
    level: 3
    opens: |
      Each of the following failures points at a setting this milestone made.
    items:
      - id: pf-bindings
        kind: failure
        from: s-doctor
        symptom: |
          The `config.bindings` check fails.
        cause: |
          `wrangler.jsonc` lacks the `AUTH_DB` or `EMAIL` entry.
        handledBy: pf-bindings-fix
      - id: pf-refusal
        kind: failure
        from: s-deploy-prod
        symptom: |
          `/admin` on the deployed site still shows **Wrangler bindings are missing**.
        cause: |
          The deployed build has no `AUTH_DB` binding.
        handledBy: pf-bindings-fix
      - id: pf-bindings-fix
        kind: sentence
        mode: claim
        text: |
          Declare both entries as the database and Email Sending sections show, then deploy again.
        facts:
          - f:m0ouh8
          - f:jbt2hh
      - id: pf-origin
        kind: failure
        from: s-deploy-prod
        symptom: |
          The site throws `config.public-origin-invalid`.
        cause: |
          `PUBLIC_ORIGIN` is unset or invalid.
        handledBy: pf-origin-fix
      - id: pf-origin-fix
        kind: sentence
        mode: claim
        text: |
          Set `PUBLIC_ORIGIN` under `vars` to the deployed `https` origin.
        facts:
          - f:ntdafg
      - id: pf-mail
        kind: failure
        from: s-sign-in
        symptom: |
          The sign-in email never arrives.
        cause: |
          The domain is not onboarded for Email Sending.
        handledBy: pf-mail-fix
      - id: pf-mail-fix
        kind: sentence
        mode: claim
        text: |
          Onboard the domain in the `PUBLIC_ORIGIN` zone with `npx wrangler email sending enable`.
        facts:
          - f:xhwl32
      - id: pf-nonce
        kind: failure
        from: s-sign-in
        symptom: |
          A store error names the missing column and `0004_login_nonce.sql`.
        cause: |
          The auth database lacks that migration.
        handledBy: pf-nonce-fix
      - id: pf-nonce-fix
        kind: sentence
        mode: claim
        text: |
          Copy `0004_login_nonce.sql` into `migrations` and apply the migrations again with
          `--remote`.
        facts:
          - f:hft8s8
          - f:xxtooz
      - id: pf-publish
        kind: failure
        from: s-publish
        symptom: |
          The publish fails.
        cause: |
          The App lacks **Contents** at **Read and write**, is not installed on the site's
          repository, or the Worker has no `GITHUB_APP_PRIVATE_KEY_B64` secret.
        handledBy: pf-publish-fix
      - id: pf-key-condition
        kind: fact
        fact: f:pg2smj
        use: |
          Only the runtime half: an unset `GITHUB_APP_PRIVATE_KEY_B64` Worker secret raises the
          `github.app-unreachable` condition. Never mention the retired doctor or its check.
      - id: pf-publish-fix
        kind: sentence
        mode: claim
        text: |
          Check the App's permission and installation on GitHub, and put the secret again if the
          Worker lacks it.
        facts:
          - f:vgw8x9
          - f:rp65d2
          - f:pg2smj
      - id: pf-debug-link
        kind: link
        target: debug-your-site.md
