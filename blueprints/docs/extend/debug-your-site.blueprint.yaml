constraints:
  - |
    [[adminactionmisconfigured]] states the current wiring (the guard and the dev backend's handle
    attach the adapter's access map), and
    [[the-site-facts-json-check-was-skipped]] describes the warning the build emits when it skips
    the check.
  - |
    The page never offers `devBackendHandle({ access })` or a guard `access` option as a fix, and
    never says the build reports a stale `site-facts.json` current. An upgrading reader is sent to
    Upgrade cairn's one-declaration section by link, with no history restated.
  - |
    Each event row's heading is the literal event string. Each event row also links the log events
    reference (`../reference/log-events.md`) for its record's fields: the blueprint carries that
    target once, as `l-see-log-events` in [[see-also]], and the drafter writes the per-row link in
    every event row from this constraint. The two headings that carry an `anchor` keep their exact
    text: sibling blueprints subordinate facts to their anchors.
  - |
    Each row holds, in order, what the reader sees, the event or error, what it means, and the fix
    (or that none is needed), or for a record row how a query allows for it; a fix that needs code
    or config changed says so in those words.
  - |
    The rate-limit row states only what `f:1b3ye3` and `f:i1dayf` state for those events; it adds
    no detail from the log events reference.
  - |
    `cairn help agents` is described as the contract for a script or program that runs the
    `cairn` CLI; the page addresses no coding assistant.
  - |
    Workers Logs and `wrangler tail` get their vendor links and no copied dashboard navigation.
  - |
    The page carries only the rows this blueprint lists: no `admin.action.csrf_refused` row (the
    check-order list names its event and response, from `f:1b3ye3`, and nothing more), no
    build-time env-read row, and no illustrative today reader, since no fact here backs either
    of the last two.
  - |
    These links also render in the introduction's not-covered list: the [[see-also]] links to the
    log events reference, Upgrade cairn, the migration notes, and Run cairn-audit on your site. The
    blueprint carries one link item per target, in [[see-also]], and none in the first section.
