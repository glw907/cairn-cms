version: 1
argument: |
  An access map is a narrowing layer over the capability floor cairn already enforces, declared
  once on the adapter and read by every enforcement point: the engine's screens, their write
  actions, and the sidebar read it through the composed runtime, and the guard attaches the same
  map to every admin request for the site's own routes. The engine gates its own screens, but the
  guard decides no per-route authorization, so a site's own route enforces the map itself, on its
  read and on every write, because SvelteKit runs a form action without its page's `load`. The two
  enforcement points read a target the map leaves out in opposite ways (an engine screen stays
  open, a route that opted in refuses everyone), which is what makes the map safe to add
  incrementally and dangerous to forget on a new route. One running example carries the page: a
  webmaster role with editor capability that alone, with owners, reaches the media library and the
  example site's signups screen at `/admin/signups`, declared on the adapter, enforced on the
  screen's load and actions, deployed with the roles migration, assigned on the roster, and proved
  on the deployed site by a test editor who meets the admin's own error page wherever the map
  excludes their role.
introduction:
  covers: |
    The introduction frames the page from above, then states the contract. It opens on the model,
    as statements: everyone who signs in to the admin has a role; the site declares its own role
    names, or uses the default pair, `owner` and `editor`; each role resolves to one capability,
    `owner`, `editor`, or `none`, and capability is the floor cairn enforces. The access map, the
    site's declaration keyed by engine screen or `/admin` route, narrows which editor-capability
    roles reach each target. An owner reaches every mapped target, and the one widening is a `none`
    role, which only a route rule naming it admits. It then says where the map sits: declared once,
    as the adapter's `access` member, and read by the engine's screens, the sidebar, and, through
    the guard, the site's own routes. The contract sentence: the steps declare a role vocabulary
    and an access map on the adapter, enforce the map on your own screen's reads and writes, deploy
    the change with the roles migration, assign the new role, and verify each role's reach. Then
    the running example in one sentence (a webmaster role that alone, with owners, reaches the
    media library and the example site's signups screen). It names the readers who arrive: one
    gating a custom screen's route, one closing an engine screen such as the media library to most
    editors, and one who wants the map to admit named roles alone, whom it points to
    [[make-the-map-exhaustive]].
  priorKnowledge: |
    A Svelte-fluent developer: SvelteKit server hooks, `load` functions, form actions, and route
    ids with their groups and parameters; the site's adapter module; and a Workers Logs query, for
    the checks. The page explains none of these.
  notCovered: |
    Each out-of-scope subject names its page, subject first: why the map only narrows and never
    acts as an allowlist by itself (Security model); building a custom screen and its section
    actions in full (Add a custom admin screen); hiding a sidebar entry without denying its route
    (Arrange the admin sidebar); a role that signs in but reaches no engine content, a `none` role
    for a second sign-in group (Add a second sign-in group); and moving an older site's map off its
    hooks onto the adapter (Upgrade cairn). A scope sentence may name the page.
  facts:
    - f:p1xmp5
    - f:zjglk8
    - f:cvzb8z
framing:
  introPlan: |
    Three paragraphs, then the bounds (prior knowledge and what the page leaves out). No heading.
    The introduction frames the page from above, then states the contract. The first sentence is a
    statement of the model, neither an imperative nor a sentence about the page.

    1. **The model.** Open on statements: everyone who signs in to the admin has a role; the site
       declares its own role names, or uses the default pair, `owner` and `editor`; each role
       resolves to one capability, `owner`, `editor`, or `none`, and capability is the floor cairn
       enforces (`f:zjglk8`). The access map, the site's declaration keyed by engine screen or
       `/admin` route, narrows which editor-capability roles reach each target. An owner reaches
       every mapped target, and the one widening is a `none` role, which only a route rule naming it
       admits (`f:p1xmp5`).
    2. **Where the map sits, and the contract.** The map is declared once, as the adapter's `access`
       member, and read by the engine's screens, the sidebar, and, through the guard, the site's own
       routes (`f:cvzb8z`). Then the contract sentence: the steps declare a role vocabulary and an
       access map on the adapter, enforce the map on your own screen's reads and writes, deploy the
       change with the roles migration, assign the new role, and verify each role's reach.
    3. **The running example and the readers.** The running example in one sentence: a webmaster
       role that alone, with owners, reaches the media library and the example site's signups
       screen. Then the readers who arrive: one gating a custom screen's route, one closing an
       engine screen such as the media library to most editors, and one who wants the map to admit
       named roles alone, whom it sends to [[make-the-map-exhaustive]].

    Then the bounds. The page assumes a Svelte-fluent developer: SvelteKit server hooks, `load`
    functions, form actions, and route ids with their groups and parameters; the site's adapter
    module; and a Workers Logs query, for the checks. It explains none of these. Each out-of-scope
    subject names its page, subject first: why the map only narrows and never acts as an allowlist
    by itself (Security model); building a custom screen and its section actions in full (Add a
    custom admin screen); hiding a sidebar entry without denying its route (Arrange the admin
    sidebar); a role that signs in but reaches no engine content, a `none` role for a second sign-in
    group (Add a second sign-in group); and moving an older site's map off its hooks onto the
    adapter (Upgrade cairn). A scope sentence may name the page.
orderReason: |
  The sections run in the order each step depends on: the vocabulary before the map that names it,
  the map before the routes that enforce it, the comparison of the two enforcement points once both
  are known, then how a key matches nested routes and sidebar entries. The file edits end before
  [[deploy-the-changes]], because the roster and every per-role check run on the deployed site.
  [[assign-the-roles]] follows the deploy, and [[verify-each-role-s-reach]], [[resolve-a-refusal]],
  and [[see-also]] close the page, as the task-guide anatomy requires. The capability floor and the
  narrowing model sit in the introduction, because the reader needs the model before any step.
