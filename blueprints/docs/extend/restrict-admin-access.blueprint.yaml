constraints:
  - |
    The page carries the map declared once on the adapter and read by the guard from the runtime
    (`f:iwf4nu`, `f:4xrx5f`, `f:7cv105`, `f:cvzb8z`, `f:f21bcz`); the none-capability rule
    (`f:p1xmp5`, `f:4673n6`); the roles migration (`f:rn62i1`, `f:gepykz`, `f:xffr6i`); the scaffold
    with no access member and no signups screen (`f:3z1uxv`, `f:onqm6k`, `f:tycp7k`); and the admin
    error page a refusal renders (`f:ty4ehh`).
  - |
    The page never tells the reader to create or edit `src/access.ts` or to pass `roles` or
    `access` to `createAuthGuard` or `devBackendHandle`. Both declarations live in the adapter
    module, and the hooks file needs no edit. An older site's migration is Upgrade cairn's, linked
    from the introduction.
  - |
    The running example's role name, `webmaster`, is a name the page introduces: the brief lists it
    in `local`, and no fact carries it, so no sentence cites a fact for the name alone. In prose it
    is in code font wherever it names the role key, as in the code block. The select label
    `webmaster (editor)` is vouched by `f:2dgbff`: in prose it is in code font as a value, and in a
    step it is bold, **webmaster (editor)**, as the option the reader picks.
  - |
    Prose paths are vouched paths only: `/admin/signups` (`f:3z1uxv`, `f:onqm6k`), `/admin/media`
    (`f:joo5f2`), `/admin/editors` (`f:udg87q`), and `/admin/money` with its two neighbors
    (`f:uhoyun`). The signups screen is the example site's and the scaffold does not ship it; never
    call it the scaffold's.
  - |
    Do not claim that the setup command always applies `0001_roles.sql` to the remote auth
    database: it applies it only when it runs the site's first deploy, in its "Deploy to
    workers.dev" step (`f:m4y3m4`), which a declined deploy or `--yes` without `--deploy` skips. Do
    not claim that applying an already-applied migration is a no-op; no fact states it. The apply
    step stands for every site.
  - |
    Imports: `defineAdapter`, `defineRoles`, and `defineAccess` from `@glw907/cairn-cms`;
    `createAuthGuard`, `requireAccess`, `requireEditor`, and `createSectionAction` from
    `@glw907/cairn-cms/sveltekit`.
  - |
    The code block in [[declare-the-access-map]] marks the map's other keys as elided (a comment such
    as "the site's other keys, unchanged"), and the page never shows or tells the reader to replace
    the whole `access` map: a dropped key leaves its route calling `requireAccess` with no rule,
    which refuses every session, owner included (`f:zo034s`). In the example, the theme-kit key
    stays.
  - |
    The reader arrives with a site route under `/admin` whose `load` and form actions
    do not yet check the access map, and with or without an `access` member on the adapter
    (`f:3z1uxv`). The page never presupposes the route's map key, its `requireAccess` call, or its
    `createSectionAction` wrappers: [[declare-the-access-map]] adds the key and
    [[enforce-the-map-on-your-routes]] adds the call and the wrappers. The example site's signups
    screen (`f:onqm6k`) appears only as the finished form of those steps and as the screen the
    checks name, never as the reader's starting state, and its owner-only starting map
    (`f:3z1uxv`) is the example site's, not the reader's.
  - |
    Keep the heading of [[make-the-map-exhaustive]] stable: `docs/extend/security-model.md` sends a
    reader here for the steps of an exhaustive map.
  - |
    No manufactured scenario beyond the running example: the introduction states who arrives and
    why without inventing an organization or its people.
  - |
    Each step names its location before its action and holds one action; a conditional step
    states its condition first, and the condition alone tells who skips it, so a step adds a skip
    sentence only where the skip reaches past the step itself (a push that skips the build and
    deploy steps) or where the running example skips it. The checks in [[verify-each-role-s-reach]]
    and [[resolve-a-refusal]] are numbered lists.
