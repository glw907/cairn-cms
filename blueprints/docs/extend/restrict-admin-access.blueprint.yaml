constraints:
  - |
    The page carries the map declared once on the adapter and read by the guard from the runtime
    (`f:iwf4nu`, `f:4xrx5f`, `f:7cv105`, `f:cvzb8z`, `f:f21bcz`); the none-capability rule
    (`f:p1xmp5`, `f:4673n6`); the roles migration (`f:rn62i1`, `f:gepykz`, `f:xffr6i`); the scaffold
    with no access member and no signups screen (`f:3z1uxv`, `f:onqm6k`, `f:tycp7k`); and the admin
    error page a refusal renders (`f:ty4ehh`).
  - |
    The page never tells the reader to create or edit `src/access.ts` or to pass `roles` or
    `access` to `createAuthGuard` or `devBackendHandle`. Both declarations live in the adapter
    module, and the hooks file needs no edit. An older site's migration is Upgrade cairn's, linked
    from the introduction.
  - |
    The running example's role name is written in prose as the plain word webmaster, outside code
    font and quotes, since no fact carries the invented name. The quoted select label
    `webmaster (editor)` is vouched by `f:2dgbff`. Inside the code block the name is written as
    code requires.
  - |
    Prose paths are vouched paths only: `/admin/signups` (`f:3z1uxv`, `f:onqm6k`), `/admin/media`
    (`f:joo5f2`), `/admin/editors` (`f:udg87q`), and `/admin/money` with its two neighbors
    (`f:uhoyun`). The signups screen is the example site's and the scaffold does not ship it; never
    call it the scaffold's.
  - |
    Do not claim that the setup command applied `0001_roles.sql` to the remote auth database, or
    that applying an already-applied migration is a no-op; no fact states either. The apply step
    stands for every site.
  - |
    Imports: `defineAdapter`, `defineRoles`, and `defineAccess` from `@glw907/cairn-cms`;
    `createAuthGuard`, `requireAccess`, `requireEditor`, and `createSectionAction` from
    `@glw907/cairn-cms/sveltekit`.
  - |
    The code block in [[declare-the-access-map]] marks the map's other keys as elided (a comment such
    as "the site's other keys, unchanged"), and the page never shows or tells the reader to replace
    the whole `access` map: a dropped key leaves its route calling `requireAccess` with no rule,
