  - source: extenders/django-custom-management-commands/
    slice: Extenders
    manifestType: Task guide
    take: Take one running example (restrict media and a custom route to one role) carried through declaration, guard, and verification; leave the class reference.
sections:
  - id: before-you-begin
    heading: Before you begin
    why: |
      The reader learns before any step what the task needs: a custom admin screen to gate, and a
      deployed site with a second person to sign in as, since local development cannot show a role
      refusal.
    opens: |
      The steps need a site with a custom admin screen, and the checks need a deployed site you can
      redeploy and a second person to sign in as.
    items:
      - id: intro-one-declaration
        kind: fact
        fact: f:cvzb8z
        use: |
          Only the readers of the one declaration, which back the introduction's where-it-sits
          sentence: the engine's screens, their write actions, and the sidebar through the runtime,
          and `requireAccess` and `createSectionAction` through `locals.cairnAccess`. Omit the
          earlier-versions clause.
      - id: intro-security-link
        kind: link
        target: security-model.md
      - id: intro-custom-screen-link
        kind: link
        target: add-a-custom-admin-screen.md
      - id: intro-sidebar-link
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: intro-second-group-link
        kind: link
        target: add-a-second-sign-in-group.md
      - id: intro-upgrade-link
        kind: link
        target: upgrade-cairn.md#when-your-range-crosses-the-one-declaration-change
      - id: intro-exhaustive-link
        kind: link
        target: '#make-the-map-exhaustive'
      - id: bb-list
        kind: sentence
        mode: claim
        text: |
          A bulleted list of four preconditions, each with a link to what produces it: a site that
          `create-cairn-site` scaffolded (or a hand-built site); a custom admin screen whose `load`
          calls `requireAccess` and whose form actions are `createSectionAction` wrappers; a
          deployed site with a way to redeploy it; and an email address for a test editor besides
          the owner's, with a second browser to sign in as that editor.
      - id: bb-adapter-module
        kind: fact
        fact: f:q07rd5
        use: |
          Only the adapter module's two locations, on a scaffolded site and on the hand-built
          tutorial's site, for the site precondition. Omit the manifest and the tutorial's hooks
          clause.
      - id: bb-no-access-member
        kind: fact
        fact: f:3z1uxv
        use: |
          Only the scaffold's missing `access` member and `src/access.ts`, as the site
          precondition's second clause, stated as where a scaffolded site starts: the custom-screen
          precondition has since added a map holding the screen's key. Omit the example site's map,
          which [[declare-the-access-map]] carries.
      - id: bb-hand-built-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: bb-screen
        kind: fact
        fact: f:onqm6k
        use: |
          Only the signups screen as the custom-screen precondition: its gated load, its `create`
          and `remove` section actions, and that the scaffold does not ship it. Omit `APP_DB` and
          the migration, which Add a custom admin screen owns.
      - id: bb-screen-link
        kind: link
        target: add-a-custom-admin-screen.md
      - id: bb-deployed-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#move-the-site-to-production
      - id: bb-dev-owner
        kind: fact
        fact: f:dqjkci
        use: |
          Only the dev backend's owner editor on `/admin`, as the reason for the deployed-site
          precondition: local development cannot show a role refusal.
      - id: bb-dev-roles
        kind: fact
        fact: f:7cv105
        use: |
          Only the clause on `runtime.roles` under the dev backend, the same reason's second half.
          Omit the one-declaration half, which [[declare-the-access-map]] places.
      - id: bb-handoff
        kind: handoff
        text: |
          The map admits roles by name, so the vocabulary comes first.
  - id: declare-the-roles
    heading: Declare the roles
    why: |
      The map admits roles by name, and `defineAccess` validates every role name against the
      vocabulary it is given, so the vocabulary is declared first.
    opens: |
      The access map admits roles by name, so the site first declares its role vocabulary,
      mapping each role name to the capability it resolves to.
    items:
      - id: roles-member
        kind: fact
        fact: f:2zytgf
        use: |
          Only where the members go: `roles` and `access` as optional members of the adapter.
      - id: roles-forms
        kind: fact
        fact: f:zjglk8
        use: |
          Only the two declaration forms, as what a declaration is.
      - id: roles-none
        kind: fact
        fact: f:4673n6
        use: |
          Only what `none` capability means for sign-in and for the engine's content and roster
          screens. Omit the `staff` example.
      - id: roles-none-route
        kind: fact
        fact: f:p1xmp5
        use: |
          Only the route-rule clause, the map's one widening, in the same paragraph as the `none`
          capability.
      - id: roles-second-group-link
        kind: link
        target: add-a-second-sign-in-group.md
      - id: roles-owner-reserved
        kind: fact
        fact: f:dbaklx
        use: |
          Only the one reserved name and the throw when it is missing. Omit the rest of the
          validation list, which the reference entry carries.
      - id: roles-reference-link
        kind: link
        target: ../reference/core.md#defineroles
      - id: roles-absent-trap
        kind: fact
        fact: f:zjglk8
        use: |
          Only the absent-name rule, as the trap in the paragraph with the vocabulary, with its
          consequence for a renamed or dropped role. It is why the example declares `editor` beside
          webmaster.
      - id: roles-default
        kind: fact
        fact: f:4xrx5f
        use: |
          Only the last clause, the default when the adapter declares no roles.
      - id: s-roles-declare
        kind: step
        text: |
          In the adapter module, declare the vocabulary with `defineRoles` and export it as
          `roles`, mapping `owner` to `'owner'` and both `editor` and webmaster to `'editor'`.
        requires:
          - scaffolded-site
        produces:
          - roles-declared
        canFail: true
      - id: x-roles-throw
        kind: failure
        from: s-roles-declare
        symptom: |
          The server start throws from `defineRoles`.
        cause: |
          The vocabulary has no `owner` key mapped to owner capability.
        handledBy: roles-owner-reserved
      - id: s-roles-member
        kind: step
        text: |
          In the same file, add `roles` to the `defineAdapter` call.
        requires:
          - roles-declared
        produces:
          - roles-on-adapter
      - id: roles-handoff
        kind: handoff
        text: |
          The map names these roles.
  - id: declare-the-access-map
    heading: Declare the access map
    why: |
      The map names the declared roles, so it follows them. It carries the page's one code block,
      both declarations on the adapter, and says where the map goes in place of a separate step for
      the guard, which reads the map from the runtime.
    opens: |
      The access map keys each target, an engine screen id or an `/admin` route path, to the role
      names it admits.
    items:
      - id: map-keys
        kind: fact
        fact: f:0qb73i
        use: |
          Only the screen and route key forms, the value lists, and the owner rule.
      - id: map-where
        kind: fact
        fact: f:iwf4nu
        use: |
          Only where the map goes and when it runs: the adapter member, the runtime, and the guard's
          attachment on every admin path, so the guard takes no second copy. Omit the
          earlier-versions clause.
      - id: map-guard-reads
        kind: fact
        fact: f:4xrx5f
        use: |
          Only the guard's required `runtime` and the two members it reads from it, in the same
          paragraph. Omit the earlier-versions clause.
      - id: map-dev-reads
        kind: fact
        fact: f:7cv105
        use: |
          Only the clause that `devBackendHandle` takes the same runtime, in the same paragraph, so
          one declaration serves both handles.
      - id: map-scaffold-hooks
        kind: fact
        fact: f:f21bcz
        use: |
          Only the scaffold's hooks module passing the runtime to both handles, closing the same
          paragraph: the hooks file needs no edit. Omit the dev-gate mechanics.
      - id: map-example-site
        kind: fact
        fact: f:3z1uxv
        use: |
          Only the example site's starting map: name the owner-only signups rule and say the map
          holds other keys the steps keep (in the example, an owner-only theme-kit rule). The
          example changes the signups key so the webmaster role reaches the screen.
      - id: s-map-vocab
        kind: step
        text: |
          In the adapter module's `defineAccess` call, pass `roles` as the first argument in place
          of `undefined`.
        requires:
          - roles-on-adapter
        produces:
          - map-vocab-passed
      - id: s-map
        kind: step
        text: |
          In the adapter module's `access` map, change the `/admin/signups` key to admit webmaster
          and add a `media` key admitting webmaster. Keep every other key.
        requires:
          - map-vocab-passed
        produces:
          - map-declared
        canFail: true
      - id: map-keep-keys
        kind: fact
        fact: f:zo034s
        use: |
          Only the route half, as one clause beside the step: a key dropped from the map locks its
          route. Omit the comparison, which [[decide-what-the-map-leaves-open]] carries.
      - id: map-code
        kind: code
        text: |
          An illustrative excerpt of the adapter module, marked as an excerpt for the snippet
          check: `defineAdapter`, `defineAccess`, and `defineRoles` imported from
          `@glw907/cairn-cms`; `export const roles = defineRoles({ owner: 'owner', editor:
          'editor', webmaster: 'editor' })`; and a `defineAdapter` call whose other members are
          elided, carrying `roles` and `access: defineAccess(roles, { media: ['webmaster'],
          '/admin/signups': ['webmaster'], ... })`, with a comment marking the map's other keys as
          elided and unchanged. Modeled on the example site's `access` member and the
          `defineAccess` reference snippet.
      - id: map-media-trap
        kind: fact
        fact: f:iewhzh
        use: |
          Only the image-picker consequence of restricting `media`, as the trap in the paragraph
          right after the block, beside the `media` key.
      - id: map-writes
        kind: fact
        fact: f:cvv6to
        use: |
          Only the media library's write actions, in the same paragraph. Omit the exceptions, which
          the link that follows carries.
      - id: map-limits-link
        kind: link
        target: security-model.md#limits-of-access-map-coverage
      - id: map-validation
        kind: fact
        fact: f:3z48zf
        use: |
          Only the construction and composition checks, as when the map is checked.
      - id: map-undefined-vocab
        kind: fact
        fact: f:grxpu5
        use: |
          Only the `undefined` vocabulary rule, in the same paragraph: a map naming webmaster needs
          the declared vocabulary.
      - id: map-reference-link
        kind: link
        target: ../reference/core.md#defineaccess
      - id: x-map-throw
        kind: failure
        from: s-map
        symptom: |
          The server start throws a `defineAccess:` or `access:` error naming a key or a role.
        cause: |
          The map breaks one of the construction or composition checks.
        handledBy: map-validation
      - id: map-unset-pointer
        kind: link
        target: '#decide-what-the-map-leaves-open'
      - id: map-handoff
        kind: handoff
        text: |
          The engine now enforces the map on its own screens, and your own routes enforce it
          through two calls.
  - id: enforce-the-map-on-your-routes
    heading: Enforce the map on your routes
    why: |
      `requireAccess` and `createSectionAction` read the map the guard attaches, so the site's own
      routes are enforced once the map exists. Its first step keys the route, so a reader never
      locks everyone out before learning why.
    opens: |
      Your own routes check the map themselves, with `requireAccess` in each `load` and a
      `createSectionAction` wrapper around each form action.
    items:
      - id: enf-guard-split
        kind: fact
        fact: f:2sd4if
        use: |
          Only the guard's split, backing the opening sentence: it gates the whole `/admin` subtree
          and decides no per-route authorization.
      - id: enf-example
        kind: fact
        fact: f:onqm6k
        use: |
          Only the signups screen's existing gates, with `ownerOnly: true` on `remove` alone, to say
          the example needs no edit here. The steps that follow are for a route of your own.
      - id: enf-route-id
        kind: fact
        fact: f:54d3ui
        use: |
          Only the route-id check and its reason.
      - id: enf-require-access
        kind: fact
        fact: f:8anql1
        use: |
          Only what `requireAccess` returns, when it redirects, and when it refuses and what it
          logs, in the same paragraph. Omit the reasons, the route-id normalization, and
          `requireEditor`, which later sections carry.
      - id: enf-action-trap
        kind: fact
        fact: f:5pyozi
        use: |
          Only the form-action rule, as the trap in the paragraph with the `load` call: a gated
          `load` never gates the actions beside it.
      - id: enf-section-action
        kind: fact
        fact: f:3s23un
        use: |
          Only the section action's two checks and its default target, in the same paragraph. Omit
          its other options, which the links carry.
      - id: enf-section-action-link
        kind: link
        target: ../reference/sveltekit.md#createsectionaction
      - id: enf-owner-only
        kind: fact
        fact: f:smbsa6
        use: |
          Only the `ownerOnly` rule, on top of the map's rule and never in place of it, with the
          example: a webmaster session adds a signup and only an owner removes one.
      - id: s-route-key
        kind: step
        text: |
          In the adapter module's `access` map, add a key for the route, listing the roles that
          reach it. The example's `/admin/signups` key already covers its screen.
        requires:
          - map-declared
          - custom-screen
        produces:
          - route-keyed
      - id: enf-no-key
        kind: fact
        fact: f:zo034s
        use: |
          Only the route half, as one clause beside step 1. Omit the comparison, which
          [[decide-what-the-map-leaves-open]] carries.
      - id: s-load-gate
        kind: step
        text: |
          In the route's `+page.server.ts`, call `requireAccess(event)` at the top of `load`,
          before it reads anything.
        requires:
          - route-keyed
        produces:
          - load-gated
      - id: s-wrap-actions
        kind: step
        text: |
          In the same file, wrap each form action in the section's `createSectionAction` wrapper.
        requires:
          - load-gated
        produces:
          - actions-gated
      - id: s-owner-only
        kind: step
        text: |
          For an action only an owner may run, set `ownerOnly: true` in its wrapper's options. A
          route with no such action skips this step.
        requires:
          - actions-gated
        produces:
          - owner-gated
        optional: true
      - id: enf-handoff
        kind: handoff
        text: |
          The two enforcement points treat a target the map never names in opposite ways.
  - id: decide-what-the-map-leaves-open
    heading: Decide what the map leaves open
    why: |
      Its claim compares the engine's screens with the site's own routes, so it comes once both
      enforcement points are known.
    opens: |
      An unnamed engine screen stays open to every editor-capability role, while an unnamed route
      that calls `requireAccess` refuses every session, owner included.
    items:
      - id: open-asymmetry
        kind: fact
        fact: f:zo034s
        use: |
          Only the route half and its misconfiguration reason, backing the opening sentence and the
          refusal that reaches owners too.
      - id: open-require-editor
        kind: fact
        fact: f:8anql1
        use: |
          Only the last sentence, the `requireEditor` route for every editor-capability role.
      - id: open-warning
        kind: fact
        fact: f:8ciz2s
        use: |
          Only the engine-screen half: the unnamed-screen default and the `config.access_unmapped`
          warning, with the href key that never counts. In the example the warning names every
          concept and fixed screen except `media`.
      - id: open-allowlist-link
        kind: link
        target: security-model.md#allowlist-semantics-from-an-exhaustive-map
      - id: open-handoff
        kind: handoff
        text: |
          A site that wants named roles alone on every engine screen closes the gap the warning
          names.
  - id: make-the-map-exhaustive
    heading: Make the map exhaustive
    why: |
      It is the remedy for the engine-screen half of [[decide-what-the-map-leaves-open]], so it sits
      under it at level 3, and its warning is what [[verify-each-role-s-reach]] reads.
    level: 3
    anchor: make-the-map-exhaustive
    opens: |
      To admit only named roles to every engine screen, map every concept and fixed screen until
      `config.access_unmapped` no longer fires.
    items:
      - id: s-exhaustive
        kind: step
        text: |
          In the adapter module's `access` map, add a key for each target the warning names,
          listing the roles that reach it. The running example leaves the warning in place and
          skips this step.
        requires:
          - map-declared
        produces:
          - map-exhaustive
        optional: true
      - id: exh-exceptions
        kind: fact
        fact: f:cvv6to
        use: |
          Only the actions an exhaustive map still leaves outside it, named in one sentence after
          the step. Omit the rest, which the limits link carries.
      - id: exh-limits-link
        kind: link
        target: security-model.md#limits-of-access-map-coverage
      - id: exh-handoff
        kind: handoff
        text: |
          A route key reaches beyond the route it names.
  - id: key-nested-and-parameterized-routes
    heading: Key nested and parameterized routes
    why: |
      Whether a target counts as unnamed depends on how a key matches a route id, so the matching
      rule follows the rule for unnamed targets.
    opens: |
      A route key governs its own path and every path beneath it, matched by the deepest
      whole-segment prefix the map holds.
    items:
      - id: nest-prefix
        kind: fact
        fact: f:uhoyun
        use: |
          Only the matching rule, with the fact's own paths. Omit the nav half, which
          [[sidebar-entries]] carries.
      - id: nest-route-id
        kind: fact
        fact: f:8anql1
        use: |
          Only the default target's normalization and, as the trap in the same paragraph, the
          parameterized route under a deeper key that must declare `target`.
      - id: nest-section-target
        kind: fact
        fact: f:3s23un
        use: |
          Only when a section action's `target` is required, and that a declared one is used
          verbatim.
      - id: s-nest-load-target
        kind: step
        text: |
          If the route has such a parameter or serves more than one section, in its
          `+page.server.ts`, pass the governing key as the second argument to `requireAccess`.
          Any other route skips this step and the next.
        requires:
          - load-gated
        produces:
          - load-target-declared
        optional: true
      - id: s-nest-action-target
        kind: step
        text: |
          In the same file, set `target` to the same key in each section action's options.
        requires:
          - load-target-declared
          - actions-gated
        produces:
          - action-target-declared
        optional: true
      - id: nest-handoff
        kind: handoff
        text: |
          The sidebar applies the same matching to its entries.
  - id: sidebar-entries
    heading: Sidebar entries
    why: |
      A site entry is gated only when its href matches a key, and its trap needs both the matching
      rule and the route refusal, so it follows both.
    opens: |
      The sidebar reads the adapter's map through the same check the routes use, so a keyed entry
      shows only to the roles its key admits.
    items:
      - id: nav-gating
        kind: fact
        fact: f:altcjp
        use: |
          Only the two gating rules, for an engine screen's entry and a `navLayout` site entry,
          backing the opening sentence and its detail.
      - id: nav-example
        kind: fact
        fact: f:tycp7k
        use: |
          Only the scaffold's `navLayout` and the example site's Signups site entry, which the
          example's key gates.
      - id: nav-unmatched-trap
        kind: fact
        fact: f:uhoyun
        use: |
          Only the second half of the fact, as the trap: an unmatched href stays visible while the
          route behind it refuses, so a new screen's entry shows before its route has a key.
      - id: nav-handoff
        kind: handoff
        text: |
          The edits are complete in the site's files, and the deployed site does not have them
          yet.
  - id: deploy-the-changes
    heading: Deploy the changes
    why: |
      It follows the last file edit, because the roster and every per-role check run on the deployed
      site, and the roles migration must reach the auth database before a custom role can be
      written.
    opens: |
      The roster and the per-role checks run on the deployed site, so the roles migration and the
      new adapter must reach it first.
    items:
      - id: dep-migration-why
        kind: fact
        fact: f:rn62i1
        use: |
          Only when `0001_roles.sql` is needed and where a site gets it, with the trap in the same
          paragraph: a site carries any column it added to `editor` across first. Omit
          `0003_preview.sql`.
      - id: dep-scaffold-set
        kind: fact
        fact: f:gepykz
        use: |
          Only `0001_roles.sql` in a scaffolded site's `migrations/`. Omit the rest of the set and
          the audit migration.
      - id: dep-by-hand
        kind: fact
        fact: f:jtl15v
        use: |
          Only the by-hand apply and why neither redeploy path applies a migration. Omit the
          engine-upgrade framing.
      - id: s-copy-migration
        kind: step
        text: |
          If the site's `migrations/` directory lacks `0001_roles.sql`, in the project directory,
          copy it from `node_modules/@glw907/cairn-cms/migrations/`. A site that already holds the
          file skips this step.
        requires:
          - deployed-site
        produces:
          - roles-migration-present
        optional: true
      - id: dep-copy-apply
        kind: fact
        fact: f:xxtooz
        use: |
          Only the copy and the `--remote` apply, backing the copy and apply steps.
      - id: s-apply-migration
        kind: step
        text: |
          In the project directory, apply pending migrations to the auth database with
          `npx wrangler d1 migrations apply <auth-database-name> --remote`.
        requires:
          - deployed-site
        produces:
          - roles-migrated
      - id: dep-paths
        kind: sentence
        mode: claim
        text: |
          A lead-in that the redeploy takes one of two paths, matching how the site deploys: a
          push to a repository connected to Workers Builds, or a build and deploy with Wrangler.
          Both paths run the same two commands, a build and a deploy, and neither applies a
          migration, which is why the apply step comes first.
        facts:
          - f:qca0t0
          - f:jtl15v
      - id: dep-builds
        kind: fact
        fact: f:qca0t0
        use: |
          Only the Workers Builds path: the connect command and the deploy on every push to the
          default branch.
      - id: s-deploy-push
        kind: step
        text: |
          If the repository is connected to Workers Builds, push the changes to its default
          branch, which deploys them. Otherwise take the next two steps instead.
        requires:
          - roles-migrated
          - map-declared
          - actions-gated
        produces:
          - changes-deployed
      - id: dep-wrangler
        kind: fact
        fact: f:9ug9mo
        use: |
          Only the Wrangler path's deploy command. Omit the workers.dev address and `wrangler
          login`.
      - id: s-build
        kind: step
        text: |
          Otherwise, in the project directory, build the site with `npm run build`.
        requires:
          - roles-migrated
          - map-declared
          - actions-gated
        produces:
          - site-built
      - id: s-wrangler-deploy
        kind: step
        text: |
          In the same directory, deploy the build with `npx wrangler deploy`.
        requires:
          - site-built
        produces:
          - changes-deployed
      - id: dep-change-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#deploy-a-change
      - id: dep-handoff
        kind: handoff
        text: |
          The deployed roster now offers the new role.
  - id: assign-the-roles
    heading: Assign the roles
    why: |
      A declared role reaches no one until an owner assigns it on the deployed roster, so assignment
      follows the deploy; the next-request rule lets one test editor cycle through the roles in the
      checks.
    opens: |
      A declared role reaches no one until an owner assigns it on the roster.
    items:
      - id: asg-owner
        kind: fact
        fact: f:pwb0wr
        use: |
          Only the owner's roster management and the editor's lack of it, backing the opening
          sentence.
      - id: asg-form
        kind: fact
        fact: f:udg87q
        use: |
          Only the Add editor form and its Role select, as step 1's location.
      - id: asg-label
        kind: fact
        fact: f:2dgbff
        use: |
          Only the option label for a role whose name differs from its capability, as step 1's
          option.
      - id: s-add-editor
        kind: step
        text: |
          In `/admin/editors` on the deployed site, as the owner, add the test editor through the
          **Add editor** form, choosing `webmaster (editor)` as its **Role**.
        requires:
          - changes-deployed
          - test-editor-address
        produces:
          - test-editor-added
        canFail: true
      - id: x-add-unmigrated
        kind: failure
        from: s-add-editor
        symptom: |
          Adding the test editor with the webmaster role fails on `/admin/editors`.
        cause: |
          The auth database lacks `0001_roles.sql`, so the `editor` table still accepts only
          `owner` and `editor`, which the running site reports as `auth.store-roles-unmigrated`.
        handledBy: s-apply-migration
      - id: asg-unmigrated
        kind: fact
        fact: f:xffr6i
        use: |
          Only the failed write and the `auth.store-roles-unmigrated` warning, backing the failure's
          cause. Omit the statement list and the CHECK text.
      - id: s-sign-in-test
        kind: step
        text: |
          In a second browser, sign in as the test editor.
        requires:
          - test-editor-added
        produces:
          - test-editor-signed-in
      - id: asg-change
        kind: fact
        fact: f:dfxxwb
        use: |
          Only the row's role select and its separate **Change** button, for an editor already on
          the roster. Omit the default-pair toggle and the accessible label.
      - id: asg-next-request
        kind: fact
        fact: f:uotol3
        use: |
          Only the next-request rule, with its two consequences: a demotion takes effect at once,
          and one test editor can cycle through the roles.
      - id: asg-handoff
        kind: handoff
        text: |
          One test editor, moved between roles, proves the map.
  - id: verify-each-role-s-reach
    heading: Verify each role's reach
    why: |
      The task guide closes its steps on proof: each check reads the deployed map through the role
      the test editor holds.
    opens: |
      On the deployed site, the composition warning names the targets the map leaves open, and
      each role meets the admin's error page wherever the map excludes it.
    items:
      - id: ver-lead
        kind: sentence
        mode: verbatim
        text: |
          To verify the map, run these checks in order:
      - id: v-warning
        kind: step
        text: |
          In Workers Logs, query `config.access_unmapped` across the cold start that followed the
          deploy. The record's `unmapped` list names every concept and fixed screen except `media`.
        requires:
          - changes-deployed
        produces:
          - warning-read
        canFail: true
      - id: ver-cold-start
        kind: fact
        fact: f:mou1li
        use: |
          Only the once-per-isolate timing, as the check's caveat: a query scoped to a live request
          window can miss the event.
      - id: ver-unmapped
        kind: fact
        fact: f:8ciz2s
        use: |
          Only the `unmapped` list, backing the check's expected list: here every concept and fixed
          screen but `media`.
      - id: x-no-warning
        kind: failure
        from: v-warning
        symptom: |
          The query returns no `config.access_unmapped` record.
        cause: |
          The record fires only at composition, once per isolate, so a window that misses the
          cold start misses it.
        handledBy: r-widen-window
      - id: r-widen-window
        kind: reason
        text: |
          Widen the query window to cover the cold start after the deploy, since no request after
          composition logs the warning again.
      - id: v-set-editor
        kind: step
        text: |
          In `/admin/editors`, choose `editor` in the test editor's role select, then select
          **Change**.
        requires:
          - test-editor-signed-in
        produces:
          - role-editor
      - id: v-sidebar-editor
        kind: step
        text: |
          In the test editor's browser, check the sidebar. The media library entry is gone, and so
          is a Signups entry where the site's `navLayout` carries one, as the example site's does.
        requires:
          - role-editor
        produces:
          - sidebar-checked
      - id: v-posts
        kind: step
        text: |
          In the same browser, open **Posts**. The list opens, since the map names no `posts` key
          and an unnamed engine screen stays open to editor capability.
        requires:
          - role-editor
        produces:
          - posts-checked
      - id: ver-posts
        kind: fact
        fact: f:5eum60
        use: |
          Only the scaffold's posts concept, backing the Posts check.
      - id: v-signups-refused
        kind: step
        text: |
          In the same browser, open `/admin/signups`. The admin's error page reads "You don't have
          access to this page.", and the site logs `auth.access.refused` with the role and the
          target.
        requires:
          - role-editor
        produces:
          - signups-refusal-seen
      - id: ver-error-page
        kind: fact
        fact: f:ty4ehh
        use: |
          Only the admin error page and its 403 wording, backing the refusal checks.
      - id: v-media-refused
        kind: step
        text: |
          In the same browser, open `/admin/media`. The same error page shows, and the site logs
          `auth.access.refused` with the target `media`.
        requires:
          - role-editor
        produces:
          - media-refusal-seen
      - id: ver-media
        kind: fact
        fact: f:joo5f2
        use: |
          Only the media library's path and its refusal, backing the media check.
      - id: v-set-webmaster
        kind: step
        text: |
          In `/admin/editors`, choose `webmaster (editor)` in the test editor's role select, then
          select **Change**.
        requires:
          - role-editor
        produces:
          - role-webmaster
      - id: v-reload
        kind: step
        text: |
          In the test editor's browser, reload the admin. The media library and the signups screen
          appear in the sidebar and both open, with no new sign-in.
        requires:
          - role-webmaster
        produces:
          - webmaster-reach-seen
      - id: v-add-signup
        kind: step
        text: |
          On the signups screen, enter a name and an email, then select **Add**. The status line
          reads `Signup added.`, and the table lists the new row.
        requires:
          - role-webmaster
        produces:
          - signup-added
      - id: ver-add
        kind: fact
        fact: f:7ji7x0
        use: |
          Only the add form, its status line, and the new row, backing the add check.
      - id: v-remove-refused
        kind: step
        text: |
          On the signups screen, select **Delete** on the signup you added, then **Delete** in the
          confirmation dialog. The dialog stays open, the status line reads
          `You do not have access to this action.`, and the site logs `auth.access.refused`.
        requires:
          - signup-added
        produces:
          - owner-gate-seen
      - id: ver-delete-flow
        kind: fact
        fact: f:b0kf86
        use: |
          Only the two-click delete flow, backing the remove check.
      - id: ver-refused-ui
        kind: fact
        fact: f:thnbyp
        use: |
          Only the refused remove's dialog and status line, backing the remove check's result.
      - id: ver-refused-log
        kind: fact
        fact: f:xbjxit
        use: |
          Only the `fail(403)` and the log event, backing the remove check's log. Omit
          `createAdminAction` and `deniedMessage`.
      - id: ver-owner-only
        kind: sentence
        mode: claim
        text: |
          The remove is refused because `remove` carries `ownerOnly: true`, while the map admits
          webmaster to the screen.
        facts:
          - f:smbsa6
          - f:onqm6k
      - id: ver-handoff
        kind: handoff
        text: |
          A result that differs from these checks traces through the failure path that follows.
  - id: resolve-a-refusal
    heading: Resolve a refusal
    why: |
      The page's failure path: it traces a result that differs from [[verify-each-role-s-reach]] to
      its cause, so it follows the checks.
    opens: |
      An unexpected refusal traces to a missing key or `target`, a role the vocabulary does not
      hold, or an auth database without the roles migration, and an open screen the map should
      close traces to a deploy that predates the map or a route that skips `requireAccess`.
    items:
      - id: res-lead
        kind: sentence
        mode: verbatim
        text: |
          To find the cause, run these checks in order:
      - id: x-refuse-all
        kind: failure
        symptom: |
          A route refuses every session, owner included.
        cause: |
          The route calls `requireAccess` and the map has no key for its target, or a deeper key
          shadows a parameterized route; the `auth.access.refused` record's `reason` reads
          `no_rule` or `shadowed`.
        handledBy: s-route-key
      - id: res-refuse-all
        kind: fact
        fact: f:8anql1
        use: |
          Only the record's target and its `no_rule` and `shadowed` reasons, backing the first
          check. Point to [[key-nested-and-parameterized-routes]] for the shadowed case.
      - id: res-nested-link
        kind: link
        target: '#key-nested-and-parameterized-routes'
      - id: x-role-unknown
        kind: failure
        symptom: |
          A webmaster editor is refused on every screen, and the logs show `auth.role.unknown`
          for that role.
        cause: |
          The role is absent from the adapter's vocabulary, so it resolves to `none`.
        handledBy: s-roles-declare
      - id: res-role-unknown
        kind: fact
        fact: f:4bazhe
        use: |
          Only the `none` resolution and the `auth.role.unknown` log, backing the second check.
      - id: res-doctor
        kind: fact
        fact: f:hwffph
        use: |
          Only the `auth.role-wiring-missing` condition and its fix, as the second check's other
          cause. Say that on this engine a `createAuthGuard()` call without `runtime` does not
          type-check (`f:4xrx5f`, placed in [[declare-the-access-map]]), so this cause mostly
          reaches a hand-built site following the tutorial's stale hooks. Omit the older-engine `{
          roles }` spelling.
      - id: res-doctor-link
        kind: link
        target: ../reference/cli-cairn-doctor.md
      - id: res-unmigrated
        kind: sentence
        mode: claim
        text: |
          The third check: if adding a webmaster editor fails on `/admin/editors`, apply
          `0001_roles.sql` to the remote auth database, as [[deploy-the-changes]] does.
        facts:
          - f:xffr6i
          - f:rn62i1
      - id: res-deploy-link
        kind: link
        target: '#deploy-the-changes'
      - id: x-still-open
        kind: failure
        symptom: |
          The media library or the signups screen still opens for an `editor` session.
        cause: |
          The deployed Worker predates the map, or the route calls `requireEditor` rather than
          `requireAccess`.
        handledBy: s-load-gate
      - id: res-still-open
        kind: fact
        fact: f:8anql1
        use: |
          Only the `requireEditor` clause, backing the fourth check's second cause; its fix is the
          `requireAccess` call in [[enforce-the-map-on-your-routes]]. For the first cause, redeploy
          as [[deploy-the-changes]] does.
      - id: res-enforce-link
        kind: link
        target: '#enforce-the-map-on-your-routes'
      - id: res-redeploy-link
        kind: link
        target: '#deploy-the-changes'
      - id: res-debug-link
        kind: link
        target: debug-your-site.md
  - id: see-also
    heading: See also
    why: |
      The anatomy closes a task guide with the pages and references behind its steps.
    opens: |
      The following pages cover the reasoning and the tasks around the access map.
    items:
      - id: see-security
        kind: link
        target: security-model.md
      - id: see-custom-screen
        kind: link
        target: add-a-custom-admin-screen.md
      - id: see-sidebar
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: see-second-group
        kind: link
        target: add-a-second-sign-in-group.md
      - id: see-access-map
        kind: link
        target: ../reference/core.md#access-map
      - id: see-require-access
        kind: link
        target: ../reference/sveltekit.md#requireaccess
      - id: see-log-events
        kind: link
        target: ../reference/log-events.md
dispositions:
  - fact: f:gun084
    disposition: subordinated
    reference: ../reference/sveltekit.md#createauthguard
    reason: |
      The `createAuthGuard` entry states the whole config bag (`runtime`, `includeSubDomains`,
      `identity`) and that the guard reads `roles` and `access` off the runtime and attaches the
      map. The page needs only the `{ runtime }` call, which `f:4xrx5f` and `f:iwf4nu` carry; the
      other options belong to other tasks.
  - fact: f:5iqvmt
    disposition: subordinated
    reference: security-model.md#limits-of-the-browser-binding
    reason: |
      Sign-in browser binding is off this page's job (access after sign-in); the security model's
      browser-binding limits state that a row with no binding matches a cookieless confirm.
  - fact: f:bw5uk0
    disposition: subordinated
    reference: ../reference/cli-cairn-doctor.md
    reason: |
      Which conditions the `cairn` CLI checks raise is the doctor reference's subject. The page
      names only `auth.role-wiring-missing`, which `f:hwffph` carries.
  - fact: f:eiaqkh
    disposition: cut
    reason: |
      The example site's dev-backend swap in its hooks file is engine-repository wiring a reader's
      site does not carry; the scaffold's hooks, placed through `f:f21bcz`, are what the reader has.
  - fact: f:gcuj1j
    disposition: cut
    reason: |
      What a deploy creates (one Worker, one D1, one R2 bucket) is the admin track's setup subject,
      off this page's job, and the admin arm holds no page to link yet.
  - fact: f:vfpai6
    disposition: cut
    reason: |
      The five things the setup command creates or connects are the admin track's setup subject,
      off this page's job, and the admin arm holds no page to link yet.
  - fact: f:xw0bit
    disposition: cut
    reason: |
      The setup command's closing summary is the admin track's setup subject, off this page's job,
      and the admin arm holds no page to link yet.
  - fact: f:l3cxgc
    disposition: subordinated
    reference: scaffolded-site-files.md
    reason: |
