version: 1
argument: |
  An access map is a narrowing layer over the capability floor cairn already enforces, declared
  once on the adapter and read by every enforcement point: the engine's screens, their write
  actions, and the sidebar read it through the composed runtime, and the guard attaches the same
  map to every admin request for the site's routes. The engine gates its screens, but the
  guard decides no per-route authorization, so a site's route enforces the map itself, on its
  read and on every write, because SvelteKit runs a form action without its page's `load`. The two
  enforcement points read a target the map leaves out in opposite ways (an engine screen stays
  open, a route that opted in refuses everyone), which is what makes the map safe to add
  incrementally and dangerous to forget on a new route. One running example carries the page: a
  `webmaster` role with editor capability that alone, with owners, reaches the media library and the
  example site's signups screen at `/admin/signups`, declared on the adapter, enforced on the
  reader's route's load and actions (the signups screen shows the finished form), deployed with the roles migration, assigned on the roster, and proved
  on the deployed site by a test editor who meets the admin's error page wherever the map
  excludes their role.
introduction:
  covers: |
    The introduction frames the page from above, then states the contract. It opens on the model,
    as statements: everyone who signs in to the admin has a role; the site declares role names, or
    uses the default pair, `owner` and `editor`; each role resolves to one of three capabilities,
    `owner`, `editor`, or `none`, and cairn always enforces capability. The access map restricts it
    further: its keys are engine screens and `/admin` routes, each key lists the roles that reach
    that target, and an owner reaches every mapped target whatever the map lists. The map's one
    widening, a route rule that names a `none` role, belongs to [[declare-the-roles]], not the
    introduction. It then says where the map sits: declared once, as the adapter's `access` member;
    the engine's screens, their write actions, and the sidebar read it through the composed
    runtime; the guard attaches the same map to every admin request but decides no per-route
    authorization, so a route the site writes checks the map itself, in its `load` and in each form
    action, because SvelteKit runs a form action without its page's `load`. The contract sentence:
    the steps declare a role vocabulary and an access map on the adapter, enforce the map on your
    route's reads and writes, deploy the change with the roles migration, assign the new role, and
    verify each role's reach. Then the running example in two sentences (the steps follow one
    example; in it, a `webmaster` role is the only role besides owner that reaches the media library
    and the example site's signups screen). It names the readers who arrive: one gating a custom
    admin screen's route and one closing an engine screen such as the media library to most
    editors, whom the steps serve in order, and one who wants the map to admit only the roles it
    names, on every engine screen, who also needs [[make-the-map-exhaustive]].
  priorKnowledge: |
    A Svelte-fluent developer: SvelteKit server hooks, `load` functions, form actions, and route
    ids with their groups and parameters; the site's adapter module; and a Workers Logs query, for
    the checks. The page explains none of these.
  notCovered: |
    Each out-of-scope subject names its page, subject first, and links it: why the map only narrows
    and never acts as an allowlist by itself (Security model, `security-model.md`); building a
    custom screen and its section actions in full (Add a custom admin screen,
    `add-a-custom-admin-screen.md`); hiding a sidebar entry without denying its route (Arrange the
    admin sidebar, `arrange-the-admin-sidebar.md`); a role that signs in but reaches no engine
    content, a `none` role for a second sign-in group (Add a second sign-in group,
    `add-a-second-sign-in-group.md`); and moving an older site's map off its hooks onto the adapter
    (Upgrade cairn, `upgrade-cairn.md#when-your-range-crosses-the-one-declaration-change`). A scope
    sentence may name the page.
  facts:
    - f:p1xmp5
    - f:zjglk8
    - f:cvzb8z
    - f:0qb73i
    - f:iwf4nu
    - f:2sd4if
    - f:5pyozi
framing:
  introPlan: |
    Three paragraphs, then the bounds (prior knowledge and what the page leaves out). No heading.
    The introduction frames the page from above, then states the contract. The first sentence is a
    statement of the model, neither an imperative nor a sentence about the page.

    1. **The model.** Open on statements: everyone who signs in to the admin has a role; the site
       declares role names, or uses the default pair, `owner` and `editor`; each role resolves to
       one of three capabilities, `owner`, `editor`, or `none`, and cairn always enforces capability
       (`f:zjglk8`). The access map restricts it further: its keys are engine screens and `/admin`
       routes, and each key lists the roles that reach that target (`f:0qb73i`). An owner reaches
       every mapped target whatever the map lists (`f:p1xmp5`). The `none`-role widening waits for
       [[declare-the-roles]].
    2. **Where the map sits, and the contract.** You declare the map once, as the adapter's
       `access` member; the engine's screens, their write actions, and the sidebar read it through
       the composed runtime (`f:cvzb8z`). The guard attaches the same map to every admin request,
       but it decides no per-route authorization (`f:iwf4nu`, `f:2sd4if`), so a route the site
       writes checks the map itself, in its `load` and in each form action, because SvelteKit runs a
       form action without running its page's `load` first (`f:5pyozi`). Then the contract
       sentence: the steps declare a role vocabulary and an access map on the adapter, enforce the
       map on your route's reads and writes, deploy the change with the roles migration, assign the
       new role, and verify each role's reach.
    3. **The running example and the readers.** The steps follow one example throughout: a
       `webmaster` role is the only role besides owner that reaches the media library and the
       example site's signups screen at `/admin/signups`. Then the readers who arrive: one gating a
       custom admin screen's route and one closing an engine screen such as the media library to
       most editors, whom the steps serve in order; and one who wants the map to admit only the
       roles it names, on every engine screen, who also needs [[make-the-map-exhaustive]].

    Then the bounds. The page assumes a Svelte-fluent developer: SvelteKit server hooks, `load`
    functions, form actions, and route ids with their groups and parameters; the site's adapter
    module; and a Workers Logs query, for the checks. It explains none of these. Each out-of-scope
    subject names its page, subject first: why the map only narrows and never acts as an allowlist
    by itself (Security model); building a custom screen and its section actions in full (Add a
    custom admin screen); hiding a sidebar entry without denying its route (Arrange the admin
    sidebar); a role that signs in but reaches no engine content, a `none` role for a second sign-in
    group (Add a second sign-in group); and moving an older site's map off its hooks onto the
    adapter (Upgrade cairn). A scope sentence may name the page.
orderReason: |
  The sections run in the order each step depends on: the vocabulary before the map that names it,
  the map before the routes that enforce it, the comparison of the two enforcement points once both
  are known, then how a key matches nested routes and sidebar entries. The file edits end before
  [[deploy-the-changes]], because the roster and every per-role check run on the deployed site.
  [[assign-the-roles]] follows the deploy, and [[verify-each-role-s-reach]], [[resolve-a-refusal]],
  and [[see-also]] close the page, as the task-guide anatomy requires. The capability floor and the
  narrowing model sit in the introduction, because the reader needs the model before any step.
preconditions:
  - scaffolded-site
  - unchecked-route
  - deployed-site
  - test-editor-address
  - editor-columns-carried
exemplars:
  - source: extenders/sveltekit-hooks/
    slice: Extenders
    manifestType: Reference entry
    take: Take "where it goes, when it runs, a typed example, the default when unset" per piece, and the placement of the security trap, stated in the same paragraph as the value that invites the misuse (in the capture it sits in the remote-function paragraph; imitate its placement, not its subject); leave the remote-function tangents.
  - source: extenders/django-custom-management-commands/
    slice: Extenders
    manifestType: Task guide
    take: Take one running example (restrict media and a custom route to one role) carried through declaration, guard, and verification; leave the class reference.
sections:
  - id: before-you-begin
    heading: Before you begin
    why: |
      The reader learns before any step what the task needs: an admin route in the site whose reads and writes do not yet check the access map, and a deployed site with a second
      person to sign in as, since the dev backend mints an owner editor on `/admin`.
    opens: |
      Before you start, have the following in place:
    items:
      - id: bb-list
        kind: sentence
        mode: claim
        text: |
          A bulleted list of five preconditions, each with a link to what produces it where a page
          does: a site that `create-cairn-site` scaffolded or that was built by hand as in Add cairn
          to a SvelteKit app, with or without an `access` member on its adapter; a site route under
          `/admin` whose `load` and form actions do not yet check the access map, such as one whose
          `load` calls `requireEditor`; a deployed site with a way to redeploy it; an email address
          for a test editor besides the owner's, with a second browser to sign in as that editor;
          and, if the site copies `0001_roles.sql` in and added columns to the auth database's
          `editor` table, an edited copy of the file.
      - id: bb-adapter-module
        kind: fact
        fact: f:q07rd5
        use: |
          Only the scaffolded site's adapter module path, `src/theme/cairn.config.ts`, for the site
          precondition. Name a hand-built site's module generically, as the module that calls
          `defineAdapter`, and omit the tutorial's path, the manifest, and the tutorial's hooks
          clause.
      - id: bb-no-access-member
        kind: fact
        fact: f:3z1uxv
        use: |
          Only the scaffold's missing `access` member, as the site precondition's second clause.
          Omit `src/access.ts` and the example site's map, which [[declare-the-access-map]]
          carries.
      - id: bb-hand-built-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: bb-route-editor
        kind: fact
        fact: f:8anql1
        use: |
          Only the `requireEditor` clause, as the route precondition's example of a `load` that
          does not consult the map. Omit `requireAccess` and `requireSession`.
      - id: bb-deployed-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#move-the-site-to-production
      - id: bb-dev-owner
        kind: fact
        fact: f:dqjkci
        use: |
          Only the owner editor the dev backend mints on `/admin`, as the reason for the
          deployed-site precondition. Omit the in-memory stores and the email loop.
      - id: bb-dev-reason
        kind: sentence
        mode: claim
        text: |
          The checks need a deployed site because the dev backend signs every `/admin` visitor in as
          an owner, so a role refusal never shows in local development.
        facts:
          - f:dqjkci
          - f:7cv105
      - id: bb-dev-roles
        kind: fact
        fact: f:7cv105
        use: |
          Only the clause that the dev backend never reads `runtime.roles`, since it mints the
          owner capability, the same reason's second half.
          Omit the one-declaration half, which [[declare-the-access-map]] places.
      - id: bb-editor-columns
        kind: fact
        fact: f:rn62i1
        use: |
          Only the rebuild that keeps the engine's four `editor` columns and the edit a site's copy
          needs (each added column in `editor_new` and in both column lists of its `INSERT`), as
          the conditional fifth precondition and its two sentences. Omit when the file is needed
          and where a site gets it, which [[deploy-the-changes]] places.
      - id: bb-handoff
        kind: handoff
        text: |
          The map admits roles by name, so the vocabulary comes first.
  - id: declare-the-roles
    heading: Declare the roles
    why: |
      The map admits roles by name, and `defineAccess` validates every role name against the
      vocabulary it is given, so the vocabulary is declared first.
    opens: |
      The role vocabulary maps each role name to the capability it resolves to.
    items:
      - id: roles-member
        kind: fact
        fact: f:2zytgf
        use: |
          Only where the members go: `roles` and `access` as optional members of the adapter.
      - id: roles-forms
        kind: fact
        fact: f:zjglk8
        use: |
          Only the two declaration forms, as what a declaration is.
      - id: roles-none
        kind: fact
        fact: f:4673n6
        use: |
          Only what `none` capability means for sign-in and for the engine's content and roster
          screens. Omit the `staff` example.
      - id: roles-none-route
        kind: fact
        fact: f:p1xmp5
        use: |
          Only the route-rule clause, the map's one widening, in the same paragraph as the `none`
          capability.
      - id: roles-second-group-link
        kind: link
        target: add-a-second-sign-in-group.md
      - id: roles-owner-reserved
        kind: fact
        fact: f:dbaklx
        use: |
          Only the one reserved name and the throw when it is missing. Omit the rest of the
          validation list, which the reference entry carries.
      - id: roles-reference-link
        kind: link
        target: ../reference/core.md#defineroles
      - id: roles-absent-trap
        kind: fact
        fact: f:zjglk8
        use: |
          Only the absent-name rule, as the trap in the paragraph with the vocabulary, with its
          consequence for a renamed or dropped role. It is why the example declares `editor` beside
          `webmaster`.
      - id: roles-default
        kind: fact
        fact: f:4xrx5f
        use: |
          Only the last clause, the default when the adapter declares no roles.
      - id: s-roles-declare
        kind: step
        text: |
          In the adapter module, export a `roles` vocabulary built with `defineRoles` that maps
          `owner` to `'owner'` and both `editor` and `webmaster` to `'editor'`.
        requires:
          - scaffolded-site
        produces:
          - roles-declared
        canFail: true
      - id: x-roles-throw
        kind: failure
        from: s-roles-declare
        symptom: |
          The server start throws from `defineRoles`.
        cause: |
          The vocabulary fails a check the `defineRoles` entry lists, such as a missing `owner`
          key mapped to owner capability.
        handledBy: s-roles-declare
      - id: s-roles-member
        kind: step
        text: |
          In the same file, add `roles` to the `defineAdapter` call.
        requires:
          - roles-declared
        produces:
          - roles-on-adapter
      - id: roles-handoff
        kind: handoff
        text: |
          The map names these roles.
  - id: declare-the-access-map
    heading: Declare the access map
    why: |
      The map names the declared roles, so it follows them. It carries the page's one code block,
      both declarations on the adapter, and where the map goes, since the guard reads the map from
      the runtime.
    opens: |
      The access map keys each target, an engine screen id or an `/admin` route path, to the role
      names it admits.
    items:
      - id: map-keys
        kind: fact
        fact: f:0qb73i
        use: |
          Only the screen and route key forms and the value lists. Omit the owner rule, which the
          introduction places.
      - id: map-where
        kind: fact
        fact: f:iwf4nu
        use: |
          Only where the map goes: the adapter member and nowhere else, and `composeRuntime`
          carrying it onto the runtime, which both handles take. Omit the earlier-versions clause
          and any checking of the map's keys, which `composeRuntime` does not do and a later item
          places.
      - id: map-guard-reads
        kind: fact
        fact: f:4xrx5f
        use: |
          Only the guard's required `runtime` and the two members it reads from it, `roles` and
          `access`, in the same paragraph. Omit the earlier-versions clause.
      - id: map-dev-reads
        kind: fact
        fact: f:7cv105
        use: |
          Only that `devBackendHandle` takes the same runtime and reads only its `access`, which it
          attaches to each `/admin` request it mints an owner editor for, in the same paragraph.
      - id: map-scaffold-hooks
        kind: fact
        fact: f:f21bcz
        use: |
          Only the scaffold's hooks module passing the runtime to both handles, closing the same
          paragraph: the hooks file needs no edit. Omit the dev-gate mechanics.
      - id: map-example-site
        kind: fact
        fact: f:3z1uxv
        use: |
          Only the example site's starting `access` map and its two route rules. Omit the scaffold
          half, which [[before-you-begin]] places.
      - id: s-map-vocab
        kind: step
        text: |
          If the adapter already declares `access`, in its `defineAccess` call, pass `roles` as
          the first argument in place of `undefined`. The example site's call takes this step.
        requires:
          - roles-on-adapter
        produces:
          - map-vocab-passed
        optional: true
      - id: s-map-member
        kind: step
        text: |
          If the adapter has no `access` member, in the `defineAdapter` call, add `access` set to
          a `defineAccess` call that passes `roles` first.
        requires:
          - roles-on-adapter
        produces:
          - map-vocab-passed
        optional: true
      - id: s-map
        kind: step
        text: |
          In the `access` map, add a `media` key that admits `webmaster`, and a key for your
          route's path that lists the roles that reach it. In the example, the `/admin/signups` key
          admits `webmaster` in place of its owner-only rule. Keep every other key.
        requires:
          - roles-on-adapter
          - unchecked-route
        produces:
          - map-declared
        canFail: true
      - id: map-keep-keys
        kind: fact
        fact: f:zo034s
        use: |
          Only the route half, beside the step's keep-every-key clause. Omit the engine-screen half,
          which [[decide-what-the-map-leaves-open]] carries.
      - id: map-code
        kind: code
        text: |
          An illustrative excerpt of the adapter module, marked as an excerpt for the snippet
          check: `defineAdapter`, `defineAccess`, and `defineRoles` imported from
          `@glw907/cairn-cms`; `export const roles = defineRoles({ owner: 'owner', editor:
          'editor', webmaster: 'editor' })`; and a `defineAdapter` call whose other members are
          elided, carrying `roles` and `access: defineAccess(roles, { media: ['webmaster'],
          '/admin/signups': ['webmaster'], ... })`, with a comment marking the map's other keys as
          elided and unchanged. Modeled on the example site's `access` member and the
          `defineAccess` reference snippet.
      - id: map-media-trap
        kind: fact
        fact: f:iewhzh
        use: |
          Only the image-picker consequence of restricting `media`, as the trap in the paragraph
          right after the block, beside the `media` key: the picker's upload is refused, but
          picking an image the library already holds makes no request, so the role can still
          insert an existing library image.
      - id: map-writes
        kind: fact
        fact: f:cvv6to
        use: |
          Only the media library's write actions, gated against `media`, in the same paragraph.
          Omit the other actions, which the link that follows carries.
      - id: map-limits-link
        kind: link
        target: security-model.md#limits-of-access-map-coverage
      - id: map-validation
        kind: fact
        fact: f:3z48zf
        use: |
          Only the three calls that check the map, opening on their count: `defineAccess`'s
          construction checks and its `defineAccess:` error; `composeRuntime`'s check of the map's
          role names against the adapter's vocabulary and its `access:` error; and the key checks
          `createContentRoutesContext` runs when the admin routes are built at server start. Then
          that each error message but the empty-map one names the key at fault, and the role where a
          role is at fault. Never attribute the key checks to `composeRuntime`.
      - id: map-undefined-vocab
        kind: fact
        fact: f:grxpu5
        use: |
          Only the `undefined` vocabulary rule, in the same paragraph: a map naming `webmaster`
          needs the declared vocabulary.
      - id: map-reference-link
        kind: link
        target: ../reference/core.md#defineaccess
      - id: x-map-throw
        kind: failure
        from: s-map
        symptom: |
          The server start throws a `defineAccess:` or `access:` error naming a key or a role.
        cause: |
          The map breaks one of `defineAccess`'s construction checks or one of the key checks the
          admin routes run when they are built at server start.
        handledBy: s-map
      - id: map-unset-pointer
        kind: link
        target: '#decide-what-the-map-leaves-open'
      - id: map-handoff
        kind: handoff
        text: |
          Your routes enforce the map through two calls.
  - id: enforce-the-map-on-your-routes
    heading: Enforce the map on your routes
    why: |
      `requireAccess` and `createSectionAction` read the map the guard attaches, so the route's
      checks follow the map that holds its key; with the key declared first, the route's
      `requireAccess` call never refuses everyone. The steps edit the reader's route, and the
      example site's signups screen shows the form they produce.
    opens: |
      Your routes check the map themselves, with `requireAccess` in each `load` and a
      `createSectionAction` wrapper around each form action.
    items:
      - id: enf-guard-split
        kind: fact
        fact: f:2sd4if
        use: |
          Only the guard's split, as the sentence after the opening one: the guard admits a
          signed-in session to the `/admin` subtree before any `load` runs, and the route itself
          decides which roles reach it.
      - id: enf-example
        kind: fact
        fact: f:onqm6k
        use: |
          Only the signups screen's `load` call and its `create` and `remove` wrappers, with
          `ownerOnly: true` on `remove` alone, as the finished form of these steps and never as
          the reader's starting state. Omit `APP_DB` and the migration.
      - id: enf-route-id
        kind: fact
        fact: f:54d3ui
        use: |
          Only the route-id check and its reason.
      - id: enf-require-access
        kind: fact
        fact: f:8anql1
        use: |
          Only what `requireAccess` returns, when it redirects, and when it refuses and what it
          logs, in the same paragraph. Omit the reasons, the route-id normalization, and
          `requireEditor`, which later sections carry.
      - id: enf-action-trap
        kind: fact
        fact: f:5pyozi
        use: |
          Only the form-action rule and its reason, as the trap in the paragraph with the `load`
          call.
      - id: enf-section-action
        kind: fact
        fact: f:3s23un
        use: |
          Only the section action's two checks and its default target, in the same paragraph. Omit
          its other options, which the links carry.
      - id: enf-section-action-link
        kind: link
        target: ../reference/sveltekit.md#createsectionaction
      - id: enf-owner-only
        kind: fact
        fact: f:smbsa6
        use: |
          Only the `ownerOnly` rule, in the paragraph after the section action's checks.
      - id: s-load-gate
        kind: step
        text: |
          In the route's `+page.server.ts`, call `requireAccess(event)` at the top of `load`,
          before it reads anything, in place of any `requireEditor` call.
        requires:
          - map-declared
          - unchecked-route
        produces:
          - load-gated
      - id: s-wrap-actions
        kind: step
        text: |
          In the same file, wrap each form action in a `createSectionAction` wrapper, so no action
          runs without the map's check.
        requires:
          - load-gated
        produces:
          - actions-gated
      - id: enf-wrapper-link
        kind: link
        target: add-a-custom-admin-screen.md#choose-the-action-wrapper
      - id: s-owner-only
        kind: step
        text: |
          For an action only an owner may run, set `ownerOnly: true` in its wrapper's options.
        requires:
          - actions-gated
        produces:
          - owner-gated
        optional: true
      - id: enf-handoff
        kind: handoff
        text: |
          The two enforcement points treat a target the map never names in opposite ways.
  - id: decide-what-the-map-leaves-open
    heading: Decide what the map leaves open
    why: |
      Its claim compares the engine's screens with the site's routes, so it comes once both
      enforcement points are known.
    opens: |
      An unnamed engine screen stays open to every editor-capability role, while an unnamed route
      that calls `requireAccess` refuses every session, owner included.
    items:
      - id: open-asymmetry
        kind: fact
        fact: f:zo034s
        use: |
          Only the route half, backing the opening sentence. Omit the misconfiguration reason.
      - id: open-require-editor
        kind: fact
        fact: f:8anql1
        use: |
          Only the last sentence, the `requireEditor` route for every editor-capability role.
      - id: open-warning
        kind: fact
        fact: f:8ciz2s
        use: |
          Only the `config.access_unmapped` warning, its `unmapped` list, and the href key that
          never counts. Omit the shape checks.
      - id: open-allowlist-link
        kind: link
        target: security-model.md#allowlist-semantics-from-an-exhaustive-map
      - id: open-handoff
        kind: handoff
        text: |
          A site that wants named roles alone on every engine screen closes the gap the warning
          names.
  - id: make-the-map-exhaustive
    heading: Make the map exhaustive
    why: |
      It is the remedy for the engine-screen half of [[decide-what-the-map-leaves-open]], so it sits
      under it at level 3, and its warning is what [[verify-each-role-s-reach]] reads.
    level: 3
    anchor: make-the-map-exhaustive
    opens: |
      A map is exhaustive when it keys every concept and fixed screen, and
      `config.access_unmapped` then stops firing.
    items:
      - id: s-exhaustive
        kind: step
        text: |
          In the adapter module's `access` map, add a key for each target the warning's
          `unmapped` list names, listing the roles that reach it. The running example leaves the
          warning in place and skips this step.
        requires:
          - map-declared
        produces:
          - map-exhaustive
        optional: true
      - id: exh-exceptions
        kind: fact
        fact: f:cvv6to
        use: |
          Only that an exhaustive map covers every engine write action, in one sentence after the
          step: the tidy and personal-dictionary actions gate against the entry's concept like any
          entry action, and the site-wide publish filters each entry by its concept. Omit the rest,
          which the limits link carries.
      - id: exh-limits-link
        kind: link
        target: security-model.md#limits-of-access-map-coverage
      - id: exh-handoff
        kind: handoff
        text: |
          A route key reaches beyond the route it names.
  - id: key-nested-and-parameterized-routes
    heading: Key nested and parameterized routes
    why: |
      Whether a target counts as unnamed depends on how a key matches a route id, so the matching
      rule follows the rule for unnamed targets.
    opens: |
      A route key governs its path and every path beneath it, matched by the deepest
      whole-segment prefix the map holds.
    items:
      - id: nest-prefix
        kind: fact
        fact: f:uhoyun
        use: |
          Only the matching rule, with the fact's paths. Omit the nav half, which
          [[sidebar-entries]] carries.
      - id: nest-route-id
        kind: fact
        fact: f:8anql1
        use: |
          Only the default target's normalization, which drops route groups but keeps a
          parameterized id verbatim, and, as the trap in the same paragraph, a worked example: with
          `/admin/money` and the deeper `/admin/money/refunds` in the map, a route under
          `/admin/money` whose next segment is a dynamic or rest parameter, such as `[id]`, resolves
          to no rule and refuses every session until it declares `target`.
      - id: nest-shadow
        kind: fact
        fact: f:lmtfkt
        use: |
          Only that a dynamic segment under a key with a deeper sibling key resolves to no rule,
          backing the worked example.
      - id: nest-section-target
        kind: fact
        fact: f:3s23un
        use: |
          Only when a section action's `target` is required, and that a declared one is used
          verbatim, as a separate rule the sentence marks with "Separately".
      - id: s-nest-load-target
        kind: step
        text: |
          If the route has one of these parameters or serves several sections, in its
          `+page.server.ts`, pass the governing key to `requireAccess` as its second argument.
        requires:
          - load-gated
        produces:
          - load-target-declared
        optional: true
      - id: s-nest-action-target
        kind: step
        text: |
          If you passed a key to `requireAccess`, in the same file, set `target` to that key in
          each section action's options.
        requires:
          - load-target-declared
          - actions-gated
        produces:
          - action-target-declared
        optional: true
      - id: nest-handoff
        kind: handoff
        text: |
          The sidebar applies the same matching to its entries.
  - id: sidebar-entries
    heading: Sidebar entries
    why: |
      A site entry is gated only when its href matches a key, and its trap needs both the matching
      rule and the route refusal, so it follows both.
    opens: |
      The sidebar reads the adapter's map through the same check the routes use, so a keyed entry
      shows to the roles its key admits and to an owner.
    items:
      - id: nav-gating
        kind: fact
        fact: f:altcjp
        use: |
          Only the two gating rules, backing the opening sentence and the two after it: an engine
          screen's entry follows the map directly, and a site entry in the adapter's `navLayout` is
          gated only when a key matches its href.
      - id: nav-example
        kind: fact
        fact: f:tycp7k
        use: |
          Only the scaffold's `navLayout` and the example site's Signups site entry, which the
          example's key gates.
      - id: nav-unmatched-trap
        kind: fact
        fact: f:uhoyun
        use: |
          Only the unmatched-href half, as the trap. Omit the prefix matching, which
          [[key-nested-and-parameterized-routes]] carries.
      - id: nav-handoff
        kind: handoff
        text: |
          The deployed site still runs without these edits.
  - id: deploy-the-changes
    heading: Deploy the changes
    why: |
      It follows the last file edit, because the roster and every per-role check run on the deployed
      site, and the roles migration must reach the auth database before a custom role can be
      written.
    opens: |
      The roster and the per-role checks run on the deployed site.
    items:
      - id: dep-migration-why
        kind: fact
        fact: f:rn62i1
        use: |
          Only when `0001_roles.sql` is needed and where a site gets it: the scaffold ships it, and
          a site scaffolded before it shipped copies it from the package. Close the paragraph on one
          pointer sentence: applying the file rebuilds the `editor` table, as [[before-you-begin]]
          notes, which carries the column trap. Omit the automated-apply clause, since no redeploy
          path this page names applies a migration (`f:jtl15v`), and omit `0003_preview.sql`.
      - id: dep-scaffold-set
        kind: fact
        fact: f:gepykz
        use: |
          Only `0001_roles.sql` in a scaffolded site's `migrations/`. Omit the rest of the set and
          the audit migration.
      - id: dep-first-deploy
        kind: fact
        fact: f:m4y3m4
        use: |
          Only that the setup command's "Deploy to workers.dev" step applies the auth database's
          migrations, so it applies a scaffolded site's `0001_roles.sql` when it runs the site's
          first deploy. Omit the `PUBLIC_ORIGIN` write and the second deploy.
      - id: dep-hand-built
        kind: fact
        fact: f:hft8s8
        use: |
          Only the two migrations every site applies, `0000_auth.sql` and
          `0004_login_nonce.sql`, behind the clause that a hand-built site never receives
          `0001_roles.sql` and copies it from the package. Omit the nonce column.
      - id: dep-by-hand
        kind: fact
        fact: f:jtl15v
        use: |
          Only the by-hand apply and why neither redeploy path applies a migration. Omit the
          engine-upgrade framing.
      - id: s-copy-migration
        kind: step
        text: |
          If the site's `migrations/` directory lacks `0001_roles.sql`, in the project directory,
          copy the file from the package's `migrations/` directory, with the `cp` command from
          `node_modules/@glw907/cairn-cms/migrations/` as its block.
        requires:
          - deployed-site
        produces:
          - roles-migration-present
        optional: true
      - id: dep-copy-apply
        kind: fact
        fact: f:xxtooz
        use: |
          Only the copy and the `--remote` apply, backing the copy and apply steps.
      - id: s-apply-migration
        kind: step
        text: |
          In the project directory, apply pending migrations to the auth database with
          `npx wrangler d1 migrations apply <auth-database-name> --remote`.
        requires:
          - deployed-site
          - editor-columns-carried
        produces:
          - roles-migrated
      - id: dep-paths
        kind: sentence
        mode: claim
        text: |
          A lead-in that the redeploy takes one of two paths, matching how the site deploys: a
          push to a repository connected to Workers Builds, or a build and deploy with Wrangler.
          Then three short sentences: both paths run the same two commands, a build and a deploy;
          neither path applies a migration; that is why the apply step comes first.
        facts:
          - f:qca0t0
          - f:jtl15v
      - id: dep-builds
        kind: fact
        fact: f:qca0t0
        use: |
          Only the Workers Builds path: the setup command's chapter 3 connects it in the same setup
          run, the connected repository deploys on every push to its default branch, and
          `--connect` re-enters that chapter on a site from its live step onward.
      - id: s-deploy-push
        kind: step
        text: |
          If the repository is connected to Workers Builds, in the project directory, push the
          changes to its default branch. The push deploys them, and a site deployed this way skips
          the next two steps.
        requires:
          - roles-migrated
          - map-declared
          - actions-gated
        produces:
          - changes-deployed
      - id: dep-wrangler
        kind: fact
        fact: f:9ug9mo
        use: |
          Only the Wrangler path's deploy command. Omit the workers.dev address and `wrangler
          login`.
      - id: s-build
        kind: step
        text: |
          Otherwise, in the project directory, build the site with `npm run build`.
        requires:
          - roles-migrated
          - map-declared
          - actions-gated
        produces:
          - site-built
      - id: s-wrangler-deploy
        kind: step
        text: |
          In the same directory, deploy the build with `npx wrangler deploy`.
        requires:
          - site-built
        produces:
          - changes-deployed
      - id: dep-change-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#deploy-a-change
      - id: dep-handoff
        kind: handoff
        text: |
          The deployed roster now offers the new role.
  - id: assign-the-roles
    heading: Assign the roles
    why: |
      A declared role reaches no one until an owner assigns it on the deployed roster, so assignment
      follows the deploy, and the role select it introduces is what the checks use to move the test
      editor between roles.
    opens: |
      A declared role reaches no one until an owner assigns it on the roster.
    items:
      - id: asg-owner
        kind: fact
        fact: f:pwb0wr
        use: |
          Only the owner's roster management, backing the opening sentence and, as the sentence
          after it, that only an owner can add or remove editors and change their roles.
      - id: asg-form
        kind: fact
        fact: f:udg87q
        use: |
          Only the Add editor form and its Role select, as step 1's location.
      - id: asg-label
        kind: fact
        fact: f:2dgbff
        use: |
          Only the option label for a role whose name differs from its capability, as the sentence
          before the steps, where `webmaster` reads `webmaster (editor)`, and as step 1's option.
      - id: s-add-editor
        kind: step
        text: |
          In `/admin/editors` on the deployed site, as the owner, add the test editor through the
          **Add editor** form, choosing **webmaster (editor)** as its **Role**.
        requires:
          - changes-deployed
          - test-editor-address
        produces:
          - test-editor-added
        canFail: true
      - id: x-add-unmigrated
        kind: failure
        from: s-add-editor
        symptom: |
          The add fails, and the site logs `admin.action.failed` with the `conditionId`
          `auth.store-roles-unmigrated`.
        cause: |
          The auth database still lacks `0001_roles.sql`, so the `editor` table accepts only
          `owner` and `editor`. The reader applies the migration as [[deploy-the-changes]] does,
          then adds the editor again.
        handledBy: s-apply-migration
        facts:
          - f:7ele62
          - f:xffr6i
      - id: asg-unmigrated
        kind: fact
        fact: f:xffr6i
        use: |
          Only the failed write and its `auth.store-roles-unmigrated` condition, backing the
          failure's cause. Omit the statement list and the CHECK text.
      - id: asg-failed-log
        kind: fact
        fact: f:7ele62
        use: |
          Only the `admin.action.failed` record and its `conditionId`, which names
          `auth.store-roles-unmigrated` for an editor add on an unmigrated auth database, backing
          the failure's symptom. Omit the failure strip and the record's other fields.
      - id: s-sign-in-test
        kind: step
        text: |
          In a second browser, sign in as the test editor.
        requires:
          - test-editor-added
        produces:
          - test-editor-signed-in
      - id: asg-change
        kind: fact
        fact: f:dfxxwb
        use: |
          Only the row's role select and its separate **Change** button, for an editor already on
          the roster. Omit the default-pair toggle and the accessible label.
      - id: asg-next-request
        kind: fact
        fact: f:uotol3
        use: |
          Only the next-request rule, in the paragraph after the **Change** button.
      - id: asg-handoff
        kind: handoff
        text: |
          The next-request sentence carries the handoff in its own close: the checks that follow
          move one test editor between roles.
  - id: verify-each-role-s-reach
    heading: Verify each role's reach
    why: |
      The task guide closes its steps on proof: each check reads the deployed map through the role
      the test editor holds.
    opens: |
      On the deployed site, the `config.access_unmapped` warning names the targets the map leaves
      open. A role the map excludes gets the admin's error page.
    items:
      - id: ver-own-route
        kind: sentence
        mode: claim
        text: |
          The checks name the example site's signups screen at `/admin/signups`. On your site,
          the route you gated stands in for `/admin/signups`, and its actions stand in for the
          signups add and delete. A route with no owner-only action skips the delete check.
        facts:
          - f:onqm6k
          - f:3z1uxv
      - id: ver-lead
        kind: sentence
        mode: verbatim
        text: |
          To verify the map, run these checks in order:
      - id: v-warning
        kind: step
        text: |
          In Workers Logs, query `config.access_unmapped` across the cold start that followed the
          deploy. The record's `unmapped` list names every concept and fixed screen except `media`.
        requires:
          - changes-deployed
        produces:
          - warning-read
        canFail: true
      - id: ver-cold-start
        kind: fact
        fact: f:mou1li
        use: |
          Only the once-per-isolate timing, as the check's caveat: a query scoped to a live request
          window can miss the event.
      - id: ver-unmapped
        kind: fact
        fact: f:8ciz2s
        use: |
          Only the `unmapped` list, backing the check's expected list.
      - id: x-no-warning
        kind: failure
        from: v-warning
        symptom: |
          The query returns no `config.access_unmapped` record.
        cause: |
          The record fires only when the admin routes are built at server start, once per isolate,
          so a window that misses the
          cold start misses it.
        handledBy: r-widen-window
      - id: r-widen-window
        kind: reason
        text: |
          Widen the query window to cover the cold start after the deploy, since no request after
          server start logs the warning again.
      - id: v-set-editor
        kind: step
        text: |
          In `/admin/editors`, in the test editor's row, choose **editor** in the role select.
        requires:
          - test-editor-signed-in
        produces:
          - role-editor-chosen
      - id: v-change-editor
        kind: step
        text: |
          In the same row, select **Change**.
        requires:
          - role-editor-chosen
        produces:
          - role-editor
      - id: v-sidebar-editor
        kind: step
        text: |
          In the test editor's browser, check the sidebar. The media library entry is gone, and so
          is a Signups entry where the site's `navLayout` carries one, as the example site's does.
        requires:
          - role-editor
        produces:
          - sidebar-checked
      - id: v-posts
        kind: step
        text: |
          In the same browser, open **Posts**. The list opens, since the map names no `posts` key
          and an unnamed engine screen stays open to editor capability.
        requires:
          - role-editor
        produces:
          - posts-checked
      - id: ver-posts
        kind: fact
        fact: f:5eum60
        use: |
          Only the scaffold's posts concept, backing the Posts check.
      - id: v-signups-refused
        kind: step
        text: |
          In the same browser, open `/admin/signups`. The admin's error page shows the heading
          `You don't have access to this page.`, and the site logs `auth.access.refused` with the
          role and the target.
        requires:
          - role-editor
        produces:
          - signups-refusal-seen
        canFail: true
      - id: ver-error-page
        kind: fact
        fact: f:ty4ehh
        use: |
          Only the admin error page and its 403 wording, backing the refusal checks.
      - id: v-media-refused
        kind: step
        text: |
          In the same browser, open `/admin/media`. The same error page shows, and the site logs
          `auth.access.refused` with the target `media`.
        requires:
          - role-editor
        produces:
          - media-refusal-seen
        canFail: true
      - id: ver-media
        kind: fact
        fact: f:joo5f2
        use: |
          Only the media library's path and its refusal, backing the media check.
      - id: v-set-webmaster
        kind: step
        text: |
          In `/admin/editors`, in the test editor's row, choose **webmaster (editor)** in the role
          select.
        requires:
          - role-editor
        produces:
          - role-webmaster-chosen
      - id: v-change-webmaster
        kind: step
        text: |
          In the same row, select **Change**.
        requires:
          - role-webmaster-chosen
        produces:
          - role-webmaster
      - id: v-reload
        kind: step
        text: |
          In the test editor's browser, reload the admin. The media library entry is back in the
          sidebar, and so is the Signups entry where the site's `navLayout` carries one; the media
          library and `/admin/signups` both open, with no new sign-in.
        requires:
          - role-webmaster
        produces:
          - webmaster-reach-seen
        canFail: true
      - id: v-add-signup
        kind: step
        text: |
          On the signups screen, enter a name and an email, then select **Add**. The status line
          reads `Signup added.`, and the table lists the new row.
        requires:
          - role-webmaster
        produces:
          - signup-added
        canFail: true
      - id: x-add-refused
        kind: failure
        from: v-add-signup
        symptom: |
          The add is refused for the `webmaster` session, and the site logs `auth.access.refused`.
        cause: |
          The add action carries `ownerOnly: true`, or it checks a different target than the load,
          because one of them declares a `target` the other does not.
        handledBy: s-nest-action-target
        facts:
          - f:3s23un
          - f:8anql1
          - f:xbjxit
          - f:smbsa6
      - id: ver-add
        kind: fact
        fact: f:7ji7x0
        use: |
          Only the add form, its status line, and the new row, backing the add check.
      - id: v-remove-delete
        kind: step
        text: |
          On the signups screen, select **Delete** on the signup you added.
        requires:
          - signup-added
        produces:
          - delete-confirm-open
      - id: v-remove-refused
        kind: step
        text: |
          In the confirmation dialog, select **Delete**. The dialog stays open, the status line
          reads `You do not have access to this action.`, and the site logs `auth.access.refused`.
        requires:
          - delete-confirm-open
        produces:
          - owner-gate-seen
        canFail: true
      - id: ver-delete-flow
        kind: fact
        fact: f:b0kf86
        use: |
          Only the two-click delete flow, backing the remove check.
      - id: ver-refused-ui
        kind: fact
        fact: f:thnbyp
        use: |
          Only the refused remove's dialog and status line, backing the remove check's result.
      - id: ver-refused-log
        kind: fact
        fact: f:xbjxit
        use: |
          Only the `fail(403)` and the log event, backing the remove check's log. Omit
          `createAdminAction` and `deniedMessage`.
      - id: ver-owner-only
        kind: sentence
        mode: claim
        text: |
          The remove is refused because `remove` carries `ownerOnly: true`, while the map admits
          `webmaster` to the screen.
        facts:
          - f:smbsa6
          - f:onqm6k
      - id: ver-handoff
        kind: handoff
        text: |
          A result that differs from these checks traces through the failure path that follows.
  - id: resolve-a-refusal
    heading: Resolve a refusal
    why: |
      The page's failure path: it traces a result that differs from [[verify-each-role-s-reach]] to
      its cause, so it follows the checks.
    opens: |
      Each check pairs a symptom from the verification with the log record or the code that
      explains it.
    items:
      - id: res-lead
        kind: sentence
        mode: verbatim
        text: |
          To find the cause, run these checks in order:
      - id: x-refuse-all
        kind: failure
        from: v-reload
        symptom: |
          A route refuses every session, owner included, and the `auth.access.refused` record's
          `reason` reads `no_rule`.
        cause: |
          The route calls `requireAccess` and the map has no key for its target.
        handledBy: s-map
        facts:
          - f:8anql1
          - f:zo034s
      - id: x-shadowed
        kind: failure
        from: v-reload
        symptom: |
          A parameterized route refuses every session, and the `auth.access.refused` record's
          `reason` reads `shadowed`.
        cause: |
          A deeper map key hides the route's rule, and the route declares no `target`.
        handledBy: s-nest-load-target
        facts:
          - f:8anql1
      - id: x-role-not-listed
        kind: failure
        from: v-reload
        symptom: |
          The `webmaster` session is refused on your route or on the media library, and the
          `auth.access.refused` record names `webmaster`; a route's record reads `reason` `role`.
        cause: |
          The map holds a key for the target, but the key does not list `webmaster`, as the
          example site's starting owner-only `/admin/signups` key does.
        handledBy: s-map
        facts:
          - f:8anql1
          - f:joo5f2
          - f:0qb73i
          - f:3z1uxv
      - id: res-refuse-all
        kind: fact
        fact: f:8anql1
        use: |
          Only the record's target and its `no_rule`, `shadowed`, and `role` reasons, backing the
          three checks before.
      - id: res-nested-link
        kind: link
        target: '#key-nested-and-parameterized-routes'
      - id: x-role-unknown
        kind: failure
        from: v-reload
        symptom: |
          A `webmaster` editor sees only the welcome view at `/admin` and is refused on every other
          admin screen, and the logs show `auth.role.unknown` for that role.
        cause: |
          The role is absent from the adapter's vocabulary, so it resolves to `none`.
        handledBy: s-roles-declare
        facts:
          - f:zjglk8
          - f:4bazhe
          - f:kqcyv1
      - id: res-role-unknown
        kind: fact
        fact: f:4bazhe
        use: |
          Only the `auth.role.unknown` log and that no access-map rule can name an undeclared role,
          backing the unknown-role check. Omit the resolution to `none`, which `f:zjglk8` carries and
          [[declare-the-roles]] places.
      - id: res-unmigrated
        kind: sentence
        mode: claim
        text: |
          If adding a `webmaster` editor fails on `/admin/editors`, apply `0001_roles.sql` to the
          remote auth database, as [[deploy-the-changes]] does.
        facts:
          - f:xffr6i
          - f:rn62i1
      - id: res-deploy-link
        kind: link
        target: '#deploy-the-changes'
      - id: x-signups-open
        kind: failure
        from: v-signups-refused
        symptom: |
          The signups screen opens for an `editor` session, and the route's `load` calls
          `requireEditor`.
        cause: |
          `requireEditor` never consults the map; the reader replaces the call with
          `requireAccess`, as [[enforce-the-map-on-your-routes]] covers.
        handledBy: s-load-gate
      - id: res-still-open
        kind: fact
        fact: f:8anql1
        use: |
          Only the `requireEditor` clause, backing the `requireEditor` check.
      - id: x-stale-worker
        kind: failure
        from: v-media-refused
        symptom: |
          The signups screen or the media library still opens for an `editor` session.
        cause: |
          The deployed Worker predates your edits; the reader redeploys as [[deploy-the-changes]]
          does.
        handledBy: res-redeploy-link
        facts:
          - f:joo5f2
          - f:8anql1
      - id: x-remove-succeeds
        kind: failure
        from: v-remove-refused
        symptom: |
          The delete succeeds for the `webmaster` session.
        cause: |
          The route's remove action carries no `ownerOnly: true` in its wrapper's options, or
          another action carries it instead.
        handledBy: s-owner-only
        facts:
          - f:smbsa6
          - f:3s23un
      - id: res-enforce-link
        kind: link
        target: '#enforce-the-map-on-your-routes'
      - id: res-redeploy-link
        kind: link
        target: '#deploy-the-changes'
      - id: res-debug-link
        kind: link
        target: debug-your-site.md
  - id: see-also
    heading: See also
    why: |
      The anatomy closes a task guide with the pages and references behind its steps.
    opens: |
      The following pages cover the reasoning and the tasks around the access map.
    items:
      - id: see-security
        kind: link
        target: security-model.md
      - id: see-custom-screen
        kind: link
        target: add-a-custom-admin-screen.md
      - id: see-sidebar
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: see-second-group
        kind: link
        target: add-a-second-sign-in-group.md
      - id: see-upgrade
