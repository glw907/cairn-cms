  - id: settings-outside-the-admin
    heading: Settings outside the admin
    why: |
      The rules that span several files start once every file they span is introduced, and the
      hand-edited settings lead into the crawl rules: the archive route the page size governs is the
      one route the crawl exempts.
    opens: |
      The archive's page size and the footer menu are set in files, outside the admin.
    items:
      - id: settings-archive
        kind: fact
        fact: f:38pjqy
        use: |
          Only `ARCHIVE_PAGE_SIZE` as the one page-size setting for the home page and the archive,
          its value in the scaffold, and when `/archive/2` first exists.
      - id: settings-footer
        kind: fact
        fact: f:2s8u70
        use: |
          Only that `/admin/nav` edits only the primary menu, and that the footer menu is a flat
          menu the developer edits by hand in `site.config.yaml`.
  - id: crawl-rules
    heading: Crawl rules
    why: |
      The build-time crawl follows the setting whose route it exempts and precedes the request-time
      404.
    opens: |
      The prerender crawl fails the build on an unseen route or an HTTP error, and the scaffold
      keeps its build passing with one route exemption and one link attribute.
    items:
      - id: crawl-unseen
        kind: fact
        fact: f:2zl3qz
        use: |
          Only the one route `handleUnseenRoutes` exempts, why, and that any other unseen
          prerenderable route still throws.
      - id: crawl-admin-links
        kind: fact
        fact: f:34rsss
        use: |
          Only the `rel="external"` rule for an `/admin` link in prerendered public markup, why the
          crawl needs it, and the shared `isAdminHref` predicate the header and footer apply it
          through.
      - id: crawl-new-link
        kind: sentence
        mode: claim
        text: |
          A new `/admin` link in public markup needs the same attribute.
        facts:
          - f:34rsss
      - id: crawl-kit-link
        kind: link
        target: https://svelte.dev/docs/kit/@sveltejs-kit-vite
  - id: themed-404-page
    heading: Themed 404 page
    why: |
      The request-time 404 follows the build-time crawl, and it rests on two files from different
      sections, so it is a rule that spans files.
    opens: |
      A scaffolded site serves a themed 404 page through two pieces that need each other, the root
      `src/routes/+error.svelte` and `assets.not_found_handling` set to `"none"` in
      `wrangler.jsonc`.
    items:
      - id: notfound-error-page
        kind: fact
        fact: f:2qnqkm
        use: |
          Only the error page's half: why the `(site)` group's layout never runs for an unmatched
          path, and that the root `+error.svelte` rebuilds the site chrome itself.
      - id: notfound-layout-data
        kind: fact
        fact: f:ofex2m
        use: |
          Only that the error page reads the menus and the site name through `page.data` from the
          root `+layout.server.ts`.
      - id: notfound-worker
        kind: fact
        fact: f:2qnqkm
        use: |
          Only the Worker's half: `"none"` passes an unmatched request to the Worker, where
          `"404-page"` would serve an unthemed static file from the edge.
      - id: notfound-cf-link
        kind: link
        target: https://developers.cloudflare.com/workers/static-assets/routing/worker-script/
  - id: setup-state-outside-the-tree
    heading: Setup state outside the tree
    why: |
      What lives outside the repository closes the body, ending on the build-token risk, the one
      item there that can break a live site.
    opens: |
      The setup command kept its record of the run on the machine that ran it, and when its
      separate `--connect` invocation connected Workers Builds, it registered the Cloudflare API
      token pasted during setup as the build token the site's deploys use.
    items:
      - id: state-record
        kind: fact
        fact: f:3m0oxs
        use: |
          Only the record's path and file modes, that it never sits under the project directory,
          that it includes the pasted Cloudflare token, and how a `--yes` run takes the token.
      - id: state-no-copy
        kind: sentence
        mode: claim
        text: |
          A developer who took over the site from someone else has no copy of that record, since it
          sits in the home directory of whoever ran the command.
        facts:
          - f:3m0oxs
      - id: state-resume
        kind: fact
        fact: f:3my5c1
        use: |
          Only the four flags that override a saved answer on a resumed run.
      - id: state-brand-color
        kind: fact
        fact: f:498l97
        use: |
          Only the three shapes `--brand-color` accepts and that any other fails. State no range for
          the number.
      - id: state-build-token
        kind: fact
        fact: f:3bbeia
        use: |
          Only the build token's name and its reuse, that revoking or rolling it breaks automatic
          deploys with no prior warning, and how that shows: the next commit still triggers a
          build, and the build fails. This is the body's last paragraph.
  - id: related-resources
    heading: Related resources
    why: |
      The concept anatomy closes the page with related resources.
    opens: |
      The following guides cover changing or rebuilding parts of the tree.
    items:
      - id: rel-howto-addcairn
