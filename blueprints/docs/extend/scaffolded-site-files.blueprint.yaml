version: 1
argument: |
  A scaffolded site is a complete SvelteKit project that the site owns outright, with the engine
  as one dependency, and only a short, marked set of its files carries a contract that the engine
  or a build or CI check reads. A new owner who knows which files those are can change everything
  else freely and change those few with the contract kept. The page proves the claim file by file:
  it states the ownership first, draws the tree with the contract files marked, gives each file or
  directory a short entry saying what it does and what reads it, then states the rules that span
  several files and the state the setup command left outside the repository.
introduction:
  covers: |
    A site that `create-cairn-site` scaffolded arrives as a complete SvelteKit project in its own
    GitHub repository, already deployed as a Cloudflare Worker, in which every file belongs to the
    site and the engine, `@glw907/cairn-cms`, is one dependency. A new owner needs three answers
    for each file and directory: what it does, whether it is theirs to change freely, and whether
    the engine or a build or CI check reads it, because nothing in the tree says which is which.
    The introduction names two readers: a developer who took over a scaffolded site from someone
    else, and a developer who ran the setup command and wants to know what it wrote and why. It
    lists the subjects in body order: what the scaffold is and who owns it; the file tree, with the
    files the engine or a check reads marked; the root files, the build and deploy configuration
    with the Worker's one D1 database, and the database migrations, with why a database the site
    adds takes its own directory; the routes and the server hook, including what the local dev
    server runs; the theme, chassis, content, and style sheets; the settings a new owner edits by
    hand; the build's crawl rules and the themed 404 page; and the state the setup command left
    outside the repository.
  priorKnowledge: |
    Working knowledge of SvelteKit's project structure (routes, layouts, hooks, and prerendering),
    Vite configuration, and Wrangler configuration for a Worker's bindings and D1 migrations. A
    Svelte-fluent reader needs nothing more, and the page explains no SvelteKit or Cloudflare basics.
  notCovered: |
    A bulleted list under a complete lead-in that never names the page itself, each item subject
    first and its page last: building the same tree by hand (`docs/extend/add-cairn-to-a-sveltekit-app.md`);
    changing the theme and the chassis (`docs/extend/theme-your-public-site.md`); building a custom
    admin screen (`docs/extend/add-a-custom-admin-screen.md`); each delivery route's wiring
    (`docs/extend/build-the-public-routes.md`); media configuration behind the `MEDIA_BUCKET`
    binding (`docs/extend/configure-media.md`); `cairn-audit.config.json` in depth
    (`docs/extend/run-cairn-audit-on-your-site.md`); and the guidance files under `.claude/` with
    the `cairn-guidance` command (`docs/reference/guidance.md`).
framing:
  readers: |
    | Reader | Arrives from | Came for | Knows | Lacks |
    | --- | --- | --- | --- | --- |
    | A. The inheritor (the job's reader): a Svelte-fluent developer who took over a site someone else scaffolded | `docs/extend/architecture.md` paragraph 3 ("maps each file the command writes") and its related resources; the extend index's Start group once the page is listed; a search for a file the tree holds (`cairn-audit.config.json`, `.dev.vars.example`, `check.yml`) | What each file does, whether it may change it, and what the engine or a gate depends on | SvelteKit, Vite, enough Wrangler to read `wrangler.jsonc`; that the site is live and editors may already publish to it (`f:kldwss`, `f:cjonmm`) | The setup run's history: the saved record sits in the home directory of whoever ran the command (`f:3m0oxs`), and a Workers Builds connection deploys on a token that person pasted (`f:3bbeia`, `f:qca0t0`); which files carry a contract; that no engine release rewrites the tree (`f:rxj43c`, `f:jtl15v`); what `.claude/` is for (`f:qlgggh`; the guidance detail is subordinated to the guidance reference) |
    | B. The runner: a developer who ran `create-cairn-site` and now opens the tree to change it | `docs/extend/add-cairn-to-a-sveltekit-app.md` paragraph 2 ("explains what it writes"); the extend index; a search after the run. The command's hand-over text names `.github/workflows/check.yml`, `.claude/`, and `npx cairn-guidance check` but links no page (`packages/create-cairn-site/src/scaffold.mjs:230-264`, `f:kouawx`), so the output itself is not an arrival path | Why each file the command wrote is there, starting with the three the hand-over named | Their own answers to the setup prompts; they hold the state file | The file map; which files carry a contract; why the CI's guidance step never fails a build (`f:jd54ph`; the check's own exit rules are subordinated to the guidance reference) |
    | C. The chooser: a developer deciding between the setup command and the by-hand build | `docs/extend/add-cairn-to-a-sveltekit-app.md` paragraph 2, which names this page as the account of what the command writes | A look at what the command would give them before choosing | SvelteKit; little of cairn | A scaffold to look at; the page shows it through the file tree and the ownership statement |
    | D. The architecture reader: a developer mapping the engine's import points and seams onto real files | `docs/extend/architecture.md`, the crossLink "A scaffolded reader maps the architecture onto their own files" | Where the adapter, the server hook, the admin mount, and the bindings sit in the tree | The model: one adapter, the seams, the data tiers (`f:j0ut9n`) | File locations; the body's tree and per-file entries answer it |
    | E. The theme reader: a developer working on the public design | `docs/extend/theme-your-public-site.md` lines 36 and 510 ("maps every file the setup command writes") | The files around the theme, and which ones outside it they may touch | Theming: tokens, cascade layers, Waymark on the chassis (`f:s23sk0`) | The rest of the tree; theming depth stays on their page, which the out-of-scope list names |
    | F. Wrong place, routed: a developer adding cairn to an app they already run, or building without Waymark | A search, or the Start group, where this page sits third | Steps to wire cairn in | Their own app | That the setup command writes only into a missing or empty directory (`f:9slxqf`), and that the npm package carries no template (`f:rxj43c`); they belong on `docs/extend/add-cairn-to-a-sveltekit-app.md`, which the out-of-scope list's first item names |
    | G. Wrong place, unroutable for now: a technical non-developer who ran or inherited the setup command's site | A search, since the admin arm (`docs/admin/`) holds no page yet; the register's admin track claims this reader ("inheriting a running site someone else created") | How to run the site without code | The setup command's prompts | A page in their track. The intro's prior-knowledge sentence tells them the page expects SvelteKit; no admin page exists to route them to |
    | H. Minor, not addressed by the intro: an engine contributor reading the showcase | `examples/showcase/README.md` line 23; old links through the redirect from `docs/extend/what-the-scaffold-wrote.md` | What the scaffold carries out of the showcase | The showcase and its exclude list | Nothing the intro owes them; the tree and [[the-scaffold]] answer it |

    A coding agent working on a scaffolded site is not a reader: the guidance fragment sends agents to
    the reference index only (`templates/waymark/.claude/cairn/CLAUDE.md:79-81`), and the register's
    scripter-or-agent profile reads the reference arm.
  background: |
    - **The general model.** A scaffolded site is an ordinary SvelteKit project in its own GitHub
      repository, built into one Cloudflare Worker, with the engine installed as an ordinary npm
      dependency (`f:j0ut9n`, `f:o47i0q`). The same run that wrote the tree created the site's GitHub
      App, its repository, and its Cloudflare bindings, and deployed it (`f:kldwss`), so a new owner
      meets a live site, not a starter to deploy.
    - **What the tree is, and why it exists.** The setup command bakes Waymark, cairn's reference
      reading theme, on a chassis of design-neutral plumbing, from the same tree the engine tests
      itself against, with test-only material pruned (`f:n2skkz`, `f:rxj43c`). Waymark is the only
      template shipped (`f:u705t5`). The scaffold exists so a site starts from the engine's own
      reference wiring, already deployed, rather than from a by-hand build (`f:kldwss`, `f:9slxqf`).
    - **Why the site owns every file.** The npm package's `files` list carries neither Waymark nor the
      chassis (`f:rxj43c`), so an engine upgrade moves the `@glw907/cairn-cms` range and leaves the
      tree as it is; each change a release needs in the site's code, a new D1 migration included, is
      the site's to make, named by the changelog's `Consumers must:` lines (`f:jtl15v`, `f:h0xykj`).
      The agent guidance under `.claude/` is refreshed only when the site runs
      `npx cairn-guidance install`, guidance detail the page subordinates to the guidance
      reference. Caution for the drafter: the package does ship the
      engine's `migrations` and the guidance sources (`package.json:204-216`), so no sentence may say
      the package carries none of the tree's files; say what `f:rxj43c` says.
    - **Why ownership still has contracts.** Three kinds of reader depend on particular files. The
      engine reads the adapter in `src/theme/cairn.config.ts` (`f:u4cfvv`), the server hook that
      installs the guard (`f:f21bcz`), and the bindings in `wrangler.jsonc` (`f:n7t4bn`). The admin
      commits editors' work into the tree: each publish lands content on the default branch
      (`f:cjonmm`, `f:gj96px`), patches the content manifest, and the media commits write the media
      registry (`f:vrue1g`); `/admin/nav` writes the primary menu in `src/theme/site.config.yaml`
      (`f:2s8u70`), and the nav, settings, and vocabulary saves commit that file (`f:0gihxq`,
      `f:shv6wv`). The CI workflow and the build fail on others: `check.yml` runs the checks
      (`f:guiavc`, `f:mrv24k`), and the prerender handlers in `vite.config.ts` throw on an unseen route
      or an HTTP error (`f:2zl3qz`, `f:34rsss`). These files share directories with files only the site
      reads, such as the adapter beside the theme's style sheets in `src/theme/` (`f:qnf469`).
    - **Where SvelteKit fits.** The tree is a SvelteKit project with its config inline in
      `vite.config.ts` and no `svelte.config.js` (`f:n4rg1z`); the admin is a catch-all route pair at
      `/admin` (`f:t2t5lx`), a server hook guards it (`f:f21bcz`), and the public site is a prerendered
      route group (`f:qtm9y2`, `f:2qnqkm`).
    - **Where Cloudflare fits.** `wrangler.jsonc` names the Worker the build produces and binds one D1
      database, the auth store `AUTH_DB`, with no second database, plus the Email Sending binding and
      an R2 bucket (`f:o47i0q`, `f:n7t4bn`, `f:l3cxgc`), with Workers Logs on (`f:prb2os`);
      `migrations/` is that database's one migrations directory (`f:gepykz`), and a database the
      site adds would take its own (`f:nv0ok0`, general rule only). The setup run deploys the site
      once (`f:kldwss`); Workers Builds deploys on every push to the default branch only once the
      setup command's separate `--connect` invocation has connected it (`f:qca0t0`), on the build
      token that chapter registered (`f:3bbeia`). The intro hedges any deploy claim accordingly and
      never says every push deploys.
    - **Where GitHub fits.** The repository holds the code and the markdown; the site's GitHub App
      commits each editor's publish to its default branch (`f:cjonmm`); a GitHub Actions workflow runs
      install, `npm run check`, and `npm run check:cairn` on every push and pull request and never
      builds (`f:guiavc`).
    - **State outside the tree, and why it matters to a new owner.** The setup command keeps its record
      of the run in `~/.config/cairn/sites/<id>.json` on the machine that ran it (`f:3m0oxs`), which a
      resumed run reads (`f:3my5c1`) and `--sign-in` needs (`f:o8uoci`); an inheritor has no copy. A
      revoked build token breaks deploys with no warning (`f:3bbeia`). This is the inheritor's sharpest
      reason to read the page, and the intro names it.

    Nothing is left out on purpose: the page touches all three platforms, and the intro places each in
    one clause.
  placeInDocSet: |
    - **Group and neighbors.** The extend track's Start group, third after Architecture and Add cairn to
      a SvelteKit app. `docs/extend/README.md` lists only the first two today; the page joins its group
      when it lands.
    - **What links in, and why.** `docs/extend/architecture.md` (intro paragraph 3 and related
      resources) sends the inheritor here for the file map. `docs/extend/add-cairn-to-a-sveltekit-app.md`
      (intro paragraph 2) sends the runner and the chooser here for what the command writes.
      `docs/extend/theme-your-public-site.md` (intro list and related resources) sends the theme reader
      here for the file map behind the theme. `examples/showcase/README.md` and the
      redirect from `docs/extend/what-the-scaffold-wrote.md` bring a contributor or an old link. No
      committed page links an anchor here. No arm index outside extend exists yet (`docs/README.md`,
      `docs/admin/`, and `docs/editors/` hold no page).
    - **What links out.** The outline's crossLinks: theme-your-public-site, add-a-custom-admin-screen,
      add-cairn-to-a-sveltekit-app (and its sign-in email section), configure-media,
      run-cairn-audit-on-your-site, define-an-adapter-and-schema, build-the-public-routes, and
      upgrade-cairn. The intro carries six of them through the out-of-scope list and adds one link to
      Architecture.
    - **What siblings own, so the intro words the shared ideas fresh.**
      - Architecture owns the model (subpaths, seams, data tiers, stability tiers) and opens "cairn is
        an embedded content management system". Its paragraph 3 already says the setup command
        "creates the GitHub App, the repository, and the Cloudflare bindings and deploys the site in one
        run" and that an inheritor "needs to know which of those files rest on an engine contract".
        This intro does not open on "cairn is", does not repeat that four-item list as a sentence, and
        does not reuse "rest on an engine contract".
      - Add cairn to a SvelteKit app opens "cairn is a markdown CMS embedded in a SvelteKit site" and
        calls the setup command "the much easier route". This intro makes no route comparison beyond
        one clause for the chooser.
      - Theme your public site says the npm package ships neither Waymark nor the chassis, "so no
        engine version governs the site's chrome". This intro states ownership over the whole tree and
        in upgrade terms, never in terms of chrome or design.
  introPlan: |
    Three paragraphs, then the introduction's three bounds in their order. The intro opens on a statement about a
    scaffolded site from the reader's situation, never an imperative and never a sentence about the
    page. First mention is `create-cairn-site`, then "the setup command" (register, "Names").

    1. **The scaffolded site and where the platforms fit.** Open on the subject: a site that
       `create-cairn-site` scaffolded arrives as a complete SvelteKit project in its own GitHub
       repository, already deployed as a Cloudflare Worker, with the engine as one npm dependency
       (`f:kldwss`, `f:o47i0q`, `f:j0ut9n`). One sentence says what the tree is: Waymark, cairn's
       reference reading theme, on the chassis, baked from the same tree the engine tests itself
       against (`f:n2skkz`, `f:rxj43c`); the definition proper waits for [[the-scaffold]]. Then at most two
       sentences place the platforms: SvelteKit's routes mount the admin and the public site, a server
       hook guards `/admin`, and the config sits inline in `vite.config.ts` (`f:t2t5lx`, `f:f21bcz`,
       `f:n4rg1z`); `wrangler.jsonc` binds the Worker's one D1 database (the auth store), mail
       binding, and R2 bucket (`f:n7t4bn`); the repository holds the code and the markdown, the site's GitHub App commits
       each editor's publish into it, and a workflow checks every push and pull request (`f:cjonmm`,
       `f:gj96px`, `f:guiavc`).
    2. **Ownership and the contracts inside it (why the page matters).** Every file belongs to the
       site: the engine package carries neither Waymark nor the chassis, so an engine upgrade moves
       the dependency and leaves the tree as it is, and any edit a release needs is the site's to make
       (`f:rxj43c`, `f:jtl15v`). Owning a file does not leave it unread. The engine reads some (the
       adapter, the server hook, the bindings: `f:u4cfvv`, `f:f21bcz`, `f:n7t4bn`); the admin commits
       editors' work into others (the content, its manifests, the site config's primary menu:
       `f:cjonmm`, `f:vrue1g`, `f:2s8u70`); the CI workflow and the build's prerender checks can fail on
       a few more (`f:guiavc`, `f:mrv24k`, `f:2zl3qz`, `f:34rsss`). Those files share directories with
       files only the site reads, as the adapter shares `src/theme/` with the theme's style sheets
       (`f:qnf469`), so knowing which is which lets an owner change the rest freely and change the few
       with their contract kept. One idea per sentence; the three kinds of reader may take three
       sentences or one with a complete-sentence lead-in, never a reflexive triad for its own sake.
    3. **The readers and their reasons.** A developer who ran the setup command, or who took over a
       site from someone who did, reads on to learn what each file does and whether to change it. One
       who took over also lacks what the command left outside the repository: its saved record on the
       machine that ran it, and, when the setup command's separate `--connect` invocation connected
       Workers Builds, the build token whose
       revocation stops deploys without warning (`f:3m0oxs`, `f:3bbeia`, `f:qca0t0`). A reader who knows
       the engine's import points and seams from Architecture (link `docs/extend/architecture.md`, the
       intro's one link outside the bounds lists) finds where each lands in the tree, and a reader
       working on the theme finds the files around it (no link here; the out-of-scope list carries
       Theme your public site). A developer still choosing between the setup command and the by-hand
       build sees what the command writes; one adding cairn to an app that already exists has no
       choice to make, since the setup command writes only into a missing or empty directory
       (`f:9slxqf`), and the out-of-scope list's first item names the by-hand page.

    Then the bounds:

    - **What the page covers.** The eight-item bulleted list of `covers` in body order, under a
      complete lead-in that names the subjects and never the page. Keep "the themed 404 page": the
      numeral is the page's name and matches the [[themed-404-page]] heading, which the no-numeral
      rule (aimed at counts) does not reach.
    - **Prior knowledge.** The `priorKnowledge` sentence: SvelteKit's project structure (routes, layouts, hooks,
      and prerendering), Vite configuration, and Wrangler configuration for a Worker's bindings and D1
      migrations. It follows paragraph 3, so reader G learns here that the page expects a developer.
    - **What the page doesn't cover.** The seven-item list of `notCovered` under a complete lead-in that never
      names the page, each item subject first and page last.

    Cautions for the drafter, each from the background above: never say every push deploys (Workers
    Builds is optional, `f:qca0t0`); never say the CI builds the site (`f:guiavc`); never say the
    package carries none of the tree's files (it ships `migrations` and the guidance sources); keep
    Topo, the shadcn principle lines, and the state file's path for the body.
orderReason: |
  Ownership comes first because every later answer to "may I change this?" rests on it, and the
  annotated tree follows as the map the rest of the page walks. The per-file sections walk the tree
  from the outside in: the root files, the configuration in the order the build reads it, the
  migrations, the routes and the server hook, the theme, chassis, and content the routes read, and
  the style sheets. The rules that span several files come after every file they span is
  introduced, and the state outside the repository closes the body. [[related-resources]] ends the
  page, as the concept anatomy requires.
exemplars:
  - source: extenders/shadcn-introduction/
    slice: Extenders
    manifestType: Concept page
    take: Take the up-front ownership statement (you own and edit this code) and one line per principle on what it changes in practice; leave the pitch lines and the deploy CTA.
  - source: designers/ghost-themes-structure/
    slice: Designers
    manifestType: Reference entry
    take: Take the annotated file tree first, with load-bearing files marked inline, then one short entry per file saying what it does and what breaks without it; leave Handlebars helpers and Ghost routing.
sections:
  - id: the-scaffold
    heading: The scaffold
    why: |
      Ownership comes first because every later answer to whether a file may change rests on it: the
      section defines the scaffold and states that the site owns every file.
    opens: |
      A scaffolded site is Waymark, cairn's reference theme, wired onto a chassis of design-neutral
      plumbing, and the setup command copies both from the same tree the engine runs its tests
      against.
    items:
      - id: scaffold-source
        kind: fact
        fact: f:n2skkz
        use: |
          Only the source tree, `examples/showcase`, and the material the copy leaves out.
      - id: scaffold-one-template
        kind: fact
        fact: f:u705t5
        use: |
          Only that Waymark is the only template the setup command ships, and that Topo is planned
          but not shipped.
      - id: scaffold-same-run
        kind: fact
        fact: f:kldwss
        use: |
          Only the run's outcome: the GitHub App, the repository, the Cloudflare bindings, and the
          deploy, so the tree arrives already live. Omit any claim that this run connects Workers
          Builds, which a separate `--connect` invocation does ([[setup-state-outside-the-tree]]).
      - id: scaffold-ownership
        kind: sentence
        mode: claim
        text: |
          Every file in the tree belongs to the site: the engine's npm package carries neither the
          template nor the chassis, and the engine arrives as one ordinary dependency in
          `package.json`.
        facts:
          - f:rxj43c
          - f:o47i0q
      - id: scaffold-by-hand-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: scaffold-contract-reason
        kind: reason
        text: |
          Owning a file does not remove a contract on it: a file that the engine or a check reads
          can still break the build, the deploy, or the admin when it changes, which is why the
          tree marks those files.
      - id: scaffold-handoff
        kind: handoff
        text: |
          The file tree marks each file that carries such a contract.
  - id: file-tree
    heading: File tree
    why: |
      The annotated tree is the map every later section walks, and its markers answer at a glance
      whether the engine or a check reads a file.
    opens: |
      In the tree the setup command writes, `[engine]` marks a file the engine reads, writes, or
      requires a shape of; `[gate]` marks a file that runs or feeds a check that can fail the build
      or the CI run.
    items:
      - id: tree-block
        kind: code
        text: |
          One plain-text tree in directory-listing order: the root fully listed, `src/` one level
          deep, `src/content/` and `src/theme/` expanded one more level, and `src/routes/` collapsed
          to one line (the routes section draws its own tree). Markers, each resting on a cited
          fact: `.github/workflows/check.yml` [gate]; `cairn-audit.config.json` [gate];
          `package.json` [gate]; `migrations/` [engine]; `src/admin.css` [gate];
          `src/content/.cairn/` [engine] [gate]; `src/content/posts/`, `pages/`, and `fragments/`
          [engine]; `src/hooks.server.ts` [engine]; `src/theme/cairn.config.ts` [engine];
          `src/theme/site.config.yaml` [engine]; `vite.config.ts` [engine] [gate]; `wrangler.jsonc`
          [engine]. `CLAUDE.md` and `.claude/` appear unmarked. The tree has no `src/access.ts`, no
          `migrations-app/`, and no `src/routes/admin/signups/`, and it leaves out files no section
          discusses, such as `src/app.html` and the theme's test files.
        facts:
          - f:guiavc
          - f:mrv24k
          - f:gepykz
          - f:666eg6
          - f:vs6k2k
          - f:vrue1g
          - f:gj96px
          - f:f21bcz
          - f:q07rd5
          - f:2s8u70
          - f:xluud1
          - f:2zl3qz
          - f:34rsss
          - f:n7t4bn
        source: ../../templates/waymark
      - id: tree-root-entries
        kind: fact
        fact: f:qlgggh
        use: |
          Only the listing of what exists: the root's files and directories, plus `src/admin.css`,
          `src/lib/log.ts`, `src/content/.cairn/site-facts.json`, and `src/theme/theme-names.ts`,
          with no `src/access.ts`.
      - id: tree-claude-label
        kind: sentence
        mode: claim
        text: |
          `CLAUDE.md` and `.claude/` hold Claude Code's guidance files, in one line that labels the
          tool and links its page.
        facts:
          - f:qlgggh
      - id: tree-claude-link
        kind: link
        target: ../claude-code/using-claude-code-with-cairn.md
  - id: root-files
    heading: Root files
    why: |
      The per-file walk starts at the outside of the tree, with the root's files, among them the CI
      workflow every push meets.
    opens: |
      Beside a plain SvelteKit project's files, the root carries a CI workflow, a template for
      local secrets, the audit's config, and a `.gitignore` that the setup command renames.
    items:
      - id: root-two-entries
        kind: fact
        fact: f:qlgggh
        use: |
          Only that the root holds `.github/workflows/check.yml`, `.dev.vars.example`,
          `cairn-audit.config.json`, and `.gitignore`, which backs the section's opening sentence;
          [[gitignore]] carries the rename.
  - id: github-workflows-check-yml
    heading: '`.github/workflows/check.yml`'
    why: |
      The CI workflow is the check every push and pull request meets, so it leads the root files.
    level: 3
    opens: |
      On every push and pull request, the workflow installs dependencies and runs `npm run check`
      and `npm run check:cairn`.
    items:
      - id: ci-runs
        kind: fact
        fact: f:guiavc
        use: |
          Only what backs the section's opening sentence; add nothing beyond it.
      - id: ci-node
        kind: fact
        fact: f:jcux9z
        use: |
          Only the Node version the workflow pins, and that nothing else in the scaffold names a
          Node version.
      - id: ci-guidance-step
        kind: fact
        fact: f:jd54ph
        use: |
