constraints:
  - |
    Each of these claims lands in one section: the dev admin's content option in
    [[src-hooks-server-ts]] (`f:zzjrza`, `f:p1v88s`, `f:cgt4tk`); no second database in
    [[wrangler-jsonc]] and [[database-migrations]] (`f:n7t4bn`, `f:nv0ok0`), and no signups route
    in the route tree (`f:qtm9y2`); the admin error page in [[src-routes-admin]] (`f:ty4ehh`);
    `cf-typegen` in the table of [[package-json]] (`f:n0fg3w`); the guidance check in
    [[github-workflows-check-yml]] (`f:jd54ph`); the engine-supplied define in [[vite-config-ts]]
    (`f:xluud1`); the health route's 200 and 503 in [[endpoints-at-the-root]] (`f:paotzb`); the
    roles migration in [[database-migrations]] (`f:gepykz`, `f:rn62i1`).
  - |
    No coding assistant is assumed (register, owner ruling). Claude Code appears once,
    in the file tree's one line that labels `CLAUDE.md` and `.claude/` and links the Claude Code
    page (`tree-claude-label`, `tree-claude-link`). The introduction, the out-of-scope list, and
    every other section name no coding agent, and no sentence addresses one. The `check.yml` entry
    names the `npx cairn-guidance check` step as a CI step and states only that it cannot fail the
    job.
  - |
    Scaffold claims only. The page never states that the scaffold carries a signups screen,
    `APP_DB`, `migrations-app/`, or `src/access.ts`. The example site, `examples/showcase`, appears
    only as the scaffold's source in [[the-scaffold]]; the example-site halves of `f:zzjrza`, `f:3z1uxv`,
    `f:tycp7k`, `f:nv0ok0`, and `f:q07rd5` stay off the page.
  - |
    Where the outline entry's `covers` or `outOfScope` names `APP_DB`, `migrations-app/`, the
    signups screen, or the guidance tooling under `.claude/`, the introduction follows this
    blueprint instead: the scaffold holds no `APP_DB`, no `migrations-app/`, and no signups screen
    (`f:n7t4bn`, `f:nv0ok0`, `f:t2t5lx`), so the covers list names the one D1 database and the
    general rule for a database the site adds, and the out-of-scope list routes building a custom
    admin screen and the guidance tooling to their own pages. The outline entry needs the matching
    update.
  - |
    `/healthz`: state only what `f:paotzb` carries (outside the guard, the JSON payload, 200 or 503,
    the fixed detail on a thrown error, `cache-control: no-store`, `prerender = false`). Never call
    it a liveness or uptime check, and leave what the signing check proves to the `loadHealth`
    link. The path is `/healthz`, never `/admin/healthz`.
  - |
    The feeds and the sitemap appear by name only; no placed fact describes what they carry.
  - |
    Names (register "Names"): `create-cairn-site` on first mention, then the setup command; the
    engine for the library and `@glw907/cairn-cms` where the reader types it; the package only for
    a tarball fact; cairn lowercase; `cairn-audit`, `cairn-manifest`, and `cairn-guidance` by name;
    the GitHub App; the Worker. Never "chassis component".
  - |
    Form: every list and table takes a complete-sentence lead-in; every list item and table cell
    sentence stays under 26 words; the two trees are plain-text code blocks; an H3 for a single
    file names it in code font; a group H3 takes a noun phrase; no em dash; no heading carries a
    link.
  - |
    The table in [[package-json]] has two columns, the script and what it runs. Its lead-in
    (`pkg-table-lead`) claims no completeness, since `check`, `preview`, `build:admin-css`, and
    `dev:admin-css` carry no fact of their own and stay out of the table. The list in
    [[src-theme]] after `theme-files-lead` is a bulleted list with one file or directory per item.
  - |
    Hand-offs: the page places one (`scaffold-handoff`), and the headings do the rest of the
    navigation. A hand-off carries no extractable fact.
