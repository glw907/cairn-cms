constraints:
  - |
    The introduction's not-covered list renders the same links as [[related-resources]]
    (`rr-access`, `rr-identity`, `rr-channel`, `rr-render`, `rr-key`); each target appears as one
    `link` item only, in [[related-resources]].
  - |
    The sanitize floor's guarantees for a `sanitizeSchema` callback (the callback gets a copy,
    `script` is stripped after it returns, and a missing `tagNames` throws) are placed in
    [[render-safety]] (`rs-callback`, `rs-tagnames`) and their residual in
    [[limits-of-render-safety]] (`rs-callback-limit`); the one-declaration design is placed in
    [[access-map-coverage]] (`am-one-declaration`, `am-narrows`).
  - |
    Claims that are false and must not appear: that the sidebar
    reads the adapter's map while `requireAccess` reads the guard's, so a map given to one gates
    only that one; that a site passes the same access map to the adapter and the guard; that the
    tidy and dictionary actions are open to any editor-capability session on a route without a
    `concept` parameter (they answer 404); that an exhaustive map still leaves those actions open;
    and that a `sanitizeSchema` callback's return replaces the floor's schema with nothing
    checking it, so a callback can admit `<script>`.
  - |
    Keep the headings that carry an `anchor` verbatim, because live links in other pages and
    sibling plans point at their slugs.
  - |
    Every component section with a residual ends in a level-3 "Limits of" subsection, so a reader
    separates what cairn defends from what it leaves to the site by heading alone. A Limits
    subsection states residuals only and never re-explains its parent's defense.
  - |
    Form: the guard's five steps, the render pipeline's nine stages, and the access map's three
    fail-closed gates are numbered lists introduced by a complete sentence; the admin response
    headers, the auth channel's three controls, and the site's responsibilities are bulleted
    lists introduced by a complete sentence. Each responsibility is one sentence under 26 words.
  - |
    [[the-site-s-responsibilities]] opens on the "In short" verdict (the syncthing exemplar's device)
    and then lists the responsibilities as bullets in the page's section order; its items are
    `claim` sentences drawn from facts placed in earlier sections, so the list introduces no new
    fact.
  - |
    The heading of [[the-dev-backend-flags-two-refusals]] keeps "two refusals" for its slug; the body states the two
    engine refusals first and the dev package's own third refusal as a separate sentence, so the
    heading stays true.
  - |
    The first body mention of an auth channel, in [[scope-and-threat-position]] (`sc-seams`),
    defines it in one clause (the seam a site adds to sign in a second sign-in group on its own
    routes); later mentions use the term without redefining it. The first mention of the setup command names
    `create-cairn-site` once, then "the setup command".
  - |
    Vendor specifics get a link, never a copy: SvelteKit's CSRF and CSP options, the Fetch
    Standard's Origin rules, Cloudflare Access's session defaults and identity-provider claim
    settings, and NIST's requirements each appear as the one load-bearing distinction the
    section needs, with the link beside it.
  - |
    Hand-off items name the turn and the target heading; the drafter writes each as one sentence
    with the heading rendered as a link, carrying no fact, numeral, path, or version, and never
    naming a position on the page ("below", "next").
  - |
    The general docs assume no coding assistant: no sentence addresses a coding agent or
    mentions Claude Code.
  - |
    The introduction opens on a statement about the reader's situation or the subject, never on
    the page itself or an imperative; a later sentence that bounds the page's scope may name the
    page. The introduction's covers list and the body's section order must match.
