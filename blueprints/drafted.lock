        blocked:
            commit: 18099821a890cd51dc4d5d7a55fbccc7f948f468
            findings:
                - location: resolve-a-failed-setup / r-unmigrated, rs-unmigrated-link
                  text: Recovery route points at the wrong section. r-unmigrated tells the reader to copy and apply `0001_roles.sql` "as [[add-the-role-s-people]] does", and rs-unmigrated-link targets '#add-the-roles-people'. That section only adds people through the form. The copy and apply steps (s-copy-roles, s-apply-roles) live in deploy-the-role, so the route sends the reader to a section that cannot fix the failure.
                - location: resolve-a-failed-setup / x-unmigrated, x-wiring
                  text: The section's why says it holds the failures "in the order a reader meets them". On the role path, though, x-unmigrated (from s-submit, in add-the-role-s-people) comes before x-wiring (from v-doctor, in deploy-the-role). The reader runs v-doctor first, so the stated order is wrong.
                - location: resolve-a-failed-setup / x-construct
                  text: 'x-construct names `from: s-channel`, but writing the module cannot throw. Construction throws when the module first loads. Following the steps, that first happens at t-run, because the test imports the module''s `normalizeContact` and so loads member-channel.ts, or at the first request after d-deploy. The `from` names a step where the failure cannot occur.'
                - location: resolve-a-failed-setup (failure from verify-a-member-signs-in-to-the-member-area / c-enter)
                  text: Missing failure. At c-enter the reader can enter a code that answers `bad-code` and mints no session (f:vo4m61). The code may be mistyped, past its 10-minute TTL, or past the attempt cap (f:u3qhel). The login form then answers fail(400) and c-redirect does not happen, but no failure item covers this outcome.
                - location: test-the-channel-on-node / t-run; resolve-a-failed-setup
                  text: Missing failure. t-run can fail on Node below 24. `createChannelDb` needs `node:sqlite`, the dev package adds no runtime floor guard, and npm only warns (f:fcqs22). before-you-begin states the floor, but t-run carries no `canFail` and no failure item, so a reader on an older Node meets an unexplained test failure.
                - location: verify-the-role-signs-in-to-its-home-screen / v-sidebar; resolve-a-failed-setup
                  text: Missing failure. v-sidebar can fail, yet it has no `canFail` and no failure item. If the entry's `roles` names a role the vocabulary does not declare, validation fails (f:16paho). If the site already keeps an access map with a key matching `/admin/staff` that does not name `staff`, `canReach` hides the link (f:altcjp, f:5sx6zl). Either way the reader sees no link and has no recovery.
                - location: deploy-the-role / v-doctor; before-you-begin / bb-list
                  text: Reader state. v-doctor tells the reader to run `cairn doctor`, which needs the Go `cairn` CLI installed. No precondition lists it and no earlier step installs it. The magic-link-site precondition covers a site built through the tutorial or the setup command, neither of which implies the CLI.
                - location: write-the-channel-module / s-types, s-dev-vars-example
                  text: Reader state. Two steps rely on files that only a scaffolded site is guaranteed to have, and no step or precondition produces either. s-types tells the reader to run "the command that `worker-configuration.d.ts` records on its first lines", so `npx wrangler types` must already have run. s-dev-vars-example edits `.dev.vars.example`, which comes from the scaffold (f:nls26c). The page's priorKnowledge also admits a hand-built tutorial site, where these files may not exist.
                - location: introduction.covers; framing.introPlan item 3
                  text: The introduction does not give an accurate overview of what the sections deliver. The outline's covers lists "Test with createChannelDb and the Node requirement", and the blueprint has test-the-channel-on-node and end-a-removed-member-s-sessions. Yet introduction.covers and introPlan items 1 to 3 name neither the Node test nor ending a removed member's sessions. Vitest appears only as prior knowledge.
                - location: framing.introPlan item 5
                  text: The introPlan misdescribes the sections. Item 5 says "The page states only the one map constraint the role path needs, in [[show-the-home-screen-in-the-sidebar]]". The sections actually state access-map behavior in two places. build-the-role-s-home-screen covers `requireAccess` and `canReach` admitting a `none` role (hs-why, hs-map-alt, hs-map-link). The sidebar section covers an unmatched href staying visible (sb-visible). An introduction drafted from item 5 would misstate the page's scope against the outline's out-of-scope access maps.
