        sections:
            _intro: sha256:bad06db458031f11fca6ecb6f6885b92d54771f60c6c1ed8558f61a003a77746
            before-you-begin: sha256:48154814a4d22e323f9e2895c151affad6a07814f6ad8dd5973e9a02045d5830
            delete-the-old-key: sha256:f0d47c41282b4da417d9dc68884e2932f2c41c261e6fe588dd18ce658c740218
            generate-a-new-key: sha256:25a69d62a50b8e8ed688cdcecb69c3297d69af084348c7378627aed3a8fa8720
            generate-a-third-key: sha256:2b2d56a5984dab836b0288ed7322e52af447a21b4e9e7cfcde1074c60524bbea
            push-the-new-key-to-the-worker: sha256:1f486c3414c5af5dc14fe5b1731b19d3832bcbb599598bf52b483e81565e8f99
            recover-from-a-failed-key: sha256:7f71973244bbccafd2c9738edf53f652f5daeceb5404f699834d7f7d6d0e4e28
            roll-back-to-the-old-key: sha256:03b43cf6bcf150cef5bea823dbabbe155017f382766d628ff11e5a200c8f1888
            see-also: sha256:f3ca1e3e61907aa0b7035eb95b7f28bedc55e031bab062e53967533bd8040fa0
            verify-the-new-key: sha256:3b9e85ea02175d20a57f2cf2bc79eecfecf7a960dcb2a96b99f5d39408d0d307
        blocked:
            commit: fd90da8d87488d3320b78c482fb03071c68b4d7b
            findings:
                - location: roll-back-to-the-old-key / s-rollback
                  text: The rollback route has no deploy step for a Worker that uses gradual deployments. The push section makes `wrangler versions secret put` the command for such a Worker and adds s-push-gradual-deploy, because that command does not deploy. s-rollback only says to run the push command with the old key's file. A gradual-deployments reader who follows it leaves the old key in an undeployed version, so s-rollback-verify still reports the failed key and the reader loops through rb-repush without restoring anything.
                - location: roll-back-to-the-old-key / x-rollback-verify, rb-repush
                  text: Recovery comes before diagnosis. x-rollback-verify treats any 503 from the live request as 'the Worker holds a key other than the old key' and hands off to rb-repush. rb-repush tells the reader to push again first and to read the recovery rows only if the 503 persists. A live 503 carries a `githubAppToken` or `githubAppSigning` detail that names the failure, and `installation_not_found`, `installation_suspended`, `unreachable`, and `key_refused` are not fixed by re-pushing. The cause is also stated too narrowly.
