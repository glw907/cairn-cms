            findings:
                - location: find-the-records
                  text: The section warns that an empty log proves nothing until observability is on, but it has no `failure` item for that case and never gives the remedy. A reader whose `cairn logs <site>` or Workers Logs query returns zero entries is told only that the result proves nothing. There is no symptom row that names the cause (`observability.enabled` unset in the Wrangler config) and the fix (set it and redeploy). Every later row assumes the reader can see a record, so this is the first failure a reader of this page can meet.
                - location: admin-action-session-absent / f-session-absent
                  text: The `opens` line says the wrapped action redirects to `/admin/login`. `f-session-absent`'s `use` claims 'the redirect' backs that sentence, and `s-session-absent-fix` calls the redirect the recovery. Fact `f:v1jj2k` says nothing about a redirect or its target, so the `use` scopes a part the fact does not hold. The opening sentence, the symptom wording ('lands on the sign-in page'), and the 'no code change' recovery all rest on an unbacked claim.
