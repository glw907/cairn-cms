# Written by drafter; do not edit by hand.
version: 1
pages:
    docs/claude-code/using-claude-code-with-cairn.md:
        blocked:
            commit: 18099821a890cd51dc4d5d7a55fbccc7f948f468
            findings:
                - location: the-guidance-tree, s-agent-location
                  text: The outline's covers list requires the review agent's purpose and its relation to the audit gate, and its job names 'what the review agent reviews'. The blueprint places only the agent's file location. A constraint and the introPlan caution ('never what it reviews') rule the purpose out, yet outOfScope does not list it. The page would fail to deliver a covers item and would not say it leaves that item out.
                - location: introduction / framing.introPlan
                  text: The introduction does not match the outline. introduction.covers and introPlan promise only the review agent's location, while the outline job and covers promise its purpose and audit relation. notCovered does not list that omission, so the introduction gives an inaccurate overview against the outline.
                - location: see-also
                  text: The task-guide closing section is incomplete. Its opens line promises the pages covering the work this page leaves out, but it links only scaffolded-site-files and upgrade-cairn. It omits Run cairn-audit on your site and the cairn-guidance reference page, both named in notCovered, and it lists no concept pages or limitations.
                - location: verify-the-guidance-setup, v-hook (and wire-the-stop-hook, s-hook)
                  text: 'Reader state: v-hook relies on the site having a check:cairn script, and the daisyui and tailwindcss peers, without saying so. No step produces the script and no precondition lists it. A hand-built site, which pre-site admits, has no script, so --if-present makes the hook silently do nothing and the step cannot succeed.'
                - location: make-the-ci-step-gate-on-a-stale-tree, s-ci / s-ci-no-workflow
                  text: 'Reader state: s-ci edits .github/workflows/check.yml, which a hand-built site may not have. s-ci-no-workflow sends the reader to cairn-guidance check''s CI workflow line, but check first runs at v-check, later on the page. The prerequisite is unavailable at that point, and the recovery route comes before the diagnosis that surfaces it.'
                - location: diagnose-an-install-or-check-failure (from s-install)
                  text: A failure is missing for s-install. f:5ohm23 states that a failure creating a directory, writing the MANIFEST, or reading a destination throws out of the bin and exits nonzero. A reader running s-install can meet this, and a constraint even notes it, but no failure item covers it.
                - location: diagnose-an-install-or-check-failure (from v-hook)
                  text: A failure is missing for v-hook. When the hook produces no check:cairn output, because the script is absent, --if-present skips it, or the settings entry did not take, the reader has no failure item to turn to. x-peer covers only the missing-peer stop.
                - location: verify-the-guidance-setup v-push / diagnose-an-install-or-check-failure
                  text: A failure is missing for v-push. A reader who gated CI and pushes can see the check job fail, either from a stale or missing tree or, without continue-on-error, from a crash. v-push has no canFail and no failure item.
                - location: make-the-ci-step-gate-on-a-stale-tree, f-ci-step / r-ci-trade
                  text: Two items carry a claim the fact does not hold. f-ci-step's use says continue-on-error 'covers only a crash or a resolution failure', and r-ci-trade cites f:jd54ph for that claim. f:jd54ph says only that continue-on-error passes the job on any nonzero exit. The use adds content instead of scoping the fact, and the paraphrase would survive a corrected fact.
