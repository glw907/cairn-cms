            findings:
                - location: framing (background 'Where Cloudflare fits'; introPlan paragraph 1)
                  text: The framing contradicts the facts and the wrangler-jsonc section. The background's 'Where Cloudflare fits' bullet says `wrangler.jsonc` 'binds two D1 databases' and that 'each D1 database has its own migrations directory (f:gepykz, f:nv0ok0)'. introPlan paragraph 1 says it 'binds the Worker's D1 databases', in the plural. f:n7t4bn and f:l3cxgc say the scaffold binds only `AUTH_DB` and no second database. [[wrangler-jsonc]] opens on 'its only D1 database is the auth store', and [[database-migrations]] calls `migrations/` 'the scaffold's only migrations directory'. As planned, the introduction would misstate what the body delivers and restate the showcase's `APP_DB` and `migrations-app/`, which the scaffold-claims constraint forbids.
                - location: introduction (covers, notCovered) against the outline entry
                  text: The outline entry's `covers` and `outOfScope` no longer match what the blueprint's introduction and sections deliver. `covers` still lists four things the blueprint drops. First, `APP_DB` among the wrangler bindings, which f:n7t4bn says the scaffold lacks. Second, `migrations/` versus `migrations-app/`, which the scaffold does not ship (f:nv0ok0). Third, 'the signups example screen' under `src/routes/`, which f:t2t5lx says is not part of the scaffold. Fourth, `.claude/` with its four skills and VERSION stamp, plus a whole 'guidance tooling' item, which the dispositions subordinate to the guidance reference under the register's Claude Code ruling. `outOfScope` names 'The signups screen as a pattern', while `notCovered` says 'building a custom admin screen'. The blueprint's choices follow verified facts and the register, so the outline entry is stale. Under the introduction check, though, the intro and the entry disagree. I cannot edit the outline entry.
