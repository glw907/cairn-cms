        blocked:
            commit: 18099821a890cd51dc4d5d7a55fbccc7f948f468
            findings:
                - location: orderReason
                  text: The `orderReason` describes the planning session rather than the page. It opens "The page re-sequences the outline's covers…", which is a departure from the outline's milestone order (content and admin swapped) and belongs in the commit message.
                - location: push-the-site-to-github
                  text: 'The section''s `why` narrates a move against an earlier plan: "the push opens this milestone instead of closing the content one."'
                - location: constraints (facts placed beyond the outline's inventory)
                  text: 'A constraint records planning history against the outline''s fact inventory: "Facts placed beyond the outline''s inventory, each load-bearing for a claim the covers or the Part 1 items need." It reads as a session note, not a description of the page.'
                - location: wire-the-dev-backend / d-hooks
                  text: 'The `use` restates the fact''s content instead of scoping it: "Under `vite dev` the hooks run in Node, where the Worker env never carries the shell variable `npm run dev` sets, so this site''s flag test reads `process.env`." It also changes the fact. f:f21bcz says the opt-in reads the Worker env first and falls back to `process.env`. A corrected fact would leave this paraphrase stale.'
                - location: add-the-email-sending-binding-and-name-the-origin / em-observability
                  text: The `use` restates content and adds a claim the fact does not carry. f:txgoyy never says the records go to "Workers Logs", and the use also paraphrases the doctor warning.
                - location: wire-the-dev-backend / d-callsite
                  text: The `use` restates the direct-naming rule ("the module names `__CAIRN_DEV_BUILD__` itself, never through an imported constant") instead of naming the part of the fact it carries.
                - location: before-you-begin / s-install-cli
                  text: The step relies on a prerequisite no earlier step produces and no precondition lists. `go install` needs a Go toolchain, which the preconditions omit, and the step declares no `requires`. A reader without Go cannot complete the primary install form.
                - location: edit-the-message-in-a-custom-sender / s-custom-send
                  text: The custom sender relies on state the page never builds. cs-code reads `env.EMAIL` (from `cloudflare:workers`) and sends through the binding. Per f:vvgpr5, Worker bindings are typed only by the `Env` that `wrangler types` generates, and the page places no `wrangler types` step. The dispositions say "the tutorial's code reads no generated binding type", and i-appd-code adds no `Cloudflare.Env`. `env.EMAIL` therefore will not type-check. The Email Sending binding's send call is also never established on the page.
                - location: resolve-a-production-failure / pf-refusal, pf-origin
                  text: Two failures name `s-deploy-prod` in `from`, but neither can occur there. The "`/admin` still shows Wrangler bindings are missing" symptom and the `config.public-origin-invalid` throw are runtime responses to a request, and the deploy step opens no page. The reader first meets them when opening the deployed origin.
                - location: resolve-a-content-build-failure / f-zero
                  text: The failure has no `from`, yet a reader meets it during the steps, not in ordinary use after they end. A concept left out of the plugin's `content` option shows when the manifest is written or the build runs in this milestone. The free-standing symptom-row allowance does not apply.
                - location: verify-the-sign-in-email / x-email
                  text: 'The failure names two causes, "the custom sender threw, or the domain is not onboarded", but `handledBy: pf-mail-fix` covers only domain onboarding. A reader whose custom `auth.send` threw has no recovery route.'
