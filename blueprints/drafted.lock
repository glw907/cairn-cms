                  text: This constraint records the planning session, not the page. It says the outline's suggested headings are not used, why each was rejected, and which old slugs they had. That is a departure from an earlier outline and belongs in the commit message, not a durable field.
                - location: framing.introPlan (paragraphs 2 and 4) against scope-and-threat-position (sc-attacker, sc-floors, sc-seams)
                  text: The introduction plan restates sections instead of framing them. It carries the owner's threat sentences word for word, then the floors and the identity hand-off. scope-and-threat-position opens on the same threat sentence (sc-attacker) and places the floors (sc-floors) and the seams (sc-seams). A reader meets the same definition twice in a row. This contradicts the introduction.covers rule that the framing names the model "without restating any section's mechanics".
