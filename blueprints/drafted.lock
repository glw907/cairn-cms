            findings:
                - location: before-you-begin / intro-one-declaration, intro-security-link, intro-custom-screen-link, intro-sidebar-link, intro-second-group-link, intro-upgrade-link, intro-exhaustive-link
                  text: 'Order: the introduction''s material is filed under the Before you begin section. intro-one-declaration and six intro-*-link items, including the out-of-scope links and the link to make-the-map-exhaustive, sit in before-you-begin. A drafter following section order would put the introduction''s where-it-sits support and its scope links under the Before you begin heading, mixed with the preconditions. The framing says the introduction has no heading.'
                - location: before-you-begin / bb-list; enforce-the-map-on-your-routes / s-load-gate, s-wrap-actions
                  text: 'User goal: the precondition presupposes half of the page''s job. The job is to declare a map and to enforce it on your own screens'' reads and writes. bb-list requires a custom screen whose load already calls requireAccess and whose actions are already createSectionAction wrappers. That makes enforce-the-map-on-your-routes redundant for every reader who meets the preconditions. enf-example then says the example needs no edit there. Yet s-load-gate and s-wrap-actions are not optional, and s-deploy-push and s-build require actions-gated.'
                - location: resolve-a-refusal / x-still-open
                  text: 'Recovery: x-still-open has no `from`, but a reader meets it during the steps. The media library or signups screen opening for an editor session is exactly the outcome that contradicts v-signups-refused and v-media-refused. Its handledBy also covers only the second cause, the requireEditor route. The first cause, a Worker that predates the map, has no handler.'
                - location: resolve-a-refusal / x-role-unknown, x-refuse-all
                  text: 'Recovery: x-role-unknown and x-refuse-all have no `from`, but a reader meets both at the verification steps. A webmaster refused on signups or media after the role change surfaces at v-reload. A route refusing everyone surfaces at v-reload or v-signups-refused. Neither is a symptom met only in ordinary use after the steps end. x-refuse-all also routes its shadowed cause to s-route-key, when the fix for that cause is s-nest-load-target.'
                - location: verify-each-role-s-reach / v-remove-refused
                  text: 'Missing failure: v-remove-refused can show a delete that succeeds. That happens for a reader''s own route that skipped the optional s-owner-only step, or set ownerOnly on the wrong action. No failure item covers a webmaster removing a row.'
                - location: declare-the-access-map (why)
                  text: Durable field narrates a planning departure. The why says the section carries where the map goes 'in place of a separate step for the guard'. That records a step cut against the outline's 'Pass the same map to the adapter and to createAuthGuard', when the field should describe the page as it is.
                - location: declare-the-access-map / map-keep-keys
                  text: This `use` restates the fact's content instead of scoping it. 'a key dropped from the map locks its route' paraphrases f:zo034s. The same happens in enf-no-key's sibling placements.
                - location: enforce-the-map-on-your-routes / enf-action-trap
                  text: 'This `use` paraphrases f:5pyozi: ''a gated `load` never gates the actions beside it''.'
                - location: enforce-the-map-on-your-routes / enf-owner-only
                  text: 'This `use` adds example content the fact does not carry: ''a webmaster session adds a signup and only an owner removes one''. A corrected fact or example would leave it stale.'
                - location: sidebar-entries / nav-unmatched-trap
                  text: 'This `use` restates f:uhoyun''s second half and an inference: ''an unmatched href stays visible while the route behind it refuses, so a new screen''s entry shows before its route has a key''.'
                - location: decide-what-the-map-leaves-open / open-warning; verify-each-role-s-reach / ver-unmapped
                  text: Two `use`s state a derived content claim, that the warning names 'every concept and fixed screen except `media`'. That claim should stay in the step text, or go, rather than sit in a scoping field.
                - location: assign-the-roles / asg-next-request
                  text: 'This `use` restates content and invents consequences beyond f:uotol3: ''a demotion takes effect at once, and one test editor can cycle through the roles''.'
                - location: before-you-begin / bb-dev-owner; declare-the-access-map / map-example-site
                  text: Two `use`s carry content claims rather than scope. bb-dev-owner says 'local development cannot show a role refusal'. map-example-site says 'an owner-only theme-kit rule' and that the example changes the signups key.
