                  text: 'This `use` restates the fact''s content, not its scope. It copies the `{ outcome: ''sent'' }` literal, which goes stale if the fact changes.'
                - location: csrf-protection / cs-sveltekit
                  text: 'This `use` paraphrases the fact''s content: what SvelteKit compares and refuses, `trustedOrigins`, the global setting, and the SvelteKit 3 removal of `checkOrigin`. It does not just scope the fact.'
                - location: csrf-protection / cs-referrer and cs-referrer-scope
                  text: These two `use` fields restate header values (`strict-origin`, the meta tag) and their scope instead of naming the parts of the facts to place.
                - location: identity-modes-threat-surface / id-lifetime
                  text: This `use` restates the fact's content, including the 30-day constant. A changed constant would leave the `use` stale.
                - location: identity-modes-threat-surface / id-logout and the-session-cookie / sk-logout
                  text: Both `use` fields copy logout mechanics from f:8xxe3b (`isSafeLogoutUrl`, `/admin/login`, the cookie name forms) instead of scoping the fact.
                - location: identity-modes-threat-surface / id-logs
                  text: This `use` restates the log event names and reasons (`guard.refused`, `identity`, `auth.identity.unknown`) instead of scoping the fact.
                - location: the-dev-backend-flags-two-refusals / dv-hooks; limits-of-the-admin-headers / gd-csp-option; render-safety / rs-callback
                  text: These `use` fields paraphrase the fact's mechanics (`__CAIRN_DEV_BUILD__`, `process.env`, the `sveltekit()` call, the `script`/`strip` handling) instead of naming parts of the facts.
                - location: the-auth-channels-threat-surface / ch-why, ch-origin-why, ch-nist; limits-of-the-auth-channel / ch-capture
                  text: These `use` fields restate the fact's content instead of scoping it. ch-why paraphrases the lockout. ch-origin-why restates SvelteKit's behavior. ch-nist restates NIST's requirement. ch-capture restates the capture-transport clause.
