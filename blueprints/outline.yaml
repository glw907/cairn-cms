    slug: restrict-admin-access
    title: Restrict admin access
    type: task guide
    job: Declare an access map that narrows which roles reach which admin screens and routes, and enforce it on your own screens' reads and writes. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - Capability as the floor and the map as a narrowing layer.
      - 'Roles: the declared vocabulary and capability values (link add-a-second-sign-in-group for a none-capability audience).'
      - 'defineAccess: keys (screen ids or /admin paths) and values; validation against roles.'
      - Give the map to the adapter; the guard takes only { runtime } and reads the map from it.
      - 'Enforce on your routes: requireAccess checks the route id; a load never gates its own action; ownerOnly adds to the rule.'
      - The unmapped-target asymmetry between routes and engine screens; media restriction reaching the image picker.
      - Nav entries gated by a matching rule.
      - Href keys matched by deepest path-segment prefix, and an unmatched href that stays visible in the nav while its route refuses.
      - A role change applies on the editor's next request with no new sign-in.
      - 'Make the map exhaustive when you want whitelist behavior: map every concept and fixed screen until config.access_unmapped is silent.'
      - 'Verify: the config.access_unmapped warning and a 403 per role.'
    outOfScope:
      - Why the map narrows and never whitelists (security-model).
      - Section actions in full (add-a-custom-admin-screen).
      - Hiding nav entries (arrange-the-admin-sidebar).
  - path: docs/extend/replace-magic-links-with-cloudflare-access.md
    slug: replace-magic-links-with-cloudflare-access
    title: Replace magic links with Cloudflare Access
    type: task guide
    job: Replace the magic link with your organization's identity provider by putting Cloudflare Access in front of /admin and writing the resolver that turns its token into a roster email. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - 'Before you switch: all-or-nothing replacement, roster emails matching the IdP''s primary address, the first owner seeded, Zero Trust free-plan user cap.'
      - 'Create the Access application: /admin, its subpaths, and /admin/__data.json covered; `/preview/<token>` not covered; CORS off; no cache rule on /admin; preview URLs closed.'
      - 'Write the verifier: header not cookie, type app, email claim required, stateless validation against the certs; the code is yours and cairn ships no OIDC client.'
      - 'Wire identity on createAuthGuard: IdentityResolver, ResolvedIdentity carrying no role, per-request resolve, composition via sequence.'
      - Logout under identity and Access's token lifetime.
      - The seam is not Cloudflare-specific.
      - 'Verify: identity refusal logs by reason, auth.identity.unknown.'
    outOfScope:
      - The threat analysis of identity mode (security-model).
      - Magic-link setup (add-cairn-to-a-sveltekit-app).
