  - path: docs/extend/run-cairn-audit-on-your-site.md
    slug: run-cairn-audit-on-your-site
    title: Run cairn-audit on your site
    type: task guide
    job: 'Run cairn-audit as your site''s gate: scope its static and rendered passes to your own sources, stylesheets, and admin pages, sign the rendered pass in, and suppress or allowlist a finding with a recorded reason. For a Svelte-fluent web developer building an organization''s site on cairn''s seams.'
    covers:
      - 'What cairn-audit checks: the static pass over sources and the compiled sheet, the rendered pass over live admin pages, the two tiers, and the exit codes (link the reference).'
      - 'Scope the static pass: static.scope, static.sourceScope for the log rules, sheet as one path or a list, and the failure when a named path is missing.'
      - 'Scope the rendered pass: the default core admin pages, rendered.pages for a site whose concepts are not posts and pages, rendered.extraPages for custom screens, and the exit 2 on a page outside 2xx.'
      - Sign the rendered pass in with CAIRN_AUDIT_COOKIES, and the redirect-trap refusal without it.
      - Suppress a static finding with cairn-audit-disable-next-line and a reason; the suppression findings a malformed directive raises.
      - Allowlist a rendered finding with page, selector, reason, and rule; stale, dead, and unparseable entries.
      - 'Run it in CI: the scaffold''s check:cairn and check:cairn:rendered scripts, and advisory versus error tier on a consumer.'
    outOfScope:
      - Auditing one custom admin screen while you build it (add-a-custom-admin-screen).
      - Running the public-scope theme rules on a theme (theme-your-public-site).
      - Every rule, flag, and config key (docs/reference/cairn-audit.md).
  - path: docs/claude-code/using-claude-code-with-cairn.md
    slug: using-claude-code-with-cairn
    title: Using Claude Code with cairn
    type: task guide
    job: 'Work on a cairn site with Claude Code: know which guidance cairn installs under .claude/, which of the four skills loads for which task, where the review agent sits, how to wire the Stop hook that runs the audit after each turn, and how to adopt, refresh, and check the guidance tree with cairn-guidance install and check, including their exit codes and the CI step. For the extend track''s reader (a Svelte-fluent web developer building an organization''s site on cairn''s seams) who has chosen Claude Code as their coding assistant. The general docs assume no coding assistant; this page is the one that teaches working with Claude Code.'
    covers:
      - 'The introduction: the task (set up and work with Claude Code on a cairn site), who it is for (the extend track''s developer who has chosen Claude Code), that the general docs assume no coding assistant and this page is the one that does not, and that cairn ships guidance in Claude Code''s format only (no AGENTS.md, no file for another agent).'
      - 'The guidance tree a scaffolded site is born with and that cairn-guidance install writes: .claude/skills/<skill>/, .claude/agents/cairn-extension-reviewer.md, .claude/cairn/CLAUDE.md, .claude/cairn/VERSION, .claude/cairn/MANIFEST, and the root CLAUDE.md that imports the fragment with one @ line followed by the site''s own section; what VERSION stamps (the caret-stripped engine spec at bake time).'
      - 'The four skills and when each loads: cairn-admin-screens (build or review a screen inside /admin), cairn-consult (write a consultation brief after working around an engine behavior twice or wanting something the seams do not reach), cairn-extend (change anything that touches /admin, a form action, logging, or an engine seam), and cairn-public (restyle or extend the public side, with its catalogue pages).'
      - 'The review agent, cairn-extension-reviewer: where it sits (.claude/agents/cairn-extension-reviewer.md), with a link to the guidance reference page for what it checks.'
      - 'The Stop hook: cairn-guidance install never writes .claude/settings.json, so the hook that runs npm run check:cairn --if-present is a snippet (claude/snippets/settings-hook.json) the developer pastes in deliberately; what check:cairn runs.'
      - 'cairn-guidance install: adopting the tree on an existing site and refreshing it after an upgrade; it never deletes (a path an earlier MANIFEST listed that the package no longer ships is printed as removable); it never rewrites the root CLAUDE.md; it refuses a symlinked or directory destination by name and continues; a write failure prints the errno code on stderr; it exits 0 even on a refusal or write failure, so a script reads stderr, not the exit code; a failure creating a directory, writing the MANIFEST, or reading an existing destination stops it with a nonzero exit.'
      - 'cairn-guidance check: the seven report lines, exit 0 by default, --strict exits 1 only when the guidance tree is stale or missing, the root CLAUDE.md import check, the .claude/ Tailwind exclusion check, and that the VERSION stamp does not count toward staleness.'
      - 'The CI step: the scaffold''s check.yml runs npx cairn-guidance check without --strict under continue-on-error: true, so a stale tree surfaces in the job log without failing the build; how to make it gate (add --strict and remove the step''s continue-on-error: true line, since --strict alone still passes the build under it) as a choice the reader makes.'
    outOfScope:
      - 'Any coding assistant other than Claude Code: cairn ships no guidance for another agent, and this page says so in one line without teaching one.'
      - 'The review agent''s purpose and how it relates to the audit gate: no fact states either, so this page places only the agent''s file and links the guidance reference page.'
      - The scaffolded tree outside .claude/, file by file (scaffolded-site-files); that page names CLAUDE.md and .claude/ in one labeled line each and links here.
      - Running the audit and reading its findings (run-cairn-audit-on-your-site); this page wires the Stop hook that runs it and links there.
      - The upgrade procedure and when to refresh the tree (upgrade-cairn); this page covers the install command that refreshes it.
      - Writing a consultation brief and what the engine does with it (the protocol lives in the cairn-consult skill itself, not in the published docs).
      - The CLI's full option and output listing (the guidance reference page); this page links it.
      - 'The general docs'' rule stands: no other page carries Claude Code teaching, and this page does not rewrite another page''s prose.'
