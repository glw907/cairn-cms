  - path: docs/extend/security-model.md
    slug: security-model
    title: Security model
    type: concept
    job: 'Assess what cairn defends and what it leaves to you: the sign-in and session design, CSRF, the access map''s limits, the render pipeline''s sanitizing, the GitHub App''s reach, and the residual risks of each seam you replace. For a Svelte-fluent web developer assessing cairn before adopting it, and for one about to replace its sign-in or access rules.'
    covers:
      - Scope and who the realistic attacker is; floors, not ceilings.
      - 'Magic-link sign-in: token and session lifetimes, hashing at rest, non-enumerating answers and the throttled relaxation.'
      - 'Sign-in binds to the browser that asked (suggested heading, so restored links reuse the old slug #sign-in-binds-to-the-browser-that-asked): the pending cookie, NULL-bound rows, last-requester-wins rebind and the forwarded-token residual.'
      - 'The session cookie (suggested heading, so the restored link reuses the old slug #the-session-cookie): __Host-, Secure derivation, logout.'
      - 'CSRF: the double-submit token, how SvelteKit''s origin check (every route, no site csrf key, checkOrigin removed in SvelteKit 3) and the token divide the work, Origin null when a site-wide referrer policy strips the header, rotation.'
      - The guard's request order and admin response headers; no CSP on /admin by design.
      - What the dev backend flag's two refusals leave open (suggested heading, so the restored link reuses the old slug it).
      - 'An access map is not a whitelist (suggested heading, so restored links reuse the old slug #an-access-map-is-not-a-whitelist): canReach, fail-closed gates, unmapped targets, publish-all and tidy exceptions, config.access_unmapped; end the section with a "Recovering whitelist semantics" subsection (the heading the 0.97.0 migration note links): the exhaustive-map rule in two sentences, linking restrict-admin-access for the steps.'
      - 'Identity mode''s threat surface: session lifetime moves to the gate, CSRF value never rotates, the email as the only join, gate login methods that let a user assert any email.'
      - 'The auth channel threat catalogue: the identity-keyed-denial rule, escalation, eviction, spend ceiling, origin checks, hashing prefixes, code generation, dev transports as roster oracles.'
      - 'Render safety: the pipeline order, the sanitize floor and additive schema, the sink guard, raw HTML, target=_blank, what unsafeDisableSanitize removes, and what a registered build() can still bypass.'
      - 'The GitHub App''s reach: one private key as a Worker secret, the installation token''s repository-wide write.'
      - Logs never carry tokens or session ids.
      - 'A preview link is the credential: anyone holding it reads the draft with no sign-in until it expires, is revoked, a change to the entry ends it, or its minting editor is removed.'
    outOfScope:
      - Configuring the access map (restrict-admin-access).
      - Setting up Access (replace-magic-links-with-cloudflare-access).
      - Building a channel (add-a-second-sign-in-group).
      - Renderer options (write-a-markdown-component).
      - Rotating the key (rotate-the-github-app-key).
      - When the sanitize floor shipped; state the floor as it is (migration-notes, kept).
