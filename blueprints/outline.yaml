      - 'Path A, a none-capability role: same magic link, home redirect or welcome screen, invites through the editor screen, nav gating with roles.'
      - 'Path B, a channel: config members and their correctness obligations, its own D1 binding and migrations directory, the packaged migration, the returned actions and helpers, no route or UI shipped.'
