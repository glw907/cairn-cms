      - The three node kinds and the six fixed screen ids; label, hidden, icon allowlist.
      - Runtime validation of the whole tree at composition.
      - Unreferenced screens fall into a trailing group; hidden is never authorization, nor is ownerOnly.
      - Section roles narrowing only; collapsed and the collapse cookie.
      - 'A one-line pointer: the nav screen id is the public menu editor, turned on by editor.nav (build-the-public-routes), and a navLayout that references it without editor.nav throws at server start.'
