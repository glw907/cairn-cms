  - path: docs/extend/architecture.md
    slug: architecture
    title: Architecture
    type: concept
    job: 'Learn where cairn ends and your site begins: which export subpath each piece of your site imports, which seams you extend through, where each kind of state lives, and what each tier of the public surface promises across versions. For a Svelte-fluent web developer evaluating cairn against alternatives or taking over a scaffolded site.'
    covers:
      - 'The one-paragraph premise: a site declares one adapter, and every route factory, admin screen, and delivery helper reads its behavior from it.'
      - 'The export map as six functional groups plus the subpaths outside them (delivery/head, delivery/data, reproductions, log), and the placement rules: nothing on the root barrel imports SvelteKit, nothing on /sveltekit is a .svelte file, no /components subpath; a /sveltekit export bundled outside Vite (a Cron Worker using the audit sink) needs no $app/env alias.'
      - The three places a site touches the engine (adapter via the root barrel, the SvelteKit layer, the admin mount) and what is engine-internal behind them.
      - The named seams a site extends through (content map, render, access map and roles, identity, custom admin routes, navLayout, BackendProvider) with one line each and a link to the page that uses it; BackendProvider links its reference entry, since no page builds a second backend.
      - 'The write path: save to holding branch, pending entry as branch existence, Publish to main with the editor as author and no committer, the deploy, and the manifest rebuilt and verified at build.'
      - 'The read path: the admin''s batched GitHub reads per entry versus the committed manifest for the content graph.'
      - 'The three data tiers (git, D1, R2): what each holds, why (placement by what reads it), that no table or manifest row stores an entry body, and that a site''s own extension data sits outside them under the cairn_ naming reservation.'
      - Sessions, tokens, audit_log, and preview_tokens as D1 rows, and git history as the edit record (their security properties on security-model).
      - Cloudflare and SvelteKit as hard dependencies with no host abstraction.
      - The three stability tiers (Extension, Scaffold, Unstable), that cairn is pre-1.0 so the tiers are a target discipline, and the 0.86.0 navLayout break as the worked example; link to the reference index for per-export tiers.
      - 'Commit concurrency: which writes use the head-merge retry and which are head-guarded, publish-all as one commit and one deploy, and the branch cleanup that keeps a concurrent save pending.'
      - The Backend contract behind BackendProvider (expectedHead, missing-path, and missing-branch semantics); signatures stay in the reference.
    outOfScope:
      - Security properties of each piece (security-model).
      - Declaring the adapter field by field (define-an-adapter-and-schema).
      - The concept and fieldset model in depth (content-model).
      - Per-export signatures (reference arm).
      - The upgrade procedure (upgrade-cairn, kept).
      - Media storage settings (configure-media).
      - The role column's former database CHECK constraint; state the application-layer check as it is (migration-notes, kept).
    figure: true
  - path: docs/extend/add-cairn-to-a-sveltekit-app.md
    slug: add-cairn-to-a-sveltekit-app
    title: Add cairn to a SvelteKit app
    type: tutorial milestone
    job: Add cairn to a SvelteKit app, from an empty sv create project or one you already have, through a working /admin on the dev backend to a production deploy that commits through your own GitHub App. For a Svelte-fluent web developer who has Node 24, a GitHub account, and a Cloudflare account.
    covers:
      - 'Prerequisites: Node 24, TypeScript 6 pin, a GitHub account, a Cloudflare account, and the Workers Paid plan the moment a second person receives email.'
      - 'Milestone 1, a bare SvelteKit site deployed: sv create flags, inline kit config in vite.config.ts, adapter-cloudflare named explicitly, minimal wrangler.jsonc, wrangler login and deploy; check: the site answers at its workers.dev address.'
      - 'Milestone 2, install and wire the engine: the package and its @cloudflare/workers-types peer, ssr.noExternal, the ambient import in app.d.ts, the admin catch-all and layout pair with prerender = false, createCairnAdmin and bootstrapOwner.'
      - 'Milestone 3, content on disk: the content directories, a minimal adapter, parseSiteConfig, createSiteIndexes and the cairnManifest plugin with their two failure modes (full adapter detail links to define-an-adapter-and-schema); the rendered entry stays unstyled until the site adds Tailwind, daisyUI, and cairn-public.css (link theme-your-public-site).'
      - 'The dev-backend section (suggested heading "Wire the dev backend"; no reference link reads the old CSRF-handoff slug now): devBackendHandle, the __CAIRN_DEV_BUILD__ define named at every call site, the hooks if-branch, and the Windows one-off env var forms; the site sets no csrf key, because SvelteKit 3 removed checkOrigin and its origin check covers every route beside the guard''s double-submit token; check: sign in at /admin on the dev backend.'
      - 'Milestone 4, production: register the GitHub App (one permission, webhook off, private key PEM, App and Installation IDs as non-secret identity), createGithubApp, the base64 single-line key secret, the auth D1 database and the migrations every site applies versus the opt-in ones, the optional audit database, the Email Sending binding and domain onboarding, a custom sender through auth.send, the three edits that move a dev-backend site to production; check: cairn doctor''s config.bindings check passes, and a build with no AUTH_DB and no dev backend returns the branded 500.'
      - 'Customize the sign-in email (a closing section after the milestones, not a milestone): which parts are engine copy, where the site name and sender come from, auth.branding replacing all three, and a custom auth.send''s MagicLinkMessage and the log scrubbing of what it throws.'
    outOfScope:
      - 'The faster path: the setup command, create-cairn-site, which scaffolds a site in one step (scaffolded-site-files).'
      - The scaffolded tree file by file (scaffolded-site-files).
      - Every adapter option (define-an-adapter-and-schema).
      - The security reasoning behind the GitHub App's repository-wide write and the CSRF design (security-model).
      - Delivery routes beyond the entry catch-all (build-the-public-routes).
      - Rotating the key later (rotate-the-github-app-key).
      - The retired JavaScript doctor and the removed /components subpath (upgrade-cairn and migration-notes, kept).
  - path: docs/extend/scaffolded-site-files.md
    slug: scaffolded-site-files
    title: Scaffolded site files
    type: concept
    job: 'Take over a site the setup command scaffolded: learn what each generated file and directory does, that the site owns every one of them, and which ones the engine or a check reads, so you change the rest freely and keep the contract on those. For a Svelte-fluent web developer who took over a scaffolded site and wants to know what the tool wrote and why.'
    covers:
      - 'What the scaffold is: Waymark on the chassis, copied from the same tree the engine tests itself against, and why the site owns every file.'
      - The annotated file tree, with the files the engine or a check reads marked.
      - 'The root files (the CI workflow, the local secrets template, the audit config, the renamed .gitignore); the build and deploy configuration (package.json, vite.config.ts, wrangler.jsonc with the Worker''s one D1 database, the auth store, and app.d.ts); and the migrations/ directory, with why a database the site adds takes its own directory.'
      - 'The routes and the server hook: the guard and the dev backend in hooks.server.ts, including what the local dev server runs, the admin mount, the (site) group, the endpoints at the root, and the root layout and error page.'
      - 'The theme, chassis, and content directories, the committed manifests under src/content/.cairn/, and the two style sheets.'
      - The settings a new owner edits by hand, outside the admin.
      - The build's crawl rules and the themed 404 page.
      - 'What the setup command left outside the repository: its saved record of the run and, when Workers Builds was connected, the build token whose revocation stops deploys without warning.'
    outOfScope:
      - Building the same tree by hand (add-cairn-to-a-sveltekit-app).
      - Changing the theme and chassis (theme-your-public-site).
      - Building a custom admin screen (add-a-custom-admin-screen).
      - Each delivery route's wiring (build-the-public-routes).
      - Media configuration behind the MEDIA_BUCKET binding (configure-media).
      - cairn-audit.config.json in depth (run-cairn-audit-on-your-site).
  - path: docs/extend/content-model.md
    slug: content-model
    title: Content model
    type: concept
    job: 'Understand cairn''s content model before you declare one: what a concept is, how a fieldset drives the form, the validator, and your types, how entries are identified and routed, and what the manifest records. For a Svelte-fluent web developer building an organization''s site on cairn''s seams.'
    covers:
      - 'A concept as one entry in the adapter''s content map: a directory of markdown files plus a fieldset; the concept set is the site''s own, and Posts and Pages are not reserved.'
      - The fieldset as the single source of truth for the form, the save-time validator, and the inferred type; the fifteen builders as a closed union with no custom-field seam.
      - Containers (object and array) nested one level deep, and why a field key never contains a dot.
      - 'Entry identity: the filename stem is the id, the date prefix only feeds the slug, and the entry''s date comes from frontmatter.'
      - Routing shorthands (feed, page, embedded) and what each turns on or off; an embedded concept keeps its admin list and editor.
      - 'Validation behavior: the save is refused before any commit (the error banner and a throwing behavior.validate on define-an-adapter-and-schema).'
      - 'The manifest: one row per entry with identity, routing facts, links, reference edges, tags, and includes; git stays the source of truth.'
      - 'Rename as one atomic commit that moves the file and rewrites inbound cairn: tokens, refused on collision.'
      - Frontmatter keys the engine reads by literal name (title, date, updated, description, draft, and the SEO head's image, robots, and author) and why each must be declared to survive a save.
      - 'Field-type edges: url accepts absolute http(s) only, pattern is unanchored, default only prefills a new entry, multiselect options stay closed, and datetime ignores min and max and converts a parsed Date.'
      - dir used verbatim; slugify's ASCII-only ids (permalink tokens on define-an-adapter-and-schema).
      - The address-collision advisory and the publish-time recheck, both warn-only and fail-open.
    outOfScope:
      - Writing the declaration (define-an-adapter-and-schema).
      - Reference fields in use (link-content-with-references).
      - Fragments (reuse-content-across-entries).
      - Rendering the body (write-a-markdown-component).
  - path: docs/extend/define-an-adapter-and-schema.md
    slug: define-an-adapter-and-schema
    title: Define an adapter and schema
    type: task guide
    job: 'Declare your site''s adapter and its concepts: write the defineAdapter call, add a concept with its fields, permalink, and date prefix, and confirm the declaration typechecks and builds. For a Svelte-fluent web developer who has installed the engine and read the content model.'
    covers:
      - 'Preconditions: an installed engine (link add-cairn-to-a-sveltekit-app) and the model (link content-model).'
      - 'The defineAdapter call: the four required groups (content, backend, email, rendering), the optional ones, and the narrowed return type that carries field types into reads.'
      - The scaffold's cairn.config.ts as the worked starting point.
      - 'Add a concept, which the scaffold does not do for you: dir, label, singular, routing, fields, and the ids the engine refuses; register its literal ?raw eager glob in createSiteIndexes (with the build throws for a missing or lazy glob) and in the cairnManifest plugin''s content option (the silent-omission trap).'
      - 'Permalinks and datePrefix: defaults (`/<id>/:slug`, pages at /:slug), the allowed tokens (:slug, :year, :month, :day) with the date tokens feed-only and requiring a date field, datePrefix read only for a feed concept, and declaration-time validation.'
      - 'Tag a concept: the one top-level taxonomy: true multiselect, the site-wide tag vocabulary a save checks against (lowercase hyphenated values, existing out-of-vocabulary tags kept as orphans), where the vocabulary is stored (the file editor.siteConfigPath names, default src/theme/site.config.yaml), and the content.field_unmarked warning a missing marker raises.'
      - 'Field behavior and refine: when each runs, a throwing behavior.validate treated as valid versus an uncaught refine throw, and the one-banner save error that makes a refine message a standalone sentence.'
      - 'Concept options beyond fields: summaryFields and an array field''s itemLabel.'
      - 'Verify: npm run check typechecks the declared fields, npm run build runs the content index, and the regenerated manifest and the admin show the new concept.'
    outOfScope:
      - What routing and identity mean (content-model).
      - Normalized frontmatter and save-time validation (content-model).
      - The backend identity and the email sender (add-cairn-to-a-sveltekit-app, and the createGithubApp reference entry).
      - The site config's accepted keys and refusals (the parseSiteConfig reference entry).
      - The editor group's supportContact (its reference entry).
      - Reference fields (link-content-with-references).
      - The render group (write-a-markdown-component).
      - Roles and the access map (restrict-admin-access).
      - navLayout (arrange-the-admin-sidebar).
  - path: docs/extend/write-a-markdown-component.md
    slug: write-a-markdown-component
    title: Write a markdown component
    type: task guide
    job: Write a custom public component beside the ones your site already has, from its declaration through its build function, picker entry, and registration, and check it in the editor and on the published page. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - 'defineComponent: the required members, the container-only directive grammar, attributes from the ten serializable field types and where they are validated, and the reserved figure and include names.'
      - 'Slots: the title and body slots, named regions, the three slot kinds, required, itemFields, and a repeatable slot''s itemLabel.'
      - 'The build function: the context members, the synchronous rule, where build runs, the entrance ordinal, and inner class names kept apart from DaisyUI''s.'
      - The picker members of a component (icon, group, hidden, insertTemplate, use, preview, defaultIconByRole) and which components the picker lists.
      - 'Registration: defineRegistry, the registry handed to createRenderer and to the admin page, and the throws defineRegistry raises.'
      - 'The authoring grammar a component produces: the four-colon fence, nested slot containers, repeatable items as bullets, the label dropped without a title slot, and the HTML build returns from it.'
      - Diagnosing a component that fails a check, including a directive printed as literal text and a code fence with no token colors.
      - 'Pointers only: building the render function, adding a remark plugin, the renderer options, and the classes the built-in render steps emit.'
    outOfScope:
      - What the sanitize floor and sink guard protect and the opt-out's cost (security-model).
      - Hydrating a component on the client (add-an-island).
      - Styling the rendered output (theme-your-public-site).
      - Fragments (reuse-content-across-entries).
      - Missing media assets and the media resolver (configure-media).
  - path: docs/extend/link-content-with-references.md
    slug: link-content-with-references
    title: Link content with references
    type: task guide
    job: Connect one entry to another with a typed reference field, render the resolved target on a public page, and rely on the build and the admin guards to keep every reference pointing at a real entry. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - Declare fields.reference and array(reference), typed to a declared concept, with the normalizeConcepts failure when the concept is missing.
      - 'What the editor shows: the scoped picker button and the chip list.'
      - Resolve on a public route with resolveReferences and what a ResolvedReference carries; missing ids dropped.
      - 'Integrity: verifyReferences fails the build on a dangling reference, with no prerender fallback, unlike a cairn: link.'
      - 'The admin guards: save warns on a missing or draft target, delete checks body links then reference edges across open branches, rename refuses when another branch holds an inbound edge, and draft edges count.'
      - The byte-preserving rewrite on rename.
      - 'Where a cairn: token is live (an inline body link) and where it stays inert (raw HTML, reference-style definitions, component attributes, frontmatter); a link to a draft resolves and 404s until the target publishes.'
    outOfScope:
      - 'cairn: body links as a model (content-model).'
      - Fragments and the include directive (reuse-content-across-entries).
  - path: docs/extend/reuse-content-across-entries.md
    slug: reuse-content-across-entries
    title: Reuse content across entries
    type: task guide
    job: Write a block of content once as a fragment and include it in any entry, with the build and the delete guard keeping every include valid. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - Declare the reserved fragments concept with routing embedded, its glob in the content index, and its entry in the cairnManifest plugin.
      - Include syntax and the editor's insert-palette control.
      - Forward resolveFragment from your render alongside resolve and resolveMedia, backed by createFragmentResolver.
      - Render-time resolution one pass deep, and the refused nested include.
      - 'Guards: a dangling include fails the build, and deleting a fragment still included is refused; the fragment''s edit screen lists where it is used.'
      - The empty-fragment and not-found notices with their include.missing reasons, versus the build's throwing resolver.
    outOfScope:
      - Reusable components with attributes (write-a-markdown-component).
      - Reference fields (link-content-with-references).
  - path: docs/extend/configure-media.md
    slug: configure-media
    title: Configure media
    type: task guide
    job: 'Change how media behaves on a site that already has it: set the upload limits, move or reshape the image URLs, turn on responsive images, fail the build on a missing asset, know which media: references the Library counts before deleting an asset, and upload from a custom admin screen. For a Svelte-fluent web developer whose site has media on, as a scaffolded site does.'
    covers:
      - 'Preconditions: media already on, as the scaffold wires it (the MEDIA_BUCKET binding, the adapter''s media block, the public resolver, the media route); for a hand-built site, the three pieces named with a link to each reference entry, not taught.'
      - 'Upload limits: allowedTypes narrows but never widens the five sniffed image types (SVG, HTML, and HEIC always refused), and maxUploadBytes against the request-body limit of the Cloudflare plan.'
      - 'Image URLs: publicBase and the route directory that must move with it, urlForm and the two URL shapes, and the edit page''s preview that keeps /media.'
      - 'Responsive images: transformations, the zone setting it reports, and the srcset and intrinsic size it turns on.'
      - 'A missing asset: the broken-image marker and media.resolve_missing, the build that still succeeds, and wrapping the resolver to fail it while keeping imageDetail.'
      - 'Which media: references the Library counts, and what deleting an asset with no counted reference does.'
      - 'Uploading from a custom admin screen: the mediaUpload action, its raw-body request and headers, its fail() refusals in the envelope, and the manifest row it does not commit.'
      - 'Verify: an upload through the Library, the rendered image URL and srcset, the media route''s headers, and a build that fails on a missing asset.'
    outOfScope:
      - Seeding local media for theme work (theme-your-public-site).
      - Editor-facing use of the Library (editors arm).
      - Restricting media through the access map (restrict-admin-access).
      - The R2 tier's place among the data tiers (architecture).
      - Wiring each media piece on a hand-built site step by step (the reference entries for the adapter's media member, createMediaResolver, PublicRoutesConfig, and createMediaRoute).
  - path: docs/extend/migrate-existing-content.md
    slug: migrate-existing-content
    title: Migrate existing content
    type: task guide
    job: Move an existing site's markdown into cairn's concepts with a short script, so every entry keeps a stable id, validates, and links correctly. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - 'No importer ships: a short script with parseMarkdown and what it returns; write the frontmatter block yourself, since serializeMarkdown is internal.'
      - 'Filenames: the stem is the id, the date-prefix stripping rule per datePrefix, and the slug shape a cairn: link and the rename guard require.'
      - 'Frontmatter that must change: date as YYYY-MM-DD, draft: true semantics, tag values against a configured vocabulary.'
      - 'Old body markup: image URLs pass through unchanged, no bulk media import, one upload per action; custom shortcodes become registered components.'
      - 'Frontmatter traps: undeclared keys dropped on the first admin save, and unquoted YAML numbers, dates, or booleans read as empty by text-like fields.'
      - 'The build as the migration check: createSiteIndexes fails listing each invalid field, and opts.validate false as the temporary escape.'
      - 'Verify: the content index records content problems per entry.'
    outOfScope:
      - Declaring the target concepts (define-an-adapter-and-schema).
      - Registering components (write-a-markdown-component).
  - path: docs/extend/theme-your-public-site.md
    slug: theme-your-public-site
    title: Theme your public site
    type: task guide
    job: 'Own your public site''s design: style a hand-built site on the engine''s public style sheet, re-skin the scaffolded Waymark theme, or port your own theme onto the chassis, then iterate locally against real content until the public-scope audit rules pass. For a Svelte-fluent web developer building an organization''s site on cairn''s seams.'
    covers:
      - 'A hand-built site starts with neither Waymark nor the chassis: it adds Tailwind and daisyUI, imports cairn-public.css after tailwindcss, supplies a daisyUI theme block, links the sheet through a ?url import from a layout that wraps only the public routes, and names the same URL in editor.preview (link docs/reference/public-css.md and the core preview entry).'
      - 'The theme guide (required, Geoff 2026-09-24): re-skin Waymark by walking the recipe comment in src/theme/theme.css, light and dark, and a full status-color rebrand.'
      - 'Port your own theme onto the chassis step by step: the #chassis subpath import (templates/waymark/package.json imports), tokens.css first, the daisyUI theme blocks and the component exclude list, the site-owned CTA keys, the heading levers, the composition primitives, the skip link and theme toggle, and editor.preview when the sheets change. One line per chassis trap where a step meets it; src/chassis/README.md carries the rest.'
      - 'Local iteration: HMR, /styleguide, and seeding local R2 with cairn-media-seed.'
      - Seeded media shows only with the dev backend off (npx vite dev without CAIRN_DEV_BACKEND, or wrangler dev).
      - 'Style rendered markdown: the .prose wrapper, directive classes from markdown-components.ts, the --cairn-code-* roles the engine sheet''s code rules read, and the data-flourish opt-in.'
      - 'Verify: the cairn-audit public-scope rules run on their own (--rule public-literals --rule theme-conformance --rule theme-contrast), theme-contrast at WCAG AA, and the editor preview; resolving a public-rule finding or an unstyled preview.'
    outOfScope:
      - The file map of the scaffold (scaffolded-site-files).
      - 'The chassis tour: its file table, class prefixes, dependents table, token tiers, heading levers, and traps (the site''s src/chassis/README.md).'
      - 'The preview member''s full type, byConcept, and the ?url rule in depth (docs/reference/core.md, the preview entry).'
      - Building components (write-a-markdown-component).
      - The admin's look (add-a-custom-admin-screen).
      - Delivery routes (build-the-public-routes).
      - Media storage and the media route (configure-media).
      - Configuring cairn-audit for the whole site (run-cairn-audit-on-your-site).
  - path: docs/extend/build-the-public-routes.md
    slug: build-the-public-routes
    title: Build the public routes
    type: task guide
    job: 'Wire your public routes to the engine: the entry pages and their markdown twins, the archive, the feeds, the sitemap, and robots.txt, all reading one typed index and one origin. For a Svelte-fluent web developer building an organization''s site on cairn''s seams.'
    covers:
      - One typed index from createSiteIndexes with literal globs, and the ordering all() already gives.
      - One ORIGIN constant as a literal.
      - 'createPublicRoutes: entryLoad and entries, the load data an entry page receives, canonical URLs and og:url, the heroImage rules, and assetsEnabled.'
      - The markdown twin and its Content-Type caveat on adapter-cloudflare.
      - The feed, sitemap, and robots builders and Response wrappers, prerendered; always disallow /admin; the posture option (link choose-an-ai-posture).
      - 'createLinkResolver for cairn: links; CairnHead''s titleTemplate rule.'
      - 'Build-time integrity: the glob form createSiteIndexes needs, frontmatter validation that fails the build, the permalink collision throw, and drafts left out of every public route.'
      - 'Entry SEO: the description, social image, and hero fallbacks; article versus website typing and the JSON-LD shape a site can replace; which SEO fields the fieldset must declare; the hero field kept named image; the scaffold''s defaultImage that 404s until the file exists.'
      - Pages that are not entries get no SEO unless the site calls buildSeoMeta and renders CairnHead itself.
      - 'A tag page: allTags() and byTag() on the index, drafts excluded, and the SEO it gets only through buildSeoMeta and CairnHead.'
      - 'An editable site menu: declare editor.nav (menuName, label, maxDepth), the menu node shape and its limits, readMenu in the root layout''s load, and a second menu edited by hand in site.config.yaml.'
      - 'The sitemap: buildSitemapView and extraRoutes versus the scaffold''s hand-built route, noindex entries still listed, and an origin with no trailing slash.'
      - delivery/data's pure builders (buildSiteDescriptors, buildSitemapView, renderJsonLdScript, buildExcerpt).
      - 'The draft preview route for a hand-built site: apply the preview migration, mount loadPreview inside the entry pages'' layout group, render PreviewBanner, and verify a minted link; a scaffolded site already carries all of it.'
    outOfScope:
      - Choosing the AI posture (choose-an-ai-posture, kept).
      - Announcing new entries (act-on-newly-published-entries).
  - path: docs/extend/act-on-newly-published-entries.md
    slug: act-on-newly-published-entries
    title: Act on newly published entries
    type: task guide
    job: Detect which entries a deploy newly published by diffing two manifests and hand them to your own notification code, or give editors a next-step link the moment they publish. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - 'The post-deploy job as the spine: read the deployed manifest, load the prior one from your storage, diff with buildNewlyPublished, send, and save; the exports from delivery/data it imports (buildNewlyPublished, parseManifest, Manifest, ManifestEntry).'
      - Persisting the prior manifest is your job; the job keeps it as one string, shown against Workers KV, and another store works the same way.
      - Ordering the send and the save, and what each order trades when a send throws.
      - 'The first run stores the deployed manifest and sends nothing; before: null only for a deliberate backfill.'
      - 'The rule in short (not draft, stamped, no prior stamp at the concept/id key) and the cases a run meets: a rename reads as new, a delete and recreate reads as new only across a run, removals are silent, and an entry never stamped never returns; the full rule stays on the buildNewlyPublished reference entry.'
      - 'The in-admin alternative in short: editor.publishActions next-step links after a single entry''s publish, with the publish-actions reference for the placeholders, the concept filter, and validation.'
    outOfScope:
      - The feed routes (build-the-public-routes).
      - The full buildNewlyPublished rule and its purity (reference/delivery-data).
      - The PublishActionEntry members and their substitution rules (reference/sveltekit).
      - Sending the message (your email or messaging provider).
  - path: docs/extend/add-an-island.md
    slug: add-an-island
    title: Add an island
    type: task guide
    job: Make one markdown component interactive on the public site by hydrating it as an island, while its static fallback still serves readers without JavaScript. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - An island as a component declared with hydrate, set to true or 'visible', and build() output as the fallback.
      - A scaffolded site's short path, since its tree already carries the registry, the adapter member, the root load, and the layout call.
      - Register it in rendering.islands through a lean registry module; the declaration-time mismatch check.
      - On a hand-built site, call hydrateIslands from afterNavigate, gated on a hasIslands flag from the root server load, with dynamic imports of the runtime and the registry module, never the adapter.
      - 'Props: typed from declared attributes, untrusted, and passed unsanitized; the do and the don''t, linked to the islands reference''s contract.'
      - 'Runtime behavior in one line (teardown on navigation, root scoping, failure isolation, fallback restore), linked to the islands reference.'
      - Verify on the public page, since the sandboxed preview frame always shows the fallback.
    outOfScope:
      - Declaring the component itself (write-a-markdown-component).
      - The runtime's full contract and the boundary markup (the islands reference, docs/reference/islands.md).
  - path: docs/extend/add-a-custom-admin-screen.md
    slug: add-a-custom-admin-screen
    title: Add a custom admin screen
    type: task guide
    job: Add your own screen under /admin that renders inside the admin shell, gates its reads and writes through the access map, audits its actions, and passes the admin audit. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - Where the route goes and why it wins over the catch-all; it renders as the shell's child; the root layout must not wrap /admin in chrome.
      - 'Gate it (suggested heading "Gate it", so the restored reference link reuses the old slug): the guard covers the subtree, requireAccess in load, createSectionAction in every action, the shared fail-closed predicate, the 403 for an unmapped route, and nested routes not inheriting requireAccess.'
      - 'createSectionAction versus createAdminAction: the Env parameter, resolveDb, and what each audits.'
      - 'Wire the AuditSink (suggested heading "Wire the AuditSink", reusing the old slug): hooks.server.ts, sequence, createD1AuditSink and its fail-open write.'
      - 'Compose from the admin toolkit: the primitives and their one job each, AdminTable and ExpandableRow markup rules, the graduation rule.'
      - 'Styling: your screen''s own utilities compile only through the site admin sheet (src/admin.css scanning routes/admin and importing admin-sources.css, compiled to .cairn/admin.css by the pre-scripts and imported from the admin layout), which a scaffolded site already has; daisyUI classes available in the admin sheet, the corner ladder and radius tokens, hairline and selected buttons, fixed Tailwind radii not following it.'
      - 'The dialog-form recipe: enhance result types, failure handling without update(), live-region and dialog naming rules.'
      - 'Loading data: streaming and lazy row detail, fetch error handling.'
      - 'Animate it (section): the motion tokens, the reduced-motion blanket, the three error-tier motion rules and the frame-offset allowance, static.adminScope and cssFiles, citing admin-design-system by heading.'
      - Toolkit props that change behavior (AdminTable density and zebra, EmptyState headingLevel, Pagination's conditional range line and size select), ExpandableRow's data-cairn-inert-cell, and MediaPicker's entries and selection.
      - 'Engine components as building blocks: CairnAdminShell''s themeOverride, EditPage''s spellcheckOverride, and ContentFormFailure for a content route''s form prop.'
      - The cairn-text-warning and cairn-text-success classes in place of bracketed arbitrary values the admin sheet does not compile.
      - 'What the shell does not let a site brand: the fixed favicon and wordmark, with siteName the only identity shown.'
      - 'Verify: run npx cairn-audit over the screen and fix each error-tier finding (tiers and exit codes on run-cairn-audit-on-your-site).'
    outOfScope:
      - Declaring the access map itself (restrict-admin-access).
      - Adding the screen to the nav (arrange-the-admin-sidebar).
      - Why an access map is not a whitelist (security-model).
      - 'Configuring the audit for the whole site: rendered pages, cookies, suppressions, allowlists (run-cairn-audit-on-your-site).'
      - The media upload protocol (configure-media).
      - The audit norms' former values; state the current bands (migration-notes, kept).
    figure: true
  - path: docs/extend/arrange-the-admin-sidebar.md
