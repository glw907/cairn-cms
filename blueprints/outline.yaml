    slug: rotate-the-github-app-key
    title: Rotate the GitHub App key
    type: task guide
    job: Replace your GitHub App's private key without a publishing outage, and recover if the new key fails. For a Svelte-fluent web developer building an organization's site on cairn's seams.
    covers:
      - Why two keys can coexist and the zero-downtime order.
      - Generate a key in GitHub's settings.
      - Encode it on one line (Linux, macOS, and PowerShell forms) and push it with wrangler secret put, which deploys immediately.
      - 'Verify signing: /healthz, Workers Logs with observability on, github.unreachable.'
      - Delete the old key; rollback before deletion and the third-key recovery after.
      - 'The per-isolate 55-minute installation token cache: a warm isolate keeps a token minted with the old key until it expires.'
    outOfScope:
