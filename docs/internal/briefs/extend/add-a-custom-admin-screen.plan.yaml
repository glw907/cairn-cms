constraints:
  - |
    Re-arm (stage 2b), carried verbatim: "The signups screen is the example site's worked custom
    screen and the scaffold no longer ships it, `APP_DB`, or `migrations-app`; the one-declaration
    change moved `roles` and `access` onto the adapter." The page never says the scaffold ships the
    signups screen, `APP_DB`, `migrations-app/`, or `src/access.ts`; it names
    `examples/showcase` as the signups screen's home; the hooks snippet calls
    `createAuthGuard({ runtime })` and imports no access map.
  - |
    Keep these headings exactly, since other pages link their slugs: "Place the route", "Gate it",
    "Wire the audit sink", "Style the screen", "Verify the screen", and "Resolve a missing audit
    record".
  - |
    The page states the norms' current bands only; the former values never appear (outline
    out-of-scope, kept in the migration notes).
  - |
    No link to `docs/internal/admin-design-system.md`: it is internal, so motion and corner
    guidance links the cairn-audit reference headings instead.
  - |
    The Build the dialog form, Load row detail on demand, and Animate the screen sections each
    open on their condition, so a reader without that feature knows to skip; the introduction says
    the same once.
  - |
    No prose claim names `ExpandableRow`'s controlled props (`expanded`, `onToggle`): no fact in
    the inventory states them, so the steps link the entry and its example shows the wiring. The
    row panel's pending and failed displays are not described.
  - |
    The Events snippet is the one aside from the running example; its lead-in says it shows the
    toolkit alone and is not a second screen to build. It stays word for word with
    `src/lib/reproductions/stories/CustomScreen.svelte`.
  - |
    Three snippets have no file that holds them as shown (the hooks excerpt, the create dialog,
    and the open handler); each lead-in frames it as an excerpt or as illustrative.
  - |
    The page never claims the engine's own screens write audit records (`f:2tqkv9` is rejected).
  - |
    The page teaches no coding assistant and names no agent-specific file.
  - |
    Verification runs `npm run check:cairn`, not a bare `npx cairn-audit`, because the script
    compiles the site admin sheet first.
friction:
  - |
    No `introduction.facts` field: the six facts behind the introduction's claims are `fact` items
    at the top of Before you begin, each `use` naming the introduction sentence it backs (for
    example `intro-git-history`: "Backs the introduction's audit why only"). A drafter could
    misread them as content for Before you begin; an `introduction.facts` list would remove the
    ambiguity.
  - |
    No `optional` field on a step or a section: three whole sections (Build the dialog form, Load
    row detail on demand, Animate the screen) are conditional, so their skip lives in `opens` and a
    constraint, and their steps carry `requires` tokens that a reader skipping them never
    produces. Nothing downstream requires them, which is the only reason reader-state still
    passes.
