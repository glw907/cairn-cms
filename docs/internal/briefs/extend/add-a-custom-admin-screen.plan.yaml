version: 1
page:
  path: docs/extend/add-a-custom-admin-screen.md
  title: Add a custom admin screen
  type: task guide
argument: |
  A custom admin screen is an ordinary SvelteKit route under `src/routes/admin/` that the engine
  frames like one of its own screens, provided the site does for it what the engine does for its
  own: the route's location gives it the admin shell and the subtree sign-in guard for free, and
  the site adds the rest. The site checks the access map on the read and on every write, because
  the guard decides no per-route authorization; it records every write in the audit trail, because
  the site's own data sits outside the git history that records content; and it builds the markup
  in the admin's daisyUI idiom, because `cairn-audit` applies the engine's own rules to everything
  under `src/routes/admin`. One running example, the example site's signups screen, carries the
  page from the route through its load, its actions, their audit calls, and its markup, to a
  verification that proves all four.
introduction:
  covers: |
    The introduction frames the page from above before the contract sentence. cairn owns markdown
    content and the admin frame and leaves a site's other data and domain logic to the developer,
    served through a thin seam; in the admin that seam is the custom admin screen, a route under
    `src/routes/admin/` that renders inside `CairnAdminShell`, can adopt the packaged admin
    toolkit, and sits behind the same `/admin` sign-in guard as the engine's screens. Two readers
    arrive: a developer whose site keeps data outside its markdown content (rows in a D1 database
    the site binds) and wants a screen for it beside the editors' screens, and a developer reading
    the example site's signups screen at `examples/showcase/src/routes/admin/signups/` who wants to
    know what each call in it is for. The introduction says why the four duties exist: the route's
    location gives the shell and the guard, the guard gates the subtree and decides nothing per
    route, an entry's history comes from git while a screen's database writes do not, and
    `cairn-audit` holds the screen to the engine's rules. Then the one-line contract: the steps
    build a screen that renders inside the admin shell, enforces the site's access map on its
    reads and writes, records each write in the audit trail, and passes `cairn-audit`. It names the
    signups screen as the worked example and says a scaffolded site does not ship it. It says the
    dialog-form, row-detail, and animation sections apply only to a screen with that feature. It
    routes a reader with another kind of markdown content to a concept instead (Define an adapter
    and schema), right after the model, since that is the decision the first reader may be
    weighing. The facts behind these claims are the intro fact items placed under Before you
    begin.
  priorKnowledge: |
    A Svelte-fluent developer: SvelteKit routes, `load` functions, form actions, `enhance`, and
    server hooks (`handle` and `sequence`); Svelte 5 snippets and runes; Cloudflare D1 bindings in
    `wrangler.jsonc`. The page explains none of these and links the vendor docs where a step
    depends on a vendor detail.
  notCovered: |
    Each out-of-scope subject names its page, subject first: declaring the access map and changing
    who reaches a screen (Restrict admin access); adding the screen to the sidebar (Arrange the
    admin sidebar); why an access map is not a whitelist (Security model); configuring the audit
    for the whole site, including rendered runs, suppressions, and allowlists (Run cairn-audit on
    your site); and the media upload protocol (Configure media). The first two are named
    sentences in the introduction; the remaining three are folded into one sentence that defers to
    See also. The audit norms' former values are not covered anywhere on the page.
orderReason: |
  The order follows the build's dependencies, not the outline's covers inventory. Before you begin
  states the preconditions and draws the admin directory first (the Django exemplar's file tree
  device), so the reader sees where the new directory goes. A screen cannot be gated until its
  route exists, so Place the route comes first and Gate it second. The action wrapper must be
  chosen before the actions are written, so Choose the action wrapper sits between the read-side
  gate and the write-side wrapping, and Gate it names the wrapper only as the next section's
  choice. The nested-route inheritance rule is stated in Gate it as explanation, while its two
  actions are steps of Load row detail on demand, where the reader first creates a nested route.
  The audit sink is wired after the wrapper because the wrapper emits the records the sink
  persists, and its hooks change composes with the guard the reader already has. Markup follows
  the server side: the toolkit first (what to build with), then styling (how its classes compile
  and follow the corner ladder). The two conditional recipes, the dialog form and the row detail,
  follow styling because each builds on markup and classes already in place. Motion comes last of
  the markup sections because it is a constraint the audit enforces over markup that already
  exists. Verify the screen closes the task by checking all four duties in the order they were
  built, the failure path for a missing audit record follows, and See also ends the page, as the
  task-guide anatomy requires. One aside breaks the single running example: Compose the screen from
  the toolkit shows a smaller, toolkit-only Events screen, because the only shell-hosted
  reproduction story transcribes that snippet, and its lead-in marks it as an aside. Departures
  from the covers: covers 10 and 11 (toolkit props that change behavior, and the engine
  components' override props) are delivered by link sentences to their reference entries, except
  `data-cairn-inert-cell`, which a row-detail step needs; cover 9's "citing admin-design-system by
  heading" is met by the cairn-audit reference's headings, because the design system document is
  internal; cover 14's `npx cairn-audit` becomes `npm run check:cairn`, which compiles the site
  admin sheet first and then runs `cairn-audit`; cover 4's suggested heading "Wire the AuditSink"
  becomes "Wire the audit sink", because the reference and two extend pages already link
  `#wire-the-audit-sink`.
preconditions:
  - scaffolded-site
  - access-rule
  - data-db
  - audit-db
sections:
  - heading: Before you begin
    opens: |
      The steps assume a scaffolded site, an access-map rule for the screen's route, a D1 database
      bound for the screen's data, and a D1 database prepared for the audit trail.
    items:
      - id: intro-boundary
        kind: fact
        fact: "f:bhyvqg"
        use: |
          Backs the introduction's opening statement only: cairn owns markdown content and the
          admin frame, and a site's own data and domain logic belong to the developer, served
          through a thin seam rather than a built-in feature. Not restated in this section.
      - id: intro-toolkit
        kind: fact
        fact: "f:9xthnq"
        use: |
          Backs the introduction's model sentence only: a developer's route under `/admin` renders
          as a child of `CairnAdminShell`, can adopt the admin toolkit, and sits behind the same
          `/admin` sign-in guard. Not restated in this section.
      - id: intro-guard-split
        kind: fact
        fact: "f:2sd4if"
        use: |
          Backs the introduction's first "why" only: the guard gates the whole `/admin` subtree
          and decides no per-route authorization.
      - id: intro-git-history
        kind: fact
        fact: "f:hcydfe"
        use: |
          Backs the introduction's audit "why" only: an entry's history and attribution come from
          git, which is why a screen's writes to its own database need the audit trail as their
          record. State only the git-history half; the history screen and Revert stay off the
          page.
      - id: intro-audit-scope
        kind: fact
        fact: "f:326755"
        use: |
          Backs the introduction's audit-scope "why" only: the default scan scope names
          `src/routes/admin`, so `cairn-audit` applies the engine's rules to a custom screen.
      - id: intro-worked-example
        kind: fact
        fact: "f:onqm6k"
        use: |
          Backs the introduction's worked-example sentence: the signups screen is the example
          site's custom admin screen and the scaffold does not ship it. Also backs this section's
          sentence that the reader's own screen follows the same shape.
      - id: bb-precondition-list
        kind: sentence
        mode: claim
        text: |
          A bulleted list of four preconditions, each with a link to what produces it: a site that
          `create-cairn-site` scaffolded (or a hand-built site brought to the same shape); an
          access-map rule for the screen's route, declared on the adapter; a D1 database bound for
          the screen's data, with its own migrations directory; a D1 database prepared for the
          audit trail.
      - id: bb-access-rule
        kind: fact
        fact: "f:3z1uxv"
        use: |
          The access-rule precondition: a scaffolded site's adapter declares no `access` member,
          so it starts with no rule for a new screen; the example site's adapter declares
          `'/admin/signups': ['owner']`, the rule its signups load and actions resolve against.
          Leave out the `theme-kit` rule.
      - id: bb-restrict-link
        kind: link
        target: restrict-admin-access.md
      - id: bb-no-second-db
        kind: fact
        fact: "f:n7t4bn"
        use: |
          The data-database precondition: a scaffolded site binds `AUTH_DB` and no second
          database, so the screen's data needs a D1 database the site binds itself, as the
          example site binds `APP_DB` for its signups screen. Do not list the other bindings.
      - id: bb-migrations-dir
        kind: fact
        fact: "f:nv0ok0"
        use: |
          The data-database precondition's second clause: the second database takes its own
          migrations directory, because `wrangler d1 migrations apply` walks one directory per
          database; the example site keeps its `signups` table in `migrations-app/0000_signups.sql`
          and points `APP_DB`'s `migrations_dir` there.
      - id: bb-d1-binding-link
        kind: link
        target: https://developers.cloudflare.com/d1/worker-api/
      - id: bb-audit-db-link
        kind: link
        target: ../reference/sveltekit.md#created1auditsink
      - id: bb-hand-built-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: bb-admin-files
        kind: fact
        fact: "f:b8rkq9"
        use: |
          The sentence before the tree: the setup command writes the admin layout pair and the
          `[...path]` catch-all pair into `src/routes/admin/`, and a new screen adds one directory
          beside them.
      - id: bb-tree
        kind: code
        source: ../../templates/waymark/src/routes/admin
        text: |
          A plain-text tree of `src/` holding `hooks.server.ts`, `admin.css`, and `routes/admin/`
          with `+layout.server.ts`, `+layout.svelte`, and `[...path]/` (its `+page.server.ts` and
          `+page.svelte`), plus one directory the steps add, `signups/` with `+page.server.ts` and
          `+page.svelte`, marked as the new screen (the example site's name for it). Nothing else.
      - id: bb-handoff
        kind: handoff
        text: |
          The first step creates that directory.
  - heading: Place the route
    opens: |
      A route directory under `src/routes/admin/` is the whole registration: SvelteKit resolves it
      ahead of the engine's `[...path]` catch-all, and the shared admin layout renders it inside
      `CairnAdminShell`.
    items:
      - id: route-precedence
        kind: fact
        fact: "f:03zj56"
        use: |
          The opening sentence's first clause: SvelteKit resolves the more specific route first,
          so the custom route wins over the catch-all with no configuration.
      - id: route-shell-children
        kind: fact
        fact: "f:brfitv"
        use: |
          The opening sentence's second clause, and the sentence after the steps: every `/admin/**`
          route renders as the shell's children with the nav, user, and theme, with no wrapper
          code and no registration.
      - id: s-route-dir
        kind: step
        text: |
          In `src/routes/admin/`, create a directory named for the screen.
        requires: [scaffolded-site]
        produces: [route-dir]
      - id: s-route-files
        kind: step
        text: |
          In that directory, create `+page.server.ts` for the load and the actions, and
          `+page.svelte` for the markup.
        requires: [route-dir]
        produces: [route-files]
      - id: route-branding
        kind: fact
        fact: "f:qz4gj2"
        use: |
          What the shell withholds, in two sentences after the steps: the favicon and sidebar
          brand mark are fixed to the cairn glyph and wordmark, and `siteName` is the only site
          identity the shell shows, in the page title and the topbar.
      - id: route-chrome
        kind: fact
        fact: "f:g7zuji"
        use: |
          The root-layout rule: the site's root layout renders no visible chrome around `/admin`,
          since a header, footer, or width cap stops the shell filling the viewport; in dev only, a
          check logs one console error when an ancestor caps the shell's width, and it never throws
          or changes rendering. Leave out the function names.
      - id: x-chrome-wrap
        kind: failure
        symptom: |
          The admin shell does not fill the viewport, and in dev the console shows one error about
          a width cap on an ancestor of the admin root.
        cause: |
          Fires on any visit to `/admin` when the site's root layout wraps every route, the admin
          included, in a header, footer, or width cap.
        handledBy: l-chrome-free
      - id: l-chrome-free
        kind: link
        target: ../reference/admin-routes.md#the-root-layout-must-be-chrome-free
      - id: route-sidebar-link
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: route-handoff
        kind: handoff
        text: |
          Listing the screen in the sidebar is a separate task; the route now needs its access
          check.
  - heading: Gate it
    opens: |
      The screen enforces the site's access map itself, with `requireAccess` in its `load` and an
      access-checking wrapper around every action, because the auth guard admits a session to the
      `/admin` subtree and decides nothing per route.
    items:
      - id: gate-guard-split
        kind: fact
        fact: "f:2sd4if"
        use: |
          The opening sentence's reason: `createAuthGuard` gates the whole subtree before any
          `load` runs and decides no per-route authorization.
      - id: gate-one-map
        kind: fact
        fact: "f:cvzb8z"
        use: |
          One sentence: `requireAccess` and `createSectionAction` read the map from
          `event.locals.cairnAccess`, which the guard sets from the adapter's `access` member, the
          one declaration every reader sees. Leave out the earlier-versions clause and the engine
          screens and sidebar.
      - id: gate-predicate
        kind: fact
        fact: "f:10ojk8"
        use: |
          `requireAccess` and every `createSectionAction` wrapper share one fail-closed predicate,
          so a session the map does not admit is refused on the read and on the write.
      - id: gate-no-rule
        kind: fact
        fact: "f:3lbdl6"
        use: |
          A route the map has no rule for refuses every session with a 403, owner included.
      - id: gate-check-order-link
        kind: link
        target: ../reference/sveltekit.md#createsectionaction
      - id: gate-dispatch
        kind: fact
        fact: "f:chsstm"
        use: |
          Why an action needs its own check: SvelteKit dispatches a matched form action without
          re-running `load`, and a hand-rolled action that skips the access check and the audit
          call admits any signed-in session to the write and records nothing.
      - id: s-gate-load
        kind: step
        text: |
          In the screen's `+page.server.ts`, call `requireAccess` in `load` before it reads
          anything. A procedure of one step, written as a single bulleted item.
        requires: [route-files, access-rule, data-db]
        produces: [load-gated]
      - id: gate-signups-load
        kind: fact
        fact: "f:onqm6k"
        use: |
          The sentence before the snippet: the signups `load` calls `requireAccess`, then reads the
          `signups` table through `env.APP_DB` from `cloudflare:workers`, failing closed with a 500
          when the binding is absent.
      - id: gate-load-code
        kind: code
        source: ../../examples/showcase/src/routes/admin/signups/+page.server.ts#load
        text: |
          The example site's `load` and its `requireAppDb` helper with the imports they use,
          minus the logger call and the comments, so the snippet shows `requireAccess(event)`
          before the read and the 500 on an absent binding.
      - id: gate-nested
        kind: fact
        fact: "f:lmtfkt"
        use: |
          As explanation after the snippet, never as a step: a route nested under the screen
          inherits the guard but never the screen's `requireAccess` rule, so a detail endpoint
          calls `requireAccess` itself and takes its own access-map entry. Point at Load row
          detail on demand, where those two actions are steps.
      - id: gate-nested-link
        kind: link
        target: "#load-row-detail-on-demand"
      - id: gate-handoff
        kind: handoff
        text: |
          An action gets its access check from a wrapper, which the next section chooses.
  - heading: Choose the action wrapper
    opens: |
      A screen whose actions write through a database binding wraps them in `createSectionAction`,
      and a screen with no binding uses `createAdminAction` with its `access` option set.
    items:
      - id: choose-binding
        kind: fact
        fact: "f:hroqbu"
        use: |
          The opening sentence: `createSectionAction` requires a `resolveDb` binding resolver, and
          a site that wants only the CSRF-plus-audit contract with no binding stays on
          `createAdminAction`. Also the table's "needs a binding" row.
      - id: s-choose-wrapper
        kind: step
        text: |
          In the screen's server file, import the wrapper that matches whether its actions write
          through a binding. A procedure of one step, written as a single bulleted item.
        requires: [route-files]
        produces: [wrapper-chosen]
      - id: choose-table
        kind: sentence
        mode: claim
        text: |
          A table comparing the two wrappers, introduced by a complete sentence, with four rows:
          when each checks the access map (every call; only when the `access` option is set),
          how each refuses a session (returns `fail(403)`; throws `error(403, ...)`), whether it
          needs a binding (yes, through `resolveDb`; no), and how a refusal is recorded (audited
          and logged as `auth.access.refused`, for both).
        facts: ["f:xbjxit", "f:hroqbu"]
      - id: choose-refusals
        kind: fact
        fact: "f:xbjxit"
        use: |
          The table's access-check, refusal, and record rows, and one sentence after the table:
          `createSectionAction`'s `deniedMessage` option replaces its 403 copy, while
          `createAdminAction`'s message is fixed. Leave out the default message text.
      - id: choose-example
        kind: sentence
        mode: claim
        text: |
          The signups screen writes through `APP_DB`, so the rest of the page uses
          `createSectionAction`.
        facts: ["f:onqm6k"]
      - id: choose-admin-action-link
        kind: link
        target: ../reference/sveltekit.md#createadminaction
      - id: choose-handoff
        kind: handoff
        text: |
          The next section builds the wrapper and wraps each action.
  - heading: Wrap the actions
    opens: |
      One `createSectionAction` call builds the section's wrapper, and each form action passes its
      handler and its audited `action` and `entity` to that wrapper.
    items:
      - id: wrap-factory
        kind: fact
        fact: "f:3j02dk"
        use: |
          The opening sentence: one call builds a reusable per-section wrapper, and `resolveDb`
          reads the site's binding off the Worker env the engine takes from `cloudflare:workers`.
      - id: wrap-env
        kind: fact
        fact: "f:esp93u"
        use: |
          Before the steps: `Env` is a type parameter for the site's own platform bindings, the
          engine ships no `Env` type for them, `resolveDb` receives `Env | undefined`, and the
          example site passes the generated `Env` from `worker-configuration.d.ts`.
      - id: f-wrap-env-infer
        kind: fact
        fact: "f:pmmtdv"
        use: |
          Before the steps, and the handler for the step's typecheck failure: `Env` does not infer
          from an unannotated `resolveDb` parameter, so the site annotates that parameter or passes
          explicit type arguments; otherwise `Env` becomes `unknown` and binding reads stop
          typechecking.
      - id: s-build-wrapper
        kind: step
        text: |
          In the screen's server file, build one wrapper with `createSectionAction`, passing a
          `resolveDb` that reads the section's binding.
        requires: [wrapper-chosen, data-db]
        produces: [section-wrapper]
        canFail: true
      - id: x-env-unknown
        kind: failure
        from: s-build-wrapper
        symptom: |
          A binding read off the `resolveDb` parameter fails to typecheck, because `Env` resolved
          to `unknown`.
        handledBy: f-wrap-env-infer
      - id: s-wrap-handlers
        kind: step
        text: |
          In the exported form actions, wrap each handler in that wrapper, passing its `action` and
          `entity`.
        requires: [section-wrapper]
        produces: [actions-wrapped]
      - id: s-owner-only
        kind: step
        text: |
          On the destructive action, add `ownerOnly: true` to the options.
        requires: [actions-wrapped]
        produces: [destructive-owner-only]
      - id: wrap-actions-code
        kind: code
        source: ../../examples/showcase/src/routes/admin/signups/+page.server.ts#actions
        text: |
          The example site's `sectionAction` declaration and its `actions` export (`create` and
          `remove`), minus the comments, continuing the same file as the load snippet.
      - id: wrap-handler-shape
        kind: fact
        fact: "f:pyt58u"
        use: |
          After the snippet, one sentence: each handler receives `{ form, ctx }`, writes through
          `ctx.db`, and calls `ctx.audit` with a `detail` or an `entityId`, with `ownerOnly: true`
          on the destructive `remove`.
      - id: wrap-layering
        kind: fact
        fact: "f:lblh3u"
        use: |
          One sentence: underneath, the wrapper runs `createAdminAction`'s editor identity, CSRF,
          and single form-read work, so a section never calls `createAdminAction` directly.
      - id: wrap-audit-default
        kind: fact
        fact: "f:6vy0ka"
        use: |
          One sentence: the handler's `ctx.audit` takes its `action` and `entity` from the
          wrapper's options unless the call passes either, which is why the snippet's calls name
          only `detail` or `entityId`.
      - id: wrap-resolve-link
        kind: link
        target: "#resolve-a-missing-audit-record"
      - id: wrap-handoff
        kind: handoff
        text: |
          A `ctx.audit` call persists nothing until the site wires an audit sink.
  - heading: Wire the audit sink
    opens: |
      A `ctx.audit` call persists a record only when `hooks.server.ts` sets an audit sink on
      `event.locals.cairnAuditSink`, composed with the auth guard through `sequence`.
    items:
      - id: sink-locals
        kind: fact
        fact: "f:68h31z"
        use: |
          The opening sentence, and the next: the sink is an `AdminActionAuditSink` set on
          `event.locals.cairnAuditSink` in `hooks.server.ts`, typically `createD1AuditSink` over a
          bound D1 database.
      - id: sink-one-handle
        kind: fact
        fact: "f:rurhey"
        use: |
          The file holds exactly one `handle` export, so the sink's handle and the guard compose
          through `sequence`, which runs them in order.
      - id: sink-order
        kind: fact
        fact: "f:6quvqm"
        use: |
          The sink's handle only sets a `locals` field the route reads, so it needs nothing an
          earlier handle sets and works placed after `createAuthGuard`.
      - id: sink-runtime
        kind: fact
        fact: "f:f21bcz"
        use: |
          Only that the scaffold's hooks module picks between the dev backend and
          `createAuthGuard` in one `if`, exports the result as `handle`, and passes both the
          composed `runtime` imported from `#chassis/cairn.server.js`. Leave out the define, the
          opt-in variable, `process.env`, and the earlier-versions clause.
      - id: sink-no-map
        kind: fact
        fact: "f:iwf4nu"
        use: |
          One sentence after the snippet: the access map lives once on the adapter, and
          `createAuthGuard({ runtime })` attaches it, so the hooks file passes no map. Leave out
          the earlier-versions clause.
      - id: s-sink-handle
        kind: step
        text: |
          In `hooks.server.ts`, add a handle that sets `event.locals.cairnAuditSink` to a
          `createD1AuditSink` over the audit database.
        requires: [audit-db, actions-wrapped]
        produces: [sink-handle]
      - id: s-sink-sequence
        kind: step
        text: |
          In the same file, compose that handle after `createAuthGuard({ runtime })` through
          `sequence` in the production branch.
        requires: [sink-handle]
        produces: [sink-wired]
      - id: sink-code
        kind: code
        source: ../reference/sveltekit.md#created1auditsink
        text: |
          An excerpt of `src/hooks.server.ts`: the `wireAuditSink` handle from the
          `createD1AuditSink` entry's example (the `building` guard, `env.AUDIT_DB`, and the
          exported `waitUntil`), and the production branch's assignment
          `handle = sequence(createAuthGuard({ runtime }), wireAuditSink)`. It imports `runtime`
          from `#chassis/cairn.server.js` and imports no access map. Marked as an excerpt, since no
          file in the repository wires the sink.
      - id: sink-building
        kind: fact
        fact: "f:i8pbhc"
        use: |
          The handle checks `building` from `$app/env` before it reads `env.AUDIT_DB`, because
          every `cloudflare:workers` `env` read throws while the build prerenders. Leave out
          `isBuilding()` and the deprecated-alias clause.
      - id: sink-wait-until
        kind: fact
        fact: "f:ph6kjg"
        use: |
          Two sentences: inside a request the handle passes the `waitUntil` that
          `cloudflare:workers` exports and binds nothing; a caller holding an `ExecutionContext`,
          such as a Cron `scheduled` handler, passes `ctx.waitUntil.bind(ctx)`, because the unbound
          method typechecks and then throws `Illegal invocation` in workerd, after which the row can
          be lost.
      - id: sink-fail-open
        kind: fact
        fact: "f:ff3l1u"
        use: |
          The sink returns before the insert settles and logs a rejected write, so a failed insert
          never fails the audited action.
      - id: sink-refusal-cost
        kind: fact
        fact: "f:da6d2z"
        use: |
          The closing paragraph: the wrapper writes an audit row for every refusal its own checks
          make, so a refused caller can fill a persisted table cheaply unless the section sets the
          `rateLimit` option; the 429 for an exceeded limit writes no row, and neither do the
          session and CSRF refusals underneath it. The option's members stay on the reference.
      - id: sink-rate-limit-link
        kind: link
        target: ../reference/sveltekit.md#createsectionaction
      - id: sink-handoff
        kind: handoff
        text: |
          The server side is complete; the screen's markup comes next.
  - heading: Compose the screen from the toolkit
    opens: |
      The screen's markup composes the admin toolkit's primitives, the same set the engine's own
      screens compose, in place of a hand-rolled table, list, or field.
    items:
      - id: compose-same-set
        kind: fact
        fact: "f:5t1i7o"
        use: |
          The opening sentence, and one more: the engine's `ManageEditors` screen builds from the
          toolkit's `PageHeader` and `AdminTable`.
      - id: s-import-toolkit
        kind: step
        text: |
          In the screen's `+page.svelte`, import the primitives it needs from
          `@glw907/cairn-cms/admin-toolkit`.
        requires: [route-files]
        produces: [screen-markup]
      - id: s-csrf-field
        kind: step
        text: |
          In each form that posts to one of the screen's actions, mount a `CsrfField` from
          `@glw907/cairn-cms/admin`.
        requires: [screen-markup, actions-wrapped]
        produces: [forms-csrf]
      - id: compose-csrf
        kind: fact
        fact: "f:fers77"
        use: |
          Under the CsrfField step: the guard refuses an admin form POST whose CSRF field is
          missing or wrong with a 403, logged as `guard.refused` with `reason: csrf`; inside the
          shell the field takes no `token` prop; the example site's signups screen mounts one in
          its `create` form and its `remove` form. Leave out the clause that says the scaffold
          ships the screen.
      - id: compose-aside-lead
        kind: sentence
        mode: claim
        text: |
          A lead-in that marks the switch: a smaller screen shows the toolkit alone, an Events
          list that composes three primitives with the table inside a card. It is an aside, never
          a second screen to build.
      - id: compose-jobs
        kind: fact
        fact: "f:clyg9r"
        use: |
          A bulleted list of the three primitives the Events snippet uses and the job of each:
          `PageHeader` (the eyebrow, title, and meta band), `AdminTable` (the table chrome around
          the caller's header and row markup), and `StatusChip` (a status chip). Leave the other
          primitives to the reference.
      - id: compose-events-code
        kind: code
        source: ../../src/lib/reproductions/stories/CustomScreen.svelte
        text: |
          The Events screen: `PageHeader`, `AdminTable` with `header` and `children` snippets, and
          a `StatusChip` per row, with the table wrapped in a `div` carrying `overflow-hidden
          card-shell card-shadow`. Word for word with the story file, which must stay in lockstep.
      - id: compose-figure
        kind: figure
        source: toolkit/custom-screen
        text: |
          The reproduction of the Events screen rendered inside the admin shell, below the
          shell's topbar: the page header with its eyebrow, title, and count, and each row's
          status as a chip. A `repro` fence directly after the snippet.
      - id: compose-wrapper-div
        kind: fact
        fact: "f:8x0qpa"
        use: |
          After the figure: the wrapping `div` carries `overflow-hidden card-shell card-shadow` and
          never `overflow-x-auto`, because `AdminTable` sets its own horizontal scroll.
      - id: compose-charter
        kind: fact
        fact: "f:mfa5vi"
        use: |
          The toolkit admits general-purpose primitives only, so a component that renders one of
          cairn's content concepts does not belong in it.
      - id: compose-graduation
        kind: fact
        fact: "f:asujoi"
        use: |
          A primitive graduates into the toolkit from a site's own screens once it has a second
          real consumer, as `ExpandableRow` did.
      - id: compose-upgrades
        kind: fact
        fact: "f:7m5o61"
        use: |
          Each primitive ships its compiled classes and scoped styles with the package, so a later
          release still renders it under the site's route with no change on the site's side.
      - id: compose-toolkit-link
        kind: link
        target: ../reference/admin-toolkit.md
      - id: compose-admin-link
        kind: link
        target: ../reference/admin.md
      - id: compose-handoff
        kind: handoff
        text: |
          Two no-claim link sentences close the section: the admin toolkit reference lists every
          export with its props, the props that change a primitive's behavior included, and the
          admin components reference lists the engine's components a screen can mount beside the
          toolkit, with each one's props.
  - heading: Style the screen
    opens: |
      The screen's utility classes compile only through the site admin sheet, `src/admin.css`,
      which a scaffolded site already builds, and the admin's design reaches the screen through
      stock daisyUI classes.
    items:
      - id: style-site-sheet
        kind: fact
        fact: "f:vkfd7b"
        use: |
          The opening sentence and the sheet paragraph: `src/admin.css` turns off automatic source
          detection, scans `./routes/admin` and `./lib/admin` through `@source`, then imports
          `@glw907/cairn-cms/admin-sources.css`; `build:admin-css` compiles it to
          `.cairn/admin.css`, which `src/routes/admin/+layout.svelte` imports, so a screen's
          classes compile only when its file sits under a scanned root.
      - id: style-pre-scripts
        kind: fact
        fact: "f:666eg6"
        use: |
          The scaffold's `predev`, `prebuild`, and `precheck` scripts run that compile, so a build
          needs no separate admin-stylesheet step.
      - id: style-packaged-sheet
        kind: fact
        fact: "f:zpi2ux"
        use: |
          The engine's packaged admin sheet scans only the engine's admin components and the
          toolkit, so the site's markup never feeds it.
      - id: style-config-link
        kind: link
        target: ../reference/cairn-audit.md#configuration
      - id: s-markup-roots
        kind: step
        text: |
          Under `src/routes/admin` or `src/lib/admin`, keep every file that holds the screen's
          markup.
        requires: [screen-markup]
        produces: [markup-scanned]
      - id: style-idiom
        kind: fact
        fact: "f:k6aopn"
        use: |
          Under the first step: the admin is built in daisyUI and Tailwind, the idiom a custom
          screen extends.
      - id: style-daisyui
        kind: fact
        fact: "f:9rxw92"
        use: |
          Under the first step: every daisyUI component and utility class except calendar
          compiles into the admin sheet, so the screen uses any of them without a safelist entry.
      - id: s-corner-classes
        kind: step
        text: |
          In the screen's markup, give each rounded corner `rounded-selector`, `rounded-field`, or
          `rounded-box`, never a fixed Tailwind radius such as `rounded-lg`.
        requires: [screen-markup]
        produces: [corners-on-ladder]
      - id: style-fixed-radius
        kind: fact
        fact: "f:2babfl"
        use: |
          Under the second step: a fixed Tailwind radius still compiles in the admin sheet but does
          not follow the corner ladder.
      - id: style-ladder
        kind: fact
        fact: "f:9oa6sk"
        use: |
          Under the second step: both admin themes set daisyUI's radius tokens as a three-step
          ladder, `--radius-selector` for chips and small markers, `--radius-field` for controls,
          and `--radius-box` for cards and dialogs. Name the three tokens; the rem values may be
          left out.
      - id: style-chip
        kind: fact
        fact: "f:bwn0uo"
        use: |
          Under the second step, one sentence: `StatusChip` renders on `--radius-selector`, so it
          is a chip, not a fully rounded pill.
      - id: style-norms
        kind: fact
        fact: "f:39sn8c"
        use: |
          Under the second step: the norms `cairn-audit` measures follow the same ladder, 6px for
          buttons, inputs, and selects, 8px for a card, and 4px for a status chip, and the control
          height bands grow with `--size-field`. Current bands only: leave out every "was" value.
      - id: style-hairline
        kind: fact
        fact: "f:gc0hx3"
        use: |
          After the steps: a bare `btn` with no color, style, selected, or disabled form renders as
          a hairline button. Leave out the sublayer name.
      - id: style-selected
        kind: fact
        fact: "f:5stbq2"
        use: |
          In the same sentence: a `btn` in a selected form, such as `.btn-active` or
          `aria-pressed="true"`, renders as the neutral selected segment. Name two forms and say
          others exist; the full list stays off the page.
      - id: style-status-text
        kind: fact
        fact: "f:q4jyat"
        use: |
          The last sentence: warning or success text uses `cairn-text-warning` or
          `cairn-text-success`, which the packaged sheet defines, because the sheet does not
          compile the bracketed `text-[var(--cairn-warning-ink)]` and
          `text-[var(--color-positive-ink)]` forms.
      - id: style-handoff
        kind: handoff
        text: |
          Two recipes follow for a screen with a dialog form or expanding rows.
  - heading: Build the dialog form
    opens: |
      When a screen collects input in a native `<dialog>` submitted with `enhance`, the form
      survives every result only when its callback handles each of the four result types; a screen
      with no dialog skips this section.
    items:
      - id: dialog-survives
        kind: fact
        fact: "f:jra92k"
        use: |
          The opening sentence, and the four branches under the callback step as a bulleted list:
          on `'failure'`, show the message in the dialog, then call `update()`, which for a
          same-page failure only updates `form` and the page status; on `'error'`, report it in the
          dialog without calling `update()`; on `'success'`, close the dialog before awaiting
          `update()`, so it never sits open through `refreshAll()`; on `'redirect'`, hand the
          result to `update()`. Leave out the `reset` clause.
      - id: dialog-result-types
        kind: fact
        fact: "f:xgy3iu"
        use: |
          One sentence of why before the steps: `enhance` hands the callback one of four result
          types, and SvelteKit's form actions documentation, linked, states what the default
          `update()` does with each. The per-type defaults stay behind the link.
      - id: dialog-svelte-link
        kind: link
        target: https://svelte.dev/docs/kit/form-actions#Progressive-enhancement-Customizing-use:enhance
      - id: s-dialog-element
        kind: step
        text: |
          In the screen's markup, add a `<dialog class="modal">` whose `aria-labelledby` points at
          the dialog's heading.
        requires: [screen-markup]
        produces: [dialog]
      - id: dialog-name
        kind: fact
        fact: "f:tskfz1"
        use: |
          Under the dialog step: an element with the `dialog` role needs an accessible name, and
          the heading supplies one that does not depend on the body text.
      - id: s-dialog-open
        kind: step
        text: |
          In the handler of the button that opens the dialog, call `showModal()`.
        requires: [dialog]
        produces: [dialog-opens]
      - id: dialog-native
        kind: fact
        fact: "f:ho6dxa"
        use: |
          Under the open step: a dialog opened with `showModal()` closes on Escape without script.
          Under the form step: a `<form method="dialog">` is a form element of its own, and nested
          forms are invalid HTML.
      - id: s-dialog-form
        kind: step
        text: |
          Inside the dialog, add the action form with `enhance` applied, as a separate form element
          and never inside a `<form method="dialog">`.
        requires: [dialog, forms-csrf]
        produces: [dialog-form]
      - id: s-dialog-callback
        kind: step
        text: |
          In the `enhance` callback, handle each of the four result types, and never call
          `update()` on `'error'`.
        requires: [dialog-form]
        produces: [dialog-callback]
      - id: dialog-error-reason
        kind: fact
        fact: "f:9fwsz5"
        use: |
          The `'error'` branch's reason: `update()` calls `applyAction`, which renders the nearest
          `+error` page for an `'error'` result and destroys the dialog.
      - id: s-dialog-alert
        kind: step
        text: |
          In the form, mount an empty `role="alert"` paragraph for the failure message.
        requires: [dialog-form]
        produces: [dialog-alert]
      - id: dialog-live-region
        kind: fact
        fact: "f:tkqoia"
        use: |
          Under the alert step: a live region inserted with its text already present is announced
          unreliably, so the paragraph is mounted empty and filled on failure. Leave out the
          polite and assertive clause.
      - id: s-dialog-describedby
        kind: step
        text: |
          On the input, point `aria-describedby` at the alert paragraph.
        requires: [dialog-alert]
        produces: [input-described]
      - id: s-dialog-invalid
        kind: step
        text: |
          On the same input, set `aria-invalid="true"` while its value is the failed one.
        requires: [input-described]
        produces: [input-invalid-state]
      - id: s-dialog-pending
        kind: step
        text: |
          On the submit button, set `disabled` while the request is pending.
        requires: [dialog-form]
        produces: [submit-guarded]
      - id: dialog-a11y
        kind: fact
        fact: "f:5vn194"
        use: |
          Under the `aria-invalid` step: screen readers typically read the error with its field
          when focus moves to the input. Phrase it as common screen-reader behavior, never as a
          guarantee, since the specifications do not require it. Under the pending step: a
          disabled submit cannot fire the action a second time. Leave out the `sr-only` clause,
          since the message is visible in the dialog.
      - id: dialog-code
        kind: code
        source: ../../examples/showcase/src/routes/admin/signups/+page.svelte
        text: |
          An illustrative create dialog that posts to the signups screen's `?/create` action: a
          `SubmitFunction` callback with the four branches, a pending flag, `<CsrfField />`, the
          name and email inputs with the `aria-describedby` and `aria-invalid` wiring, the empty
          `role="alert"` paragraph, and the pending-disabled submit. The example site's own file
          holds the remove confirm dialog, which has no input, so this snippet is written for the
          page on that file's imports and patterns, and the lead-in frames it as illustrative.
      - id: dialog-handoff
        kind: handoff
        text: |
          The second recipe loads detail for rows that expand.
  - heading: Load row detail on demand
    opens: |
      When a screen's rows expand to show detail, the screen fetches each row's detail as its panel
      opens and caches it per row; a screen with no expanding rows skips this section.
    items:
      - id: row-cost
        kind: fact
        fact: "f:uy7vyc"
        use: |
          The opening sentence's reason: a `load` that fetched every row's detail would pay for all
          of them on every visit. Under the cache-hit step: fetching on open and caching per row
          costs only the rows a reader opens.
      - id: row-streaming
        kind: fact
        fact: "f:b5mcea"
        use: |
          The lead-in before the steps: streaming an unawaited promise from `load` does not save
          that work, because the promise starts running when `load` creates it.
      - id: s-detail-route
        kind: step
        text: |
          Under the screen's directory, add the detail endpoint as a nested route that returns one
          row's detail as JSON.
        requires: [route-files]
        produces: [detail-route]
      - id: s-detail-access
        kind: step
        text: |
          In that route's server file, call `requireAccess`.
        requires: [detail-route]
        produces: [detail-gated]
      - id: row-nested
        kind: fact
        fact: "f:lmtfkt"
        use: |
          Under the `requireAccess` step: the nested route needs the call because the screen's
          `requireAccess` rule does not reach it.
      - id: s-detail-map-entry
        kind: step
        text: |
          In the site's access map, add an entry for the nested route, as Restrict admin access
          describes.
        requires: [detail-route, access-rule]
        produces: [detail-mapped]
      - id: row-restrict-link
        kind: link
        target: restrict-admin-access.md
      - id: s-rows-expandable
        kind: step
        text: |
          In the screen's markup, render each row as an `ExpandableRow` inside the `AdminTable`.
        requires: [screen-markup]
        produces: [expandable-rows]
      - id: row-entry-link
        kind: link
        target: ../reference/admin-toolkit.md#expandablerow
      - id: row-colspan
        kind: fact
        fact: "f:vao0dd"
        use: |
          Under the `ExpandableRow` step, the first of three markup rules in a bulleted list: the
          `colspan` the caller passes counts the trailing trigger cell the component adds, since
          the panel's one `<td>` spans it. Under the render step: the panel snippet receives the
          row's `datum`, so it reaches the row's detail without a closure over the row.
      - id: row-th
        kind: fact
        fact: "f:n2bhjw"
        use: |
          The second markup rule: the `header` snippet heads the trigger cell with a
          `<th scope="col">` holding an `sr-only` span, as the signups table does for its actions
          column.
      - id: row-inert
        kind: fact
        fact: "f:pswc3n"
        use: |
          The third markup rule: an interactive summary cell wraps its content in an element with
          `data-cairn-inert-cell`, since `ExpandableRow` ignores a row click inside it, and the cell
          needs no `stopPropagation()`.
      - id: s-open-handler
        kind: step
        text: |
          In the same file, write an open handler for the rows.
        requires: [expandable-rows]
        produces: [open-handler]
      - id: s-connect-handler
        kind: step
        text: |
          On each `ExpandableRow`, connect the open handler as the `ExpandableRow` entry's example
          shows. The step names no prop.
        requires: [open-handler]
        produces: [handler-connected]
      - id: s-cache-hit
        kind: step
        text: |
          In the open handler, return the cached detail when the row already has one.
        requires: [open-handler]
        produces: [cache-read]
      - id: s-fetch-try
        kind: step
        text: |
          Otherwise, in the same handler, call `fetch` for the row's detail inside a `try` block.
        requires: [cache-read, detail-gated, detail-mapped]
        produces: [detail-fetch]
      - id: row-fetch-errors
        kind: fact
        fact: "f:od9mww"
        use: |
          Under the three steps that follow the fetch, one clause each: `fetch` resolves on an
          HTTP error status, so the handler checks `response.ok`; `Response.json()` rejects on a
          body that is not JSON; the detail is cached only after both succeed, so a failed row
          stays retryable.
      - id: s-check-ok
        kind: step
        text: |
          Inside the `try` block, check `response.ok`.
        requires: [detail-fetch]
        produces: [status-checked]
      - id: s-parse-json
        kind: step
        text: |
          In the same block, parse the body with `Response.json()`.
        requires: [status-checked]
        produces: [detail-parsed]
      - id: s-cache-store
        kind: step
        text: |
          In the same block, cache the detail only after the status check and the parse both
          succeed.
        requires: [detail-parsed]
        produces: [detail-cached]
      - id: s-render-panel
        kind: step
        text: |
          In the row's panel snippet, render the cached detail.
        requires: [detail-cached, handler-connected]
        produces: [detail-shown]
      - id: row-code
        kind: code
        source: ../reference/admin-toolkit.md#expandablerow
        text: |
          An illustrative open handler covering the cache-hit, fetch, status, parse, and cache
          steps: a `SvelteMap` keyed by row id, and an async function that returns the cached
          detail, or fetches the detail URL passed in, checks `response.ok`, parses JSON, caches,
          and returns `undefined` on any failure. It names no `ExpandableRow` prop; the entry's
          own example shows the wiring. Framed as illustrative in its lead-in.
      - id: row-handoff
        kind: handoff
        text: |
          A screen that animates any of this meets the admin's motion rules next.
  - heading: Animate the screen
    opens: |
      When a screen animates, `cairn-audit` holds its motion to the same rules as the engine's
      screens, so each transition names its duration and easing with the admin's motion tokens; a
      screen with no motion skips this section.
    items:
      - id: s-motion-tokens
        kind: step
        text: |
          In the screen's markup or scoped `<style>` block, write each duration and easing as a
          `var()` of a motion token, such as `var(--cairn-dur-base)`. A procedure of one step,
          written as a single bulleted item.
        requires: [screen-markup]
        produces: [motion-tokenized]
      - id: motion-tokens
        kind: fact
        fact: "f:017qss"
        use: |
          Both admin theme roots declare a closed set of five durations, `--cairn-dur-instant`
          through `--cairn-dur-settle`, and three curves, `--cairn-ease-standard`,
          `--cairn-ease-entrance`, and `--cairn-ease-exit`. Name the tokens; no value table.
      - id: motion-defaults
        kind: fact
        fact: "f:018sgk"
        use: |
          A `transition-*` utility with no `duration-*` or `ease-*` sibling already animates on
          `--cairn-dur-base` and `--cairn-ease-standard`, which both roots set as Tailwind's
          defaults. Leave out the once-per-run report.
      - id: motion-reduced
        kind: fact
        fact: "f:2p5otw"
        use: |
          Under `prefers-reduced-motion: reduce`, the admin collapses every duration to `0.01ms`,
          and only a paint transition may opt back in, by restating it inside the same guard with
          `!important`.
      - id: motion-rule-property
        kind: fact
        fact: "f:09g8ev"
        use: |
          Only the rule's name and standing in one bulleted list item: `motion-property` is an
          error-tier, admin-only rule that limits which properties a transition may name. The
          property list and its messages stay on the reference.
      - id: motion-rule-vocabulary
        kind: fact
        fact: "f:0aa9tp"
        use: |
          Only in one bulleted list item: `motion-vocabulary` is an error-tier, admin-only rule that
          fails a literal duration or easing not written as a motion token. The notes and messages
          stay on the reference.
      - id: motion-rule-hover
        kind: fact
        fact: "f:0mbj5n"
        use: |
          Only in one bulleted list item: `motion-hover-gate` is an error-tier, admin-only rule that
          fails a hand-authored `:hover` motion rule outside `@media (hover: hover)`. The pair
          handling and the tests stay on the reference.
      - id: motion-scope
        kind: fact
        fact: "f:t767qb"
        use: |
          The three rules read the components under `static.adminScope`, which defaults to
          `src/routes/admin`, `src/lib/admin`, and `src/lib/admin-toolkit`; a site whose screens
          live elsewhere names their roots under that key.
      - id: motion-css-files
        kind: fact
        fact: "f:22odbz"
        use: |
          Only the admin-only half: the three rules read a `static.cssFiles` entry only when it lies
          under an admin root. Leave out `token-colors`, `motion-band`, and `reduced-motion`.
      - id: motion-config-link
        kind: link
        target: ../reference/cairn-audit.md#configuration
      - id: motion-rules-link
        kind: link
        target: ../reference/cairn-audit.md#the-static-rules
      - id: motion-limits-link
        kind: link
        target: ../reference/cairn-audit.md#what-the-motion-rules-dont-cover
      - id: motion-handoff
        kind: handoff
        text: |
          For what each rule checks, the static rules table is the reference; the exemptions and
          the frame-offset allowance sit under its coverage limits.
  - heading: Verify the screen
    opens: |
      The screen passes when it renders inside the shell, its `load` refuses a session the map does
      not admit, it leaves an audit row for each write, and it clears the error tier of
      `cairn-audit`.
    items:
      - id: verify-env-lead
        kind: sentence
        mode: claim
        text: |
          A lead-in before the checks: the browser and audit-row checks run against a site served
          through the auth guard, either a default build served by `npm run build` and then
          `npm run preview` (which runs `wrangler dev`) or the deployed site, never under
          `npm run dev`. Under `npm run dev`, the hooks module takes the dev-backend branch, which
          mints an owner session on every `/admin` request and wires no audit sink, so the refusal
          check and the audit-row check cannot pass there.
        facts: ["f:f21bcz", "f:dqjkci", "f:xluud1", "f:vh5aw8"]
      - id: verify-dev-branch
        kind: fact
        fact: "f:f21bcz"
        use: |
          The lead-in only: `npm run dev` sets the dev-backend opt-in, so the hooks module's one
          `if` takes the `devBackendHandle` branch instead of `createAuthGuard`. Leave out the
          `process.env` fallback mechanics and the earlier-versions clause.
      - id: verify-dev-owner
        kind: fact
        fact: "f:dqjkci"
        use: |
          The lead-in only: the dev backend mints an owner editor on every `/admin` request, so
          under `npm run dev` every session is an owner and no refusal can be observed. Leave out
          the fake bindings and the in-memory GitHub Backend.
      - id: verify-default-build
        kind: fact
        fact: "f:xluud1"
        use: |
          The lead-in only: `__CAIRN_DEV_BUILD__` is `false` in a default build, so a build served
          by `npm run preview` runs the guard branch. Leave out the manifest plugin and the
          `VITE_CAIRN_E2E` build.
      - id: verify-preview-script
        kind: fact
        fact: "f:vh5aw8"
        use: |
          The lead-in only: the scaffold's `preview` script runs `wrangler dev` on port 4173 once
          `npm run build` has run. Leave out the rendered `cairn-audit` run and `BASE_URL`.
      - id: s-verify-open
        kind: step
        text: |
          In a browser signed in as an owner, open the screen under `/admin`. Observable result:
          the screen renders as the children of `CairnAdminShell`, with the shell's nav, user, and
          theme.
        requires: [load-gated]
        produces: [screen-open]
        canFail: true
      - id: x-owner-403
        kind: failure
        from: s-verify-open
        symptom: |
          The owner gets a 403 on the screen.
        cause: |
          The access map has no rule for the route, which refuses every session, owner included.
        handledBy: l-verify-restrict
      - id: verify-no-rule
        kind: fact
        fact: "f:3lbdl6"
        use: |
          The one diagnostic sentence under the first check: a 403 here means the map has no rule
          for the route, since a route with no rule refuses every session, owner included.
      - id: l-verify-restrict
        kind: link
        target: restrict-admin-access.md
      - id: s-verify-refused
        kind: step
        text: |
          In a second browser, signed in as a second editor whose role the screen's rule does not
          name, open the screen. Say where that account comes from: an owner adds it through the
          Add editor form on `/admin/editors`, choosing such a role in its Role select (for the
          signups rule, `editor`), as Restrict admin access describes under Assign the roles.
          Observable result: `requireAccess` refuses the session with a 403.
        requires: [screen-open]
        produces: [refusal-checked]
      - id: verify-add-editor
        kind: fact
        fact: "f:2dgbff"
        use: |
          Only that `/admin/editors` carries an Add editor form with a Role select listing the
          declared roles, which is where the second editor comes from. Leave out the option-label
          rule.
      - id: l-verify-assign-roles
        kind: link
        target: restrict-admin-access.md#assign-the-roles
      - id: s-verify-submit
        kind: step
        text: |
          In a browser signed in as an owner, submit one of the screen's actions.
        requires: [actions-wrapped, forms-csrf]
        produces: [action-submitted]
        canFail: true
      - id: x-submit-csrf
        kind: failure
        from: s-verify-submit
        symptom: |
          The submit returns a 403, and the logs carry `guard.refused` with `reason: csrf`.
        cause: |
          The form that posted has no `CsrfField`.
        handledBy: s-csrf-field
      - id: s-verify-row
        kind: step
        text: |
          In the audit database, query the `audit_log` table for its newest row. Observable result:
          one row for the action, whose `action` and `entity` match the wrapper's options.
        requires: [action-submitted, sink-wired]
        produces: [audit-row-checked]
        canFail: true
      - id: x-no-row
        kind: failure
        from: s-verify-row
        symptom: |
          No row arrives for the action.
        cause: |
          The request ran under `npm run dev`, whose dev-backend branch wires no sink; or a handler
          skipped `ctx.audit`; or no handle set the sink; or the sink's insert failed.
        handledBy: r-check-dev-backend
      - id: verify-row-shape
        kind: fact
        fact: "f:wnvqlz"
        use: |
          Under the query step: each row records the `actor`, `action`, `entity`, `entity_id`, and
          `detail` of one audited action, with an ISO 8601 timestamp. Leave out the migration file
          name.
      - id: verify-row-default
        kind: fact
        fact: "f:6vy0ka"
        use: |
          Under the query step: the row's `action` and `entity` match the wrapper's options unless
          the handler's `ctx.audit` call passes either.
      - id: s-verify-audit
        kind: step
        text: |
          In the site directory, run `npm run check:cairn`.
        requires: [markup-scanned]
        produces: [audit-run]
        canFail: true
      - id: verify-check-cairn
        kind: fact
        fact: "f:mrv24k"
        use: |
          Under the run step: the script compiles the site admin sheet, then runs `cairn-audit`
          over the whole static registry. Leave out the public-scope rules and the missing-peer
          message.
      - id: x-audit-error
        kind: failure
        from: s-verify-audit
        symptom: |
          The command exits 1 and the report lists an unsuppressed error-tier finding.
        handledBy: s-verify-fix
      - id: s-verify-fix
        kind: step
        text: |
          In the report, fix each unsuppressed error-tier finding.
        requires: [audit-run]
        produces: [findings-fixed]
      - id: verify-exit
        kind: fact
        fact: "f:1md5oj"
        use: |
          Under the fix step: only an unsuppressed error-tier finding makes `cairn-audit` exit 1,
          so an advisory finding prints without changing the exit code. After the list: a bare run
          is static, and `--rendered` drives a browser against an already-running server.
      - id: s-verify-rerun
        kind: step
        text: |
          In the site directory, run the script again until no error-tier finding remains.
        requires: [findings-fixed]
        produces: [audit-clean]
      - id: verify-same-rules
        kind: fact
        fact: "f:326755"
        use: |
          After the list: the default scan scope names `src/routes/admin` beside the engine's admin
          sources, so the screen meets the same static rules as the engine's screens, and the
          scaffold's `check:cairn` script is what runs them.
      - id: verify-tiers-link
        kind: link
        target: ../reference/cairn-audit.md#tiers-and-exit-codes
      - id: verify-rendered-link
        kind: link
        target: run-cairn-audit-on-your-site.md
      - id: verify-rendered-rules-link
        kind: link
        target: ../reference/cairn-audit.md#the-rules
      - id: verify-handoff
        kind: handoff
        text: |
          A rendered run for the custom screen is set up on Run cairn-audit on your site; a missing
          audit row is traced next.
  - heading: Resolve a missing audit record
    opens: |
      A missing audit record means the request ran under the dev backend, a handler skipped
      `ctx.audit`, no handle set the sink, or the sink's insert failed.
    items:
      - id: resolve-unaudited
        kind: fact
        fact: "f:07efts"
        use: |
          One sentence before the checks: a handler that returns without calling `ctx.audit`
          throws `UnauditedActionError` in dev and logs `admin.action.unaudited` in production,
          since an error response mid-request would be worse than a gap in the audit trail.
      - id: r-check-dev-backend
        kind: step
        text: |
          In the terminal that serves the site, check that the request ran under a default build
          served by `npm run preview` or on the deployed site, not under `npm run dev`, whose
          dev-backend branch replaces the guard and wires no sink. The checks run in order and form
          a numbered list.
      - id: resolve-dev-branch
        kind: fact
        fact: "f:f21bcz"
        use: |
          Under the first check only: `npm run dev` sets the opt-in, so the hooks module exports
          `devBackendHandle` as `handle` in place of the guard branch where the page composes the
          sink. Leave out the `process.env` fallback mechanics and the earlier-versions clause.
      - id: r-check-audit-call
        kind: step
        text: |
          In the action's handler, check that every successful path calls `ctx.audit` before it
          returns.
      - id: r-check-sink-handle
        kind: step
        text: |
          In `hooks.server.ts`, check that a handle sets `event.locals.cairnAuditSink` and that
          `sequence` composes it into the exported `handle`.
      - id: r-check-write-failed
        kind: step
        text: |
          In Workers Logs, look for `audit.sink.write_failed`, whose reason `wait_until_failed`
          names an unbound `waitUntil`.
      - id: resolve-wait-until
        kind: fact
        fact: "f:ph6kjg"
        use: |
          Under the third check only: the sink logs `audit.sink.write_failed` with reason
          `wait_until_failed` when it receives an unbound `waitUntil`, and the row can be lost.
      - id: resolve-debug-link
        kind: link
        target: debug-your-site.md
      - id: resolve-log-events-link
        kind: link
        target: ../reference/log-events.md
      - id: resolve-handoff
        kind: handoff
        text: |
          Debug your site maps `admin.action.unaudited` to its cause, and the log events reference
          lists both events' fields and the `audit.sink.write_failed` reasons.
