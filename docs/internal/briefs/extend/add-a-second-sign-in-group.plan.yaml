    reason: |
      Neither path composes the admin toolkit: the member area sits outside `/admin`, where the
      toolkit's daisyUI classes are unstyled, and the home screen's composition belongs to Add a
      custom admin screen. The toolkit reference owns its rendering contract.
  - fact: "f:tnvu0a"
