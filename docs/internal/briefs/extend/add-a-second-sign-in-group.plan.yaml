version: 1
page:
  path: docs/extend/add-a-second-sign-in-group.md
  title: Add a second sign-in group
  type: task guide
argument: |
  cairn signs a second group in through one of two mechanisms, and the choice decides every step
  after it. A declared role puts the group in the editors' roster in `AUTH_DB` at `none`
  capability: its people use the editors' magic link, the role is declared once on the adapter and
  read by the guard from the composed runtime, and `/admin` sends them to a screen the site builds,
  which checks the session's role itself. An auth channel built with `createAuthChannel` is a
  separate login over a numeric code, with its own D1 binding, migration, cookie, and sessions that
  never become an editor's, so the site builds the login route and the member area outside
  `/admin` and supplies the delivery, the roster lookup, the normalizer, and the bot challenge the
  factory cannot. Either way cairn signs the people in and the site models them. Each path runs
  from declaration to a deploy and a check that the group signs in on the live site: the role on
  the staff example from the roles reference, the channel on the members channel of the
  repository's example site.
introduction:
  covers: |
    The introduction frames the page from above, then states the contract. It opens on the
    reader's situation, as a statement: some sites need people besides editors to sign in, to
    reach screens or pages made for them. cairn's sign-in exists only to gate the admin, so by
    default it knows the owner and editor pair and signs them in by an emailed magic link. For a
    second group, cairn supplies the sign-in through one of two mechanisms, while what a staff
    member or a member is, and the records kept about them, stay the site's code. It then names
    where each mechanism sits: a declared role joins the editors' roster in `AUTH_DB` at `none`
    capability and lands on a screen the site builds under `/admin`; an auth channel is a separate
    login with its own database and sessions, whose area is the site's routes outside `/admin`.
    It says why the channel exists: for people the owner and editor sign-in was never meant to
    model, with the factory owning the login's security discipline and the site supplying the
    delivery, the roster lookup, and the check that a requester is human. The contract sentence:
    whichever mechanism you choose, by the end the group signs in on your deployed site and lands
    in an area made for it. Then the two running examples, a `staff` role whose `home` is
    `/admin/staff` and the members channel in the repository's example site, `examples/showcase`,
    which signs members in at `/members/login` and gates `/members`. It names the readers who
    arrive: one undecided between the two, one sent from Restrict admin access with a `none` role,
    one sent from the security model to build the channel, and one sent from Replace magic links
    who wants a group beside magic-link editors. The paths share no steps, so a reader who has
    chosen follows one.
  priorKnowledge: |
    A site built through Add cairn to a SvelteKit app or scaffolded by `create-cairn-site`, so its
    hooks file, its adapter module, its Wrangler bindings, and applying a D1 migration are
    familiar; SvelteKit load functions and form actions; and Vitest, for the channel's test. The
    page explains none of these.
  notCovered: |
    Each subject the page leaves out names its page, subject first. A group whose people write the
    site's content: `none` capability closes the engine's content screens, so such a group signs
    in at editor capability and an access map narrows what it reaches (Restrict admin access,
    which also owns access maps themselves). Signing the editors themselves in through the
    organization's identity provider (Replace magic links with Cloudflare Access). The channel's
    threat surface and the hazards a site's delivery function can introduce (the security model's
    auth channel section). A scope sentence may name the page.
  facts: ["f:zxdoaf", "f:nz890r", "f:b3l3t0", "f:nguseg", "f:qqy4uq", "f:4673n6"]
orderReason: |
  The sections follow the task-guide anatomy and the dependency between steps, not the outline's
  covers inventory. Before you begin comes first, as the anatomy requires, and its channel items (a
  transport, a roster store, a Turnstile secret) are themselves a cost the reader weighs in the
  choice that follows. Choose the mechanism is next because the outline's job says the page first
  helps the reader choose and the two paths share no step; it takes the early right-tool callout
  from the Sanity exemplar. The role path comes before the channel because it is shorter and reuses
  the sign-in the site already runs, and a channel reader skips it from the comparison. The role's
  sections run in dependency order: declare the role (the name and `home` every later step uses,
  declared once on the adapter so the hooks need no edit), build the home screen (the path `home`
  names must exist before anyone lands there), show it in the sidebar (the link points at that
  screen), deploy the role (the roles migration, then the `cairn doctor` wiring check on a local
  build so a wiring fault is caught before it goes live, then the deploy that makes the editors
  screen offer the role), add the people (once the deployed screen offers the role), and verify on
  the deployed site (the dev backend mints an owner, so the role cannot be tried locally). The channel's sections follow the
  example site's build order, the Django exemplar's one running example: provision the database
  (the binding `resolveDb` returns, migrated locally so `wrangler dev` serves the channel), write
  the module (it returns the actions the routes call, and its secret steps type the env), build the
  login route (it calls `request` and `confirm`), gate the member area (the login's redirect
  target), end a removed member's sessions (the two removal tools with no route), test on Node (the
  last check before anything goes live), deploy (the remote migration and the production secret
  before the code that reads them), and verify on the deployed site. Both paths end the same way, a
  deploy then a check on the live site. Resolve a failed setup holds both paths' failures in the
  order a reader meets them, and See also closes the page. Departures from the covers: the binding
  comes before the config members, because the module's `resolveDb` returns it; the covers'
  returned actions and helpers are split across the sections that call each one; the home-screen,
  removal, deploy, and verification sections are added; and the test cover keeps its Node floor in
  Before you begin, where the reader needs it.
preconditions:
  - magic-link-site
  - owner-sign-in
  - code-transport
  - roster-store
  - turnstile-widget
  - test-toolchain
sections:
  - heading: Before you begin
    opens: |
      Both mechanisms start from a cairn site whose editors already sign in by magic link, and each
      path adds the items labeled for it.
    items:
      - id: intro-auth-gate
        kind: fact
        fact: "f:zxdoaf"
        use: |
          Only, for the introduction: auth exists only to gate the admin, and the owner and editor
          pair on the magic link is cairn's zero-config default. Not restated in this section.
      - id: intro-default
        kind: fact
        fact: "f:nz890r"
        use: |
          Only, for the introduction: a site that declares no roles gets the owner and editor
          pair, signed in by the email magic link, and `createAuthChannel` is the login factory for
          a second sign-in group. Not restated in this section.
      - id: intro-channel-purpose
        kind: fact
        fact: "f:qqy4uq"
        use: |
          Only, for the introduction's why for the channel: it exists for a group the owner and
          editor sign-in was never meant to model, the site supplies delivery, roster lookup,
          identifier shape, and a bot challenge, and the factory owns code minting and consumption,
          budgets, sessions, and revocation. Omit the subpath wording. Not restated in this
          section.
      - id: bb-owner
        kind: fact
        fact: "f:nj0nfm"
        use: |
          Only: an owner adds people on `/admin/editors`, which is why the role path needs an
          owner's sign-in.
      - id: bb-supplies
        kind: fact
        fact: "f:cf1avu"
        use: |
          Only: the site supplies the channel's delivery function and roster lookup, which is why
          the channel path needs a transport and a roster store.
      - id: bb-challenge
        kind: fact
        fact: "f:ez788q"
        use: |
          Only: `challenge` must actually verify a human, which is why the channel path needs a
          Turnstile widget and its secret key.
      - id: bb-node
        kind: fact
        fact: "f:fcqs22"
        use: |
          Only: the channel's test uses `@glw907/cairn-cms-dev`'s `createChannelDb`, the dev
          package declares `engines.node` `>=24`, nothing enforces that floor at runtime, and npm
          only warns.
      - id: bb-list
        kind: sentence
        mode: claim
        text: |
          A bulleted list of six preconditions, introduced by the opening sentence, each labeled
          with the path it serves and linked to what produces it where a page does: a site whose
          editors sign in by magic link, with the auth database created and migrated; for a role,
          an owner's sign-in; for a channel, a transport the Worker can call to send a code, such
          as an email or SMS provider; for a channel, the group's roster in a store the site's code
          can read; for a channel, a Cloudflare Turnstile widget and its secret key; for the
          channel's test, Node 24 or later and `@glw907/cairn-cms-dev` installed as a dev
          dependency.
        facts: ["f:nj0nfm", "f:cf1avu", "f:ez788q", "f:fcqs22"]
      - id: bb-auth-db-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#create-the-auth-database
      - id: bb-turnstile-link
        kind: link
        target: https://developers.cloudflare.com/turnstile/get-started/
      - id: bb-dev-package-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#wire-the-dev-backend
      - id: bb-handoff
        kind: handoff
        text: |
          Turns to the first decision: which mechanism to build.
  - heading: Choose the mechanism
    opens: |
      A second group signs in either as a declared role in the editors' roster in `AUTH_DB` or
      through a separate login built with `createAuthChannel`.
    items:
      - id: ch-opens
        kind: fact
        fact: "f:b3l3t0"
        use: |
          Only the opening sentence's claim: a declared role, whose members sign in by the same magic link
          and live as rows in `AUTH_DB`'s `editor` table, or `createAuthChannel`, a separate login
          with its own subject, D1 binding, and session.
      - id: ch-table
        kind: sentence
        mode: claim
        text: |
          A table, introduced by a sentence stating that it compares the two mechanisms by where
          each keeps its people and what the site builds, with a column per mechanism and one row
          each for sign-in, roster, sessions, where people land, and what the site builds. The role
          column: the same magic link editors use; rows in the `editor` table of `AUTH_DB`, added by
          an owner on `/admin/editors`; sessions in `AUTH_DB` that populate `locals.cairnEditor`
          with `none` capability; the role's `home` under `/admin`, or a welcome screen; a screen at
          the role's `home`. The channel column: a numeric code, 8 digits by default, sent by the
          site's transport; the site's store, read by the site's `lookup`; sessions in the
          channel's D1 binding, never `AUTH_DB`, and never in `locals.cairnEditor`; the site's
          routes outside `/admin`; the login route, the member area, the delivery, and the roster
          lookup.
        facts: ["f:4673n6", "f:hcjb3o", "f:5t6hz6", "f:7n28wc", "f:we2lmp", "f:dtz8oa", "f:rcpe0n", "f:q7fj6p", "f:cf1avu"]
      - id: ch-fit-role
        kind: sentence
        mode: claim
        text: |
          A role suits a group that an owner adds person by person and that works in screens under
          `/admin`.
        facts: ["f:hcjb3o", "f:7n28wc"]
      - id: ch-fit-channel
        kind: sentence
        mode: claim
        text: |
          A channel suits a group whose roster the site already keeps and that never needs the
          admin.
        facts: ["f:dtz8oa", "f:q7fj6p"]
      - id: ch-domain
        kind: fact
        fact: "f:nguseg"
        use: |
          The sentence after the fit sentences, worded apart from the introduction's: for either
          mechanism, the site's code defines what a member, a staff assignment, or a signup is.
      - id: s-choose
        kind: step
        text: |
          Choose the mechanism the comparison fits. A reader who chooses a channel skips the role
          path and continues at Sign the group in through a channel.
        requires: [magic-link-site]
        produces: [mechanism-chosen]
      - id: ch-skip-link
        kind: link
        target: "#sign-the-group-in-through-a-channel"
      - id: ch-handoff
        kind: handoff
        text: |
          Turns to the role path, which follows.
  - heading: Sign the group in with a role
    opens: |
      A role adds the group to the editors' roster at `none` capability, so its people sign in by
      the magic link and reach only the screens the site builds for them.
    items:
      - id: ra-opens
        kind: fact
        fact: "f:4673n6"
        use: |
          Backs the opening: a `none`-capability role still authenticates through the same
          magic-link flow every editor uses, and the engine's content and roster screens refuse it.
      - id: ra-example
        kind: fact
        fact: "f:pvs115"
        use: |
          Only the running example: a `staff` role declared `{ capability: 'none', home:
          '/admin/staff' }`, the declaration the roles reference uses.
      - id: ra-roles-link
        kind: link
        target: ../reference/core.md#defineroles
      - id: ra-handoff
        kind: handoff
        text: |
          Turns to the declaration: the role starts as one entry in the vocabulary.
  - heading: Declare the role
    level: 3
    opens: |
      A role is one entry in the site's role vocabulary, declared once on the adapter's `roles`
      member, and the guard and the dev backend both read it from the composed runtime.
    items:
      - id: dr-guard
        kind: fact
        fact: "f:4xrx5f"
        use: |
          Only the opening's claim: `createAuthGuard` takes a required `runtime` and reads the declared
          role vocabulary from `runtime.roles`. Omit the earlier-versions clause.
      - id: dr-dev
        kind: fact
        fact: "f:7cv105"
        use: |
          Only: `devBackendHandle` takes the same required `runtime` and reads `runtime.roles`, so
          one declaration serves both handles. Omit the earlier-versions clause; the
          dev-backend-mints-an-owner clause is placed in the verification section.
      - id: dr-module
        kind: fact
        fact: "f:q07rd5"
        use: |
          Only the adapter module's location: `src/theme/cairn.config.ts` on a scaffolded site and
          `src/lib/cairn.config.ts` on the tutorial's site. Omit the clause about the tutorial
          page's hooks.
      - id: s-declare
        kind: step
        text: |
          In the adapter module, set the adapter's `roles` member to a `defineRoles` vocabulary
          that keeps `owner` and `editor` beside the `staff` entry.
        requires: [mechanism-chosen]
        produces: [role-declared]
        optional: true
      - id: c-declare
        kind: code
        text: |
          Illustrative adapter excerpt: a `defineRoles` vocabulary of `owner: 'owner'`,
          `editor: 'editor'`, and `staff: { capability: 'none', home: '/admin/staff' }`, passed as
          `defineAdapter`'s `roles` member, with a comment marking the adapter's other members as
          unchanged. The file comment names the adapter module.
      - id: s-hooks
        kind: step
        text: |
          In `src/hooks.server.ts`, confirm that `createAuthGuard` and `devBackendHandle` each
          receive `{ runtime }`, as the scaffold's hooks do. Where either takes no config, pass
          `{ runtime }`. An older site whose hooks pass `roles` follows Upgrade cairn instead.
        requires: [role-declared]
        produces: [role-wired]
        optional: true
      - id: dr-hooks
        kind: fact
        fact: "f:f21bcz"
        use: |
          Only: the scaffold's hooks module passes the composed runtime to both handles,
          `createAuthGuard({ runtime })` and `devBackendHandle({ runtime })`. Omit the dev-gate
          and earlier-versions clauses.
      - id: dr-upgrade-link
        kind: link
        target: upgrade-cairn.md#when-your-range-crosses-the-one-declaration-change
      - id: dr-keep
        kind: reason
        text: |
          Why the vocabulary keeps `owner` and `editor`: `defineRoles` throws without an `owner`
          key mapped to owner capability, and a roster row whose role the vocabulary omits resolves
          to `none`, so dropping `editor` would close the content screens to every existing editor.
        facts: ["f:dbaklx", "f:zjglk8"]
      - id: dr-owner
        kind: fact
        fact: "f:dbaklx"
        use: |
          Only the missing-`owner` and owner-capability throws, and the throw on a `home` outside
          `/admin`. Omit the rest of the validation list.
      - id: dr-absent
        kind: fact
        fact: "f:zjglk8"
        use: |
          Only: a role name absent from the vocabulary resolves to `none`.
      - id: dr-home
        kind: fact
        fact: "f:pvs115"
        use: |
          The `home` rule: an absolute `/admin`-prefixed path, and the `/admin` index redirects a
          role that declares one there (303) before it looks for a reachable concept.
      - id: dr-welcome
        kind: fact
        fact: "f:7n28wc"
        use: |
          Only the welcome branch, in the sentence after the redirect: a `none`-capability role
          with no `home` gets the welcome view at `/admin`.
      - id: dr-roles-link
        kind: link
        target: ../reference/core.md#defineroles
      - id: dr-handoff
        kind: handoff
        text: |
          Turns to the screen the `home` path needs, which the next section builds.
  - heading: Build the role's home screen
    level: 3
    opens: |
      The home path is a custom admin screen the site builds, and its load function checks the
      session's role itself, so the role needs no access map.
    items:
      - id: hs-session
        kind: fact
        fact: "f:5t6hz6"
        use: |
          Backs the opening: a `none`-capability session is an ordinary row in `AUTH_DB`'s `editor`
          table and populates `locals.cairnEditor` like an editor's, with `capability` resolved to
          `none`, so the screen reads `role` from it.
      - id: s-route
        kind: step
        text: |
          In the site's admin routes, create the route for `/admin/staff`, as Add a custom admin
          screen describes.
        requires: [role-declared]
        produces: [home-route]
        optional: true
      - id: hs-route-link
        kind: link
        target: add-a-custom-admin-screen.md#place-the-route
      - id: s-gate
        kind: step
        text: |
          In the screen's `+page.server.ts`, make the load function call `requireSession` and
          answer 403 to any session whose `role` is not `staff`.
        requires: [home-route]
        produces: [home-screen]
        optional: true
      - id: c-gate
        kind: code
        source: ../../src/lib/sveltekit/guard.ts#requireSession
        text: |
          The screen's server file, `src/routes/admin/staff/+page.server.ts`: a load function that
          calls `requireSession(event)`, throws `error(403, ...)` when the session's `role` is not
          `staff`, and returns the display name.
      - id: hs-session-only
        kind: fact
        fact: "f:8anql1"
        use: |
          Only: `requireSession` redirects to login when there is no session and does not consult
          the access map. Omit every `requireAccess` clause.
      - id: hs-why
        kind: reason
        text: |
          Why the screen checks the role in place of `requireAccess`: the check works whether or not
          the site declares an access map, while `requireAccess` refuses a `none` session unless a
          route rule in the map names its role.
        facts: ["f:8anql1", "f:5sx6zl"]
      - id: hs-map-alt
        kind: fact
        fact: "f:5sx6zl"
        use: |
          Only: `canReach` admits a `none`-capability session to a route path only when the deepest
          matching map key lists its role, and `requireAccess` and `createSectionAction` inherit
          that admit, so a site that keeps an access map may instead add a route rule naming
          `staff` and gate with `requireAccess`. Omit the list of targets that stay refused.
      - id: hs-map-link
        kind: link
        target: restrict-admin-access.md
      - id: hs-action
        kind: reason
        text: |
          Why an action on the screen repeats the check: SvelteKit runs a form action without its
          page's load function, so the action's handler checks the session's role too. Add a custom
          admin screen compares the two action wrappers' access checks.
      - id: hs-action-link
        kind: link
        target: add-a-custom-admin-screen.md#choose-the-action-wrapper
      - id: hs-handoff
        kind: handoff
        text: |
          Turns to the sidebar, which shows the screen's link to the role.
  - heading: Show the home screen in the sidebar
    level: 3
    opens: |
      A `navLayout` entry with a `roles` list shows the home screen's link only to the roles it
      names.
    items:
      - id: sb-opens
        kind: fact
        fact: "f:16paho"
        use: |
          Only the opening and the validation sentence: an entry's optional `roles` list names
          declared role names, and a name the vocabulary does not declare fails validation. Omit
          the section clause.
      - id: sb-where
        kind: fact
        fact: "f:ys1iq1"
        use: |
          Only: `navLayout` is declared on the adapter's `editor` group.
      - id: s-nav
        kind: step
        text: |
          In the adapter module, add a `navLayout` entry for `/admin/staff` to the adapter's
          `editor` group, with `roles` set to the `staff` role.
        requires: [home-screen]
        produces: [nav-entry]
        optional: true
      - id: c-nav
        kind: code
        text: |
          Illustrative adapter excerpt: the `editor` group's `navLayout` holding one entry with a
          `label`, an `icon` from the `NavIcon` set, `href: '/admin/staff'`, and
          `roles: ['staff']`, beside the `roles` member, with a comment marking the adapter's other
          members as unchanged.
      - id: sb-visible
        kind: fact
        fact: "f:altcjp"
        use: |
          Only: an entry whose `href` no access-map key matches stays visible to every session that
          can see the sidebar, which is why the entry carries the `roles` list.
      - id: sb-not-auth
        kind: reason
        text: |
          Why the link is not the gate: the screen's role check refuses everyone else, whatever the
          sidebar shows.
      - id: sb-sidebar-link
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: sb-handoff
        kind: handoff
        text: |
          Turns to the deploy, now that the screen and its link exist.
  - heading: Deploy the role
    level: 3
    opens: |
      The role reaches the deployed site once `AUTH_DB` carries `0001_roles.sql`, the migration that
      lets the roster hold a role beyond owner and editor, and a local build passes the role-wiring
      check.
    items:
      - id: ap-migration
        kind: fact
        fact: "f:rn62i1"
        use: |
          Only the opening, the copy step, and its caution: the migration is needed once a site
          declares a vocabulary beyond owner and editor; the scaffold ships it, so a scaffolded
          site already has the file, and an existing site without it copies it from the package;
          the rebuild keeps only the engine's four `editor` columns, so a site that added its own
          columns carries them across first. Omit the `0003_preview.sql` clause.
      - id: s-copy-roles
        kind: step
        text: |
          In the project directory, copy `0001_roles.sql` from the package's `migrations` directory
          into the site's `migrations` directory. A site whose `migrations` directory already holds
          the file skips this step.
        requires: [role-declared]
        produces: [roles-migration-file]
        optional: true
      - id: s-apply-roles
        kind: step
        text: |
          In the project directory, apply the migrations to the remote auth database with
          `wrangler d1 migrations apply` and the `--remote` flag.
        requires: [roles-migration-file]
        produces: [roles-migrated]
        optional: true
      - id: ap-apply
        kind: fact
        fact: "f:xxtooz"
        use: |
          Only the apply command, `wrangler d1 migrations apply <database> --remote`. Omit the
          count of shipped migrations.
      - id: v-doctor
        kind: step
        text: |
          After building the site locally, in the project directory, run `cairn doctor` and confirm
          that it reports no `auth.role-wiring-missing` warning.
        requires: [role-wired, home-screen, nav-entry]
        produces: [wiring-checked]
        optional: true
        canFail: true
      - id: vr-doctor
        kind: fact
        fact: "f:hwffph"
        use: |
          Only: the warning means the adapter declares custom roles but `createAuthGuard` was not
          passed `{ runtime }`, so the running guard falls back to the owner and editor pair, and
          `cairn doctor` raises it from its `auth.role-wiring` check. Omit the older-engine
          spelling.
      - id: vr-type-error
        kind: fact
        fact: "f:4xrx5f"
        use: |
          Only: on this engine a `createAuthGuard` call that passes no `runtime` is a type error, so
          the warning concerns a site whose hooks escape the type check or an older site. Omit the
          earlier-versions detail.
      - id: vr-build
        kind: fact
        fact: "f:6oopkt"
        use: |
          Only the `auth.role-wiring` clause: the check reads `src/content/.cairn/site-facts.json`,
          and without it reports that it needs one build, which is why the step runs after a build.
      - id: vr-doctor-link
        kind: link
        target: ../reference/cli-cairn-doctor.md#the-checks
      - id: s-deploy-role
        kind: step
        text: |
          In the project directory, build and deploy the site as Deploy a change describes, so the
          screen that adds editors offers the new role.
        requires: [roles-migrated, wiring-checked]
        produces: [role-deployed]
        optional: true
      - id: ap-deploy-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#deploy-a-change
      - id: ap-vocab
        kind: fact
        fact: "f:mbx6q1"
        use: |
          Only: the admin mount forwards its runtime, so the screen that adds editors validates the
          posted role against the declared vocabulary in `runtime.roles`, and the site sets the
          vocabulary once on the adapter. Omit the `createEditorRoutes` wiring detail.
      - id: dp-handoff
        kind: handoff
        text: |
          Turns to adding the role's people on the deployed site.
  - heading: Add the role's people
    level: 3
    opens: |
      An owner adds each of the role's people on `/admin/editors`, the screen that adds editors,
      which now offers the role.
    items:
      - id: ap-select
        kind: fact
        fact: "f:hcjb3o"
        use: |
          Backs the opening and the role-list step: once the vocabulary is larger than the owner and editor pair,
          the invite screen offers every declared role, so the role's people are added and removed
          there like editors.
      - id: s-add-person
        kind: step
        text: |
          On `/admin/editors`, enter the person's name and email.
        requires: [role-deployed, owner-sign-in]
        produces: [person-entered]
        optional: true
      - id: s-choose-role
        kind: step
        text: |
          In the **Role** list, choose the `staff` role.
        requires: [person-entered]
        produces: [role-picked]
        optional: true
      - id: s-submit
        kind: step
        text: |
          Select **Add editor**.
        requires: [role-picked]
        produces: [person-added]
        optional: true
        canFail: true
      - id: ap-no-email
        kind: fact
        fact: "f:nj0nfm"
        use: |
          Backs the add steps and the last step: name, email, role, then **Add editor**, and the
          action sends no invitation email.
      - id: s-tell
        kind: step
        text: |
          Tell the person to sign in at `/admin`, since adding them sends no email.
        requires: [person-added]
        produces: [person-told]
        optional: true
      - id: ap-handoff
        kind: handoff
        text: |
          Turns to the verification on the deployed site.
  - heading: Verify the role signs in to its home screen
    level: 3
    opens: |
      A working role signs its people in by the magic link onto the home screen, with the screen's
      link in the sidebar and the engine's content screens closed to them.
    items:
      - id: vr-deployed
        kind: fact
        fact: "f:7cv105"
        use: |
          Only: under the dev backend `runtime.roles` changes no authorization decision, since the
          dev backend mints an owner editor on `/admin`, so these checks run on the deployed site.
      - id: vr-lead
        kind: sentence
        mode: claim
        text: |
          The checks run in order, as a numbered list introduced by a complete sentence, and a
          failed check leads to Resolve a failed setup.
      - id: v-sign-in
        kind: step
        text: |
          As one of the role's people, open `/admin` on the deployed site and sign in with the
          emailed link.
        requires: [person-told]
        produces: [staff-signed-in]
        optional: true
      - id: v-lands
        kind: step
        text: |
          Confirm that `/admin` lands on `/admin/staff`.
        requires: [staff-signed-in]
        produces: [home-confirmed]
        optional: true
        canFail: true
      - id: v-sidebar
        kind: step
        text: |
          In the sidebar, confirm that the screen's link shows.
        requires: [home-confirmed]
        produces: [link-confirmed]
        optional: true
      - id: v-refused
        kind: step
        text: |
          Open one of the engine's content screens, and confirm that it refuses the person.
        requires: [link-confirmed]
        produces: [role-verified]
        optional: true
      - id: vr-resolve-link
        kind: link
        target: "#resolve-a-failed-setup"
      - id: vr-handoff
        kind: handoff
        text: |
          Closes the role path; a failed check goes to Resolve a failed setup.
  - heading: Sign the group in through a channel
    opens: |
      `createAuthChannel` builds the request, confirm, and logout actions for a separate login over
      a numeric code, and the site supplies the routes, the code's delivery, and the roster.
    items:
      - id: cp-code
        kind: fact
        fact: "f:we2lmp"
        use: |
          Only the opening's claim: request, confirm, and logout actions over a numeric code, 8 digits by
          default. Omit the configurable range.
      - id: cp-split
        kind: fact
        fact: "f:cf1avu"
        use: |
          Backs the opening's division of work: the site supplies the delivery function, roster
          lookup, identifier normalizer, and bot challenge, plus a D1 binding resolver and a cookie
          name, and the factory owns code minting, code consumption, rate budgets, sessions, and
          revocation.
      - id: cp-example-db
        kind: fact
        fact: "f:uci4pa"
        use: |
          Only the running example's binding: the example site binds its channel database as
          `MEMBER_DB`.
      - id: cp-example-routes
        kind: fact
        fact: "f:265s4t"
        use: |
          Only the running example's routes: the login page at `/members/login` and the gated
          `/members` page.
      - id: cp-example-cookie
        kind: fact
        fact: "f:4cw5dk"
        use: |
          Only: the example channel names its cookie `member_session`.
      - id: cp-capture
        kind: fact
        fact: "f:rv9gdc"
        use: |
          Only the first clause: the example site's capture transport refuses unless
          `CAIRN_DEV_BACKEND` is `'1'`, so the steps replace it with a `deliver` for the reader's
          transport. Omit the dev-backend import and fixture clauses.
      - id: cp-handoff
        kind: handoff
        text: |
          Turns to the channel's database, which comes first.
  - heading: Provision the channel database
    anchor: provision-the-channel-database
    level: 3
    opens: |
      The channel keeps its codes and sessions in a separate D1 database, bound beside `AUTH_DB`
      and never as it, with the packaged migration in a sibling migrations directory.
    items:
      - id: pd-binding
        kind: fact
        fact: "f:rcpe0n"
        use: |
          Backs the opening: the channel's binding is never `AUTH_DB`, and it needs its own binding
          and a `migrations_dir` distinct from the one `AUTH_DB` uses.
      - id: p-create
        kind: step
        text: |
          In the project directory, create a D1 database for the channel the way Create the auth
          database creates the auth database, and note its id.
        requires: [mechanism-chosen]
        produces: [channel-db]
      - id: pd-create-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#create-the-auth-database
      - id: p-copy
        kind: step
        text: |
          In the project directory, copy the packaged channel migration,
          `node_modules/@glw907/cairn-cms/migrations-channel/0000_channel.sql`, into a new
          `migrations-members` directory.
        requires: [channel-db]
        produces: [channel-migration-file]
      - id: pd-packaged
        kind: fact
        fact: "f:6ab2z6"
        use: |
          Backs the copy step's path and the idempotence sentence: every statement is idempotent,
          so applying the file to a database that already holds the tables changes nothing and
          records the migration.
      - id: p-bind
        kind: step
        text: |
          In `wrangler.jsonc`, add a D1 database entry that binds the database as `MEMBER_DB` with
          `migrations_dir` set to `migrations-members`.
        requires: [channel-migration-file]
        produces: [channel-binding]
      - id: c-bind
        kind: code
        text: |
          Illustrative `d1_databases` array: the existing `AUTH_DB` entry on `migrations` and the
          new `MEMBER_DB` entry on `migrations-members`, with placeholders for the database names
          and ids.
      - id: p-local
        kind: step
        text: |
          In the project directory, apply the migration to the local database with
          `wrangler d1 migrations apply MEMBER_DB --local`.
        requires: [channel-binding]
        produces: [channel-db-local]
      - id: pd-local
        kind: fact
        fact: "f:uci4pa"
        use: |
          Only the binding and local-apply steps: the example site binds `MEMBER_DB` with
          `migrations_dir` set to `migrations-members`, which holds a copy of the packaged
          migration, and applies it with `wrangler d1 migrations apply MEMBER_DB --local` before
          `wrangler dev`. Omit the drift-test clause.
      - id: pd-sibling
        kind: fact
        fact: "f:5rkxfp"
        use: |
          Only the why after the steps: a shared `migrations_dir` applies each database's schema to the
          other the first time either is migrated, so the channel migration lives in a sibling
          directory. Omit the hand-inserted marker fallback, which the reference keeps.
      - id: pd-deploy-link
        kind: link
        target: "#deploy-the-channel"
      - id: pd-ref-link
        kind: link
        target: ../reference/auth-channel.md#the-packaged-migration
      - id: pd-handoff
        kind: handoff
        text: |
          Turns to the module, whose `resolveDb` returns this binding; the remote database takes the
          migration in Deploy the channel.
  - heading: Write the channel module
    anchor: write-the-channel-module
    level: 3
    opens: |
      A channel is one `createAuthChannel` call in a server-only module, and it takes four
      functions the site writes plus the channel's binding and a cookie name.
    items:
      - id: wm-required
        kind: fact
        fact: "f:41kl6q"
        use: |
          Backs the opening and the create step: the config requires `resolveDb`, `deliver`,
          `lookup`, `normalize`, `challenge`, and `cookie.name`.
      - id: s-lookup
        kind: step
        text: |
          In `src/lib/server/members.ts`, export `findMemberId(contact, { env })`, which resolves to
          the member's subject or `null`.
        requires: [mechanism-chosen, roster-store]
        produces: [lookup-fn]
      - id: wm-server-only-link
        kind: link
        target: https://svelte.dev/docs/kit/server-only-modules
      - id: s-deliver
        kind: step
        text: |
          In the same file, export `sendCodeEmail(contact, code)`, which sends the code over your
          transport and returns a promise.
        requires: [lookup-fn, code-transport]
        produces: [deliver-fn]
      - id: wm-fn-types
        kind: fact
        fact: "f:dbh3aj"
        use: |
          Only: `lookup` is typed `(contact, ctx: { env }) => Promise<string | null>` and `deliver`
          `(contact, code, ctx) => Promise<void>`, and a site function that declares only
          `(contact, code)` satisfies `deliver`.
      - id: s-channel
        kind: step
        text: |
          In `src/lib/server/member-channel.ts`, create the channel with its six required members,
          typed over the Worker env.
        requires: [deliver-fn, channel-binding]
        produces: [channel-module]
        canFail: true
      - id: c-channel
        kind: code
        text: |
          Illustrative module modeled on the example site's channel, never copying its
          `captureDeliver` or `insecureTestChallenge`: an import of `env` from
          `cloudflare:workers`, typed by the generated `Env` that the types step produces; a local
          `Env` declaring only `MEMBER_DB`, for `resolveDb`; an exported `normalizeContact` that
          trims and lowercases; and `createAuthChannel<Env>` with `resolveDb` returning
          `env?.MEMBER_DB`, `deliver: sendCodeEmail`, `lookup: findMemberId`,
          `normalize: normalizeContact`, a `challenge` that passes the form's
          `cf-turnstile-response` token and the imported `env.TURNSTILE_SECRET` to
          `verifyTurnstile`, and `cookie: { name: 'member_session' }`.
      - id: s-dev-vars
        kind: step
        text: |
          In `.dev.vars` beside the Wrangler config, creating the file if needed, add the Turnstile
          secret key as `TURNSTILE_SECRET`.
        requires: [channel-module, turnstile-widget]
        produces: [secret-local]
      - id: s-dev-vars-example
        kind: step
        text: |
          In `.dev.vars.example`, add `TURNSTILE_SECRET` with an empty value.
        requires: [secret-local]
        produces: [secret-named]
      - id: wm-dev-vars
        kind: fact
        fact: "f:nls26c"
        use: |
          Only: `.dev.vars.example` is the template for the local-only `.dev.vars`, which the
          scaffold's `.gitignore` keeps out of git. Omit the names the template lists.
      - id: s-types
        kind: step
        text: |
          In the project directory, run the command that `worker-configuration.d.ts` records on its
          first lines, so the generated `Env` carries the secret's name.
        requires: [secret-named]
        produces: [env-typed]
      - id: wm-gen-types
        kind: fact
        fact: "f:pe4vuc"
        use: |
          Backs the types step and the sentence after it: `wrangler types` writes
          `worker-configuration.d.ts`, whose generated `Env` names each binding and secret name (a
          scaffolded site's recorded command reads `.dev.vars.example`), and that generated `Env`
          types the `env` that `cloudflare:workers` exports, never the module's local `Env`.
      - id: wm-types-why
        kind: sentence
        mode: claim
        text: |
          One sentence after the types step: `challenge` receives only the event and the form, so
          the module reads `TURNSTILE_SECRET` from the `env` that `cloudflare:workers` exports,
          which the generated `Env` types, while the local `Env` types only what `resolveDb`
          receives.
        facts: ["f:pe4vuc"]
      - id: wm-local-secret
        kind: fact
        fact: "f:86h9o6"
        use: |
          Only: `wrangler dev` reads secrets from `.dev.vars` beside the Wrangler config, never from
          a deployed secret, so the production copy waits for Deploy the channel. The
          `wrangler secret put` clause is placed in that section.
      - id: wm-members-lead
        kind: sentence
        mode: claim
        text: |
          A bulleted list, introduced by a complete sentence saying each required member is a
          decision the site makes: `resolveDb` returns the `MEMBER_DB` binding; `deliver` sends the
          code over your transport, in place of the example site's development-only capture
          transport; `lookup` returns the stable subject for a normalized contact, or `null`, and
          that answer decides membership; `normalize` puts a contact in its canonical form before
          the lookup and the rate budgets use it; `challenge` wraps `verifyTurnstile`, which
          returns `false` on every failure and never throws; `cookie.name` is the base name of the
          session cookie and of its `_pending` nonce cookie, and a `cairn_` prefix throws.
        facts: ["f:rcpe0n", "f:ditn3e", "f:rv9gdc", "f:dtz8oa", "f:ez788q", "f:69xbyh", "f:4cw5dk"]
      - id: wm-resolve-db
        kind: fact
        fact: "f:ditn3e"
        use: |
          Only: `resolveDb` returns `ChannelDatabaseLike | undefined`, which a real `D1Database`
          satisfies with no cast. The `createChannelDb` half is placed in Test the channel on Node.
      - id: wm-lookup
        kind: fact
        fact: "f:dtz8oa"
        use: |
          Only the `lookup` clause: `lookup` returns the stable subject for a normalized contact or
          null, which decides membership. The `verify` clauses are placed in End a removed member's
          sessions.
      - id: wm-env
        kind: fact
        fact: "f:ffskeq"
        use: |
          Only the `lookup` half: `lookup` takes a `{ env }` context so it reaches the roster's
          binding, and it never reads request-shaped data.
      - id: wm-cookie
        kind: fact
        fact: "f:4cw5dk"
        use: |
          The `cookie.name` member: the base name of the session cookie that also names its
          `_pending` nonce cookie, and a base that starts with `cairn_` throws at construction.
      - id: wm-turnstile
        kind: fact
        fact: "f:69xbyh"
        use: |
          Only: `verifyTurnstile` returns `false` on every failure and never throws. Omit the `ip`
          rule, which the linked reference entry states.
      - id: wm-turnstile-link
        kind: link
        target: ../reference/cloudflare.md#verifyturnstile
      - id: wm-obligations
        kind: sentence
        mode: claim
        text: |
          A lead-in sentence, three of these functions carry an obligation the factory cannot
          check, then a bulleted list: `normalize` must be idempotent, canonical per identity, and
          injective across people, since a lossy one maps two people onto one rate budget;
          `lookup` must return a subject that is stable and canonical per person; `challenge` must
          actually verify a human, since it is the whole economic bound on guessing a code.
        facts: ["f:ez788q", "f:pa2hqh"]
      - id: wm-duties
        kind: fact
        fact: "f:ez788q"
        use: |
          The three duties: `normalize` idempotent, canonical per identity, and injective across
          distinct people; `lookup`'s subject stable and canonical per person; `challenge` actually
          verifying a human.
      - id: wm-consequences
        kind: fact
        fact: "f:pa2hqh"
        use: |
          The consequences: the factory cannot verify the three obligations, a lossy `normalize`
          maps two people onto one identity's rate budget, and `challenge` is the whole economic
          bound on guessing a code.
      - id: wm-obligations-link
        kind: link
        target: ../reference/auth-channel.md#config-obligations
      - id: wm-optional-link
        kind: link
        target: ../reference/auth-channel.md#createauthchannel
      - id: wm-returns
        kind: fact
        fact: "f:q7fj6p"
        use: |
          Only, as the section's close: the channel returns `actions` (request, confirm, logout),
          `resolveSubject`, and `revokeSessions`, and ships no route or UI.
      - id: wm-handoff
        kind: handoff
        text: |
          Turns to the routes that call the returned actions, starting with the login route.
  - heading: Build the login route
    level: 3
    opens: |
      The example site folds request and confirm onto `/members/login` as two named form actions
      that pass the event to the channel's actions and switch on each outcome.
    items:
      - id: lr-example
        kind: fact
        fact: "f:265s4t"
        use: |
          Only the opening and the steps: the request form posts a `contact` field and the confirm
          form a `code` field; each action switches on the returned `outcome` and answers
          `fail(400, ...)` on anything but `sent` or `confirmed`; a confirmed code redirects to
          `/members`; the login load redirects a visitor who already has a session. Omit the
          `/members` page clauses.
      - id: l-load
        kind: step
        text: |
          In `src/routes/members/login/+page.server.ts`, add a load function that redirects a
          visitor who already has a session to `/members`.
        requires: [channel-module]
        produces: [login-load]
      - id: l-request
        kind: step
        text: |
          In the same file, add a `request` action that passes the event to `actions.request` and
          answers `fail(400, ...)` on any outcome but `sent`.
        requires: [login-load]
        produces: [login-request]
      - id: l-confirm
        kind: step
        text: |
          In the same file, add a `confirm` action that passes the event to `actions.confirm`,
          redirects to `/members` on `confirmed`, and answers `fail(400, ...)` otherwise.
        requires: [login-request]
        produces: [login-confirm]
      - id: l-prerender
        kind: step
        text: |
          In the same file, export `prerender = false`, so a site that prerenders by default still
          serves the route from the Worker.
        requires: [login-confirm]
        produces: [login-server]
      - id: lr-prerender
        kind: fact
        fact: "f:k0cryh"
        use: |
          Only: both member route modules export `prerender = false`, since on a site that
          prerenders by default the asset layer would serve a prerendered copy without running the
          Worker. The component clause is placed in Gate the member area.
      - id: l-form-request
        kind: step
        text: |
          In `src/routes/members/login/+page.svelte`, add a request form that posts a `contact`
          field to the `request` action.
        requires: [login-server]
        produces: [request-form]
      - id: l-widget
        kind: step
        text: |
          In the request form, add the Turnstile widget as Cloudflare's Embed the widget guide
          describes, so the form posts the token your `challenge` reads.
        requires: [request-form, turnstile-widget]
        produces: [widget-added]
      - id: lr-widget-link
        kind: link
        target: https://developers.cloudflare.com/turnstile/get-started/client-side-rendering/
      - id: l-form-confirm
        kind: step
        text: |
          In the same component, add a confirm form that posts a `code` field to the `confirm`
          action.
        requires: [widget-added]
        produces: [login-route]
      - id: c-login-server
        kind: code
        source: ../../examples/showcase/src/routes/members/login/+page.server.ts
        text: |
          The login route's server file: `prerender = false`, the load function that redirects a
          signed-in visitor to `/members`, and the `request` and `confirm` actions that switch on
          the outcome; it imports the channel from the server-only module.
      - id: c-login-svelte
        kind: code
        text: |
          Illustrative page component: a request form with a `contact` input and a comment marking
          where the Turnstile widget renders, a confirm form with a `code` input, and an alert line
          under each form read from the action data. It omits the example site's static test
          challenge field.
      - id: lr-outcomes
        kind: fact
        fact: "f:vo4m61"
        use: |
          Only the outcome sentence: a wrong code answers `bad-code` and mints no session, and a
          false or thrown challenge answers `challenge-required` without minting. The construction
          clause is placed in Resolve a failed setup.
      - id: lr-types-link
        kind: link
        target: ../reference/auth-channel.md#types
      - id: lr-handoff
        kind: handoff
        text: |
          Turns to `/members`, where a confirmed code lands and which the next section gates.
  - heading: Gate the member area
    level: 3
    opens: |
      A channel session never populates `locals.cairnEditor`, so the member area lives in the
      site's routes outside `/admin`, and each route resolves the subject with `resolveSubject` in
      its load function.
    items:
      - id: ga-opens
        kind: fact
        fact: "f:q7fj6p"
        use: |
          Only the opening's claim: channel sessions never populate `locals.cairnEditor`, so a site builds
          the member area as its own routes outside `/admin`, gated by `resolveSubject(event)`.
      - id: g-load
        kind: step
        text: |
          In `src/routes/members/+page.server.ts`, add a load function that calls `resolveSubject`
          and redirects to `/members/login` when it returns `null`.
        requires: [login-route]
        produces: [area-load]
      - id: ga-example
        kind: fact
        fact: "f:265s4t"
        use: |
          Only the `/members` clauses: the gated page resolves the subject in its load, redirects
          to the login page on null, and carries a `logout` action that calls `actions.logout`.
      - id: g-logout
        kind: step
        text: |
          In the same file, add a `logout` action that calls `actions.logout` and redirects to the
          login page.
        requires: [area-load]
        produces: [area-logout]
      - id: g-prerender
        kind: step
        text: |
          In the same file, export `prerender = false`, so the gate runs on every request even on a
          site that prerenders by default.
        requires: [area-logout]
        produces: [area-server]
      - id: g-component
        kind: step
        text: |
          In `src/routes/members/+page.svelte`, render the member's area and add a sign-out form
          that posts to the `logout` action.
        requires: [area-server]
        produces: [member-area]
      - id: ga-component
        kind: fact
        fact: "f:k0cryh"
        use: |
          Backs the component step and the sentence after the code: the members page component
          renders the subject its load returns and a sign-out form that posts to `?/logout`, and a
          prerendered gated page would be served by the asset layer without its gate ever running.
      - id: c-area-server
        kind: code
        source: ../../examples/showcase/src/routes/members/+page.server.ts
        text: |
          The member area's server file: `prerender = false`, the load function that resolves the
          subject and redirects to `/members/login` on `null`, and the `logout` action that calls
          `actions.logout` and redirects to the login page.
      - id: c-area-svelte
        kind: code
        text: |
          Illustrative page component: a heading, a line naming the signed-in subject, and a
          sign-out form posting to `?/logout`.
      - id: ga-subject
        kind: fact
        fact: "f:dtz8oa"
        use: |
          Only: the subject is the stable string `lookup` returned, so the page loads the member's
          records by it from the site's store.
      - id: ga-logout
        kind: fact
        fact: "f:gubeex"
        use: |
          Logout deletes the session cookie and destroys that one session's row, and it never
          touches another session of the same identity.
      - id: ga-handoff
        kind: handoff
        text: |
          Turns to a member the site removes, who keeps any open session until it expires or the
          site ends it.
  - heading: End a removed member's sessions
    level: 3
    opens: |
      A channel session lasts 30 days by default, and a site ends a removed member's sessions early
      with `verify`, with `revokeSessions`, or with both.
    items:
      - id: er-ttl
        kind: fact
        fact: "f:u3qhel"
        use: |
          Only the session default: `session.ttlMs` is 30 days. Omit every other limit.
      - id: er-lead
        kind: sentence
        mode: claim
        text: |
          A complete sentence saying a site uses either or both of the following ways, then the two
          as a bulleted list, each with its condition first.
      - id: e-verify
        kind: step
        text: |
          To check the roster on every resolution, in the channel module, give the config a
          `verify` function that returns `false` for a subject no longer on the roster.
        requires: [channel-module]
        produces: [removal-handled]
        optional: true
      - id: e-revoke
        kind: step
        text: |
          To end sessions at removal, in the site's removal code, call the channel's
          `revokeSessions` with the binding and the subject.
        requires: [channel-module]
        produces: [removal-handled]
        optional: true
      - id: er-verify
        kind: fact
        fact: "f:dtz8oa"
        use: |
          Only the `verify` clauses: a `false` from `verify` destroys the session row on that
          resolution, while a throw refuses only that resolution and keeps the row.
      - id: er-verify-env
        kind: fact
        fact: "f:ffskeq"
        use: |
          Only the `verify` half: `verify` takes the same `{ env }` context as `lookup` and never
          reads request-shaped data.
      - id: er-revoke
        kind: fact
        fact: "f:1rstld"
        use: |
          Only: `revokeSessions` ends every session for one identity at once, for site code such as
          roster removal or a reported compromise. Omit the hashed-lookup and destructive-capability
          clauses.
      - id: er-ref-link
        kind: link
        target: ../reference/auth-channel.md#createauthchannel
      - id: er-handoff
        kind: handoff
        text: |
          Turns to a test that proves the finished channel on Node before it deploys.
  - heading: Test the channel on Node
    level: 3
    opens: |
      `createChannelDb`, exported from `@glw907/cairn-cms-dev`, applies the channel's migration to
      an in-memory SQLite database and returns a D1-shaped double, so a Vitest run on Node can drive
      the channel's actions with no Worker.
    items:
      - id: tn-double
        kind: fact
        fact: "f:0l7si2"
        use: |
          Only the opening's claim: `createChannelDb(schemaSql)` opens an in-memory `node:sqlite` database,
          applies the schema once, and returns a D1-shaped double. Omit the `withSession` and
          `batch` detail.
      - id: tn-node
        kind: fact
        fact: "f:fcqs22"
        use: |
          Only: `createChannelDb` needs `node:sqlite`. The Node floor is placed in Before you
          begin.
      - id: t-inline
        kind: step
        text: |
          In `vitest.config.ts`, confirm that `test.server.deps.inline` lists `@glw907/cairn-cms`,
          as the scaffold's config does, and add it if it's missing.
        requires: [test-toolchain, channel-module]
        produces: [vitest-inline]
      - id: tn-inline
        kind: fact
        fact: "f:1stlyv"
        use: |
          Backs the inline step and the explanation: the engine imports `cloudflare:workers`, which
          Node's loader rejects when Vitest leaves the engine external; inlined, Vitest transforms
          the engine and a test's `vi.mock('cloudflare:workers')` reaches its import; the
          scaffold's `vitest.config.ts` carries the setting.
      - id: t-write
        kind: step
        text: |
          In `src/lib/server/member-channel.test.ts`, write a test that drives the channel's
          request action against the double.
        requires: [vitest-inline, channel-migration-file]
        produces: [channel-test]
      - id: c-test
        kind: code
        text: |
          Illustrative test, modeled on the engine's own run of the double: `vi.hoisted` holds a
          mocked Worker env and a `waitUntil` that collects promises; `vi.mock('cloudflare:workers')`
          supplies both; the double, built with `createChannelDb` from
          `migrations-members/0000_channel.sql`, goes on the mocked env as `MEMBER_DB` with no
          cast, the env typing `MEMBER_DB` as `ChannelDatabaseLike`; a channel keeps the module's
          `normalizeContact` and stands in for the delivery (recording the code), the roster
          lookup, and the challenge; the event carries a `localhost` POST with a `contact` field, a
          matching `Origin` header, `cookies`, `setHeaders`, `locals`, and `getClientAddress`; after
          awaiting the collected promises the test asserts `{ outcome: 'sent' }` and one 8-digit
          code.
      - id: tn-no-cast
        kind: fact
        fact: "f:ditn3e"
        use: |
          Only: `createChannelDb()`'s result satisfies `resolveDb`'s `ChannelDatabaseLike` with no
          cast.
      - id: t-run
        kind: step
        text: |
          In the project directory, run the test with `npx vitest run`.
        requires: [channel-test]
        produces: [channel-tested]
      - id: tn-mock
        kind: fact
        fact: "f:nv475y"
        use: |
          Only: the engine reads every Worker binding and `waitUntil` through `cloudflare:workers`,
          which is why the test mocks that module. Omit the internal module path and the retired
          event.
      - id: tn-origin
        kind: fact
        fact: "f:wu8x70"
        use: |
          Only: every action refuses a mismatched `Origin` or plain http outside a local host, which
          is why the event carries a local URL and a matching `Origin` header.
      - id: tn-code
        kind: fact
        fact: "f:we2lmp"
        use: |
          Only: the code is 8 digits by default, which the test's assertion checks.
      - id: tn-where
        kind: fact
        fact: "f:l2xruc"
        use: |
          The sentence after the explanation: the double runs only on Node, since under workerd
          `node:sqlite` resolves but the database constructor throws, so `wrangler dev` reads the
          local D1 database instead.
      - id: tn-provision-link
        kind: link
        target: "#provision-the-channel-database"
      - id: tn-handoff
        kind: handoff
        text: |
          Turns to the deploy, now that the test passes.
  - heading: Deploy the channel
    level: 3
    opens: |
      The deployed site needs the channel's migration on the remote database and the Turnstile
      secret as a Worker secret before the code that reads them goes live.
    items:
      - id: d-remote
        kind: step
        text: |
          In the project directory, apply the channel migration to the remote database with
          `wrangler d1 migrations apply MEMBER_DB --remote`.
        requires: [channel-binding]
        produces: [channel-db-remote]
      - id: dc-apply
        kind: fact
        fact: "f:xxtooz"
        use: |
          Only the `--remote` form of `wrangler d1 migrations apply`.
      - id: d-secret
        kind: step
        text: |
          In the project directory, store the Turnstile secret key as a Worker secret named
          `TURNSTILE_SECRET` with `wrangler secret put`.
        requires: [channel-db-remote, turnstile-widget]
        produces: [secret-deployed]
      - id: dc-secret
        kind: fact
        fact: "f:86h9o6"
        use: |
          Only: `wrangler secret put` creates a new Worker version and deploys it immediately, so the
          secret is live before the last step ships the code that reads it. Omit the gradual
          deployments clause.
      - id: d-deploy
        kind: step
        text: |
          In the project directory, build and deploy the site as Deploy a change describes.
        requires: [secret-deployed, env-typed, member-area, channel-tested]
        produces: [channel-deployed]
      - id: dc-deploy-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#deploy-a-change
      - id: dc-handoff
        kind: handoff
        text: |
          Turns to the verification on the deployed site.
  - heading: Verify a member signs in to the member area
    level: 3
    opens: |
      A working channel signs a member in on the deployed site with a code from your transport,
      lands them on `/members`, and signs them out again.
    items:
      - id: vm-example
        kind: fact
        fact: "f:265s4t"
        use: |
          Only the opening and the checks: a confirmed code redirects to `/members`, the
          `logout` action signs the member out, and the gated page redirects to the login page when
          no session resolves.
      - id: c-roster
        kind: step
        text: |
          In the roster store that `lookup` reads, make sure a contact you can receive a code at is
          on the roster.
        requires: [channel-deployed, roster-store]
        produces: [test-member]
      - id: c-request
        kind: step
        text: |
          On the deployed site's `/members/login`, request a code for that contact.
        requires: [test-member]
        produces: [code-requested]
        canFail: true
      - id: c-enter
        kind: step
        text: |
          On `/members/login`, enter the code your transport delivered.
        requires: [code-requested]
        produces: [code-entered]
        canFail: true
      - id: c-redirect
        kind: step
        text: |
          Confirm that the page redirects to `/members`.
        requires: [code-entered]
        produces: [member-signed-in]
      - id: c-sign-out
        kind: step
        text: |
          On `/members`, sign out.
        requires: [member-signed-in]
        produces: [member-signed-out]
      - id: c-returns
        kind: step
        text: |
          Confirm that the login page returns.
        requires: [member-signed-out]
        produces: [login-returned]
      - id: c-gated
        kind: step
        text: |
          Confirm that `/members` now redirects to the login page.
        requires: [login-returned]
        produces: [channel-verified]
      - id: vm-resolve-link
        kind: link
        target: "#resolve-a-failed-setup"
      - id: vm-handoff
        kind: handoff
        text: |
          Closes the channel path; a failed check goes to Resolve a failed setup.
  - heading: Resolve a failed setup
    opens: |
      Each failure below names the symptom, then its fix; the first four belong to the role path
      and the rest to the channel.
    items:
      - id: x-unmigrated
        kind: failure
        from: s-submit
        symptom: |
          Adding a person with the new role fails on `/admin/editors`.
        cause: |
          `AUTH_DB` lacks `0001_roles.sql`, so the `editor` table keeps its owner-or-editor `CHECK`
          and the write fails as the condition `auth.store-roles-unmigrated`.
        handledBy: r-unmigrated
      - id: rs-unmigrated
        kind: fact
        fact: "f:xffr6i"
        use: |
          Only the cause: the condition, the original `CHECK (role IN ('owner', 'editor'))`, a
          write naming any other role failing, the condition's message naming `0001_roles.sql`, and
          no tool check raising it. Omit the routed-statement and CHECK-text matching detail.
      - id: r-unmigrated
        kind: step
        text: |
          If adding a person with the new role fails, copy and apply `0001_roles.sql` as Add the
          role's people does.
      - id: rs-unmigrated-link
        kind: link
        target: "#add-the-roles-people"
      - id: x-wiring
        kind: failure
        from: v-doctor
        symptom: |
          `cairn doctor` reports `auth.role-wiring-missing`.
        cause: |
          The guard never received the runtime, so it resolves every session against the owner and
          editor pair and the custom role to `none`.
        handledBy: r-wiring
      - id: r-wiring
        kind: step
        text: |
          If `cairn doctor` reports `auth.role-wiring-missing`, pass `{ runtime }` to
          `createAuthGuard` in `src/hooks.server.ts`, as Declare the role does, then rebuild, rerun
          the check, and deploy as Deploy the role does.
      - id: rs-wiring-link
        kind: link
        target: "#declare-the-role"
      - id: x-welcome
        kind: failure
        from: v-lands
        symptom: |
          The person lands on the minimal signed-in welcome screen, not the home screen.
        cause: |
          The deployed vocabulary gives the role no `home`, or omits the role, which then resolves
          to `none`.
        handledBy: r-welcome
      - id: rs-welcome
        kind: fact
        fact: "f:kqcyv1"
        use: |
          Backs the symptom: a `none`-capability role with no declared `home` lands on a minimal
          signed-in screen that says it has no content access, instead of `/admin`'s first concept.
      - id: r-welcome
        kind: step
        text: |
          If the person lands on the welcome screen, check that the vocabulary declares the role with
          its `home`, then redeploy as Deploy the role does.
      - id: x-forbidden
        kind: failure
        from: v-lands
        symptom: |
          The home screen answers 403 to the role's people.
        cause: |
          The screen's load function gates with `requireAccess`, and no route rule in the access map
          names the role.
        handledBy: r-forbidden
      - id: r-forbidden
        kind: step
        text: |
          If the home screen answers 403, replace `requireAccess` in its load function with the role
          check from Build the role's home screen, then redeploy as Deploy the role does.
      - id: rs-forbidden-link
        kind: link
        target: "#build-the-roles-home-screen"
      - id: rs-redeploy-link
        kind: link
        target: "#deploy-the-role"
      - id: x-construct
        kind: failure
        from: s-channel
        symptom: |
          The channel module throws when it first loads.
        cause: |
          Construction throws when a required function is missing and when the cookie name is
          missing, empty, or starts with `cairn_`.
        handledBy: r-construct
      - id: rs-construct
        kind: fact
        fact: "f:vo4m61"
        use: |
          Only: construction throws when `challenge` or any other required function is missing. The
          cookie-name throw rests on `f:4cw5dk`, placed in Write the channel module.
      - id: r-construct
        kind: step
        text: |
          If the channel module throws when it loads, read the construction error and supply the
          member it names.
      - id: x-secret
        kind: failure
        from: c-request
        symptom: |
          Every code request answers `challenge-required`, and Workers Logs shows
          `turnstile.verify_failed` with `reason: 'missing_secret'`.
        cause: |
          The Turnstile secret is blank where the running Worker reads it.
        handledBy: r-secret
      - id: rs-reasons
        kind: fact
        fact: "f:thbxvf"
        use: |
          Only, for both challenge failures: `verifyTurnstile` logs `missing_secret` for a blank or
          non-string secret and `invalid_input` for a blank, non-string, or over-length token, and
          it checks the secret first, so a call with both bad logs `missing_secret`. Omit the fetch
          clause.
      - id: r-secret
        kind: step
        text: |
          If the reason is `missing_secret`, set `TURNSTILE_SECRET` where the running Worker reads
          it: `.dev.vars` under `wrangler dev`, and the Worker secret on the deployed site.
      - id: rs-secret-where
        kind: fact
        fact: "f:86h9o6"
        use: |
          Only where each runtime reads the secret: `wrangler dev` from `.dev.vars`, a deployed
          Worker from its secret.
      - id: x-token
        kind: failure
        from: c-request
        symptom: |
          Every code request answers `challenge-required`, and the record's reason is
          `invalid_input`.
        cause: |
          The request form posts no Turnstile token under the field your `challenge` reads.
        handledBy: r-token
      - id: r-token
        kind: step
        text: |
          If the reason is `invalid_input`, check that the request form posts the widget's token
          under the field your `challenge` reads.
      - id: x-no-code
        kind: failure
        from: c-enter
        symptom: |
          The request answers that a code was sent, but no code arrives.
        cause: |
          `lookup` returned `null` for the normalized contact, because the contact is not on the
          roster or its normalized form does not match the roster's, or `lookup` threw.
        handledBy: r-no-code
      - id: rs-no-code
        kind: fact
        fact: "f:dtz8oa"
        use: |
          Only: `lookup`'s answer for the normalized contact, a subject or null, decides membership.
      - id: r-no-code
        kind: step
        text: |
          If no code arrives, read the `auth.channel.requested` record in Workers Logs: an `outcome`
          of `unknown` means the normalized contact is not on the roster `lookup` reads, and
          `lookup_failed` means `lookup` threw.
      - id: x-send-failed
        kind: failure
        from: c-enter
        symptom: |
          The request answers that a code was sent, but no code arrives, and Workers Logs shows
          `auth.channel.send_failed`.
        cause: |
          `deliver` threw while sending the code.
        handledBy: r-send-failed
      - id: r-send-failed
        kind: step
        text: |
          If Workers Logs shows `auth.channel.send_failed`, read its `error` field and fix the
          transport your `deliver` calls.
      - id: rs-channel-records-link
        kind: link
        target: ../reference/log-events.md
      - id: r-otherwise
        kind: step
        text: |
          Otherwise, read the auth channel's records in the log events reference, and work through
          Debug your site.
      - id: rs-log-events-link
        kind: link
        target: ../reference/log-events.md
      - id: rs-debug-link
        kind: link
        target: debug-your-site.md
  - heading: See also
    opens: |
      The following pages cover the seams and limits around a second group.
    items:
      - id: sa-security
        kind: link
        target: security-model.md#the-auth-channels-threat-surface
      - id: sa-restrict
        kind: link
        target: restrict-admin-access.md
      - id: sa-identity
        kind: link
        target: replace-magic-links-with-cloudflare-access.md
      - id: sa-sidebar
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: sa-channel-ref
        kind: link
        target: ../reference/auth-channel.md
      - id: sa-roles-ref
        kind: link
        target: ../reference/core.md#roles
