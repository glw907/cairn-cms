constraints:
  - |
    Re-arm (stage 2b, relink.json, context `resolveDb`): "The one-declaration change, the roles
    migration, `resolveDb` taking `createChannelDb`'s result with no cast, and the Turnstile
    missing-secret reason." The plan carries each: the role declared once on the adapter and read
    by both handles from the runtime (`f:4xrx5f`, `f:7cv105`, `f:f21bcz`, `f:mbx6q1`, `f:hwffph`,
    `f:q07rd5`); the roles migration (`f:rn62i1`, `f:xffr6i`); `resolveDb` and the cast-free test
    (`f:ditn3e`); the missing-secret reason (`f:thbxvf`).
  - |
    The page never tells the reader to pass `roles` or `access` to `createAuthGuard` or
    `devBackendHandle`, or to create `src/access.ts`. The vocabulary lives on the adapter, and the
    hooks step only confirms that both handles take `{ runtime }`; an older site's move is Upgrade
