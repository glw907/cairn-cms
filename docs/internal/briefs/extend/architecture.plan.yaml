constraints:
  - |
    Re-arm (head-merge, stage 2b): "The one-declaration change and the head-guarded commits for
    publish, publish-all, media, and the dictionary add." The page states both as the current
    design: the one declaration in The adapter (ad-runtime), Entry points (ep-hooks), and Roles
    and the access map; the head guard on publish and publish-all in The publish commit
    (pc-guard, pc-all) and on the media commits and the dictionary add in Concurrent writes
    (cw-rules). The committed page's claim that a publish takes the head-merge retry, and its
    list putting media delete and metadata under the retry, must not survive.
  - |
    State no count of the places a site touches the engine. f:3rb362 says three, but the scaffold's
    hooks module also imports `createAuthGuard` from `/sveltekit`; the page lists four files and
    never writes "three places".
  - |
    State each design as it is now. The "earlier versions" clauses in f:4xrx5f, f:7cv105,
    f:cvzb8z, f:iwf4nu, f:f21bcz, and f:mbx6q1 stay off the page; the per-version record is
    upgrade-cairn.md's and migration-notes.md's.
  - |
    Concurrent writes states which commit takes which rule and claims nothing about what the
    retry preserves of a concurrent commit. The page never says a publish is the only action that
    deletes a holding branch.
  - |
    f:0xxou5 is stated whole, condition and consequence, in one sentence.
  - |
    The introduction has no items, so it states only facts that a body section places, and the
    drafter's brief cites the same ids there: f:i74t7g, f:3rb362, f:cjonmm, f:pgy0mr, f:bhyvqg,
    and f:gknz29. The introduction does not claim that the engine runs inside the site's one
    Worker, that it ships no CMS server, or that the setup command is the usual route, since no
    fact in this page's inventory carries those claims.
  - |
    Every hand-off is the closing sentence of its section's final paragraph, never a paragraph of
    its own, and carries no code span, path, numeral, or version. Stability tiers ends on
    st-close with no hand-off.
  - |
    Build verification says the build verifies the manifest; it does not say a drifted manifest
    fails the build, since that claim (f:n0laoh) is outside this page's inventory.
  - |
    Hard dependencies states no version or peer-dependency range; the supported toolchain
    reference link carries them.
  - |
    The seams table states no count of seams.
friction:
  - |
    The `introduction` mapping holds only prose fields and no items, so facts the introduction
    states (f:i74t7g, f:3rb362, f:cjonmm, f:pgy0mr, f:bhyvqg, f:gknz29) cannot be placed there. Workaround:
    each is placed in a body section and a constraints entry names the ids the introduction
    reuses.
  - |
    The outline's covers and the anatomy's introduction need facts the container holds but this
    page's inventory lacks, so the plan does not claim them: f:j0ut9n and f:4zpvor [verified]
    (the engine runs inside the site's one Worker, no CMS server), f:kldwss [verified] (the
    setup command as the usual route), f:djoxr9 [verified] (SvelteKit as a hard dependency with
    no framework-agnostic layer; the plan falls back to hd-sveltekit), f:xg1per (peer dependency
    ranges), f:n0laoh [verified] (a drifted manifest fails the build), f:fhit7f [verified] (the
    identity option keeps the roster lookup), f:brfitv [verified] (a custom route renders inside
    the shell chrome with no registration), f:03zj56 [external: SvelteKit], and f:p1xmp5
    [verified] (the access map only narrows a capability). Adding them to the outline's factIds
    would let the page carry the framing the job asks for.
  - |
    f:3rb362 states "A site touches the engine in three places", but the scaffold's
    `templates/waymark/src/hooks.server.ts:1,24` imports `createAuthGuard` from `/sveltekit` and
    hands it the composed runtime, a fourth place. The outline's third cover also names the three
    places differently (the SvelteKit layer instead of the public routes).
  - |
    f:3z1uxv is subordinated to restrict-admin-access.md, but the page on disk describes "the
    scaffold's signups screen" (restrict-admin-access.md:18,37), which contradicts the fact that
    the signups screen and its access map are the showcase's. The stage 2b rebuild of that page
    owns the fix.
  - |
    f:qlgggh and f:q07rd5 are subordinated to scaffolded-site-files.md, but the page on disk
    still documents `src/access.ts` and both handles receiving `{ access }`
    (scaffolded-site-files.md:325-331), contradicting the one-declaration design and f:qlgggh's
    "no `src/access.ts`". The stage 2b rebuild of that page owns the fix.
  - |
    f:xkkt1o is subordinated to migration-notes.md, which states applying `0001_roles.sql`
    (migration-notes.md:129-133) but never the former `CHECK` constraint the fact records.
    Reference-arm friction for the kept page.
  - |
    f:pzbmhq is subordinated to security-model.md#magic-link-sign-in, which states that a token
    is stored as its SHA-256 hash but not that a session id is stored and matched raw.
  - |
    f:tycp7k is subordinated to arrange-the-admin-sidebar.md#before-you-begin, which states that
    the scaffold declares a `Content` and a `Site` section but not their entries, nor the
    showcase's `Signups` entry.
  - |
    f:hwffph is subordinated to ../reference/cli-cairn-doctor.md#the-checks, which states the
    `auth.role-wiring` check and both wired spellings but not the consequence (an editor outside
    the owner and editor pair authenticates and is refused everywhere).
