version: 1
page:
  path: docs/extend/architecture.md
  title: Architecture
  type: concept
argument: |
  cairn draws the line between engine and site at one declaration: a site declares a single
  adapter, the engine composes it into one runtime, and every server handle reads its behavior
  from that runtime, so a role vocabulary or an access map declared once reaches every reader.
  From that premise the rest of the architecture follows. A site reaches the engine through a few
  files that import a mapped set of export subpaths and extends it through a short list of seams.
  An edit travels one git path, from a save on a holding branch to a head-guarded publish on the
  default branch to a deploy that verifies the manifest, and each step states its own guarantee.
  The engine keeps each kind of state in the tier whose reader needs it, depends on SvelteKit and
  Cloudflare outright with only the content store swappable, and states by tier what each export
  promises across versions. The reader leaves knowing which code is theirs, which contracts they
  lean on, and what an engine update can move.
introduction:
  covers: |
    The introduction starts from the general model before any part of it. A cairn site is built to
    run on Cloudflare Workers; its admin and public pages are SvelteKit route files whose behavior
    comes from the engine's factories; content is markdown in the site's git repository, and a
    publish is a commit through the site's GitHub App that triggers the site's existing deploy; D1
    holds the sign-in rows and R2 the media bytes. Then why the architecture matters: cairn manages
    markdown content and the admin frame and leaves everything else to the developer, reached
    through a narrow, versioned set of seams, so the line between engine and site decides which
    code a site writes and which contracts it relies on across releases.

    Two readers arrive, and the introduction names each reason. A developer evaluating cairn
    against other content systems reads end to end for what the boundary commits a site to. A
    developer taking over a scaffolded site reads to map the files they inherited onto the
    engine's entry points, seams, and stores.

    A bulleted list then names what the page covers, in page order: the adapter and the runtime
    it composes; the files a site touches the engine through and the subpaths they import; the
    seams; the path an edit takes from a save to the deploy, how every admin commit meets a moved
    head, and how the admin reads content back; where each kind of state lives; the platforms the
    engine builds on directly and the contract a replacement content store keeps; and what each stability tier promises across versions. Its
    lead-in names the subjects plainly, never as "parts of the boundary".
  priorKnowledge: |
    The reader is Svelte-fluent and knows SvelteKit routing, load functions, form actions, and
    server hooks, and Cloudflare Worker bindings, because the engine builds on both platforms
    directly. Git branches and the idea of a GitHub App are assumed at a user's level.
    The introduction skips programming basics and states this in one sentence.
  notCovered: |
    A bulleted list under a complete lead-in, subject first and page last, one form per item:
    the security properties of each piece (security-model.md); each adapter field
    (define-an-adapter-and-schema.md); concepts and fieldsets in depth (content-model.md); each
    export's signature (the reference index); the upgrade procedure (upgrade-cairn.md); and the
    media store's settings (configure-media.md). The outline's last out-of-scope item, the role
    column's former database CHECK constraint, is history rather than a subject a reader looks
    for, so it is neither listed here nor stated in the body; the page states only the current
    application-layer role check, through the roles subsection.
orderReason: |
  The page answers the job's four questions in the job's order (subpaths, seams, state, promise),
  with the write and read paths between the seams and the state, and the platform dependencies and
  the one swappable store's contract between the state and the promise. Five departures from
  the outline's covers order, each argued.

  First, the definition comes before the entry points. The concept anatomy puts a definition after
  the introduction, and the outline's first cover (one adapter drives everything) is that
  definition. The section also carries the composed runtime, because the one-declaration design
  (an access map or role vocabulary declared once on the adapter and read by every handle) is a
  consequence of the premise, and a reader who meets it here reads the hooks module in Entry
  points and the roles subsection in Seams as applications of one rule rather than as two
  unrelated facts.

  Second, Entry points precede the export map, reversing covers 2 and 3. The job's first clause is
  which subpath each piece of the reader's own site imports; starting from the site's files and
  widening to the full map and its placement rules introduces the map when it is most relevant
  (Google's outline rule). The hooks module joins the entry points beside the outline's three
  places, because it installs the guard over the same composed runtime.

  Third, Seams carries a level-3 subsection for roles and the access map. That is where the
  one-declaration design pays off for a site: the guard, the engine's screens, and the site's own
  route checks all read the adapter's declaration. One subsection keeps the seams table to one
  line per row.

  Fourth, commit concurrency (cover 11) moves inside the write path, between the publish commit
  and build verification. A publish is now head-guarded, so the publish step states its guard as
  the guarantee it creates (the Litestream spine's rule), and Concurrent writes then widens once
  to every commit the admin makes, before the spine ends at the deploy. The D1 rows and the edit
  record (cover 8) fold into Data tiers (cover 7), since that cover is a list of what D1 and git
  hold.

  Fifth, Hard dependencies (cover 9) come before the Backend contract (cover 12), because the
  contract is what the one swappable dependency keeps, and the contract's expectedHead semantics
  tie back to the head guard the write path introduced. Stability tiers close the body: they are
  the job's last clause and depend on the reader having met the exports and seams. Related
  resources is the anatomy's ending.
sections:
  - heading: The adapter
    opens: |
      A cairn site declares one adapter, a single `CairnAdapter` object, and every route factory,
      admin screen, and delivery helper reads its behavior from that object.
    items:
      - id: ad-one-adapter
        kind: fact
        fact: "f:4esdoz"
        use: |
          One adapter object drives every factory, screen, and helper, and the engine hard-codes
          no concept, directory, or field.
      - id: ad-boundary
        kind: sentence
        mode: claim
        text: |
          The adapter is where the line between engine and site is drawn: the engine owns
          markdown content management and the admin frame, and the functionality, actors, auth,
          data, and domain logic a site needs beyond that belong to the developer, who hands them
          to the engine through a thin seam rather than a built-in feature.
        facts: ["f:bhyvqg", "f:99f221"]
      - id: ad-runtime
        kind: sentence
        mode: claim
        text: |
          The root barrel's `composeRuntime` folds the adapter into one composed runtime. The
          admin factory, `createCairnAdmin`, closes over that runtime, and the hooks module hands
          the same runtime to `createAuthGuard` or to the dev backend's `devBackendHandle`, so one
          declaration on the adapter serves every server handle.
        facts: ["f:3rb362", "f:f21bcz", "f:7cv105"]
      - id: ad-handoff
        kind: handoff
        text: |
          The adapter and the runtime it composes reach the engine through a few files in the
          site.
  - heading: Entry points
    opens: |
      A site's adapter module, admin mount, and public routes each import from a different
      subpath, and its hooks module installs the guard over the same composed runtime.
    items:
      - id: ep-places
        kind: fact
        fact: "f:3rb362"
        use: |
          A bulleted list in one form, one item per file and the subpath it imports: the adapter
          module (`defineAdapter` and `composeRuntime` from the root barrel, the runtime that
          `createCairnAdmin` from `/sveltekit` closes over); the admin mount (`CairnAdmin` and
          `CairnAdminShell` from `/admin` over that factory's `load`, `shellLoad`, and `actions`);
          the public routes (`createPublicRoutes` and the feed, sitemap, and robots responders
          from `/delivery`).
      - id: ep-hooks
        kind: fact
        fact: "f:f21bcz"
        use: |
          The fourth list item: the hooks module picks between `devBackendHandle` and
          `createAuthGuard` in one `if` and exports the result as `handle`, and both take the
          composed runtime. `devBackendHandle` is glossed once, here, as the dev backend's handle,
          which mints an owner editor on `/admin` (with f:7cv105). The dev gate's define and
          opt-in mechanics stay off this page.
      - id: ep-guard-scope
        kind: fact
        fact: "f:2sd4if"
        use: |
          The guard's invariant line: it gates the whole `/admin` subtree before any load runs and
          never decides per-route authorization, which belongs to `requireAccess` and
          `createSectionAction`.
      - id: ep-guard-link
        kind: link
        target: ../reference/sveltekit.md#createauthguard
      - id: ep-behind
        kind: fact
        fact: "f:40pxcq"
        use: |
          What runs behind those calls: the `/sveltekit` layer reads and writes the content
          repository through the `Backend`, renders through the render pipeline, reads and writes
          the media store and the auth store, and the admin components on `/admin` receive what
          that layer loads as props.
      - id: ep-internal
        kind: fact
        fact: "f:n3cvf9"
        use: |
          What is engine-internal behind them: directive stamping and dispatch, the commit tree
          shape sent to the GitHub API, and the guard's CSRF and session resolution, each behind a
          stability-tiered subpath and none a seam a site reaches into.
      - id: ep-handoff
        kind: handoff
        text: |
          Those files import only part of the export map, and placement rules fix what every
          subpath in the map may contain.
  - heading: Export map
    opens: |
      Most of the export map falls into six functional groups, and a short set of placement rules
      fixes what each subpath may contain.
    items:
      - id: em-groups
        kind: fact
        fact: "f:a7qx4m"
        use: |
          A two-column table (group, subpaths) introduced by a complete sentence.
      - id: em-islands
        kind: fact
        fact: "f:bmxw7w"
        use: |
          The one gloss the table needs: `/islands` is the separate client runtime that mounts a
          site's live components. The no-`/components` clause goes to the placement list.
      - id: em-outside
        kind: fact
        fact: "f:533flu"
        use: |
          The subpaths outside the six groups, including the two style sheets. The
          `check:reference` clause is engine process and is not stated.
      - id: em-reference-index
        kind: link
        target: ../reference/README.md
      - id: em-placement
        kind: fact
        fact: "f:0duu5p"
        use: |
          The placement rules as a bulleted list under a complete lead-in, one rule per item:
          nothing on the root barrel imports SvelteKit; nothing on `/sveltekit` is a `.svelte`
          file; admin components live on `/admin`, built-in public components on `/public`, and
          no `/components` subpath exists (the last clause with f:bmxw7w).
      - id: em-barrel-scope
        kind: fact
        fact: "f:5uhx5o"
        use: |
          The root barrel carries no server route, no Svelte component, and no per-request
          framework binding, so a build script imports it outside any request, as the
          `cairnManifest` plugin does inside the app's Vite graph.
      - id: em-manifest-link
        kind: link
        target: ../reference/vite.md#cairnmanifest
      - id: em-esbuild
        kind: fact
        fact: "f:ppqu4v"
        use: |
          A `/sveltekit` export bundled with plain esbuild outside Vite, such as
          `createD1AuditSink` in a Cron Worker, needs no `$app/env` alias, because `loadPreview`
          imports that module dynamically at call time.
      - id: em-loadpreview-link
        kind: link
        target: ../reference/sveltekit.md#loadpreview
      - id: em-handoff
        kind: handoff
        text: |
          The map says where each export lives, and the seams say which of them a site hands its
          own code or data to.
  - heading: Seams
    opens: |
      A site adds a concept, a role, or an admin screen through a seam, and none of the three
      forks the engine.
    items:
      - id: se-definition
        kind: sentence
        mode: verbatim
        text: |
          A seam is a documented point where a site supplies code or data that the engine reads.
      - id: se-no-fork
        kind: fact
        fact: "f:6a32oy"
        use: |
          A concept is an edit to the `content` map, a role an edit to the `roles` declaration,
          and a custom admin screen a route file under `src/routes/admin/` that SvelteKit resolves
          ahead of the catch-all, listed in the sidebar through an `editor.navLayout` site entry.
      - id: se-table
        kind: fact
        fact: "f:i87sd3"
        use: |
          A three-column table (seam, what the site supplies, the page that documents it) under a
          complete lead-in, one self-contained line per row, no detail list after it. Rows: the
          `content` map (a `ConceptConfig` with a `fieldset` per concept); `render` (a renderer
          built with `createRenderer`); roles and the access map (declared on the adapter; see Roles
          and the access map); `navLayout`; the `media` member (an `AssetConfig`);
          `BackendProvider` (with f:n1om0r). The `identity` and custom-route rows come from
          se-identity and se-no-fork.
      - id: se-identity
        kind: sentence
        mode: claim
        text: |
          The table's `identity` row: the optional `identity` option on `createAuthGuard`
          replaces the built-in sign-in path, not a store.
        facts: ["f:hk24xs", "f:4xrx5f"]
      - id: se-backend-row
        kind: fact
        fact: "f:n1om0r"
        use: |
          The `BackendProvider` row: the seam for a content backend other than GitHub, with
          `createGithubApp` the one provider cairn ships. Its documentation cell links the core
          reference's Types table, since no page builds a second backend.
      - id: se-link-content
        kind: link
        target: content-model.md
      - id: se-link-render
        kind: link
        target: configure-rendering.md
      - id: se-link-access
        kind: link
        target: restrict-admin-access.md
      - id: se-link-identity
        kind: link
        target: replace-magic-links-with-cloudflare-access.md
      - id: se-link-custom
        kind: link
        target: add-a-custom-admin-screen.md
      - id: se-link-nav
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: se-link-media
        kind: link
        target: configure-media.md
      - id: se-link-backend
        kind: link
        target: ../reference/core.md#types
      - id: se-handoff
        kind: handoff
        text: |
          Two of these seams, the role vocabulary and the access map, are read by several parts of
          the engine at once.
  - heading: Roles and the access map
    level: 3
    opens: |
      A site declares its role vocabulary and its access map once, on the adapter, and every
      reader of either takes it from the composed runtime.
    items:
      - id: ra-vocabulary
        kind: fact
        fact: "f:3pposq"
        use: |
          Only the role and capability entries of the glossary: a role is a name the site defines,
          and a capability is one of `none`, `editor`, or `owner`. The other glossary terms are not
          restated.
      - id: ra-once
        kind: fact
        fact: "f:iwf4nu"
        use: |
          One item with ra-once-guard, drafted as one passage that states the guard's attachment
          once: the access map is the adapter's `access` member, and `composeRuntime` carries it
          onto the runtime beside the role vocabulary, so there is no second copy to pass; on
          every admin path where it signs an editor in, `createAuthGuard({ runtime })` sets
          `locals.cairnAccess` to `runtime.access ?? {}`. The "earlier versions" clause stays off.
      - id: ra-once-guard
        kind: fact
        fact: "f:gun084"
        use: |
          Only the clauses ra-once lacks, inside ra-once's passage: the guard reads the role
          vocabulary from `runtime.roles`, defaulting to the owner and editor pair when the
          adapter declares none, it sets the map beside `locals.cairnEditor`, and
          `devBackendHandle` attaches the same map. The `runtime.access ?? {}` attachment is not
          restated.
      - id: ra-readers
        kind: fact
        fact: "f:cvzb8z"
        use: |
          The engine's screens, their write actions, and the sidebar read the map through the
          runtime, and `requireAccess` and `createSectionAction` read the same map from
          `locals.cairnAccess`, so the adapter's member is the one declaration every reader sees.
          The fact's clause on what the guard and the dev backend's handle set
          `locals.cairnAccess` to stays off, since ra-once states it. The history clause about
          the scaffold's former `src/hooks.server.ts` map stays off.
      - id: ra-why
        kind: reason
        text: |
          Because the engine's own screens and a site's own routes read one declaration, the two
          cannot be gated by different maps.
      - id: ra-editors
        kind: fact
        fact: "f:mbx6q1"
        use: |
          The roster screen's routes validate a posted role against `runtime.roles`, and the admin
          mount forwards its runtime to them, so a site passes `runtime` itself only when it wires
          `createEditorRoutes` by hand.
      - id: ra-required
        kind: fact
        fact: "f:4xrx5f"
        use: |
          The guard's `runtime` is required, with no default, so a call without it is a type
          error. The no-roles fallback is not restated, since ra-once-guard states it. The
          "earlier versions" clause stays off.
      - id: ra-handoff
        kind: handoff
        text: |
          What an editor is allowed to do decides which admin actions run, and every action that
          changes content travels one path to the live site.
  - heading: Write path
    opens: |
      An edit reaches the live site through a save onto a holding branch, a publish that copies
      the branch onto the default branch, and the deploy that the publish commit triggers.
    items:
      - id: wp-spine
        kind: fact
        fact: "f:cjonmm"
        use: |
          The three steps of the path, stated in the section's first sentence.
      - id: wp-held
        kind: fact
        fact: "f:qehbx3"
        use: |
          A save holds on a per-entry branch, and a deliberate publish copies it to the default
          branch: the publish is a separate act, never a side effect of a save.
      - id: wp-stores
        kind: fact
        fact: "f:pgy0mr"
        use: |
          The second sentence names the three stores the path crosses (git for the edit and both
          manifests, D1 for the session row the guard checks on each admin request, R2 for media
          bytes), so every node in the figure is introduced before the figure.
      - id: wp-figure
        kind: figure
        text: |
          One diagram of the write path and the three data tiers, topology only, no branding: an
          editor's save lands on the `cairn/<concept>/<id>` holding branch through the GitHub App,
          a publish copies it to the default branch, and the deploy rebuilds the manifest; D1 and
          R2 sit beside git with what each holds. The caption names Data tiers as the section that
          states what each store holds. The diagram makes no claim about retries or guards.
        source: |
          The mermaid block in the committed docs/extend/architecture.md (write path and three
          data tiers), kept and edited only where a placed fact changes a claim it makes, under the
          cairn-figure skill.
      - id: wp-handoff
        kind: handoff
        text: |
          The path starts where an editor saves.
  - heading: The holding branch
    level: 3
    opens: |
      A save commits the edit to a per-entry branch named `cairn/<concept>/<id>` through the
      site's GitHub App installation token, with the signed-in editor as author and no committer
      set.
    items:
      - id: hb-commit
        kind: fact
        fact: "f:cjonmm"
        use: |
          The save's commit identity: the editor as author, no committer, so GitHub records the
          App's bot identity as the committer.
      - id: hb-pending
        kind: fact
        fact: "f:5kerxw"
        use: |
          Each later save commits onto the same branch, so an editor iterates across saves; an
          entry is pending when its branch exists and nothing else marks it; the concept list
          finds pending entries by listing the branches under `cairn/<concept>/`. The guarantee
          at this step: a save never reaches the live site.
      - id: hb-no-manifest
        kind: fact
        fact: "f:e69d0l"
        use: |
          A save to the holding branch commits no manifest change.
      - id: hb-handoff
        kind: handoff
        text: |
          The branch holds the edit until a deliberate publish.
  - heading: The publish commit
    level: 3
    opens: |
      A publish copies the holding branch's content onto the default branch as one fresh commit,
      with the editor as author, and the entry's manifest row lands in the same commit.
    items:
      - id: pc-fresh
        kind: fact
        fact: "f:70mf58"
        use: |
          A publish is a fresh commit on the default branch carrying the entry file and the
          manifest, never a merge of the holding branch.
      - id: pc-attribution
        kind: fact
        fact: "f:w379wu"
        use: |
          As on a save, no committer is set, so GitHub attributes the commit to the App.
      - id: pc-manifest
        kind: fact
        fact: "f:e69d0l"
        use: |
          The content manifest changes only in a default-branch commit that changes an entry (a
          publish, a publish-all, a delete, or a rename), each landing the manifest change with
          the entry files.
      - id: pc-guard
        kind: sentence
        mode: claim
        text: |
          A publish is head-guarded: it reads the default branch's head before its first read of
          the media manifest or the content manifest and commits with that head as
          `expectedHead`, so a commit that lands after those reads refuses the publish with "Your
          edits are saved. Publish again." while the entry stays held on its branch, and a default
          branch with no head refuses the same way. This is the guarantee the step creates.
        facts: ["f:0gihxq"]
      - id: pc-all
        kind: fact
        fact: "f:0oyrh6"
        use: |
          Publish-all commits every pending entry the editor can reach, plus the content manifest,
          as one commit to the default branch, so one deploy fires. It takes the same guard
          (with f:0gihxq: a stale head answers `?error=publish_conflict`).
      - id: pc-cleanup
        kind: fact
        fact: "f:0xxou5"
        use: |
          Whole, in one sentence: after a publish lands, the engine deletes the holding branch
          only when the branch head still equals the SHA the publish captured, so a save that
          lands during the publish keeps the entry pending.
      - id: pc-handoff
        kind: handoff
        text: |
          The publish is one of many commits the admin makes against a branch that another
          editor may have moved.
  - heading: Concurrent writes
    level: 3
    opens: |
      Every commit the admin makes meets a moved head under one of two rules: a head-merge retry,
      or a head guard that fails on the first stale head.
    items:
      - id: cw-rules
        kind: fact
        fact: "f:0gihxq"
        use: |
          Two bulleted items in one form. The retry (three retries after the first attempt, then a
          conflict) covers an entry save and an entry delete or rename. The guard covers single
          publish, publish-all, the nav, tidy-settings, vocabulary, the media upload manifest,
          media delete (single and bulk), media metadata update, media replace, media alt
          propagation, the personal-dictionary add, and revert. Then two short sentences: a media
          delete that conflicts leaves the R2 object in place, and the dictionary add retries once
          after a conflict, re-reading the head and the file.
      - id: cw-why
        kind: reason
        text: |
          A guarded commit reads the head before any file its new contents are computed from, so a
          commit that lands in between makes it refuse rather than overwrite what it never read.
      - id: cw-handoff
        kind: handoff
        text: |
          A commit that lands on the default branch then starts the site's deploy.
  - heading: Build verification
    level: 3
    opens: |
      The publish commit triggers the site's existing deploy, and the build rebuilds the content
      manifest and verifies it against the markdown on disk.
    items:
      - id: bv-verify
        kind: fact
        fact: "f:e69d0l"
        use: |
          The `cairnManifest` plugin rebuilds the manifest at build time and verifies it against
          the markdown on disk in `buildStart`.
      - id: bv-link
        kind: link
        target: ../reference/vite.md#cairnmanifest
      - id: bv-handoff
        kind: handoff
        text: |
          The admin reads content back from the two places the path writes it, the holding
          branches and the default branch.
  - heading: Read path
    opens: |
      The admin reads one entry from a concurrent batch of reads through the `Backend`, and it
      reads the whole corpus from the committed content manifest.
    items:
      - id: rp-reads
        kind: fact
        fact: "f:cng7dr"
        use: |
          An entry's edit and history loads batch the file, its pending branch head, the committed
          manifest, and the media manifest; the concept list, inbound links, reference and media
          usage, and the link check on save read the manifest on the default branch instead of
          crawling the entry files.
      - id: rp-handoff
        kind: handoff
        text: |
          That manifest is one kind of state the engine keeps in git, and git is one of three
          places the engine keeps state.
  - heading: Data tiers
    opens: |
      The engine keeps state in three tiers, git, D1, and R2, and places each kind of state by
      what reads it.
    items:
      - id: dt-placement
        kind: fact
        fact: "f:pgy0mr"
        use: |
          The placement principle, and the D1 readers: the guard looks up the `session` row by its
          session-cookie id on each admin request, and sign-in looks up a `magic_token` row by its
          SHA-256 hash; R2 holds media bytes that the delivery route streams.
      - id: dt-table
        kind: fact
        fact: "f:b6gquz"
        use: |
          A two-column table (tier, what it holds) under a complete lead-in. The key column is
          dropped, except that R2's bytes are deduplicated by content hash.
      - id: dt-manifests
        kind: fact
        fact: "f:lu67dk"
        use: |
          Both manifests are committed JSON under `src/content/.cairn/`, and only the bytes the
          media manifest describes live in R2, because git does not carry binary assets at real
          scale and D1 is not sized for megabytes.
      - id: dt-media-manifest
        kind: fact
        fact: "f:4t707i"
        use: |
          The media manifest keys each row by a 16-hex content-hash prefix and is the dedup lookup
          an upload checks before storing anything.
      - id: dt-no-body
        kind: fact
        fact: "f:6ign7q"
        use: |
          A manifest row carries an entry's title, permalink, summary, links, and edges but never
          its body, and no D1 table stores a body, so an entry body lives only in git.
      - id: dt-edit-record
        kind: fact
        fact: "f:70mf58"
        use: |
          The edit record: every save and every publish is a git commit with the editor as author
          and no audit table involved, so the default branch's history records who published each
          change and when, never each intermediate save.
      - id: dt-audit
        kind: fact
        fact: "f:wnvqlz"
        use: |
          Only a site that wires `createD1AuditSink` writes `audit_log`, one row per audited admin
          action.
      - id: dt-preview
        kind: fact
        fact: "f:dtwvtz"
        use: |
          Only a site that mints preview links writes `preview_tokens`, one hashed token per link,
          each row naming the draft it shares.
      - id: dt-security-link
        kind: link
        target: security-model.md
      - id: dt-auth-store-link
        kind: link
        target: ../reference/auth-store.md
      - id: dt-media-link
        kind: link
        target: configure-media.md
      - id: dt-site-data
        kind: fact
        fact: "f:qrwncf"
        use: |
          A site's own extension data, such as a member roster or an event schedule, sits outside
          the three tiers wherever the site chooses, provided its cookie and table names avoid the
          reserved `cairn_` prefix.
      - id: dt-handoff
        kind: handoff
        text: |
          Each of these stores is a platform the engine depends on outright, and only the content
          store has a seam that replaces it.
  - heading: Hard dependencies
    opens: |
      The engine builds on SvelteKit and Cloudflare directly, so a production site built on cairn
      runs on Cloudflare Workers.
    items:
      - id: hd-cloudflare
        kind: fact
        fact: "f:i74t7g"
        use: |
          The engine's environment contract is Cloudflare Worker bindings, such as the `AUTH_DB`
          D1 database and the Email Sending binding.
      - id: hd-sveltekit
        kind: sentence
        mode: claim
        text: |
          The admin and the public pages are SvelteKit route files over the engine's
          `/sveltekit` and `/delivery` factories, so SvelteKit is the framework every entry point
          assumes.
        facts: ["f:3rb362", "f:40pxcq"]
      - id: hd-toolchain-link
        kind: link
        target: ../reference/supported-toolchain.md
      - id: hd-no-host-seam
        kind: fact
        fact: "f:hk24xs"
        use: |
          No seam swaps Cloudflare for another host; the one swappable storage seam is the content
          store, through `BackendProvider`.
      - id: hd-one-provider
        kind: fact
        fact: "f:n1om0r"
        use: |
          `createGithubApp` is the one provider cairn ships, and none ships besides it.
      - id: hd-handoff
        kind: handoff
        text: |
          A replacement content store keeps one contract, the interface every provider connects a
          route to.
  - heading: Backend contract
    opens: |
      A `BackendProvider` connects to a live `Backend` for a route that needs one, and the
      `Backend` interface fixes the semantics every provider keeps.
    items:
      - id: bc-provider
        kind: fact
        fact: "f:gcd8h7"
        use: |
          A provider carries a `kind` tag and the default `branch` and connects with
          `connect(env)`; the provider `createGithubApp` returns mints and caches the installation
          token lazily.
      - id: bc-semantics
        kind: fact
        fact: "f:025q6u"
        use: |
          A bulleted list, one semantic per item: `commit` with `expectedHead` makes one attempt
          and throws `CommitConflictError` on a mismatch, and without it keeps the head-merge
          retry; `readFile` returns null for a missing path; `listCommits` returns an empty array
          for a missing file; `createBranch` returns the SHA it branched at and throws
          `BranchExistsError` on a collision; `deleteBranch` treats a missing branch as success.
      - id: bc-tie
        kind: sentence
        mode: claim
        text: |
          `expectedHead` is the provider-level form of the head guard that a publish and the
          admin's other guarded commits take, and its absence is the retry that a save and an
          entry delete or rename take.
        facts: ["f:025q6u", "f:0gihxq"]
      - id: bc-types-link
        kind: link
        target: ../reference/core.md#types
      - id: bc-errors-link
        kind: link
        target: ../reference/core.md#error-classes
      - id: bc-handoff
        kind: handoff
        text: |
          The contract is one exported surface among many, and each surface carries a stability
          tier.
  - heading: Stability tiers
    opens: |
      Every export carries one of three stability tiers, and the tier states what the export
      promises across versions.
    items:
      - id: st-tiers
        kind: fact
        fact: "f:c1ujrl"
        use: |
          Extension API and Scaffold API are frozen contracts; Unstable API is importable today
          with no promise across minor versions.
      - id: st-tiers-link
        kind: link
        target: ../reference/README.md#stability-tiers
      - id: st-pre1
        kind: fact
        fact: "f:549u00"
        use: |
          cairn is pre-1.0, so the tiers are a target discipline and an Extension-tier break can
          ship in a minor release. No version number is stated.
      - id: st-gate
        kind: fact
        fact: "f:gknz29"
        use: |
          Until 1.0 the `check:surface` snapshot gate detects and discloses such a break rather
          than preventing one.
      - id: st-example
        kind: fact
        fact: "f:zm9tp4"
        use: |
          The worked example, one paragraph: in `0.86.0`, the minor version that shipped
          `navLayout`, the nav fields on `AdminShellData` and the parameter and return types of
          `navFilter` changed shape inside the Extension API tier, and in `0.94.0` the `navLayout`
          types were renamed. A site that read those fields or declared a `navFilter` had code to
          change before it could take the upgrade.
      - id: st-086-link
        kind: link
        target: migration-notes.md#0860
      - id: st-094-link
        kind: link
        target: migration-notes.md#0940
      - id: st-close
        kind: sentence
        mode: claim
        text: |
          Code a site writes against the Extension tier therefore meets each break as a named
          change.
        facts: ["f:gknz29"]
      - id: st-upgrade-link
        kind: link
        target: upgrade-cairn.md
  - heading: Related resources
    opens: |
      The following resources build on this architecture, take one part of it in depth, or
      document the platforms the engine builds on.
    items:
      - id: rr-howto-lead
        kind: sentence
        mode: verbatim
        text: |
          The following guides build a site on these seams.
      - id: rr-add-cairn
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: rr-adapter
        kind: link
        target: define-an-adapter-and-schema.md
      - id: rr-restrict
        kind: link
        target: restrict-admin-access.md
      - id: rr-custom-screen
        kind: link
        target: add-a-custom-admin-screen.md
      - id: rr-upgrade
        kind: link
        target: upgrade-cairn.md
      - id: rr-migration-notes
        kind: link
        target: migration-notes.md
      - id: rr-concepts-lead
        kind: sentence
        mode: verbatim
        text: |
          The following pages take one part of the architecture in more depth.
      - id: rr-scaffold
        kind: link
        target: scaffolded-site-files.md
      - id: rr-content-model
        kind: link
        target: content-model.md
      - id: rr-security
        kind: link
        target: security-model.md
      - id: rr-external-lead
        kind: sentence
        mode: verbatim
        text: |
          The following external pages document the platforms the engine builds on.
      - id: rr-kit-routing
        kind: link
        target: https://svelte.dev/docs/kit/routing
      - id: rr-kit-load
        kind: link
        target: https://svelte.dev/docs/kit/load
      - id: rr-kit-actions
        kind: link
        target: https://svelte.dev/docs/kit/form-actions
      - id: rr-cf-bindings
        kind: link
        target: https://developers.cloudflare.com/workers/runtime-apis/bindings/
      - id: rr-github-apps
        kind: link
        target: https://docs.github.com/en/apps/overview
