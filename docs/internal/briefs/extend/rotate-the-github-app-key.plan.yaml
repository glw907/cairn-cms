  - |
    Added beyond the outline list, each [verified] and on this page's job: f:h252kb (the
    `fingerprint` the re-arm's done text names), f:1pb077 (`?live=1`, the immediate proof of
    acceptance), and f:72yc97 (a scaffolded site keeps no copy of the key, so its recovery is a
