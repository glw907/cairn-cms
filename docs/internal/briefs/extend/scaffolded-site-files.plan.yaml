version: 1
page:
  path: docs/extend/scaffolded-site-files.md
  title: Scaffolded site files
  type: concept
argument: |
  A scaffolded site is a complete SvelteKit project that the site owns outright, with the engine
  as one dependency, and only a short, marked set of its files carries a contract that the engine
  or a build or CI check reads. A new owner who knows which files those are can change everything
  else freely and change those few with the contract kept. The page proves the claim file by file:
  it states the ownership first, draws the tree with the contract files marked, gives each file or
  directory a short entry saying what it does and what reads it, then states the rules that span
  several files and the state the setup command left outside the repository.
introduction:
  covers: |
    A site that `create-cairn-site` scaffolded arrives as a complete SvelteKit project in its own
    GitHub repository, already deployed as a Cloudflare Worker, in which every file belongs to the
    site and the engine, `@glw907/cairn-cms`, is one dependency. A new owner needs three answers
    for each file and directory: what it does, whether it is theirs to change freely, and whether
    the engine or a build or CI check reads it, because nothing in the tree says which is which.
    The introduction names two readers: a developer who took over a scaffolded site from someone
    else, and a developer who ran the setup command and wants to know what it wrote and why. It
    lists the subjects in body order: what the scaffold is and who owns it; the file tree, with the
    files the engine or a check reads marked; the root files, the build and deploy configuration,
    and the database migrations; the routes and the server hook, including what the local dev
    server runs; the theme, chassis, content, and style sheets; the settings a new owner edits by
    hand; the build's crawl rules and the themed 404 page; and the state the setup command left
    outside the repository.
  priorKnowledge: |
    Working knowledge of SvelteKit's project structure (routes, layouts, hooks, and prerendering),
    Vite configuration, and Wrangler configuration for a Worker's bindings and D1 migrations. A
    Svelte-fluent reader needs nothing more, and the page explains no SvelteKit or Cloudflare basics.
  notCovered: |
    A bulleted list under a complete lead-in that never names the page itself, each item subject
    first and its page last: building the same tree by hand (`docs/extend/add-cairn-to-a-sveltekit-app.md`);
    changing the theme and the chassis (`docs/extend/theme-your-public-site.md`); building a custom
    admin screen (`docs/extend/add-a-custom-admin-screen.md`); each delivery route's wiring
    (`docs/extend/build-the-public-routes.md`); media configuration behind the `MEDIA_BUCKET`
    binding (`docs/extend/configure-media.md`); and `cairn-audit.config.json` in depth
    (`docs/extend/run-cairn-audit-on-your-site.md`).
orderReason: |
  The outline's covers are an inventory, and the page re-sequences them so each fact arrives where
  the reader needs it. Ownership comes first (the scaffold, the concept's definition) because every
  later answer to "may I change this?" rests on it. The annotated tree follows as the map every
  later section walks, its markers answering the job's third question at a glance. The per-file
  sections then walk the tree from the outside in: the root files (the CI workflow is the check
  every push meets), the configuration files the build reads in order (the scripts start the
  build, Vite runs it, Wrangler deploys its output), the one migrations directory the auth binding
  needs, the routes and the server hook that the guard and the dev backend run through, the theme,
  chassis, and content the routes read, and the two style sheets. `src/app.d.ts` closes the
  configuration group because it types what the other three provide: the define `vite.config.ts`
  sets and the bindings `wrangler.jsonc` declares. The cross-file rules come after
  every file they span is introduced: the hand-edited settings lead into the crawl rules (the
  archive route the page size governs is the one route the crawl exempts), and the build-time crawl
  precedes the request-time 404. What lives outside the repository closes the body, ending on the
  build-token risk, the one item there that can break a live site. Related resources end the page,
  as the concept anatomy requires. Departures from the covers: cover 8 (the pre-scripts and the
  remaining scripts) folds into the package.json table so the file's scripts are stated once;
  cover 13 (the guidance tooling) and the guidance detail in cover 2 leave the page for the Claude
  Code page under the owner ruling, leaving one labeled line in the file tree; covers 4 and 5 lose
  `migrations-app/` and the signups screen, which the scaffold no longer ships; `src/hooks.server.ts`,
  which no cover names, opens the routes section because the re-arm moves the dev backend's content
  behavior into it.
sections:
  - heading: The scaffold
    opens: |
      A scaffolded site is Waymark, cairn's reference theme, wired onto a chassis of design-neutral
      plumbing, and the setup command copies both from the same tree the engine runs its tests
      against.
    items:
      - id: scaffold-source
        kind: fact
        fact: "f:n2skkz"
        use: |
          The source tree is the engine repository's example site, `examples/showcase`, and the
          copy leaves out its Playwright suite, its design-review routes (`theme-kit` and
          `probe-craft`), its test routes, and a members-login fixture.
      - id: scaffold-one-template
        kind: fact
        fact: "f:u705t5"
        use: |
          Waymark is the only template the setup command ships; a second, Topo, is planned but not
          shipped.
      - id: scaffold-same-run
        kind: fact
        fact: "f:kldwss"
        use: |
          The same run created the site's GitHub App, its repository, and its Cloudflare bindings,
          and deployed the site, so the tree arrives already live.
      - id: scaffold-ownership
        kind: sentence
        mode: claim
        text: |
          Every file in the tree belongs to the site: the engine's npm package carries neither the
          template nor the chassis, and the engine arrives as one ordinary dependency in
          `package.json`, so a site built by hand from `sv create` starts with neither.
        facts: ["f:rxj43c", "f:o47i0q"]
      - id: scaffold-by-hand-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: scaffold-contract-reason
        kind: reason
        text: |
          Owning a file does not remove a contract on it: a file that the engine or a check reads
          can still break the build, the deploy, or the admin when it changes, which is why the
          tree marks those files.
      - id: scaffold-handoff
        kind: handoff
        text: |
          The file tree marks each file that carries such a contract.
  - heading: File tree
    opens: |
      In the tree the setup command writes, `[engine]` marks a file the engine reads, writes, or
      requires a shape of; `[gate]` marks a file that runs or feeds a check that can fail the build
      or the CI run.
    items:
      - id: tree-block
        kind: code
        source: ../../templates/waymark
        facts: ["f:guiavc", "f:mrv24k", "f:gepykz", "f:666eg6", "f:vs6k2k", "f:vrue1g", "f:gj96px", "f:f21bcz", "f:q07rd5", "f:2s8u70", "f:xluud1", "f:2zl3qz", "f:34rsss", "f:n7t4bn"]
        text: |
          One plain-text tree in directory-listing order: the root fully listed, `src/` one level
          deep, `src/content/` and `src/theme/` expanded one more level, and `src/routes/` collapsed
          to one line (the routes section draws its own tree). Markers, each resting on a cited
          fact: `.github/workflows/check.yml` [gate]; `cairn-audit.config.json` [gate];
          `package.json` [gate]; `migrations/` [engine]; `src/admin.css` [gate];
          `src/content/.cairn/` [engine] [gate]; `src/content/posts/`, `pages/`, and `fragments/`
          [engine]; `src/hooks.server.ts` [engine]; `src/theme/cairn.config.ts` [engine];
          `src/theme/site.config.yaml` [engine]; `vite.config.ts` [engine] [gate]; `wrangler.jsonc`
          [engine]. `CLAUDE.md` and `.claude/` appear unmarked. The tree has no `src/access.ts`, no
          `migrations-app/`, and no `src/routes/admin/signups/`, and it leaves out files no section
          discusses, such as `src/app.html` and the theme's test files.
      - id: tree-root-entries
        kind: fact
        fact: "f:qlgggh"
        use: |
          The root and `src/` entries the tree lists. Use only the listing of what exists: the
          root's files and directories, and `src/admin.css`, `src/lib/log.ts`,
          `src/content/.cairn/site-facts.json`, and `src/theme/theme-names.ts`, with no
          `src/access.ts`.
      - id: tree-claude-label
        kind: sentence
        mode: claim
        text: |
          `CLAUDE.md` and `.claude/` hold Claude Code's guidance files, in one line that labels the
          tool and links its page.
        facts: ["f:qlgggh"]
      - id: tree-claude-link
        kind: link
        target: ../claude-code/using-claude-code-with-cairn.md
  - heading: Root files
    opens: |
      Beside a plain SvelteKit project's files, the root carries a CI workflow, a template for
      local secrets, the audit's config, and a `.gitignore` that the setup command renames.
    items:
      - id: root-two-entries
        kind: fact
        fact: "f:guiavc"
        use: |
          Backs the section's first sentence; add nothing beyond it.
  - heading: "`.github/workflows/check.yml`"
    level: 3
    opens: |
      On every push and pull request, the workflow installs dependencies and runs `npm run check`
      and `npm run check:cairn`.
    items:
      - id: ci-runs
        kind: fact
        fact: "f:guiavc"
        use: |
          Backs the section's first sentence; add nothing beyond it.
      - id: ci-node
        kind: fact
        fact: "f:jcux9z"
        use: |
          It pins `node-version: 24`, and nothing else in the scaffold names a Node version: there
          is no `.nvmrc` and no `engines` field.
      - id: ci-guidance-step
        kind: fact
        fact: "f:jd54ph"
        use: |
          The last step runs `npx cairn-guidance check` without `--strict` and under
          `continue-on-error: true`, so that step never fails the job. State no more about what the
          check reads.
      - id: ci-no-browser
        kind: fact
        fact: "f:j7fha2"
        use: |
          The workflow installs no browser, so `check:cairn:rendered` cannot run in it.
  - heading: "`.dev.vars.example`"
    level: 3
    opens: |
      This file is the template for the gitignored `.dev.vars`, and its header says to copy it
      there and never commit a real value.
    items:
      - id: devvars-contents
        kind: fact
        fact: "f:nls26c"
        use: |
          It names the GitHub App's private key as `GITHUB_APP_PRIVATE_KEY_B64` with a placeholder
          value, since the App id and installation id are not secrets and live in the adapter, and
          it carries an empty `ANTHROPIC_API_KEY` that is read only when tidy is enabled in
          `site.config.yaml`.
      - id: devvars-tidy-link
        kind: link
        target: turn-on-tidy.md
  - heading: "`cairn-audit.config.json`"
    level: 3
    opens: |
      The audit's config names both compiled admin sheets, so the static audit sees every class
      that a site's own admin route writes.
    items:
      - id: audit-config-sheets
        kind: fact
        fact: "f:guiavc"
        use: |
          The two sheets are the engine's `node_modules/@glw907/cairn-cms/dist/admin/cairn-admin.css`
          and the site's `.cairn/admin.css`.
      - id: audit-config-link
        kind: link
        target: run-cairn-audit-on-your-site.md
  - heading: "`.gitignore`"
    level: 3
    opens: |
      The setup command's package stores this file as `gitignore`, because npm's packlist drops a
      file named `.gitignore`, and the setup command renames it after copying.
    items:
      - id: gitignore-rename
        kind: fact
        fact: "f:qfv5iw"
        use: |
          The rename, the loud failure when the file is absent, and `.gitattributes` shipping under
          its own name.
      - id: gitignore-devvars
        kind: fact
        fact: "f:nls26c"
        use: |
          It ignores `.dev.vars` and re-includes `.dev.vars.example`.
      - id: gitignore-admin-css
        kind: fact
        fact: "f:666eg6"
        use: |
          It ignores the compiled `.cairn/admin.css`, which the pre-scripts rebuild.
  - heading: Other root files
    level: 3
    opens: |
      The remaining root entries are a plain project's files, plus a generated types file and the
      directory that holds the dev server's launcher.
    items:
      - id: other-plain
        kind: fact
        fact: "f:qlgggh"
        use: |
          `LICENSE`, `README.md`, `.prettierignore`, `.prettierrc`, `tsconfig.json`, and
          `vitest.config.ts` are a plain project's files.
      - id: other-worker-types
        kind: fact
        fact: "f:n52h8f"
        use: |
          `worker-configuration.d.ts` is the generated `wrangler types` output that `src/app.d.ts`
          references.
      - id: other-scripts-dir
        kind: fact
        fact: "f:o47i0q"
        use: |
          `scripts/` holds `dev.mjs`, which the `dev` script runs.
  - heading: Configuration files
    opens: |
      Three files configure how the site builds and deploys, `package.json`, `vite.config.ts`, and
      `wrangler.jsonc`, and `src/app.d.ts` types what they provide.
    items:
      - id: config-chain
        kind: fact
        fact: "f:o47i0q"
        use: |
          `npm run build` runs `vite build`, which produces the Worker that `wrangler.jsonc` names as
          `main`.
  - heading: "`package.json`"
    level: 3
    opens: |
      The engine, `@glw907/cairn-cms`, sits in `dependencies`, and the `imports` field declares
      `#chassis`, `#theme`, and `#lib` as subpath imports rather than config aliases.
    items:
      - id: pkg-engine-dep
        kind: fact
        fact: "f:o47i0q"
        use: |
          Backs the section's first sentence; add nothing beyond it.
      - id: pkg-upgrade-link
        kind: link
        target: upgrade-cairn.md
      - id: pkg-imports
        kind: fact
        fact: "f:n4rg1z"
        use: |
          Backs the section's first sentence; add nothing beyond it.
      - id: pkg-lib
        kind: fact
        fact: "f:wnsv5x"
        use: |
          `#lib/*` maps to `./src/lib/*`, which holds one file, `log.ts`, the site's own
          `createLogger` instance typed over the site's event names.
      - id: pkg-log-link
        kind: link
        target: ../reference/log.md#createlogger
      - id: pkg-table-lead
        kind: sentence
        mode: verbatim
        text: |
          The following table describes what the scaffold's main scripts run.
      - id: pkg-dev-build
        kind: fact
        fact: "f:o47i0q"
        use: |
          Rows `dev` and `build`: `dev` runs `scripts/dev.mjs`, which starts `vite dev` with
          `CAIRN_DEV_BACKEND=1` beside a Tailwind watch compile, so the local admin runs on the
          in-memory dev backend; `build` runs `vite build`.
      - id: pkg-pre-scripts
        kind: fact
        fact: "f:666eg6"
        use: |
          Row `predev`, `prebuild`, `precheck`: each compiles the gitignored `.cairn/admin.css`, so
          a Workers Builds `npm run build` needs no separate admin-stylesheet step.
      - id: pkg-check-cairn
        kind: fact
        fact: "f:mrv24k"
        use: |
          Row `check:cairn`: compiles the admin sheet, then runs `cairn-audit`, which exits 1 only
          on an unsuppressed error-tier finding, prints public-scope findings as advisories, and
          names a missing `daisyui` or `tailwindcss` peer. One row; the rules belong to the audit's
          own page.
      - id: pkg-rendered
        kind: fact
        fact: "f:j7fha2"
        use: |
          Row `check:cairn:rendered`: runs `cairn-audit --rendered` in a real Playwright browser
          against a running admin, and the scaffold ships no Playwright dependency, so it does not
          run as shipped.
      - id: pkg-other-scripts
        kind: fact
        fact: "f:690k0p"
        use: |
          Rows `cairn:manifest` (runs `cairn-manifest`), `format` and `format:check` (Prettier), and
          `test:unit` (`vitest run`).
      - id: pkg-cf-typegen
        kind: fact
        fact: "f:n0fg3w"
        use: |
          Row `cf-typegen`: holds the exact `wrangler types` command recorded in
          `worker-configuration.d.ts`, so the site regenerates its `Env` with the arguments that
          produced the committed file.
  - heading: "`vite.config.ts`"
    level: 3
    opens: |
      The scaffold carries no `svelte.config.js`, so the whole SvelteKit config passes inline to
      `sveltekit()` in this file.
    items:
      - id: vite-inline
        kind: fact
        fact: "f:n4rg1z"
        use: |
          The inline config sets the Cloudflare adapter with `platformProxy: { remoteBindings: false }`
          and a prerender `handleHttpError` that throws on every prerender HTTP error.
      - id: vite-crawl-link
        kind: link
        target: "#crawl-rules"
      - id: vite-no-csrf
        kind: fact
        fact: "f:7rehzh"
        use: |
          The config carries no `csrf` key, so SvelteKit's Origin check runs ahead of every handle
          on every route, `/admin` included, and cairn's guard adds a double-submit token on top.
      - id: vite-sveltekit3
        kind: fact
        fact: "f:hnvweu"
        use: |
          SvelteKit 3 removed `csrf.checkOrigin`, and a config that sets it fails validation.
      - id: vite-csrf-link
        kind: link
        target: security-model.md#csrf-protection
      - id: vite-manifest-define
        kind: fact
        fact: "f:xluud1"
        use: |
          The `cairnManifest` plugin verifies the committed content manifest on build, and its own
          `config` hook defines `__CAIRN_DEV_BUILD__`, `true` under `vite dev` and `false` in a
          default build; the scaffold's config sets no define of its own.
      - id: vite-noexternal
        kind: fact
        fact: "f:2pv4r5"
        use: |
          `ssr.noExternal` lists `@glw907/cairn-cms-dev` beside the engine, because the dev package
          imports `cloudflare:workers`, which Node's own loader rejects; without the entry, `/admin`
          answers 500 under `vite dev`.
  - heading: "`wrangler.jsonc`"
    level: 3
    opens: |
      The Worker's config declares three bindings and one variable, and its only D1 database is the
      auth store.
    items:
      - id: wrangler-bindings
        kind: fact
        fact: "f:n7t4bn"
        use: |
          A bulleted list, one item each: `AUTH_DB`, the D1 auth store; `EMAIL`, the Email Sending
          binding; `MEDIA_BUCKET`, the R2 bucket; and `PUBLIC_ORIGIN`, a plain variable. The
          scaffold binds no second database.
      - id: wrangler-media-link
        kind: link
        target: configure-media.md
      - id: wrangler-observability
        kind: fact
        fact: "f:l3cxgc"
        use: |
          `observability.enabled` is `true`. State nothing about the doctor report the fact also
          names.
      - id: wrangler-logs-link
        kind: link
        target: https://developers.cloudflare.com/workers/observability/logs/workers-logs/
      - id: wrangler-not-found
        kind: fact
        fact: "f:2qnqkm"
        use: |
          `assets.not_found_handling` is `"none"`, one sentence that names the themed 404 section as
          the place that explains why.
      - id: wrangler-404-link
        kind: link
        target: "#themed-404-page"
  - heading: "`src/app.d.ts`"
    level: 3
    opens: |
      This file imports `@glw907/cairn-cms/ambient`, which declares the `__CAIRN_DEV_BUILD__` global,
      and it types `App.PageData` with the menus and flags the root layout load returns.
    items:
      - id: appd-contents
        kind: fact
        fact: "f:n52h8f"
        use: |
          The ambient import, the optional `nav`, `footerNav`, `siteName`, and `hasIslands` on
          `App.PageData`, and the references to `@cloudflare/workers-types` and to
          `worker-configuration.d.ts`, whose `Env` types the bindings `cloudflare:workers` exposes.
      - id: appd-ambient-link
        kind: link
        target: ../reference/ambient.md
  - heading: Database migrations
    opens: |
      The `migrations/` directory holds the auth store's schema for `AUTH_DB`, and it is the
      scaffold's only migrations directory.
    items:
      - id: mig-files
        kind: fact
        fact: "f:gepykz"
        use: |
          It carries `0000_auth.sql`, `0001_roles.sql`, `0003_preview.sql`, and
          `0004_login_nonce.sql`, and not the opt-in `0002_audit.sql`, which only a site that wires
          `createD1AuditSink` applies.
      - id: mig-audit-link
        kind: link
        target: add-a-custom-admin-screen.md#wire-the-audit-sink
      - id: mig-roles
        kind: fact
        fact: "f:rn62i1"
        use: |
          `0001_roles.sql` is needed once a site declares roles beyond the default owner and editor
          pair, and the scaffold ships it. Any automated `wrangler d1 migrations apply` runs it, and
          its rebuild keeps only the engine's four `editor` columns, so a site carries any column it
          added across first. `0003_preview.sql` serves draft-preview links.
      - id: mig-second-db
        kind: fact
        fact: "f:nv0ok0"
        use: |
          Only the general rule, never the example site's directory: a database the site adds takes
          its own migrations directory, because `wrangler d1 migrations apply` walks one directory
          per database and a shared directory would apply each schema to both.
  - heading: Routes and the server hook
    opens: |
      The server hook in `src/hooks.server.ts` installs the auth guard over `/admin`, and the routes
      split into that admin mount, a prerendered public site in the `(site)` group, and endpoints at
      the root.
    items:
      - id: routes-tree
        kind: code
        source: ../../templates/waymark/src/routes
        facts: ["f:qtm9y2", "f:t2t5lx"]
        text: |
          A plain-text tree of `src/params.ts` and `src/routes/`, with `admin/` marked
          [engine]. `admin/` lists `[...path]/`, `+error.svelte`, `+layout.server.ts`, and
          `+layout.svelte`, and nothing else.
      - id: routes-listing
        kind: fact
        fact: "f:qtm9y2"
        use: |
          The route directories and root files the tree shows.
  - heading: "`src/hooks.server.ts`"
    level: 3
    opens: |
      The hook picks `devBackendHandle` or `createAuthGuard` in one `if` and exports the result as
      `handle`.
    items:
      - id: hook-branch
        kind: fact
        fact: "f:f21bcz"
        use: |
          The test reads the build-time `__CAIRN_DEV_BUILD__` define first and the runtime opt-in
          `CAIRN_DEV_BACKEND === '1'` second, falling back to `process.env` under `vite dev`, and
          both handles take the composed `runtime` the hook imports from
          `#chassis/cairn.server.js`.
      - id: hook-guard-scope
        kind: fact
        fact: "f:2sd4if"
        use: |
          The guard gates the whole `/admin` subtree before any load runs; per-route authorization
          belongs to `requireAccess` and `createSectionAction`.
      - id: hook-no-access
        kind: fact
        fact: "f:3z1uxv"
        use: |
          Only the scaffold's half: its adapter declares no `access` member and takes the
          zero-config owner and editor floor, and the tree holds no `src/access.ts`.
      - id: hook-restrict-link
        kind: link
        target: restrict-admin-access.md
      - id: hook-dev-backend
        kind: fact
        fact: "f:dqjkci"
        use: |
          A second paragraph on the dev branch: the dev backend installs an in-memory GitHub
          backend, a fake `AUTH_DB`, and a fake media bucket, and signs the developer in as an
          owner with no sign-in email; its state lives for the server process, so a save or publish
          never leaves the machine.
      - id: hook-no-content
        kind: fact
        fact: "f:zzjrza"
        use: |
          Only the scaffold's half: the hook passes no `content` option, so a new site's dev admin
          lists the site's own entries from the working tree.
      - id: hook-content-modes
        kind: fact
        fact: "f:p1v88s"
        use: |
          `content` defaults to `'repository'`; `'fixtures'` is the alternative, a seeded in-memory
          repository of sample posts, media, fragments, and a vocabulary.
      - id: hook-overlay
        kind: fact
        fact: "f:cgt4tk"
        use: |
          In the default mode an edit lands in an in-memory overlay over the working tree: nothing
          is written to disk, and the overlay lasts until the dev server restarts.
  - heading: "`src/routes/admin/`"
    level: 3
    opens: |
      The admin mount is one catch-all pair, `[...path]/+page.server.ts` and `+page.svelte`, beside
      the shared layout pair, `+layout.server.ts` and `+layout.svelte`.
    items:
      - id: admin-mount
        kind: fact
        fact: "f:t2t5lx"
        use: |
          Backs the section's first sentence; add nothing beyond it. Never call the two pairs the
          only entries under `admin/`, since the directory also holds `+error.svelte`.
      - id: admin-mount-link
        kind: link
        target: ../reference/admin-routes.md#the-route-files-plus-the-composer
      - id: admin-error
        kind: fact
        fact: "f:ty4ehh"
        use: |
          `+error.svelte` renders an error inside `/admin` within the shell and its theme wrapper: a
          403 and a 404 each get their own message and a **Back to the dashboard** link to
          `/admin`, any other status shows the thrown message, and a failure in the admin layout's
          own load still falls to the root error page.
      - id: admin-custom-link
        kind: link
        target: add-a-custom-admin-screen.md
  - heading: "`src/routes/(site)/`"
    level: 3
    opens: |
      The entry catch-all `[...path]` and its raw-markdown twin `[...path=md]` coexist through
      `createPublicRoutes`, and `src/params.ts` defines the `md` matcher.
    items:
      - id: site-catchall
        kind: fact
        fact: "f:4cet3p"
        use: |
          Backs the section's first sentence; beyond it, add only that `archive/[page]` slices its
          page with the chassis `archive.ts` helper.
      - id: site-params
        kind: fact
        fact: "f:qtm9y2"
        use: |
          `src/params.ts` defines the `md` matcher through SvelteKit's `defineParams`, and the
          group also holds `preview/[token]/`.
      - id: site-styleguide
        kind: fact
        fact: "f:6jxd81"
        use: |
          `styleguide/` renders every registered markdown component (a sample for each one that
          declares a `preview`, the rest by name), the type scale, and the component recipes.
      - id: site-routes-link
        kind: link
        target: build-the-public-routes.md
  - heading: Endpoints at the root
    level: 3
    opens: |
      The root holds the feed, sitemap, and robots endpoints beside two routes that sit outside
      `/admin` on purpose, the media route and `/healthz`.
    items:
      - id: endpoints-names
        kind: fact
        fact: "f:qtm9y2"
        use: |
          `feed.json/`, `feed.xml/`, and `sitemap.xml/` by name only.
      - id: endpoints-robots
        kind: fact
        fact: "f:4cet3p"
        use: |
          `robots.txt/` reads a `posture` option for its stance toward AI training crawlers.
      - id: endpoints-posture-link
        kind: link
        target: choose-an-ai-posture.md
      - id: endpoints-media
        kind: fact
        fact: "f:qtvesq"
        use: |
          `media/[...path]/` exports the `createMediaRoute` handler, which validates the request
          and streams the object from `MEDIA_BUCKET` with its own security headers, because the
          route sits outside `/admin`. Leave the key format and the validation detail to the
          reference.
      - id: endpoints-media-link
        kind: link
        target: ../reference/sveltekit.md#createmediaroute
      - id: endpoints-healthz
        kind: fact
        fact: "f:paotzb"
        use: |
          `healthz/` sits outside `/admin`, so the guard does not gate it. It answers `loadHealth`'s
          payload as JSON with status 200 when `ok` is true and 503 when it is false, answers a
          thrown error with a 503 and a fixed detail, sends `cache-control: no-store`, and exports
          `prerender = false`.
      - id: endpoints-healthz-link
        kind: link
        target: ../reference/sveltekit.md#loadhealth
  - heading: Root layout and error page
    level: 3
    opens: |
      The root `+layout.server.ts` returns the menus, the site name, and whether the site registers
      any island, and it reads them without importing the full adapter.
    items:
      - id: rootlayout-data
        kind: fact
        fact: "f:ofex2m"
        use: |
          It returns `hasIslands`, `nav`, `footerNav`, and `siteName`, reading `site-config.ts` and
          the island registry so every non-prerendered request stays light; `SiteHeader` and the
          root `+error.svelte` read that data through `page.data`, and the error page is the themed
          404 and error page.
  - heading: Theme, chassis, and content
    opens: |
      `src/theme/` holds the adapter and Waymark's design, `src/chassis/` holds the plumbing every
      scaffolded site shares, and `src/content/` holds the markdown and its committed manifests.
    items:
      - id: theme-shared-dir
        kind: reason
        text: |
          The adapter shares `src/theme/` with the theme's style sheets, so a file's directory does
          not show whether it carries a contract.
  - heading: "`src/theme/`"
    level: 3
    opens: |
      The adapter, `cairn.config.ts`, is one `defineAdapter` call over `content`, `backend`,
      `email`, `rendering`, and an `editor` group carrying `navLayout`.
    items:
      - id: theme-adapter
        kind: fact
        fact: "f:qnf469"
        use: |
          Backs the section's first sentence; add nothing beyond it.
      - id: theme-adapter-path
        kind: fact
        fact: "f:q07rd5"
        use: |
          Only the scaffold's half: the adapter is imported as `#theme/cairn.config.js`, and the
          `cairnManifest` `configModule` in `vite.config.ts` names it.
      - id: theme-navlayout
        kind: fact
        fact: "f:tycp7k"
        use: |
          Only the scaffold's half: `navLayout`'s `Site` group carries only engine screens
          (`vocabulary`, `nav`, `settings`, and `editors`), and its `Content` group carries the
          `media` entry.
      - id: theme-adapter-link
        kind: link
        target: define-an-adapter-and-schema.md
      - id: theme-sidebar-link
        kind: link
        target: arrange-the-admin-sidebar.md
      - id: theme-email-link
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#customize-the-sign-in-email
      - id: theme-files-lead
        kind: sentence
        mode: verbatim
        text: |
          Besides the adapter, the directory holds the following files:
      - id: theme-files
        kind: fact
        fact: "f:qnf469"
        use: |
          The list: `site-config.ts`, the one `parseSiteConfig` call, over `site.config.yaml`;
          `site.config.yaml`, with `siteName`, `description`, the primary and footer menus, and the
          tag `vocabulary`; `markdown-components.ts`, nine `defineComponent` declarations, one of
          them hydrated; `icons.ts`, the `IconSet`; `components/`, the chrome; `islands/`,
          `Banner.svelte` with its `registry.ts` and `banner-expiry.ts`; `theme.css` and `site.css`;
          and `theme-names.ts`.
      - id: theme-public-link
        kind: link
        target: theme-your-public-site.md
  - heading: "`src/chassis/`"
    level: 3
    opens: |
      The chassis is the design-neutral plumbing every scaffolded site shares, copied into the tree
      with Waymark.
    items:
      - id: chassis-baked
        kind: fact
        fact: "f:rxj43c"
        use: |
          The setup command bakes the chassis into the tree, and the engine's package carries none,
          so the chassis files are the site's own like every other file.
      - id: chassis-boundary-link
        kind: link
        target: theme-your-public-site.md#the-chassis-boundary
      - id: chassis-archive-link
        kind: link
        target: "#settings-outside-the-admin"
  - heading: "`src/content/`"
    level: 3
    opens: |
      Content is markdown with YAML frontmatter, one directory per concept, named by the concept's
      `dir`.
    items:
      - id: content-dirs
        kind: fact
        fact: "f:gj96px"
        use: |
          The scaffold declares `posts`, `pages`, and `fragments`, seeded with 14 sample posts, two
          pages (`about.md` and `the-trail-crew.md`), and one fragment (`trail-safety-notice.md`).
      - id: content-rename-reason
        kind: reason
        text: |
          Because the adapter names each directory, renaming one is an adapter change.
  - heading: "`src/content/.cairn/`"
    level: 3
    opens: |
      This directory holds three committed files that the engine and its build tools write.
    items:
      - id: dotcairn-files
        kind: fact
        fact: "f:vrue1g"
        use: |
          `index.json`, the content manifest, which the `cairnManifest` plugin and `cairn-manifest`
          regenerate, a publish commit patches, and the build fails on when it drifts from the
          markdown on disk; `media.json`, which the admin's media upload, metadata, and delete
          commits write; and `site-facts.json`, which `cairn-manifest` writes. Leave out the
          root-barrel function names.
      - id: dotcairn-script
        kind: fact
        fact: "f:690k0p"
        use: |
          The `cairn:manifest` script runs `cairn-manifest`.
      - id: dotcairn-vite-link
        kind: link
        target: ../reference/vite.md#cairnmanifest
      - id: dotcairn-facts-link
        kind: link
        target: ../reference/site-facts.md
  - heading: Style sheets
    opens: |
      The site compiles two separate sets of styles, the admin's from `src/admin.css` and the
      public site's from `theme.css` and `site.css`.
    items:
      - id: styles-admin-import
        kind: fact
        fact: "f:vs6k2k"
        use: |
          `src/admin.css` ends by importing `@glw907/cairn-cms/admin-sources.css`, an engine-owned
          file holding only the `@source` directives for the engine's shipped admin markup; the
          audit config still names the engine's precompiled `dist` sheet, a different artifact that
          the sources import does not replace.
      - id: styles-admin-compile
        kind: fact
        fact: "f:666eg6"
        use: |
          The pre-scripts compile `src/admin.css` into the gitignored `.cairn/admin.css`.
      - id: styles-audit-sheet
        kind: fact
        fact: "f:guiavc"
        use: |
          `.cairn/admin.css` is one of the two sheets `cairn-audit.config.json` names.
      - id: styles-public
        kind: fact
        fact: "f:s23sk0"
        use: |
          A second paragraph: `theme.css` and `site.css` hold the theme's tokens and page styling,
          layered over the engine's `cairn-public.css` roles (the status inks, the shadow, the focus
          ring, `--color-muted`, and `--color-card-border`), which the chassis `tokens.css` imports
          right after Tailwind, and over the chassis's design-scale defaults.
      - id: styles-cascade-link
        kind: link
        target: theme-your-public-site.md#token-tiers-and-cascade-order
  - heading: Settings outside the admin
    opens: |
      The archive's page size and the footer menu are set in files, outside the admin.
    items:
      - id: settings-archive
        kind: fact
        fact: "f:38pjqy"
        use: |
          `ARCHIVE_PAGE_SIZE` in `src/chassis/archive.ts`, 13 in the scaffold, is the one page-size
          setting for both the home page and `/archive/[page]`; both paginate every post after the
          newest, which the home page shows as its lead, so `/archive/2` exists only once more than
          14 posts are published.
      - id: settings-footer
        kind: fact
        fact: "f:2s8u70"
        use: |
          `/admin/nav` edits only `menus.primary`; `menus.footer` is a flat menu the developer edits
          by hand in `site.config.yaml`, read through `readMenu(siteConfig, 'footer', 1)`.
  - heading: Crawl rules
    opens: |
      The prerender crawl fails the build on an unseen route or an HTTP error, and the scaffold
      keeps its build passing with one route exemption and one link attribute.
    items:
      - id: crawl-unseen
        kind: fact
        fact: "f:2zl3qz"
        use: |
          `handleUnseenRoutes` exempts only `/(site)/archive/[page]`, because a corpus that fits on
          page one gives that route no entries and the crawl-completeness check would otherwise
          fail the build; any other unseen prerenderable route still throws.
      - id: crawl-admin-links
        kind: fact
        fact: "f:34rsss"
        use: |
          A link to `/admin` in prerendered public markup carries `rel="external"`, so the crawler
          never requests it, because every `/admin` route answers a build-time crawl with an error
          and `handleHttpError` throws on any HTTP error; the header and footer apply it through the
          shared `isAdminHref` predicate in `src/theme/components/admin-link.ts`.
      - id: crawl-new-link
        kind: sentence
        mode: claim
        text: |
          A new `/admin` link in public markup needs the same attribute.
        facts: ["f:34rsss"]
      - id: crawl-kit-link
        kind: link
        target: https://svelte.dev/docs/kit/@sveltejs-kit-vite
  - heading: Themed 404 page
    opens: |
      A scaffolded site serves a themed 404 page through two pieces that need each other, the root
      `src/routes/+error.svelte` and `assets.not_found_handling` set to `"none"` in
      `wrangler.jsonc`.
    items:
      - id: notfound-error-page
        kind: fact
        fact: "f:2qnqkm"
        use: |
          The error page's half: the prerendered `(site)` group's catch-all is stripped from the
          runtime manifest, so that group's layout never runs for an unmatched path, and the root
          `+error.svelte` rebuilds the site chrome itself.
      - id: notfound-layout-data
        kind: fact
        fact: "f:ofex2m"
        use: |
          It reads the menus and the site name through `page.data` from the root
          `+layout.server.ts`.
      - id: notfound-worker
        kind: fact
        fact: "f:2qnqkm"
        use: |
          The Worker's half: `"none"` passes an unmatched request to the Worker, while `"404-page"`
          would serve an unthemed static file from the edge without invoking the Worker.
      - id: notfound-cf-link
        kind: link
        target: https://developers.cloudflare.com/workers/static-assets/routing/worker-script/
  - heading: Setup state outside the tree
    opens: |
      The setup command kept its record of the run on the machine that ran it, and when the run
      connected Workers Builds, it registered the Cloudflare API token pasted during setup as the
      build token the site's deploys use.
    items:
      - id: state-record
        kind: fact
        fact: "f:3m0oxs"
        use: |
          The record is `~/.config/cairn/sites/<id>.json` (directory mode 0700, file mode 0600),
          never under the project directory, and it includes the pasted Cloudflare token; a `--yes`
          run reads the token from `CAIRN_CF_API_TOKEN` and refuses a token-shaped command-line
          value.
      - id: state-no-copy
        kind: sentence
        mode: claim
        text: |
          A developer who took over the site from someone else has no copy of that record, since it
          sits in the home directory of whoever ran the command.
        facts: ["f:3m0oxs"]
      - id: state-resume
        kind: fact
        fact: "f:3my5c1"
        use: |
          On a resumed run, `--org`, `--repo-name`, `--app-name`, and `--owner-email` override the
          saved answer for any step not yet run.
      - id: state-brand-color
        kind: fact
        fact: "f:498l97"
        use: |
          `--brand-color` takes a `#`-prefixed hex color, an `oklch(...)` string, or a bare number
          read as a hue in degrees, and any other shape fails. State no range for the number.
      - id: state-build-token
        kind: fact
        fact: "f:3bbeia"
        use: |
          The build token is named `cairn create-cairn-site build token`, reusing an existing build
          token that wraps the same token id; revoking or rolling that token at Cloudflare breaks
          automatic deploys with no prior warning, because the next commit still triggers a build
          and the build fails. This is the body's last paragraph.
  - heading: Related resources
    opens: |
      The following guides cover changing or rebuilding parts of the tree.
    items:
      - id: rel-howto-addcairn
        kind: link
        target: add-cairn-to-a-sveltekit-app.md
      - id: rel-howto-theme
        kind: link
        target: theme-your-public-site.md
      - id: rel-howto-screen
        kind: link
        target: add-a-custom-admin-screen.md
      - id: rel-howto-adapter
        kind: link
        target: define-an-adapter-and-schema.md
      - id: rel-howto-upgrade
        kind: link
        target: upgrade-cairn.md
      - id: rel-concepts-lead
        kind: sentence
        mode: verbatim
        text: |
          The following pages explain the engine these files wire in.
      - id: rel-concept-architecture
        kind: link
        target: architecture.md
      - id: rel-concept-security
        kind: link
        target: security-model.md
      - id: rel-concept-content
        kind: link
        target: content-model.md
      - id: rel-external-lead
        kind: sentence
        mode: verbatim
        text: |
          The following external pages document the platforms the files configure.
      - id: rel-ext-kit-structure
        kind: link
        target: https://svelte.dev/docs/kit/project-structure
      - id: rel-ext-kit-vite
        kind: link
        target: https://svelte.dev/docs/kit/@sveltejs-kit-vite
      - id: rel-ext-wrangler
        kind: link
        target: https://developers.cloudflare.com/workers/wrangler/configuration/
      - id: rel-ext-d1
        kind: link
        target: https://developers.cloudflare.com/d1/reference/migrations/
      - id: rel-ext-builds
        kind: link
        target: https://developers.cloudflare.com/workers/ci-cd/builds/
