<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // The no-flash theme read. Runs synchronously before the first paint, so a returning
      // visitor's explicit choice (SiteHeader.svelte's toggle) never flashes the system default
      // first. No cookie leaves `data-theme` unset, and theme.css's prefers-color-scheme
      // block picks the system scheme with no JS involved at all. The regex line between the two
      // markers is generated from the theme manifest's colorModes by scripts/theme/theme-names.mjs,
      // the same source as src/theme/theme-names.ts, which this inline script cannot import; it
      // names both themes on purpose, so a stale cookie left by a rename fails it and the page
      // falls back to the system scheme.
      (function () {
        // cairn-theme-names:start
        var match = document.cookie.match(/(?:^|; )cairn-site-theme=(cairn-dark|cairn)(?:;|$)/);
        // cairn-theme-names:end
        if (match) document.documentElement.setAttribute('data-theme', match[1]);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div>%sveltekit.body%</div>
  </body>
</html>
