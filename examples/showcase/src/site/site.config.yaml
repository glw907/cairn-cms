siteName: Waymark
description: Trail reports and gear notes from the field.
menus:
  primary:
    - label: Writing
      url: /
    # cairn-template:exclude-start
    - label: Styleguide
      url: /styleguide
    # cairn-template:exclude-end
    - label: Admin
      url: /admin
  # /admin/nav edits only menus.primary (createNavRoutes is bound to that one menu), so this
  # block is developer-edited: a site owner changes the footer by editing this file directly.
  footer:
    - label: Writing
      url: /
    - label: Admin
      url: /admin
    - label: Feed
      url: /feed.xml
  # The actions menu holds a site's call-to-action links (a Join or Donate button), for a theme
  # that renders them. Like the footer it is developer-edited in this file. Uncomment it and point
  # each url at a page the site has.
  # actions:
  #   - label: Join
  #     url: /join
vocabulary:
  - value: trail-reports
    label: Trail Reports
  - value: gear
    label: Gear
  - value: weather
    label: Weather
  - value: routes
    label: Routes
  - value: season-notes
    label: Season Notes
tidy:
  enabled: true
  conventions:
    oxfordComma: always
    smartQuotes: true
