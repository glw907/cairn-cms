siteName: Waymark
menus:
  primary:
    - label: Writing
      url: /
    - label: Styleguide
      url: /styleguide
    - label: Admin
      url: /admin
  # /admin/nav edits only menus.primary (createNavRoutes is bound to that one menu), so this
  # block is developer-edited: a site owner changes the footer by editing this file directly.
  footer:
    - label: Writing
      url: /
    - label: Admin
      url: /admin
    - label: Feed
      url: /feed.xml
vocabulary:
  - value: trail-reports
    label: Trail Reports
  - value: gear
    label: Gear
  - value: weather
    label: Weather
  - value: routes
    label: Routes
  - value: season-notes
    label: Season Notes
spellcheck:
  dialect: en-US
tidy:
  enabled: true
  conventions:
    fixes: true
    oxfordComma: always
    smartQuotes: true
