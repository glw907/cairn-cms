name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The scaffold ships no lockfile, so this installs from package.json rather than npm ci.
      - run: npm install
      - run: npm run check
      - run: npm run build
      # Only the two wrangler steps carry the token in their environment, so no install, check,
      # or build step holds it. The wrangler steps still run whatever npm install put in
      # node_modules, so a dependency's install script can replace the wrangler they call.
      - run: npx wrangler d1 migrations apply AUTH_DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
