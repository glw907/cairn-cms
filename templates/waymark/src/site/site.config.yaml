siteName: Waymark
description: Trail reports and gear notes from the field.
menus:
  primary:
    - label: Writing
      url: /
    - label: Admin
      url: /admin
  # The admin edits menus.primary and menus.actions, one screen each under /admin/nav. The footer
  # is not listed in editor.nav, so a site owner changes it by editing this file directly.
  footer:
    - label: Writing
      url: /
    - label: Admin
      url: /admin
    - label: Feed
      url: /feed.xml
  # The actions menu holds a site's call-to-action links (a Join or Donate button), for a theme
  # that renders them. The admin screen starts empty and its first save writes this key. To seed it
  # here instead, uncomment it and point each url at a page the site has.
  # actions:
  #   - label: Join
  #     url: /join
vocabulary:
  - value: trail-reports
    label: Trail Reports
  - value: gear
    label: Gear
  - value: weather
    label: Weather
  - value: routes
    label: Routes
  - value: season-notes
    label: Season Notes
tidy:
  enabled: true
  conventions:
    oxfordComma: always
    smartQuotes: true
