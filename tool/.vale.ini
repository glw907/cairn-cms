StylesPath = .vale/styles
MinAlertLevel = suggestion

# Comment-scoped linting: extract Go comment text and lint it as Markdown.
[formats]
go = md

# Go comments: the house overlay. The em dash stays banned (no opt-out
# section). Vale lints only the comment text and ignores code tokens.
[*.go]
BasedOnStyles = glw907

# Judgment over-fires on legitimate technical vocabulary, so it stays
# advisory here rather than a gate blocker.
glw907.Judgment = warning
