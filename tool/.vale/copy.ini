# copy.ini is a separate Vale config from tool/.vale.ini (which stays untouched): it grades the
# committed copy golden alone, against the repository's own vendored Microsoft package at the
# repo root (.vale/styles/Microsoft), never against tool/.vale.ini's glw907 overlay, which governs
# Go comment prose in a different register. tool/docs/design/copy-standard.md section 4.4.
#
# The .golden.md suffix (not a bare .golden) is deliberate: it rides Vale's own built-in .md
# format mapping, so no [formats] override is needed here the way tool/.vale.ini needs one for
# Go comment prose.
StylesPath = ../../.vale/styles
MinAlertLevel = suggestion

[testdata/copy.golden.md]
BasedOnStyles = Microsoft

# The catalogue quotes several rows verbatim from tool/docs/design/copy-standard.md's own
# editorially reviewed rewrites ("Workers Builds is not connected to this Worker"), which use the
# formal form Microsoft's own Contractions rule would rewrite. The catalogue's reviewed text wins
# over the generic style rule; this stays a non-blocking suggestion rather than an error so it
# never contradicts the source it is quoting.
Microsoft.Contractions = suggestion
