<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use a current browser</title>
<style>
  :root {
    --ground: #fdfbf9; --text: #28231d; --muted: #615d57;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #221f1a; --text: #eae7e3; --muted: #a8a49e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--text);
    font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 5rem 1.5rem 4rem; }
  .eyebrow { color: var(--muted); font-size: 0.875rem; margin: 0 0 2.5rem; }
  h1 { font-size: 1.75rem; line-height: 1.25; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; }
  .lead { font-size: 1.0625rem; }
  @media (max-width: 30rem) { main { padding-top: 3rem; } h1 { font-size: 1.5rem; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">cairn · {{.SiteName}} · approval 1 of 4</p>
  <h1>Use a current browser</h1>
  <p class="lead">This browser does not send the information setup needs to keep your approval safe. Use a current Chrome, Edge, Firefox, or Safari.</p>
</main>
</body>
</html>
